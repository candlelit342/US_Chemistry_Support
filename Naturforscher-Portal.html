nobles français du phylloxéra.","work":"First Annual Report on the Noxious, Beneficial and Other Insects of the State of Missouri","year":1869},{"name":"Odoardo Beccari","born":1843,"died":1920,"nat":"Italian","fields":["botany","exploration"],"sig_de":"Der italienische Botaniker erforschte Borneo und Neuguinea und entdeckte die Titanenwurz, die groesste Bluete der Welt.","sig_en":"The Italian botanist explored Borneo and New Guinea and discovered the titan arum, the world's largest flower.","sig_fr":"Le botaniste italien explora Borneo et la Nouvelle-Guinee et decouvrit l'arum titan, la plus grande fleur du monde.","work":"Nelle foreste di Borneo","year":1902},{"name":"Adolf Engler","born":1844,"died":1930,"nat":"German","fields":["botany"],"work":"Die natürlichen Pflanzenfamilien","year":1887,"sig_en":"German botanist whose comprehensive Natürliche Pflanzenfamilien and system of classification organised the entire plant kingdom for generations.","sig_de":"Deutscher Botaniker, dessen umfassende Natürliche Pflanzenfamilien und Klassifikationssystem das gesamte Pflanzenreich über Generationen ordneten.","sig_fr":"Botaniste allemand dont les Natürliche Pflanzenfamilien complètes et le système de classification organisèrent tout le règne végétal pour des générations."},{"name":"Eugene William Oates","born":1845,"died":1911,"nat":"English","fields":["ornithology"],"work":"The Fauna of British India: Birds","year":1889,"sig_en":"British engineer in Burma whose bird volumes of The Fauna of British India became the standard reference for South Asian ornithology.","sig_de":"Britischer Ingenieur in Burma, dessen Vogelbände von The Fauna of British India zum Standardwerk der südasiatischen Ornithologie wurden.","sig_fr":"Ingénieur britannique en Birmanie dont les volumes d'oiseaux de The Fauna of British India devinrent la référence de l'ornithologie sud-asiatique."},{"name":"William Lucas Distant","born":1845,"died":1922,"nat":"British","fields":["entomology"],"sig_en":"British entomologist whose 'Rhopalocera Malayana' and extensive work on Hemiptera documented Asian and world insects.","sig_de":"Britischer Entomologe, dessen 'Rhopalocera Malayana' und umfangreiche Arbeiten über Hemipteren asiatische und weltweite Insekten dokumentierten.","sig_fr":"Entomologiste britannique dont « Rhopalocera Malayana » et les vastes travaux sur les hémiptères documentèrent les insectes d'Asie et du monde.","work":"Rhopalocera Malayana","year":1882},{"name":"Élie Metchnikoff","born":1845,"died":1916,"nat":"Russian","fields":["zoology","ideas"],"sig_de":"Russischer Zoologe, der durch vergleichende Embryologie die Phagozytose entdeckte, die zelluläre Immunologie begründete und einen Nobelpreis gewann.","sig_en":"Russian zoologist who discovered phagocytosis through comparative embryology, founding cellular immunology and winning a Nobel Prize.","sig_fr":"Zoologiste russe qui découvrit la phagocytose par l'embryologie comparée, fondant l'immunologie cellulaire et obtenant un prix Nobel.","work":"Leçons sur la pathologie comparée de l'inflammation","year":1892},{"name":"Anton Reichenow","born":1847,"died":1941,"nat":"German","fields":["ornithology"],"work":"Die Vögel Afrikas","year":1900,"sig_en":"German ornithologist whose three-volume Die Vögel Afrikas was the first comprehensive treatment of the birds of the African continent.","sig_de":"Deutscher Ornithologe, dessen dreibändiges Die Vögel Afrikas die erste umfassende Darstellung der Vögel des afrikanischen Kontinents war.","sig_fr":"Ornithologue allemand dont Die Vögel Afrikas en trois volumes fut le premier traité complet des oiseaux du continent africain."},{"name":"Genevieve Jones","born":1847,"died":1879,"nat":"American","fields":["art","ornithology"],"work":"Illustrations of the Nests and Eggs of Birds of Ohio","year":1879,"sig_en":"American artist whose ambitious hand-coloured folio of Ohio nests and eggs, completed by her family after her early death, rivalled Audubon.","sig_de":"Amerikanische Künstlerin, deren ehrgeiziger handkolorierter Foliobände über Nester und Eier Ohios, von ihrer Familie nach ihrem frühen Tod vollendet, Audubon gleichkam.","sig_fr":"Artiste américaine dont l'ambitieux in-folio colorié à la main des nids et œufs de l'Ohio, achevé par sa famille après sa mort précoce, rivalisa avec Audubon."},{"name":"Richard Bowdler Sharpe","born":1847,"died":1909,"nat":"English","fields":["ornithology"],"work":"Catalogue of the Birds in the British Museum","year":1874,"sig_en":"English ornithologist who compiled much of the British Museum's 27-volume Catalogue of Birds and founded the British Ornithologists' Club.","sig_de":"Englischer Ornithologe, der einen Großteil des 27-bändigen Vogelkatalogs des British Museum verfasste und den British Ornithologists' Club gründete.","sig_fr":"Ornithologue anglais qui rédigea une grande partie du Catalogue des oiseaux du British Museum en 27 volumes et fonda le British Ornithologists' Club."},{"name":"Auguste Forel","born":1848,"died":1931,"nat":"Swiss","fields":["entomology","ideas"],"sig_en":"Swiss psychiatrist and myrmecologist whose studies of ants revealed their behaviour, senses and social organisation.","sig_de":"Schweizer Psychiater und Myrmekologe, dessen Studien über Ameisen deren Verhalten, Sinne und soziale Organisation enthüllten.","sig_fr":"Psychiatre et myrmécologue suisse dont les études sur les fourmis révélèrent leur comportement, leurs sens et leur organisation sociale.","work":"Les fourmis de la Suisse","year":1874},{"name":"Ellis Rowan","born":1848,"died":1922,"nat":"Australian","fields":["botany","ornithology","art","exploration"],"work":"A Flower-Hunter in Queensland and New Zealand","year":1898,"sig_en":"Adventurous flower painter who roamed Australia and New Guinea, producing thousands of vivid wildflower and bird studies.","sig_de":"Abenteuerlustige Blumenmalerin, die Australien und Neuguinea durchstreifte und tausende lebhafte Wildblumen- und Vogelstudien schuf.","sig_fr":"Peintre de fleurs aventureuse qui parcourut l'Australie et la Nouvelle-Guinée, produisant des milliers d'études éclatantes de fleurs sauvages et d'oiseaux."},{"name":"Eugène Simon","born":1848,"died":1924,"nat":"French","fields":["entomology","zoology"],"sig_en":"French arachnologist whose 'Histoire naturelle des araignées' remains a monumental synthesis of the world's spiders.","sig_de":"Französischer Arachnologe, dessen 'Histoire naturelle des araignées' eine monumentale Synthese der Spinnen der Welt bleibt.","sig_fr":"Arachnologiste français dont l'« Histoire naturelle des araignées » demeure une synthèse monumentale des araignées du monde.","work":"Histoire naturelle des araignées","year":1892},{"name":"Abbott Handerson Thayer","born":1849,"died":1921,"nat":"American","fields":["art","ideas","zoology"],"work":"Concealing-Coloration in the Animal Kingdom","year":1909,"sig_en":"American painter who discovered countershading and revealed how birds' coloration conceals them, founding the modern science of camouflage.","sig_de":"Amerikanischer Maler, der die Gegenschattierung entdeckte und zeigte, wie die Färbung der Vögel sie tarnt, und die moderne Wissenschaft der Tarnung begründete.","sig_fr":"Peintre américain qui découvrit le contre-ombrage et révéla comment la coloration des oiseaux les dissimule, fondant la science moderne du camouflage."},{"name":"John Henry Comstock","born":1849,"died":1931,"nat":"American","fields":["entomology"],"sig_en":"American entomologist and influential teacher whose textbooks trained generations and helped professionalise the science in America.","sig_de":"Amerikanischer Entomologe und einflussreicher Lehrer, dessen Lehrbücher Generationen ausbildeten und die Wissenschaft in Amerika professionalisierten.","sig_fr":"Entomologiste américain et professeur influent dont les manuels formèrent des générations et contribuèrent à professionnaliser la science en Amérique.","work":"A Manual for the Study of Insects","year":1895},{"name":"Richard Lydekker","born":1849,"died":1915,"nat":"British","fields":["zoology","geology"],"sig_de":"Englischer Naturforscher, der fossile und lebende Säugetiere katalogisierte und die heute Lydekker-Linie genannte Faunengrenze definierte.","sig_en":"English naturalist who catalogued fossil and living mammals and defined the faunal boundary now called Lydekker's Line.","sig_fr":"Naturaliste anglais qui catalogua les mammifères fossiles et vivants et définit la limite faunique aujourd'hui nommée ligne de Lydekker.","work":"A Geographical History of Mammals","year":1896},{"name":"Robert Ridgway","born":1850,"died":1929,"nat":"American","fields":["ornithology","art"],"work":"The Birds of North and Middle America","year":1901,"sig_en":"American ornithologist at the Smithsonian, a founder of the AOU, whose exhaustive Birds of North and Middle America defined the region's avifauna.","sig_de":"Amerikanischer Ornithologe an der Smithsonian, Mitbegründer der AOU, dessen umfassendes Birds of North and Middle America die Avifauna der Region definierte.","sig_fr":"Ornithologue américain de la Smithsonian, fondateur de l'AOU, dont l'exhaustif Birds of North and Middle America définit l'avifaune de la région."},{"name":"William Brewster","born":1851,"died":1919,"nat":"American","fields":["ornithology"],"work":"Birds of the Cambridge Region of Massachusetts","year":1906,"sig_en":"American field ornithologist, first president of the AOU, whose meticulous New England studies advanced the modern observation of living birds.","sig_de":"Amerikanischer Feldornithologe, erster Präsident der AOU, dessen akribische Studien in Neuengland die moderne Beobachtung lebender Vögel voranbrachten.","sig_fr":"Ornithologue de terrain américain, premier président de l'AOU, dont les études méticuleuses en Nouvelle-Angleterre firent progresser l'observation moderne des oiseaux vivants."},{"name":"Oscar Drude","born":1852,"died":1933,"nat":"German","fields":["botany"],"work":"Handbuch der Pflanzengeographie","year":1890,"sig_en":"German botanist who systematised plant geography in his Handbuch der Pflanzengeographie, mapping vegetation with new rigour.","sig_de":"Deutscher Botaniker, der die Pflanzengeographie in seinem Handbuch der Pflanzengeographie systematisierte und die Vegetation mit neuer Strenge kartierte.","sig_fr":"Botaniste allemand qui systématisa la géographie botanique dans son Handbuch der Pflanzengeographie, cartographiant la végétation avec une rigueur nouvelle."},{"name":"Anna Botsford Comstock","born":1854,"died":1930,"nat":"American","fields":["entomology","art"],"sig_en":"American artist, educator and engraver whose illustrations and nature-study movement brought insect science to schools and the public.","sig_de":"Amerikanische Künstlerin, Pädagogin und Graveurin, deren Illustrationen und Nature-Study-Bewegung die Insektenkunde in Schulen und Öffentlichkeit brachten.","sig_fr":"Artiste, éducatrice et graveuse américaine dont les illustrations et le mouvement d'étude de la nature portèrent la science des insectes aux écoles et au public.","work":"Handbook of Nature Study","year":1911},{"name":"Edward Meyrick","born":1854,"died":1938,"nat":"British","fields":["entomology"],"sig_en":"British schoolmaster-entomologist and world authority on micro-moths, whose classification of Microlepidoptera remains foundational.","sig_de":"Britischer Schulmann und Entomologe, Weltautorität für Kleinschmetterlinge, dessen Klassifikation der Microlepidoptera grundlegend bleibt.","sig_fr":"Éducateur-entomologiste britannique et autorité mondiale sur les micro-lépidoptères, dont la classification des Microlepidoptera reste fondamentale.","work":"A Handbook of British Lepidoptera","year":1895},{"name":"Florentino Ameghino","born":1854,"died":1911,"nat":"Argentine","fields":["geology","zoology","ideas"],"sig_de":"Argentinischer autodidaktischer Paläontologe, der zahlreiche fossile Säugetiere Südamerikas beschrieb und die Evolution verfocht.","sig_en":"Argentine self-taught palaeontologist who described a wealth of South American fossil mammals and championed evolution.","sig_fr":"Paléontologue autodidacte argentin qui décrivit de nombreux mammifères fossiles sud-américains et défendit l'évolution.","work":"Contribución al conocimiento de los mamíferos fósiles de la República Argentina","year":1889},{"name":"Matilda Smith","born":1854,"died":1926,"nat":"British","fields":["botany","art"],"work":"Curtis's Botanical Magazine","year":1878,"sig_en":"Kew's first official botanical artist, she drew over 2,300 plates for Curtis's Botanical Magazine across forty years.","sig_de":"Kews erste offizielle botanische Künstlerin, zeichnete über 2.300 Tafeln für Curtis's Botanical Magazine in vierzig Jahren.","sig_fr":"Première artiste botaniste officielle de Kew, elle dessina plus de 2 300 planches pour le Curtis's Botanical Magazine en quarante ans."},{"name":"Andreas Franz Wilhelm Schimper","born":1856,"died":1901,"nat":"German","fields":["botany"],"work":"Pflanzen-Geographie auf physiologischer Grundlage","year":1898,"sig_en":"German botanist whose physiological plant geography explained vegetation worldwide by climate and soil, and who coined the terms tropical rainforest and sclerophyll.","sig_de":"Deutscher Botaniker, dessen physiologische Pflanzengeographie die weltweite Vegetation durch Klima und Boden erklärte und die Begriffe Tropenregenwald und Hartlaub prägte.","sig_fr":"Botaniste allemand dont la géographie botanique physiologique expliqua la végétation mondiale par le climat et le sol, et qui forgea les termes forêt tropicale humide et sclérophylle."},{"name":"Edward Bagnall Poulton","born":1856,"died":1943,"nat":"British","fields":["entomology","ideas"],"sig_en":"British evolutionary entomologist whose 'The Colours of Animals' championed natural selection through insect coloration and mimicry.","sig_de":"Britischer Evolutionsentomologe, dessen 'The Colours of Animals' die natürliche Selektion durch Insektenfärbung und Mimikry verfocht.","sig_fr":"Entomologiste évolutionniste britannique dont « The Colours of Animals » défendit la sélection naturelle par la coloration et le mimétisme des insectes.","work":"The Colours of Animals","year":1890},{"name":"Louis Dollo","born":1857,"died":1931,"nat":"Belgian","fields":["geology","zoology","ideas"],"sig_de":"In Frankreich geborener belgischer Paläontologe, der die Iguanodons von Bernissart rekonstruierte und Dollos Gesetz der irreversiblen Evolution formulierte.","sig_en":"French-born Belgian palaeontologist who reconstructed the Bernissart Iguanodons and formulated Dollo's law of irreversible evolution.","sig_fr":"Paléontologue belge né en France qui reconstitua les Iguanodons de Bernissart et formula la loi de Dollo sur l'irréversibilité de l'évolution.","work":"Première note sur les dinosauriens de Bernissart","year":1882},{"name":"Eugène Dubois","born":1858,"died":1940,"nat":"Dutch","fields":["zoology","ideas","exploration"],"sig_de":"Niederländischer Anatom, der den Java-Menschen (Pithecanthropus erectus) entdeckte, das erste gezielt gesuchte Fossil eines Menschenvorfahren.","sig_en":"Dutch anatomist who discovered Java Man (Pithecanthropus erectus), the first fossil sought as a human ancestor.","sig_fr":"Anatomiste néerlandais qui découvrit l'homme de Java (Pithecanthropus erectus), premier fossile recherché comme ancêtre de l'humain.","work":"Pithecanthropus erectus, eine menschenähnliche Übergangsform aus Java","year":1894},{"name":"Alice Eastwood","born":1859,"died":1953,"nat":"American","fields":["botany"],"work":"A Handbook of the Trees of California","year":1905,"sig_en":"American botanist who rescued Californian type specimens from the 1906 earthquake fire and wrote a popular handbook of the state's trees.","sig_de":"Amerikanische Botanikerin, die kalifornische Typusexemplare aus dem Erdbebenbrand von 1906 rettete und ein beliebtes Handbuch der Bäume des Staates schrieb.","sig_fr":"Botaniste américaine qui sauva des spécimens types californiens de l'incendie du séisme de 1906 et écrivit un manuel populaire des arbres de l'État."},{"name":"Ernst Hartert","born":1859,"died":1933,"nat":"German","fields":["ornithology"],"work":"Die Vögel der paläarktischen Fauna","year":1903,"sig_en":"German ornithologist at Tring whose Die Vögel der paläarktischen Fauna introduced trinomial subspecies nomenclature into European bird taxonomy.","sig_de":"Deutscher Ornithologe in Tring, dessen Die Vögel der paläarktischen Fauna die trinomiale Unterartennomenklatur in die europäische Vogeltaxonomie einführte.","sig_fr":"Ornithologue allemand de Tring dont Die Vögel der paläarktischen Fauna introduisit la nomenclature trinominale des sous-espèces dans la taxonomie des oiseaux européens."},{"name":"Archibald Thorburn","born":1860,"died":1935,"nat":"Scottish","fields":["art","ornithology","zoology"],"work":"British Birds","year":1915,"sig_en":"Scottish artist whose softly naturalistic watercolours in British Birds made him the most beloved bird painter of the Edwardian era.","sig_de":"Schottischer Künstler, dessen sanft naturalistische Aquarelle in British Birds ihn zum beliebtesten Vogelmaler der edwardianischen Zeit machten.","sig_fr":"Artiste écossais dont les aquarelles doucement naturalistes de British Birds firent de lui le peintre d'oiseaux le plus aimé de l'époque édouardienne."},{"name":"George Hampson","born":1860,"died":1936,"nat":"British","fields":["entomology"],"sig_en":"British lepidopterist whose vast 'Catalogue of the Lepidoptera Phalaenae' systematised the world's moths at the British Museum.","sig_de":"Britischer Lepidopterologe, dessen umfangreicher 'Catalogue of the Lepidoptera Phalaenae' die Nachtfalter der Welt am British Museum systematisierte.","sig_fr":"Lépidoptériste britannique dont le vaste « Catalogue of the Lepidoptera Phalaenae » systématisa les hétérocères du monde au British Museum.","work":"Catalogue of the Lepidoptera Phalaenae in the British Museum","year":1898},{"name":"Fridtjof Nansen","born":1861,"died":1930,"nat":"Norwegian","fields":["exploration","zoology"],"sig_de":"Der norwegische Forscher ueberquerte Groenland, liess sein Schiff im Polareis treiben und erneuerte zugleich die Erforschung des Nervensystems.","sig_en":"The Norwegian explorer crossed Greenland, drifted his ship in the polar ice, and also renewed the study of the nervous system.","sig_fr":"L'explorateur norvegien traversa le Groenland, laissa son navire deriver dans les glaces polaires et renouvela aussi l'etude du systeme nerveux.","work":"Farthest North","year":1897},{"name":"William Morton Wheeler","born":1865,"died":1937,"nat":"American","fields":["entomology"],"sig_en":"American myrmecologist whose 'Ants' synthesised their natural history and made insect societies a subject of serious biology.","sig_de":"Amerikanischer Myrmekologe, dessen 'Ants' deren Naturgeschichte zusammenfasste und Insektenstaaten zum Gegenstand ernster Biologie machte.","sig_fr":"Myrmécologue américain dont « Ants » fit la synthèse de leur histoire naturelle et fit des sociétés d'insectes un objet de biologie sérieuse.","work":"Ants: Their Structure, Development and Behavior","year":1910},{"name":"Louis Agassiz Fuertes","born":1874,"died":1927,"nat":"American","fields":["art","ornithology"],"work":"Birds of New York","year":1910,"sig_en":"American artist regarded as Audubon's heir, whose lively, accurate paintings shaped twentieth-century field guides and bird illustration.","sig_de":"Amerikanischer Künstler, der als Audubons Erbe gilt und dessen lebendige, präzise Gemälde die Bestimmungsbücher und Vogelillustration des zwanzigsten Jahrhunderts prägten.","sig_fr":"Artiste américain considéré comme l'héritier d'Audubon, dont les peintures vivantes et exactes façonnèrent les guides de terrain et l'illustration ornithologique du vingtième siècle."}],"themes":[{"id":"order-classification","title_de":"Ordnung und Klassifikation: das Leben ordnen","title_en":"Order and Classification: Bringing Life into System","title_fr":"Ordre et classification : mettre le vivant en ordre","body_de":"Zwei Jahrhunderte lang standen Naturforscher vor einer verwirrenden Flut neu beschriebener Pflanzen und Tiere und fragten, wie sie zu ordnen sei. John Ray (1627-1705) begründete den modernen Artbegriff und gruppierte Organismen nach gemeinsamer Struktur. Carl von Linné (1707-1778) schenkte der Welt die binäre Nomenklatur und eine übersichtliche Hierarchie aus Reich, Klasse, Ordnung, Gattung und Art, wusste jedoch, dass sein sexuelles Pflanzensystem eine künstliche Bequemlichkeit war. Georges-Louis Leclerc, Comte de Buffon (1707-1788), misstraute starren Kategorien und suchte stattdessen ein natürliches System, das echte Verwandtschaften und lebendige Geschichte widerspiegelt. Die Spannung zwischen künstlichen Systemen, leicht zu handhaben, und natürlichen Systemen, den Verbindungen der Natur treu, trieb die Klassifikation voran und warf leise die Frage auf, warum Organismen einander überhaupt ähneln.","body_en":"For two centuries naturalists faced a bewildering flood of newly described plants and animals, and asked how to bring it to order. John Ray (1627-1705) grounded the modern species concept and grouped organisms by shared structure. Carl Linnaeus (1707-1778) gave the world binomial nomenclature and a tidy hierarchy of kingdom, class, order, genus and species, though he knew his sexual system of plants was an artificial convenience. Georges-Louis Leclerc, Comte de Buffon (1707-1788), distrusted rigid categories and sought instead a natural system reflecting real affinities and living history. The tension between artificial systems, easy to use, and natural systems, faithful to nature's own connections, drove classification forward and quietly raised the question of why organisms resemble one another at all.","body_fr":"Pendant deux siècles, les naturalistes firent face à un flot déroutant de plantes et d'animaux nouvellement décrits et se demandèrent comment y mettre de l'ordre. John Ray (1627-1705) fonda le concept moderne d'espèce et regroupa les organismes selon leur structure commune. Carl von Linné (1707-1778) offrit au monde la nomenclature binominale et une hiérarchie ordonnée de règne, classe, ordre, genre et espèce, tout en sachant que son système sexuel des plantes n'était qu'une commodité artificielle. Georges-Louis Leclerc, comte de Buffon (1707-1788), se méfiait des catégories rigides et cherchait plutôt un système naturel reflétant les affinités réelles et l'histoire vivante. La tension entre systèmes artificiels, faciles à employer, et systèmes naturels, fidèles aux liens de la nature, fit progresser la classification et posa discrètement la question de savoir pourquoi les organismes se ressemblent."},{"id":"natural-theology","title_de":"Natürliche Theologie: das Buch der Natur","title_en":"Natural Theology: The Book of Nature","title_fr":"La théologie naturelle : le livre de la nature","body_de":"Lange vor der Evolution lasen die meisten Naturforscher die lebendige Welt als göttlichen Text, das „Buch der Natur\", in dem jede Struktur einen weisen Schöpfer bezeugte. John Rays <em>Die Weisheit Gottes offenbart in den Werken der Schöpfung</em> (1691) gab den Ton an, und William Paleys <em>Natural Theology</em> (1802) machte das Argument berühmt mit der auf einer Heide gefundenen Uhr, die einen Uhrmacher voraussetzt. Erlesene Anpassung, das Auge, der Flügel, die Wabe der Biene, schien ein Beweis für einen Plan. Diese Tradition regte geduldige Beobachtung und riesige Sammlungen an, trug aber eine zerbrechliche Annahme in sich. Als Charles Darwin zeigte, dass natürliche Selektion dieselbe Passung von Organismus und Umwelt ohne Planer hervorbringen kann, verlor das Design-Argument seinen wissenschaftlichen Halt und wich allmählich.","body_en":"Long before evolution, most naturalists read the living world as a divine text, the \"book of nature\", in which every structure testified to a wise Creator. John Ray's <em>The Wisdom of God Manifested in the Works of Creation</em> (1691) set the tone, and William Paley's <em>Natural Theology</em> (1802) made the argument famous with its watch found upon a heath, implying a watchmaker. Exquisite adaptation, the eye, the wing, the bee's cell, seemed proof of design. This tradition inspired patient observation and vast collections, yet it carried a fragile assumption. When Charles Darwin showed that natural selection could produce the same fit between organism and environment without a designer, the argument from design lost its scientific footing and slowly gave way.","body_fr":"Bien avant l'évolution, la plupart des naturalistes lisaient le monde vivant comme un texte divin, le « livre de la nature », où chaque structure témoignait d'un Créateur sage. <em>La Sagesse de Dieu manifestée dans les œuvres de la création</em> (1691) de John Ray donna le ton, et la <em>Natural Theology</em> (1802) de William Paley rendit l'argument célèbre avec sa montre trouvée sur une lande, supposant un horloger. L'adaptation exquise, l'œil, l'aile, l'alvéole de l'abeille, semblait une preuve de dessein. Cette tradition encouragea l'observation patiente et d'immenses collections, mais reposait sur une hypothèse fragile. Lorsque Charles Darwin montra que la sélection naturelle pouvait produire le même ajustement entre l'organisme et son milieu sans concepteur, l'argument du dessein perdit son assise scientifique et s'effaça peu à peu."},{"id":"newton-to-nature","title_de":"Von Newton zur Natur: die Suche nach Gesetzen des Lebendigen","title_en":"From Newton to Nature: The Search for Laws of Life","title_fr":"De Newton à la nature : la quête des lois du vivant","body_de":"Isaac Newtons <em>Principia</em> (1687) enthüllte einen Kosmos, der von wenigen universellen Gesetzen beherrscht wird, und ihr Erfolg wurde zum Vorbild jeder nachfolgenden Wissenschaft. Wenn die Gravitation Planeten und fallende Äpfel gleichermaßen bindet, sollte dann nicht auch das Leben Gesetzen von ähnlicher Eleganz gehorchen? Naturforscher begannen, Regelmäßigkeiten unter der organischen Vielfalt zu suchen, zu messen, zu kartieren und zu quantifizieren. Linné legte eine systematische Ordnung fest, als gäbe er der Natur Gesetze, während Buffon nach allgemeinen Gesetzen der lebendigen Form suchte. Immanuel Kant bezweifelte 1790, dass es je einen Newton geben könne, der auch nur einen Grashalm erklärt, so komplex erschien das Leben. Doch der Ehrgeiz blieb: Alexander von Humboldt trug Instrumente in die Anden, um Beschreibung in Zahl zu verwandeln, und der Traum von gesetzmäßiger, einheitlicher, mathematischer Ordnung prägte die Biogeographie und schließlich die Evolution.","body_en":"Isaac Newton's <em>Principia</em> (1687) revealed a cosmos governed by a few universal laws, and its success became the model for every science that followed. If gravitation could bind planets and falling apples alike, might not life obey laws of comparable elegance? Naturalists began to seek regularities beneath organic variety, measuring, mapping and quantifying. Linnaeus imposed systematic order as if legislating for nature, while Buffon sought general laws of living form. Immanuel Kant doubted in 1790 that there could ever be a Newton capable of explaining even a blade of grass, so complex did life seem. Yet the ambition endured: Alexander von Humboldt carried instruments up the Andes to turn description into number, and the dream of lawful, unified, mathematical order shaped biogeography and eventually evolution.","body_fr":"Les <em>Principia</em> (1687) d'Isaac Newton révélèrent un cosmos gouverné par quelques lois universelles, et leur succès devint le modèle de toute science ultérieure. Si la gravitation liait aussi bien les planètes que les pommes qui tombent, la vie n'obéirait-elle pas à des lois d'une élégance comparable ? Les naturalistes se mirent à chercher des régularités sous la diversité organique, à mesurer, cartographier et quantifier. Linné imposa un ordre systématique comme s'il légiférait pour la nature, tandis que Buffon cherchait des lois générales de la forme vivante. Emmanuel Kant douta en 1790 qu'il pût jamais exister un Newton capable d'expliquer un simple brin d'herbe, tant la vie semblait complexe. Mais l'ambition demeura : Alexander von Humboldt porta ses instruments dans les Andes pour changer la description en nombre, et le rêve d'un ordre légal, unifié et mathématique façonna la biogéographie puis l'évolution."},{"id":"humboldt","title_de":"Humboldt: die Natur als vernetztes Ganzes","title_en":"Humboldt: Nature as an Interconnected Whole","title_fr":"Humboldt : la nature comme un tout interconnecté","body_de":"Alexander von Humboldt (1769-1859) verwandelte die Naturgeschichte in eine Wissenschaft der Zusammenhänge. Auf seiner amerikanischen Reise (1799-1804) bestieg er den Chimborazo und erkannte, dass sich die Vegetation mit der Höhe ebenso ändert wie mit der geographischen Breite, eine Grundeinsicht der Pflanzengeographie. In seinem Naturgemälde zeichnete er den Berg als einzigen Querschnitt, der Pflanzen, Klima, Gestein und Luft zu einem wechselseitig abhängigen Bild verband. Er erfand die Isothermen, Linien, die Orte gleicher Temperatur verbinden, um globale Muster sichtbar zu machen, die auf keiner einzelnen Karte erscheinen. Für Humboldt war die Natur ein großes lebendiges Ganzes, ein Kosmos, in dem alles wechselseitig verbunden ist, und die Aufgabe des Naturforschers bestand darin, diese Einheit ebenso zu fühlen wie zu messen. Seine Vision prägte Darwin, Haeckel und das moderne Umweltdenken.","body_en":"Alexander von Humboldt (1769-1859) transformed natural history into a science of connections. During his American journey (1799-1804) he climbed Chimborazo and saw that vegetation changes with altitude just as it does with latitude, a founding insight of plant geography. In his Naturgemälde he drew the mountain as a single cross-section linking plants, climate, rock and air into one interdependent picture. He invented isotherms, lines joining places of equal temperature, to reveal global patterns invisible on any single map. For Humboldt nature was one great living whole, a cosmos in which everything was reciprocally bound, and the naturalist's task was to feel that unity as well as to measure it. His vision shaped Darwin, Haeckel and modern environmental thought.","body_fr":"Alexander von Humboldt (1769-1859) transforma l'histoire naturelle en une science des connexions. Lors de son voyage américain (1799-1804), il gravit le Chimborazo et vit que la végétation change avec l'altitude comme elle change avec la latitude, intuition fondatrice de la géographie botanique. Dans son Naturgemälde, il dessina la montagne comme une seule coupe reliant plantes, climat, roche et air en une image interdépendante. Il inventa les isothermes, lignes joignant les lieux de température égale, pour révéler des motifs planétaires invisibles sur toute carte isolée. Pour Humboldt, la nature était un grand tout vivant, un cosmos où tout est réciproquement lié, et la tâche du naturaliste était de sentir cette unité autant que de la mesurer. Sa vision inspira Darwin, Haeckel et la pensée environnementale moderne."},{"id":"goethe-morphology","title_de":"Goethes Morphologie: der Urtyp und die Einheit der Form","title_en":"Goethe's Morphology: The Archetype and the Unity of Form","title_fr":"La morphologie de Goethe : l'archétype et l'unité de la forme","body_de":"Der Dichter Johann Wolfgang von Goethe (1749-1832) war auch ein ernsthafter Naturforscher, der das Wort „Morphologie\" für das Studium der lebendigen Form und ihrer Verwandlungen prägte. In <em>Die Metamorphose der Pflanzen</em> (1790) vertrat er die Ansicht, dass Blatt, Kelchblatt, Blütenblatt und Staubblatt alle Abwandlungen eines einzigen Grundorgans seien, wobei die Pflanze ein einziges Thema endlos abwandelt. Er suchte die Urpflanze, eine archetypische Pflanze, die das Ideal verkörpert, aus dem sich alle Arten als Varianten denken lassen. Hinter der Vielfalt der Gestalten spürte er eine Einheit des Typus, einen gemeinsamen Bauplan, der sich durch Metamorphose ausdrückt. Obwohl seine intuitive, ganzheitliche Methode sich von der späteren experimentellen Biologie unterschied, nahm Goethes Überzeugung, dass die Form eine innere Logik besitzt, die vergleichende Anatomie vorweg und bereicherte das evolutionäre Denken.","body_en":"The poet Johann Wolfgang von Goethe (1749-1832) was also a serious naturalist who coined the word \"morphology\" for the study of living form and its transformations. In <em>The Metamorphosis of Plants</em> (1790) he argued that leaf, sepal, petal and stamen are all variations of one underlying organ, the plant endlessly modifying a single theme. He searched for the Urpflanze, an archetypal plant embodying the ideal from which all species could be imagined as variants. Behind the diversity of shapes he sensed a unity of type, a common plan expressed through metamorphosis. Though his intuitive, holistic method differed from later experimental biology, Goethe's conviction that form has an inner logic, and that organisms share deep architectural unity, prefigured comparative anatomy and enriched evolutionary thinking.","body_fr":"Le poète Johann Wolfgang von Goethe (1749-1832) fut aussi un naturaliste sérieux qui forgea le mot « morphologie » pour l'étude de la forme vivante et de ses transformations. Dans <em>La Métamorphose des plantes</em> (1790), il soutint que feuille, sépale, pétale et étamine sont toutes des variations d'un même organe fondamental, la plante modulant sans fin un thème unique. Il cherchait l'Urpflanze, une plante archétypale incarnant l'idéal dont toutes les espèces pourraient se concevoir comme des variantes. Derrière la diversité des formes, il pressentait une unité de type, un plan commun exprimé par la métamorphose. Bien que sa méthode intuitive et holistique différât de la biologie expérimentale ultérieure, la conviction de Goethe que la forme possède une logique interne préfigura l'anatomie comparée et enrichit la pensée évolutionniste."},{"id":"deep-time-evolution","title_de":"Tiefenzeit und der Weg zur Evolution","title_en":"Deep Time and the Road to Evolution","title_fr":"Le temps profond et le chemin vers l'évolution","body_de":"Die Evolution brauchte Zeit, und es war die Geologie, die sie lieferte. James Hutton (1726-1797) sah in den Gesteinen „keine Spur eines Anfangs, keine Aussicht auf ein Ende\", eine unermesslich alte Erde, langsam durch gewöhnliche Kräfte umgeformt. Charles Lyells <em>Principles of Geology</em> (1830-1833) machten diese Tiefenzeit und den allmählichen, gleichförmigen Wandel zum Arbeitsglauben der Wissenschaft. Vor diesem gewaltigen Hintergrund wurde die Umwandlung der Arten denkbar. Jean-Baptiste Lamarck (1809) schlug die erste umfassende Theorie des Artenwandels vor; die anonymen <em>Vestiges</em> (1844) von Robert Chambers machten die Evolution populär und empörten die Leser. Dann lieferten Charles Darwin und Alfred Russel Wallace, die 1858 gemeinsam auftraten, den Mechanismus, die natürliche Selektion, dargelegt in <em>Über die Entstehung der Arten</em> (1859). Das Leben hatte eine Geschichte, so lang wie die der Erde.","body_en":"Evolution needed time, and it was geology that supplied it. James Hutton (1726-1797) saw in the rocks \"no vestige of a beginning, no prospect of an end\", an earth immeasurably old and slowly remade by ordinary forces. Charles Lyell's <em>Principles of Geology</em> (1830-1833) made this deep time and gradual, uniform change the working faith of the science. Against that vast backdrop, transmutation grew thinkable. Jean-Baptiste Lamarck (1809) proposed the first full theory of species change; the anonymous <em>Vestiges</em> (1844) by Robert Chambers popularised evolution and scandalised readers. Then Charles Darwin and Alfred Russel Wallace, presenting jointly in 1858, supplied the mechanism, natural selection, expounded in <em>On the Origin of Species</em> (1859). Life had a history as long as the Earth's.","body_fr":"L'évolution avait besoin de temps, et ce fut la géologie qui le fournit. James Hutton (1726-1797) ne voyait dans les roches « aucune trace d'un commencement, aucune perspective d'une fin », une Terre incommensurablement ancienne, lentement refaçonnée par des forces ordinaires. Les <em>Principles of Geology</em> (1830-1833) de Charles Lyell firent de ce temps profond et du changement graduel et uniforme la foi de travail de la science. Sur cet immense arrière-plan, la transmutation devint pensable. Jean-Baptiste Lamarck (1809) proposa la première théorie complète du changement des espèces ; les anonymes <em>Vestiges</em> (1844) de Robert Chambers popularisèrent l'évolution et scandalisèrent les lecteurs. Puis Charles Darwin et Alfred Russel Wallace, présentant conjointement en 1858, fournirent le mécanisme, la sélection naturelle, exposé dans <em>L'Origine des espèces</em> (1859). La vie avait une histoire aussi longue que celle de la Terre."},{"id":"ecology-web","title_de":"Das Netz des Lebens: die Geburt der Ökologie","title_en":"The Web of Life: The Birth of Ecology","title_fr":"La toile de la vie : la naissance de l'écologie","body_de":"Die Vorstellung, dass die Lebewesen ein einziges verwobenes Gewebe bilden, wuchs allmählich zu einer Wissenschaft heran. Humboldt hatte bereits gezeigt, wie Organismen über ganze Landschaften hinweg an Klima, Boden und einander gebunden sind. Charles Darwin gab der Vision am Schluss der Entstehung der Arten (1859) ihr einprägsamstes Bild, das „verworrene Ufer\", bewachsen von vielen Pflanzen, Vögeln, Insekten und Würmern, die alle durch „rings um uns wirkende Gesetze\" voneinander abhängen. Seine Arbeiten über Regenwürmer, Orchideen und den Kampf ums Dasein verfolgten unzählige solcher Verbindungen. 1866 gab der deutsche Zoologe Ernst Haeckel dem Feld seinen Namen und prägte „Oecologie\" (Ökologie) für die Wissenschaft von den Beziehungen zwischen Organismen und ihrer Umwelt. Das Netz des Lebens war zum Gegenstand disziplinierter Forschung geworden.","body_en":"The idea that living things form a single interwoven fabric grew slowly into a science. Humboldt had already shown organisms bound to climate, soil and one another across whole landscapes. Charles Darwin gave the vision its most memorable image at the close of the <em>Origin</em> (1859), the \"entangled bank\" clothed with many plants, birds, insects and worms, all dependent on each other through \"laws acting around us\". His work on earthworms, orchids and the struggle for existence traced countless such linkages. In 1866 the German zoologist Ernst Haeckel gave the field its name, coining \"Oecologie\" (ecology) for the science of the relations between organisms and their environment. The web of life had become an object of disciplined study.","body_fr":"L'idée que les êtres vivants forment un seul tissu entrelacé devint peu à peu une science. Humboldt avait déjà montré les organismes liés au climat, au sol et les uns aux autres à travers des paysages entiers. Charles Darwin donna à cette vision son image la plus mémorable à la fin de <em>L'Origine des espèces</em> (1859), le « talus enchevêtré » couvert de plantes, d'oiseaux, d'insectes et de vers nombreux, tous dépendant les uns des autres par des « lois agissant autour de nous ». Ses travaux sur les vers de terre, les orchidées et la lutte pour l'existence retracèrent d'innombrables liens de ce genre. En 1866, le zoologiste allemand Ernst Haeckel donna son nom à la discipline, forgeant « Oecologie » (écologie) pour la science des relations entre les organismes et leur milieu. La toile de la vie était devenue un objet d'étude rigoureux."}]};const FIGS=D.figures, THEMES=D.themes;
const GLOSS={"taxonomy": "The science of naming and sorting living things into groups.", "classification": "Arranging living things into ordered groups by their similarities.", "systematics": "The study of how living things are related and how to classify them.", "species": "One kind of living thing whose members can breed together.", "genus": "A group of closely related species — the first word of a Latin name.", "family": "A larger group of related genera (plant or animal families).", "binomial nomenclature": "The two-word Latin naming system: genus + species (e.g. Homo sapiens).", "nomenclature": "The system of names used in a subject.", "hierarchy": "A ranking of groups from broad to narrow (kingdom down to species).", "morphology": "The study of the shape and structure of living things.", "anatomy": "The study of the inside structure of living things.", "physiology": "The study of how the parts of a living thing work.", "naturalist": "A person who studies plants, animals and nature, often outdoors.", "botany": "The scientific study of plants.", "zoology": "The scientific study of animals.", "ornithology": "The scientific study of birds.", "entomology": "The scientific study of insects.", "conchology": "The study of shells.", "palaeontology": "The study of fossils and ancient life.", "paleontology": "The study of fossils and ancient life.", "geology": "The study of the Earth, its rocks and its history.", "fossil": "The preserved remains or trace of an ancient living thing.", "evolution": "The slow change of living things over many generations.", "natural selection": "The process where better-suited living things survive and pass on their traits.", "descent with modification": "Darwin's phrase for how species change as they come from earlier ones.", "transmutation": "An older word for one species changing into another.", "adaptation": "A feature that helps a living thing survive where it lives.", "ecology": "The study of how living things relate to each other and  tool that makes very small things look much bigger.", "protozoa": "Tiny single-celled living things seen under a microscope.", "bacteria": "Tiny single-celled living things; some helpful, some harmful.", "alkaloid": "A bitter plant chemical, often powerful as a medicine or poison (e.g. atropine).", "styptic": "Something that stops bleeding.", "emetic": "Something that makes you vomit.", "tuber": "A swollen underground part of a plant that stores food (like a potato).", "rhizome": "An underground stem that grows sideways.", "perennial": "A plant that lives for several years.", "annual": "A plant that lives for only one year.", "calcareous": "Containing chalk or lime (lime-rich soil).", "affinities": "Natural family likenesses between living things.", "apothecary": "An old word for a pharmacist — someone who prepared and sold medicines.", "friar": "A member of a religious brotherhood, often travelling and preaching.", "Jesuit": "A member of the Society of Jesus, a Catholic order known for scholarship.", "polymath": "A person who is expert in many very different subjects.", "buccaneer": "A pirate, especially one who raided Spanish ships in the Caribbean.", "taxidermy": "The art of preparing and mounting dead animals so they look lifelike.", "curare": "A South American plant poison that relaxes muscles; used on arrows and later in surgery.", "quinine": "A medicine from tree bark used to treat malaria.", "malaria": "A dangerous fever spread by mosquito bites, common in the tropics.", "scurvy": "A disease caused by lack of vitamin C, common on long sea voyages.", "cyanotype": "An early photographic print in Prussian blue, made using sunlight.", "mimicry": "When one animal copies the look of another for protection.", "spontaneous generation": "The old, mistaken belief that living things can arise from non-living matter.", "germ plasm": "An early idea that inherited information passes only through reproductive cells.", "phagocyte": "A type of white blood cell that surrounds and 'eats' germs.", "capillary": "The tiniest blood vessel, linking arteries to veins.", "capillaries": "The tiniest blood vessels, linking arteries to veins.", "chlorophyll": "The green colouring in plants that captures sunlight to make food.", "spore": "A tiny reproductive cell of fungi, ferns and mosses that grows into a new individual.", "spores": "Tiny reproductive cells of fungi, ferns and mosses that grow into new individuals.", "marsupial": "A mammal, like a kangaroo, that carries its young in a pouch.", "marsupials": "Mammals, like kangaroos, that carry their young in a pouch.", "specimen": "A single example of a plant, animal or rock collected for study.", "expedition": "An organised journey made for exploration or research.", "zoogeography": "The study of how animals are spread across the world.", "circumnavigate": "To travel all the way around the world.", "rubber": "A stretchy material made from the sap of certain tropical trees.", "type specimen": "The single specimen that officially defines a species' name."}, NAMEMAP={"John Ray": "John Ray", "Ray": "John Ray", "Carl Linnaeus": "Carl Linnaeus", "Linnaeus": "Carl Linnaeus", "Carl von Linné": "Carl Linnaeus", "Linné": "Carl Linnaeus", "Georges-Louis Leclerc, Comte de Buffon": "Georges-Louis Leclerc, Comte de Buffon", "Buffon": "Georges-Louis Leclerc, Comte de Buffon", "Isaac Newton": "Isaac Newton", "Newton": "Isaac Newton", "Immanuel Kant": "Immanuel Kant", "Emmanuel Kant": "Immanuel Kant", "Kant": "Immanuel Kant", "Alexander von Humboldt": "Alexander von Humboldt", "Humboldt": "Alexander von Humboldt", "Johann Wolfgang von Goethe": "Johann Wolfgang von Goethe", "Goethe": "Johann Wolfgang von Goethe", "Jean-Baptiste Lamarck": "Jean-Baptiste Lamarck", "Lamarck": "Jean-Baptiste Lamarck", "Charles Lyell": "Charles Lyell", "Lyell": "Charles Lyell", "James Hutton": "James Hutton", "Hutton": "James Hutton", "Robert Chambers": "Robert Chambers (publisher, born 1802)", "Chambers": "Robert Chambers (publisher, born 1802)", "Charles Darwin": "Charles Darwin", "Darwin": "Charles Darwin", "Alfred Russel Wallace": "Alfred Russel Wallace", "Wallace": "Alfred Russel Wallace", "Ernst Haeckel": "Ernst Haeckel", "Haeckel": "Ernst Haeckel", "William Paley": "William Paley", "Paley": "William Paley", "Georges Cuvier": "Georges Cuvier", "Cuvier": "Georges Cuvier"}, HERO={"Alexander von Humboldt":{"desc":"Climbed Mount Chimborazo in Ecuador without oxygen gear. He mapped the entire Orinoco River network and proved all natural systems are interconnected.","birth":"Schloss Tegel, Berlin (Havel River) & Freiberg Mining District, Germany","active":"Orinoco & Amazon Basins","peak":"1799–1804"},"Alfred Russel Wallace":{"desc":"Lost four years of Amazon collections in a mid-ocean ship fire. He recovered, explored Indonesia, and independently derived evolution by natural selection.","birth":"Usk, Monmouthshire (River Usk, Wales)","active":"Amazon & Rio Negro Rivers, Malay Archipelago","peak":"1848–1862"},"William Dampier":{"desc":"A buccaneer and pirate who became the first person to sail around the world three times, recording detailed meteorological maps and describing Australia's unique wildlife.","birth":"East Coker, Somerset (River Yeo, England)","active":"Shark Bay, Western Australia","peak":"1686–1711"},"Fridtjof Nansen":{"desc":"Skied across frozen Greenland and intentionally froze his ship *Fram* into Arctic pack ice for three years to measure polar ocean currents.","birth":"Store Frøen, Oslo (Oslofjord, Norway)","active":"Arctic Ocean & Greenland Ice Sheet","peak":"1888–1896"},"Charles Waterton":{"desc":"Eccentric explorer who wrestled a live 10-foot caiman alligator in Guyana to capture it, then transformed his Yorkshire estate into the world's first walled wild bird sanctuary.","birth":"Walton Hall, Wakefield (River Calder, Yorkshire, England)","active":"Demerara River, Guyana","peak":"1812–1824"},"Georg Wilhelm Steller":{"desc":"Joined Vitus Bering's Great Northern Expedition to Alaska. Shipwrecked on an icy, uninhabited island, he cataloged the giant 30-foot Steller’s Sea Cow before it went extinct.","birth":"Bad Windsheim, Franconia (Aisch River, Germany)","active":"Bering Island, Kamchatka","peak":"1741"},"Aime Bonpland":{"desc":"Botanist who trekked through South American jungles alongside Humboldt, collecting 6,000 unknown plant species.","birth":"La Rochelle, Charente-Maritime (Atlantic Coast, France)","active":"Orinoco River & Andes Mountains","peak":""},"David Douglas":{"desc":"Trekker through the dense forests of Oregon and Washington, introducing the massive Douglas-fir tree to Europe.","birth":"Scone, Perthshire (River Tay, Scotland)","active":"Columbia River, Pacific Northwest","peak":""},"David Livingstone":{"desc":"Walked thousands of miles across Central Africa mapping major rivers and waterfalls while documenting native flora.","birth":"Blantyre, Lanarkshire (River Clyde, Scotland)","active":"Zambezi River & Lake Tanganyika","peak":""},"Odoardo Beccari":{"desc":"Discovered the *Titan Arum* in the Sumatran jungle—the world's largest (and foulest-smelling) flower structure.","birth":"Florence, Tuscany (Arno River, Italy)","active":"Rainforests of Sumatra & Borneo","peak":""},"Pehr Kalm":{"desc":"Sent to North America by Linnaeus; wrote detailed accounts of Niagara Falls, local trees, and surviving swarms of black flies.","birth":"Svalov, Ostrobothnia (Kemi River Basin, Finland/Sweden)","active":"St. Lawrence & Hudson Rivers","peak":""},"Richard Spruce":{"desc":"Spent 15 years mapping Amazonian tributaries, collecting over 30,000 moss, liverwort, and tree specimens.","birth":"Ganthorpe, North Yorkshire (River Derwent, England)","active":"Amazon & Andes Mountains","peak":""},"Charles Darwin":{"desc":"Five-year voyage aboard HMS *Beagle* observing island species led him to formulate the mechanism of natural selection, shattering Victorian science.","birth":"Shrewsbury (River Severn) & Down House, Kent, England","active":"Galápagos Islands","peak":"1831–1859"},"Gregor Mendel":{"desc":"Augustinian monk who systematically cultivated and analyzed 28,000 pea plants to discover the fundamental laws of genetic inheritance.","birth":"Hynčice, Silesia & St. Thomas Abbey, Brno (Svratka River, Czechia)","active":"","peak":"1856–1863"},"Thomas Henry Huxley":{"desc":"Nicknamed 'Darwin’s Bulldog' for aggressively championing evolutionary theory in high-profile public debates against conservative theologians.","birth":"Ealing, Middlesex (River Thames) & South Kensington, London, England","active":"","peak":"1860–1880"},"Jean-Baptiste Lamarck":{"desc":"Early evolutionist who theorized that organisms pass down traits acquired during their lifetimes (e.g., giraffes stretching their necks).","birth":"Bazentin, Picardy & Jardin des Plantes, Paris (Seine River, France)","active":"","peak":"1801–1809"},"Ernst Haeckel":{"desc":"Coined the word 'Ecology', produced breathtaking artistic illustrations of microscopic sea life, and popularized evolution across Europe.","birth":"Potsdam (Havel River) & Jena, Thuringia (Saale River, Germany)","active":"Gulf of Naples","peak":"1866–1899"},"Philip Lutley Sclater":{"desc":"Divided the entire terrestrial world into 6 major zoogeographic regions (e.g., Neotropical, Palearctic) that scientists still use today.","birth":"Teffont Magna, Wiltshire (River Nadder) & Regent's Park, London, England","active":"","peak":"1858–1899"},"August Weismann":{"desc":"Proved experimentally that body injuries or acquired changes are not inherited, proposing the 'germ plasm' theory of genetics.","birth":"Frankfurt am Main (Main River) & Freiburg im Breisgau (Dreisam River, Germany)","active":"","peak":""},"Fritz Müller":{"desc":"Discovered 'Müllerian Mimicry' by showing why two distasteful butterfly species evolve identical warning patterns to scare birds.","birth":"Windischholzhausen, Thuringia, Germany","active":"Santa Catarina Coast, Blumenau, Brazil","peak":""},"Robert Chambers":{"desc":"Anonymously published a sensational 1844 bestseller on evolution that primed the public for Darwin 15 years later.","birth":"Peebles, Scottish Borders (River Tweed) & Edinburgh, Scotland","active":"","peak":""},"Thomas Robert Malthus":{"desc":"Economist whose essay showing populations outgrow their food supply provided Darwin and Wallace with the key mechanism for natural selection.","birth":"Rookery, Surrey (River Tillingbourne) & Bath, Somerset, England","active":"","peak":""},"Mary Anning":{"desc":"Self-taught, working-class fossil hunter who excavated the first complete Ichthyosaur and Plesiosaur skeletons from collapsing seaside cliffs.","birth":"Lyme Regis, Dorset (River Char & Jurassic Coast, England)","active":"","peak":"1811–1830"},"Georges Cuvier":{"desc":"The 'Father of Paleontology' who compared elephant skeletons to mammoths, proving to a skeptical world that species can go extinct.","birth":"Montbéliard, Franche-Comté & Paris Basin (Seine River, France)","active":"","peak":"1796–1822"},"Edward Drinker Cope":{"desc":"Aggressive paleontologist who waged the infamous 'Bone Wars' against Marsh, discovering over 1,000 extinct fossil species.","birth":"Philadelphia, Pennsylvania (Schuylkill River, USA)","active":"Wyoming & Colorado Badlands","peak":"1870–1892"},"Othniel Charles Marsh":{"desc":"Cope’s bitter rival who named iconic dinosaurs like *Triceratops*, *Stegosaurus*, and *Brontosaurus* using trainloads of western fossils.","birth":"Lockport, New York (Erie Canal, USA)","active":"Morrison Formation, Rocky Mountains","peak":"1870–1892"},"Richard Owen":{"desc":"Coined the word 'Dinosaur' ('Terrible Lizard') in 1842 and led the drive to establish London’s famous Natural History Museum.","birth":"Lancaster, Lancashire (River Lune) & Natural History Museum, London, England","active":"","peak":"1841–1881"},"Gideon Mantell":{"desc":"Sussex physician who, with his wife Mary Ann, discovered fossil teeth in limestone and described *Iguanodon*, the second dinosaur named.","birth":"Lewes, East Sussex (River Ouse) & South Downs, England","active":"","peak":"1822–1834"},"Charles Lyell":{"desc":"Geologist who proved Earth's landscape is shaped by slow, uniform processes over millions of years, breaking biblical timelines.","birth":"Kinnordy, Angus (River Isla, Scotland)","active":"Mount Etna, Sicily, Italy","peak":""},"William Buckland":{"desc":"Described *Megalosaurus* (the first named dinosaur) and proved fossil-filled British caves were once ancient hyena dens.","birth":"Axminster, Devon (River Axe) & Kirkdale Cave, North Yorkshire, England","active":"","peak":""},"William Smith":{"desc":"Canal surveyor who realized rock layers are ordered by unique fossils, creating the first nationwide geological map of Britain.","birth":"Churchill, Oxfordshire & Somerset Coal Canal, Bath, England","active":"","peak":""},"Antonie van Leeuwenhoek":{"desc":"Draper who ground micro-lenses to become the first human to observe bacteria, blood cells, and swimming microscopic organisms ('animalcules').","birth":"Delft, South Holland (Oude Delft Canal, Netherlands)","active":"","peak":"1674–1683"},"Matthias Jakob Schleiden":{"desc":"Co-founded cell theory by demonstrating that all plant tissues are composed of individual, organized microscopic cells.","birth":"Hamburg (Elbe River) & University of Jena (Saale River, Germany)","active":"","peak":"1838"},"Theodor Schwann":{"desc":"Extended Schleiden's plant work to animals, proving all living structures—from nerve fibers to muscle—are constructed from cells.","birth":"Neuss, Rhineland (Rhine River, Germany) & University of Louvain (Dyle River, Belgium)","active":"","peak":"1839"},"Marcello Malpighi":{"desc":"Pioneered microscopic anatomy, discovering the microscopic capillaries that connect arteries to veins in lungs.","birth":"Crevalcore, Emilia-Romagna & University of Bologna (Reno River, Italy)","active":"","peak":"1661–1686"},"Élie Metchnikoff":{"desc":"Stuck thorn splinters into starfish embryos under a microscope, discovering phagocytes (white blood cells that eat infection).","birth":"Ivanovka, Kharkiv Region (Dnieper Basin, Ukraine)","active":"Strait of Messina, Sicily, Italy","peak":"1882–1908"},"Jan Swammerdam":{"desc":"Used ultra-fine micro-dissection tools under magnification to prove insects metamorphose from existing structures, rather than spontaneous generation.","birth":"Amsterdam, North Holland (Amstel River, Netherlands)","active":"","peak":"1668–1675"},"Anton de Bary":{"desc":"The father of plant pathology, who used microscopes to prove that parasitic fungi caused the catastrophic Irish Potato Famine.","birth":"Frankfurt am Main (Main River, Germany) & Strasbourg, Alsace (Ill/Rhine Rivers, France)","active":"","peak":""},"Julius von Sachs":{"desc":"Showed through microscopic plant tests that chlorophyll inside plant cells transforms sunlight into starch.","birth":"Breslau (Oder River, now Wrocław, Poland) & Würzburg, Bavaria (Main River, Germany)","active":"","peak":""},"Lazzaro Spallanzani":{"desc":"Boiled broths in sealed flasks to prove microbes do not generate spontaneously from air, laying the groundwork for Pasteur.","birth":"Scandiano, Reggio Emilia & University of Pavia (Ticino/Po Rivers, Italy)","active":"","peak":""},"Maria Sibylla Merian":{"desc":"At age 52, she sailed to Suriname to paint live insect metamorphosis in wild rainforests, revolutionizing entomological art.","birth":"Frankfurt am Main (Main River) & Nuremberg (Pegnitz River, Germany)","active":"Surinam River","peak":"1699–1705"},"John James Audubon":{"desc":"Traveled frontier American rivers painting life-sized, dramatic portraits of birds for his monumental copperplate book *Birds of America*.","birth":"Les Cayes, Saint-Domingue & Mill Grove, Pennsylvania (Perkiomen Creek, USA)","active":"Mississippi River","peak":"1827–1838"},"Pierre-Joseph Redouté":{"desc":"Official court painter to Empress Joséphine, famed worldwide for his velvety, scientifically accurate watercolor paintings of roses and lilies.","birth":"Saint-Hubert, Ardennes (Belgium) & Château de Malmaison, Paris (Seine River, France)","active":"","peak":"1798–1824"},"Marianne North":{"desc":"Unaccompanied Victorian artist who traveled the globe painting over 800 oil landscapes of tropical plants in their native settings.","birth":"Hastings, East Sussex (English Channel, England)","active":"Global Voyages (Brazil, India, Borneo)","peak":"1871–1885"},"Ferdinand Bauer":{"desc":"Sailed around Australia sketching plants and animals using a complex 1,000-number color-coding system to paint later with perfect fidelity.","birth":"Feldsberg, Moravia (Thaya River, Czechia) & Hietzing, Vienna (Danube Canal, Austria)","active":"Australian Coast","peak":"1801–1814"},"Edward Lear":{"desc":"Before writing nonsense poems, he published breathtaking, highly accurate lithographs of living parrots and toucans.","birth":"Holloway, London (River Thames, England)","active":"Sanremo, Ligurian Coast, Italy","peak":"1830–1837"},"Anna Atkins":{"desc":"Created the world's first photographically illustrated book using light-sensitive blue cyanotype impressions of seaweeds.","birth":"Tonbridge, Kent (River Medway, England)","active":"","peak":""},"Mark Catesby":{"desc":"Explored colonial Virginia and the Carolinas, producing the first comprehensive illustrated work on North American wildlife.","birth":"Castle Hedingham, Essex (River Colne, England)","active":"Savannah & James Rivers, USA","peak":""},"Sydney Parkinson":{"desc":"Botanical illustrator on Captain Cook's first Pacific voyage who drew hundreds of rare species before dying at sea.","birth":"Edinburgh (Firth of Forth, Scotland)","active":"Pacific Ocean (HMS Endeavour)","peak":""},"Jean-Henri Fabre":{"desc":"Spent decades in an arid Provençal garden observing living wasps, dung beetles, and spiders, capturing their instincts in poetic detail.","birth":"Saint-Léons, Aveyron & Harmas de Sérignan, Vaucluse (Rhône Valley, France)","active":"","peak":"1879–1907"},"Thomas Say":{"desc":"The 'Father of American Entomology', who described thousands of North American insects during hazardous western frontier expeditions.","birth":"Philadelphia, Pennsylvania","active":"Wabash River, New Harmony, Indiana, USA","peak":"1819–1828"},"Charles Valentine Riley":{"desc":"Pioneered biological pest control by importing Australian Vedalia ladybugs to destroy scales threatening California citrus groves.","birth":"London (River Thames, England)","active":"Mississippi River Valley & Washington D.C., USA","peak":"1868–1889"},"Johan Christian Fabricius":{"desc":"Linnaeus's star insect pupil who categorized over 10,000 arthropod species based strictly on the structures of their mouthparts.","birth":"Tønder, Duchy of Schleswig (Denmark) & University of Kiel (Kiel Fjord, Germany)","active":"","peak":"1775–1804"},"Pierre André Latreille":{"desc":"Saved from execution during the French Revolution when he found a rare beetle (*Necrobia*) in his prison cell, impressing the prison doctor.","birth":"Brive-la-Gaillarde, Corrèze (Corrèze River) & Jardin des Plantes, Paris (Seine River, France)","active":"","peak":"1796–1825"},"Eleanor Ormerod":{"desc":"Self-taught economic entomologist who published massive annual reports educating farmers on controlling destructive agricultural pests.","birth":"Sedbury Park, Gloucestershire (River Severn & Wye Estuary, England)","active":"","peak":"1877–1898"},"Auguste Forel":{"desc":"World expert on ant brain structure, ant colony organization, and complex social insect behaviors.","birth":"La Sagne, Vaud & Burghölzli, Zurich (Lake Zurich/Limmat River, Switzerland)","active":"","peak":""},"Eugène Simon":{"desc":"The premier spider authority in history, personally describing over 4,000 species of arachnids from around the globe.","birth":"Paris (Seine River Basin, France)","active":"","peak":""},"William Morton Wheeler":{"desc":"Pioneered the study of social insects, demonstrating that ant colonies function like unified 'superorganisms'.","birth":"Milwaukee, Wisconsin (Lake Michigan, USA)","active":"Harvard University","peak":""},"Georges-Louis Leclerc, Comte de Buffon":{"desc":"Wrote *Histoire Naturelle*, a massive 36-volume encyclopedia describing the entire animal kingdom with lively style.","birth":"Montbard, Burgundy (Brenne River) & Jardin du Roi, Paris (Seine River, France)","active":"","peak":"1749–1788"},"John Gould":{"desc":"Ornithologist and publisher who identified Darwin's Galápagos finches as distinct species and created giant illustrated bird folios.","birth":"Lyme Regis, Dorset & Zoological Society of London (Regent's Park, England)","active":"","peak":"1837–1881"},"Alexander Wilson":{"desc":"The 'Father of American Ornithology', who walked thousands of miles sketching wild birds before Audubon entered the field.","birth":"Paisley, Renfrewshire (White Cart Water, Scotland)","active":"Delaware River, Philadelphia, USA","peak":"1808–1813"},"Henry Walter Bates":{"desc":"Spent 11 years in Amazonian forests collecting 14,000 species and discovering 'Batesian Mimicry' (harmless species imitating toxic ones).","birth":"Leicester (River Soar, England)","active":"Amazon & Tapajós Rivers, Brazil","peak":"1848–1859"},"Coenraad Jacob Temminck":{"desc":"First director of the National Museum of Natural History in Leiden, classifying vast animal shipments from Japan and the East Indies.","birth":"Amsterdam & Rijksmuseum van Natuurlijke Historie, Leiden (Old Rhine River, Netherlands)","active":"","peak":"1820–1844"},"Alfred Brehm":{"desc":"Author of *Brehm's Life of Animals*, the premier illustrated animal encyclopedia that shaped popular zoology across 19th-century Europe.","birth":"Renthendorf, Thuringia (Roda River Valley, Germany)","active":"Danube & Nile River Basins","peak":"1863–1869"},"Marcus Elieser Bloch":{"desc":"Berlin physician who published a world-famous 12-volume illustrated study of world fish species with metallic prints.","birth":"Ansbach, Franconia & Berlin (Spree River, Germany)","active":"","peak":""},"Richard Bowdler Sharpe":{"desc":"Curated and cataloged over 300,000 bird specimens at the British Museum, producing a massive 27-volume reference.","birth":"London (River Thames) & British Museum (Natural History), South Kensington, England","active":"","peak":""},"Carl Linnaeus":{"desc":"The 'Father of Taxonomy' who simplified global biology by creating two-part Latin names (*binomial nomenclature*) for all known living species.","birth":"Råshult, Småland (Lake Möckeln) & Uppsala University (Fyris River, Sweden)","active":"","peak":"1735–1753"},"Joseph Dalton Hooker":{"desc":"Darwin’s closest friend; trekked hazardous Himalayan passes to introduce wild rhododendrons and later directed Kew Gardens.","birth":"Halesworth, Suffolk & Kew Gardens, London (River Thames, England)","active":"Sikkim Himalayas","peak":"1847–1885"},"Robert Brown":{"desc":"Botany genius who collected thousands of Australian plants and used microscopic lenses to discover 'Brownian Motion' and the cell nucleus.","birth":"Montrose, Angus (River South Esk, Scotland)","active":"Australian Coasts & Soho Square, London, England","peak":"1801–1827"},"Carl Friedrich Philipp von Martius":{"desc":"Explored 6,000 miles of Brazilian rivers to publish *Historia Naturalis Palmarum*, the ultimate masterwork on palm trees.","birth":"Erlangen, Franconia (Regnitz River) & Munich (Isar River, Germany)","active":"Amazon Basin","peak":"1817–1853"},"Asa Gray":{"desc":"The leading 19th-century American botanist who cataloged North American flora and acted as Darwin’s primary advocate in the US.","birth":"Paris, Oneida County, New York & Harvard Botanic Garden (Charles River, USA)","active":"","peak":"1848–1879"},"Alice Eastwood":{"desc":"Heroic botanist who entered the burning California Academy of Sciences during the 1906 earthquake to rescue nearly 1,500 rare plant type specimens.","birth":"Toronto (Lake Ontario, Canada) & California Academy of Sciences, San Francisco, USA","active":"","peak":"1892–1936"},"Antoine-Laurent de Jussieu":{"desc":"Created the first natural classification system grouping plants into logical families (like lilies or roses) rather than arbitrary traits.","birth":"Lyon (Rhône/Saône Confluence) & Jardin des Plantes, Paris (Seine River, France)","active":"","peak":""},"Christiaan Hendrik Persoon":{"desc":"Pioneered modern mycology by publishing the foundational classification systems for mushrooms and parasitic fungi.","birth":"Cape of Good Hope","active":"Latin Quarter, Paris (Seine River, France)","peak":""},"Wilhelm Hofmeister":{"desc":"Self-taught clerk turned professor who discovered the alternation of generations in ferns and mosses, linking seedless plants to seed plants.","birth":"Leipzig, Saxony (White Elster River) & University of Tübingen (Neckar River, Germany)","active":"","peak":""}}, XTRA={"Nicolas Robert":{"birth":"Langres, France","hook":"He painted flowers and animals so precisely onto calf-skin vellum that he launched the Velins du Roi, a royal collection French kings treasured for over a century."},"Robert Morison":{"birth":"Aberdeen, Scotland","hook":"Left with a serious head wound after fighting for the king at the Battle of the Bridge of Dee, he fled to France and became a royal botanist."},"Georg Eberhard Rumphius":{"birth":"Wolfersheim, Germany","hook":"Blind, and after an earthquake killed his wife and daughter and a fire burned his drawings, he still completed his great catalogue of Ambon's tropical plants."},"John Ray":{"birth":"Black Notley, Essex, England","hook":"A blacksmith's son from an Essex village, he was the first to define what a biological 'species' actually is, an idea every biologist still uses."},"Jan Commelin":{"birth":"Amsterdam (River Amstel), Netherlands","hook":"He ran Amsterdam's botanical garden as exotic plants poured in from Dutch ships worldwide, showcasing the rarest arrivals in a lavish two-volume book."},"Francis Willughby":{"birth":"Middleton, Warwickshire, England","hook":"This wealthy naturalist toured Europe cataloguing birds but died at just 36, so his friend John Ray published his pioneering bird book for him."},"Hendrik van Rheede":{"birth":"Amsterdam (River Amstel), Netherlands","hook":"As a Dutch governor in India he directed dozens of local scholars and artists to create the 12-volume Hortus Malabaricus, then died at sea."},"Filippo Bonanni":{"birth":"Rome, Italy","hook":"This Jesuit wrote the first-ever book devoted entirely to seashells, and also built early microscopes and studied the shellac that makes shiny varnish."},"Pierre Magnol":{"birth":"Montpellier, France","hook":"He was the first to group plants into 'families' like relatives, and the magnolia tree carries his name to this very day."},"Martin Lister":{"birth":"Radclive, Buckinghamshire, England","hook":"He wrote the first book cataloguing spiders, filled volumes with shell engravings drawn by his daughters, and even proposed mapping the rocks beneath England."},"Nehemiah Grew":{"birth":"Mancetter, Warwickshire, England","hook":"Peering through early microscopes, he revealed the hidden cells and tissues inside plants and described how flowers carry male and female parts."},"Isaac Newton":{"birth":"Woolsthorpe, Lincolnshire, England","hook":"Born so tiny and premature they said he'd fit in a quart mug, he grew up to give the universe its mathematical laws of gravity and motion."},"Leonard Plukenet":{"birth":"London (River Thames), England","hook":"His 'Phytographia' packed thousands of plants from across the globe onto its plates, becoming a treasure-map of the world's flora for fellow botanists."},"Charles Plumier":{"birth":"Marseille, France","hook":"This wandering friar crossed the Atlantic three times exploring the Caribbean, naming the Magnolia, Begonia and Fuchsia after other botanists."},"Gottfried Wilhelm Leibniz":{"birth":"Leipzig, Germany","hook":"He co-invented calculus, dreamed up the binary code that computers now use, and imagined Earth's fiery molten past long before geology existed."},"Paul Hermann":{"birth":"Halle (River Saale), Germany","hook":"He sailed to Ceylon as a young company doctor, collecting exotic plants whose specimens Linnaeus himself studied decades after Hermann's death."},"Engelbert Kaempfer":{"birth":"Lemgo, Germany","hook":"He journeyed through Russia and Persia all the way to secluded Japan, where he obtained the first Western description of the ginkgo tree."},"Joseph Pitton de Tournefort":{"birth":"Aix-en-Provence, France","hook":"He nailed down the idea of the 'genus' for grouping plants, then died in Paris after a runaway cart crushed him against a wall."},"Hans Sloane":{"birth":"Killyleagh, County Down, Ireland","hook":"In Jamaica he tasted local cocoa and invented a milk-chocolate drink, and his collection of over 70,000 items became the founding treasure of the British Museum."},"Olof Rudbeck the Younger":{"birth":"Uppsala (Fyris River), Sweden","hook":"His dream of picturing every plant on Earth went up in smoke when the great Uppsala fire of 1702 destroyed most of his plates."},"Albertus Seba":{"birth":"Etzel, Germany","hook":"This Amsterdam apothecary sold his entire cabinet of curiosities to Russia's Tsar Peter the Great, then simply started collecting a second, even grander one."},"Claude Aubriet":{"birth":"France","hook":"He sketched plants and animals across the Levant on Tournefort's expedition, and the purple rock-cress 'Aubrieta' in gardens today is named for him."},"James Petiver":{"birth":"Hillmorton, Warwickshire, England","hook":"This London apothecary begged sea-captains and travellers worldwide to mail him specimens, amassing a global collection that Hans Sloane later bought whole."},"Rudolf Jakob Camerarius":{"birth":"Tubingen (River Neckar), Germany","hook":"Through careful experiments he proved that plants have sexes, showing that stamens and pistils are the male and female organs of a flower."},"Herman Boerhaave":{"birth":"Voorhout, Netherlands","hook":"Europe's most famous doctor left a sealed book of medical secrets; when opened, nearly every page was blank except 'keep the head cool, feet warm'."},"Sébastien Vaillant":{"birth":"Vigny, France","hook":"His bold public lecture on plant sex scandalised and thrilled listeners, directly inspiring Linnaeus's system of classifying flowers by their reproductive parts."},"Stephen Hales":{"birth":"Bekesbourne, Kent, England","hook":"This curious clergyman strapped tubes to plants and animals to measure sap and blood pressure, founding plant physiology from his country parish."},"Pier Antonio Micheli":{"birth":"Florence (River Arno), Italy","hook":"Peering at moulds and mushrooms, he discovered that fungi grow from tiny spores, becoming the founding father of the science of fungi."},"René Antoine Ferchault de Réaumur":{"birth":"La Rochelle, France","hook":"He invented his own temperature scale, ran the first artificial-silk experiments, and filled six volumes with astonishingly detailed studies of insects."},"Johann Jacob Dillenius":{"birth":"Darmstadt, Germany","hook":"He wrote the first systematic study of mosses, ferns and other 'lower' plants, the overlooked greenery most botanists of his day ignored."},"Cadwallader Colden":{"birth":"Ireland","hook":"A colonial New York official who mapped plants, wrote on physics and medicine, and exchanged letters directly with Linnaeus in Sweden."},"Philip Miller":{"birth":"Deptford, England","hook":"Master of London's Chelsea Physic Garden, his 'Gardeners Dictionary' was so trusted that gardeners across Europe treated it as the final word on plants."},"George Edwards":{"birth":"Stratford, England","hook":"Called the father of British ornithology, he drew and described hundreds of birds new to science, many sent to him from distant colonies."},"Bernard de Jussieu":{"birth":"Lyon (River Rhone), France","hook":"He quietly arranged the king's Trianon garden by natural plant families, an idea so powerful his nephew built a whole classification system on it."},"John Bartram":{"birth":"Darby, Pennsylvania, America","hook":"This self-taught Quaker farmer trekked from Florida to the Great Lakes hunting new plants, shipping American seeds and trees to eager European gardens."},"Charles Marie de La Condamine":{"birth":"Paris (River Seine), France","hook":"He led a decade-long expedition to the equator in Peru to measure Earth's true shape, then rafted down the Amazon, bringing back rubber and quinine."},"Madeleine Françoise Basseporte":{"birth":"Paris (River Seine), France","hook":"One of very few women to hold the post of royal botanical painter, she added flower paintings to the king's vellum collection for nearly forty years."},"August Johann Rösel von Rosenhof":{"birth":"Arnstadt, Germany","hook":"A gifted miniature-painter, he raised insects and frogs at home to portray their life-cycles in dazzling, scientifically accurate colour plates."},"Georg Wolfgang Knorr":{"birth":"Nuremberg (River Pegnitz), Germany","hook":"This Nuremberg engraver created some of the earliest beautiful colour plates of seashells and fossils, treating ancient petrified creatures as objects of wonder."},"Elizabeth Blackwell":{"birth":"Aberdeen, Scotland","hook":"She drew, engraved and hand-coloured an entire herbal single-handedly to earn money and free her husband from debtors' prison."},"Georges-Louis Leclerc de Buffon":{"birth":"Montbard, France","hook":"In his 36-volume 'Histoire Naturelle' he dared suggest that Earth was far older than the Bible claimed and that species might change over time."},"Johannes Burman":{"birth":"Amsterdam (River Amstel), Netherlands","hook":"He described the plants of faraway Ceylon and the Cape, and gave the young, unknown Linnaeus a home and a job when he first reached Amsterdam."},"Albrecht von Haller":{"birth":"Bern (River Aare), Switzerland","hook":"A true genius who wrote poetry, catalogued Alpine flowers, and ran hundreds of experiments proving that muscles and nerves respond to stimulation."},"Georg Dionysius Ehret":{"birth":"Heidelberg (River Neckar), Germany","hook":"Starting as a poor gardener's boy, he became the greatest botanical artist of his age, whose flower paintings still dazzle in museums today."},"Carl Alexander Clerck":{"birth":"Stockholm, Sweden","hook":"A pupil of Linnaeus, his 'Swedish Spiders' gave arachnids their first officially recognised scientific names under the new rules of naming."},"Carl Clerck":{"birth":"Stockholm, Sweden","hook":"His beautifully illustrated 'Svenska Spindlar' was among the very first works ever to use Linnaeus's two-word naming system, cataloguing Sweden's spiders."},"Johann Georg Gmelin":{"birth":"Tubingen (River Neckar), Germany","hook":"He spent ten grueling years crossing frozen Siberia for the Russian tsars, describing hundreds of plants no European had ever seen."},"Abraham Trembley":{"birth":"Geneva (River Rhone), Switzerland","hook":"He sliced a tiny freshwater hydra into pieces and watched each fragment grow into a whole new animal, astonishing all of Europe."},"Stepan Krasheninnikov":{"birth":"Moscow (Moskva), Russia","hook":"Sent across all of Russia to remote Kamchatka, he survived a shipwreck and wrote the first detailed account of its volcanoes, geysers and peoples."},"John Miller":{"birth":"Nuremberg (Pegnitz), Germany","hook":"His engravings of Linnaeus's flower system were so exquisite that Linnaeus himself declared no one had ever drawn plants more beautifully."},"Peter Kalm":{"birth":"Ångermanland, Sweden","hook":"He wrote one of the first scientific descriptions of Niagara Falls, and Linnaeus honoured him by naming the mountain laurel, Kalmia, after him."},"Charles Bonnet":{"birth":"Geneva (Rhône), Switzerland","hook":"By isolating a single female aphid and watching it give birth with no male present, he proved some insects can reproduce entirely without fathers."},"Charles De Geer":{"birth":"Finspång, Sweden","hook":"A wealthy young baron, he poured his fortune into studying insects, producing seven lavish volumes that carried on Réaumur's unfinished masterwork."},"Gilbert White":{"birth":"Selborne, England","hook":"By listening carefully in one small village, he became the first to tell apart three near-identical leaf warblers by their songs alone."},"Patrick Browne":{"birth":"County Mayo, Ireland","hook":"Braving tropical fevers in Jamaica, he wrote one of the first natural histories to sort a whole island's plants using Linnaeus's brand-new naming system."},"Pieter Cramer":{"birth":"Amsterdam (Amstel), Netherlands","hook":"This Amsterdam merchant used his trading fortune to publish gorgeous colour plates of exotic butterflies shipped in from across the world's tropics."},"Fredric Hasselquist":{"birth":"Östergötland, Sweden","hook":"He sailed to the Holy Land to study its wildlife but died at just 30, so heavily in debt that Sweden's queen paid to rescue his notebooks."},"Giovanni Antonio Scopoli":{"birth":"Cavalese, Italy","hook":"While doctoring workers in a dangerous mercury mine, he studied the surrounding insects and was among the first to describe deadly mercury poisoning."},"Mathurin Jacques Brisson":{"birth":"Fontenay-le-Comte, France","hook":"His six giant volumes carefully sorted more than 1,500 kinds of birds, and scientists still quote his names over 250 years later."},"Pehr Osbeck":{"birth":"Västergötland, Sweden","hook":"As a ship's chaplain sailing to Canton, he collected hundreds of new Chinese plants, sending Linnaeus treasures from the far side of the world."},"Dru Drury":{"birth":"London (Thames), England","hook":"A London silversmith, he paid ship captains around the globe to bring him insects, building a collection of over 11,000 specimens."},"Immanuel Kant":{"birth":"Königsberg (Pregel), Prussia","hook":"So punctual on his daily walk that neighbours set their clocks by him, he also correctly guessed the Sun and planets formed from a spinning cloud of gas."},"Étienne Louis Geoffroy":{"birth":
