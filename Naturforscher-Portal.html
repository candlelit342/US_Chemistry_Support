alley flint tools proved humanity's great antiquity alongside extinct animals.","sig_fr":"Antiquaire français dont les outils de silex de la vallée de la Somme prouvèrent la haute antiquité de l'humanité aux côtés d'animaux éteints.","work":"Antiquités celtiques et antédiluviennes","year":1847},{"name":"Prideaux John Selby","born":1788,"died":1867,"nat":"English","fields":["ornithology","art"],"work":"Illustrations of British Ornithology","year":1821,"sig_en":"English naturalist whose Illustrations of British Ornithology was the first to depict British birds life-size, rivalling Audubon's grand folios.","sig_de":"Englischer Naturforscher, dessen Illustrations of British Ornithology britische Vögel erstmals in Lebensgröße darstellte und Audubons großen Foliobänden gleichkam.","sig_fr":"Naturaliste anglais dont Illustrations of British Ornithology fut le premier à représenter les oiseaux britanniques grandeur nature, rivalisant avec les grands in-folios d'Audubon."},{"name":"Joakim Frederik Schouw","born":1789,"died":1852,"nat":"Danish","fields":["botany"],"work":"Grundzüge einer allgemeinen Pflanzengeographie","year":1823,"sig_en":"Danish botanist and pioneer of plant geography who mapped the world's vegetation into floral regions in his general phytogeography.","sig_de":"Dänischer Botaniker und Wegbereiter der Pflanzengeographie, der die Vegetation der Welt in seiner allgemeinen Pflanzengeographie in Florenreiche gliederte.","sig_fr":"Botaniste danois et pionnier de la géographie botanique qui divisa la végétation du monde en régions florales dans sa phytogéographie générale."},{"name":"William Scoresby","born":1789,"died":1857,"nat":"British","fields":["exploration","geology","zoology"],"sig_de":"Der englische Walfaenger und Gelehrte erforschte die arktischen Meere und verfasste die erste wissenschaftliche Beschreibung der Arktis.","sig_en":"The English whaler and scholar studied the Arctic seas and wrote the first scientific account of the Arctic regions.","sig_fr":"Le baleinier et savant anglais etudia les mers arctiques et redigea la premiere description scientifique des regions arctiques.","work":"An Account of the Arctic Regions","year":1820},{"name":"William Swainson","born":1789,"died":1855,"nat":"English","fields":["ornithology","art","zoology","entomology"],"work":"Zoological Illustrations","year":1820,"sig_en":"English naturalist and pioneer of lithography in zoology, a prolific illustrator whose quinarian classification made him controversial.","sig_de":"Englischer Naturforscher und Pionier der Lithographie in der Zoologie, ein produktiver Illustrator, dessen quinäres Klassifikationssystem ihn umstritten machte.","sig_fr":"Naturaliste anglais et pionnier de la lithographie en zoologie, illustrateur prolifique dont la classification quinaire le rendit controversé."},{"name":"Gideon Mantell","born":1790,"died":1852,"nat":"British","fields":["geology"],"sig_de":"Englischer Chirurg und Fossiliensammler, der Iguanodon, einen der ersten bekannten Dinosaurier, entdeckte und beschrieb.","sig_en":"English surgeon and fossil collector who discovered and described Iguanodon, among the first known dinosaurs.","sig_fr":"Chirurgien et collectionneur de fossiles anglais qui découvrit et décrivit l'Iguanodon, l'un des premiers dinosaures connus.","work":"The Fossils of the South Downs","year":1822},{"name":"Jules Dumont d'Urville","born":1790,"died":1842,"nat":"French","fields":["exploration","botany"],"sig_de":"Der franzoesische Seefahrer und Botaniker entdeckte die Venus von Milo, erforschte Ozeanien und erreichte die Antarktis-Kueste Adelieland.","sig_en":"The French navigator and botanist found the Venus de Milo, explored Oceania, and reached the Antarctic coast of Adelie Land.","sig_fr":"Le navigateur et botaniste francais decouvrit la Venus de Milo, explora l'Oceanie et atteignit la cote antarctique de Terre Adelie.","work":"Voyage au pole sud et dans l'Oceanie","year":1841},{"name":"John Curtis","born":1791,"died":1862,"nat":"British","fields":["entomology","art","botany"],"sig_en":"English illustrator whose 'British Entomology' paired exquisite engravings of insects with their food-plants.","sig_de":"Englischer Illustrator, dessen 'British Entomology' erlesene Insektenstiche mit ihren Futterpflanzen verband.","sig_fr":"Illustrateur anglais dont « British Entomology » associa de superbes gravures d'insectes à leurs plantes nourricières.","work":"British Entomology","year":1824},{"name":"Sarah Bowdich Lee","born":1791,"died":1856,"nat":"British","fields":["zoology","art","exploration"],"work":"The Fresh-Water Fishes of Great Britain","year":1828,"sig_en":"Naturalist, explorer and artist who illustrated the first colour-plate book on British freshwater fishes.","sig_de":"Naturforscherin, Entdeckerin und Künstlerin, die das erste Farbtafelbuch über britische Süßwasserfische illustrierte.","sig_fr":"Naturaliste, exploratrice et artiste qui illustra le premier livre à planches colorées sur les poissons d'eau douce britanniques."},{"name":"William Elford Leach","born":1791,"died":1836,"nat":"British","fields":["zoology","entomology"],"sig_de":"Englischer Zoologe am British Museum, der die britische Karzinologie und Entomologie durch akribische Systematik modernisierte.","sig_en":"English zoologist at the British Museum who modernized British carcinology and entomology through meticulous systematics.","sig_fr":"Zoologiste anglais du British Museum qui modernisa la carcinologie et l'entomologie britanniques par une systématique méticuleuse.","work":"Malacostraca Podophthalmata Britanniae","year":1815},{"name":"Augusta Innes Withers","born":1792,"died":1877,"nat":"British","fields":["botany","art"],"work":"The Pomological Magazine","year":1828,"sig_en":"Flower painter to Queen Adelaide who illustrated pomological works and Bateman's monumental orchid folio.","sig_de":"Blumenmalerin von Königin Adelaide, die pomologische Werke und Batemans monumentalen Orchideenfolianten illustrierte.","sig_fr":"Peintre de fleurs de la reine Adélaïde, elle illustra des ouvrages pomologiques et le monumental in-folio d'orchidées de Bateman."},{"name":"James Francis Stephens","born":1792,"died":1852,"nat":"British","fields":["entomology"],"sig_en":"English entomologist whose multi-volume 'Illustrations of British Entomology' systematically documented the nation's insect fauna.","sig_de":"Englischer Entomologe, dessen mehrbändige 'Illustrations of British Entomology' die Insektenfauna des Landes systematisch dokumentierte.","sig_fr":"Entomologiste anglais dont les « Illustrations of British Entomology » documentèrent systématiquement la faune entomologique du pays.","work":"Illustrations of British Entomology","year":1827},{"name":"Karl Ernst von Baer","born":1792,"died":1876,"nat":"Baltic German","fields":["zoology","ideas"],"sig_de":"Baltisch-deutscher Naturforscher, Begründer der vergleichenden Embryologie, der die Eizelle der Säugetiere entdeckte und die Keimblattgesetze formulierte.","sig_en":"Baltic-German naturalist, founder of comparative embryology, who discovered the mammalian ovum and formulated the germ-layer laws.","sig_fr":"Naturaliste germano-balte, fondateur de l'embryologie comparée, qui découvrit l'ovule des mammifères et formula les lois des feuillets germinatifs.","work":"Über Entwickelungsgeschichte der Thiere","year":1828},{"name":"Roderick Murchison","born":1792,"died":1871,"nat":"Scottish","fields":["geology"],"sig_de":"Schottischer Geologe, der das silurische System und, mit anderen, das Devon und Perm definierte und so das Paläozoikum ordnete.","sig_en":"Scottish geologist who defined the Silurian system and, with others, the Devonian and Permian, ordering the Palaeozoic.","sig_fr":"Géologue écossais qui définit le système silurien et, avec d'autres, le Dévonien et le Permien, ordonnant le Paléozoïque.","work":"The Silurian System","year":1839},{"name":"William Sharp Macleay","born":1792,"died":1865,"nat":"British","fields":["entomology","ideas"],"sig_en":"British naturalist whose 'Horae Entomologicae' proposed the influential, if flawed, quinarian system of natural classification.","sig_de":"Britischer Naturforscher, dessen 'Horae Entomologicae' das einflussreiche, wenn auch fehlerhafte quinäre System der natürlichen Klassifikation vorschlug.","sig_fr":"Naturaliste britannique dont « Horae Entomologicae » proposa le système quinaire de classification naturelle, influent quoique erroné.","work":"Horae Entomologicae","year":1819},{"name":"Johann Friedrich von Eschscholtz","born":1793,"died":1831,"nat":"German","fields":["zoology","entomology","exploration"],"sig_de":"Der deutsch-russische Arzt und Zoologe erforschte auf zwei Weltreisen Pazifikkueste und Inseln und benannte den Kalifornischen Mohn.","sig_en":"The German-Russian physician and zoologist explored Pacific coasts and islands on two circumnavigations and named the California poppy.","sig_fr":"Le medecin et zoologiste germano-russe explora les cotes et iles du Pacifique lors de deux tours du monde et nomma le pavot de Californie.","work":"Zoologischer Atlas","year":1829},{"name":"Robert Havell","born":1793,"died":1878,"nat":"British","fields":["ornithology","art"],"work":"The Birds of America (engraver)","year":1827,"sig_en":"Master aquatint engraver who translated Audubon's watercolours into the printed plates of The Birds of America.","sig_de":"Meisterhafter Aquatinta-Stecher, der Audubons Aquarelle in die gedruckten Tafeln von The Birds of America übertrug.","sig_fr":"Maître graveur à l'aquatinte qui transposa les aquarelles d'Audubon en planches imprimées de The Birds of America."},{"name":"Achille Valenciennes","born":1794,"died":1865,"nat":"French","fields":["zoology"],"sig_de":"Französischer Zoologe, der mit Cuvier die zweiundzwanzigbändige Histoire naturelle des poissons verfasste, die große Ichthyologie der Epoche.","sig_en":"French zoologist who, with Cuvier, compiled the twenty-two-volume Histoire naturelle des poissons, the era's great ichthyology.","sig_fr":"Zoologiste français qui compila avec Cuvier l'Histoire naturelle des poissons en vingt-deux volumes, la grande ichtyologie de l'époque.","work":"Histoire naturelle des poissons","year":1828},{"name":"Carl Friedrich Philipp von Martius","born":1794,"died":1868,"nat":"German","fields":["botany","exploration"],"work":"Flora Brasiliensis","year":1840,"sig_en":"German botanist who explored Amazonia and launched the vast Flora Brasiliensis, the greatest survey ever made of a tropical flora.","sig_de":"Deutscher Botaniker, der Amazonien erforschte und die riesige Flora Brasiliensis begann – die größte je erstellte Übersicht einer tropischen Flora.","sig_fr":"Botaniste allemand qui explora l'Amazonie et lança la vaste Flora Brasiliensis, le plus grand inventaire jamais réalisé d'une flore tropicale."},{"name":"Christian Heinrich Pander","born":1794,"died":1865,"nat":"Baltic German","fields":["zoology","ideas"],"sig_de":"Baltisch-deutscher Embryologe, der erstmals die drei Keimblätter des sich entwickelnden Hühnerembryos beschrieb.","sig_en":"Baltic-German embryologist who first described the three germ layers of the developing chick embryo.","sig_fr":"Embryologiste germano-balte qui décrivit le premier les trois feuillets germinatifs de l'embryon de poulet en développement.","work":"Beiträge zur Entwickelungsgeschichte des Hühnchens im Eye","year":1817},{"name":"Eduard Rueppell","born":1794,"died":1884,"nat":"German","fields":["zoology","exploration"],"sig_de":"Der Frankfurter Naturforscher durchreiste Nordostafrika und Arabien und brachte zahllose neue Tiere und Pflanzen mit.","sig_en":"The Frankfurt naturalist traveled Northeast Africa and Arabia, bringing back countless new animals and plants.","sig_fr":"Le naturaliste de Francfort parcourut l'Afrique du Nord-Est et l'Arabie, rapportant d'innombrables animaux et plantes nouveaux.","work":"Atlas zu der Reise im noerdlichen Afrika","year":1826},{"name":"Eduard Rüppell","born":1794,"died":1884,"nat":"German","fields":["ornithology","zoology","exploration"],"work":"Atlas zu der Reise im nördlichen Afrika","year":1826,"sig_en":"Wealthy German explorer of north-east Africa who collected extensively in Ethiopia; Rüppell's vulture commemorates his pioneering journeys.","sig_de":"Wohlhabender deutscher Erforscher Nordostafrikas, der ausgiebig in Äthiopien sammelte; der Rüppellgeier erinnert an seine bahnbrechenden Reisen.","sig_fr":"Riche explorateur allemand du nord-est de l'Afrique qui collecta abondamment en Éthiopie ; le vautour de Rüppell rappelle ses voyages pionniers."},{"name":"Elias Magnus Fries","born":1794,"died":1878,"nat":"Swedish","fields":["botany"],"work":"Systema Mycologicum","year":1821,"sig_en":"Swedish botanist who systematised the fungi in his Systema Mycologicum, becoming the Linnaeus of mushroom classification.","sig_de":"Schwedischer Botaniker, der die Pilze in seinem Systema Mycologicum ordnete und zum Linné der Pilzsystematik wurde.","sig_fr":"Botaniste suédois qui systématisa les champignons dans son Systema Mycologicum, devenant le Linné de la mycologie."},{"name":"Rene Primevere Lesson","born":1794,"died":1849,"nat":"French","fields":["zoology","ornithology","exploration"],"sig_de":"Der franzoesische Schiffsarzt umsegelte auf der Coquille die Welt und beschrieb erstmals lebende Paradiesvoegel und viele Pazifiktiere.","sig_en":"The French ship's surgeon circled the world on the Coquille and was first to describe living birds of paradise and many Pacific animals.","sig_fr":"Le chirurgien de marine francais fit le tour du monde sur la Coquille et decrivit le premier des paradisiers vivants et maints animaux du Pacifique.","work":"Voyage autour du monde sur la Coquille","year":1826},{"name":"Christian Gottfried Ehrenberg","born":1795,"died":1876,"nat":"German","fields":["zoology","exploration","geology","botany"],"sig_de":"Deutscher Mikroskopiker, der die Mikropaläontologie begründete und die riesige Welt mikroskopischer Organismen in Wasser und Gestein enthüllte.","sig_en":"German microscopist who founded micropalaeontology and revealed the vast world of microscopic organisms in water and rock.","sig_fr":"Microscopiste allemand qui fonda la micropaléontologie et révéla le vaste monde des organismes microscopiques dans l'eau et la roche.","work":"Die Infusionsthierchen als vollkommene Organismen","year":1838},{"name":"Thaddeus William Harris","born":1795,"died":1856,"nat":"American","fields":["entomology"],"sig_en":"American naturalist whose treatise on injurious insects founded economic and agricultural entomology in the United States.","sig_de":"Amerikanischer Naturforscher, dessen Abhandlung über schädliche Insekten die ökonomische und landwirtschaftliche Entomologie in den USA begründete.","sig_fr":"Naturaliste américain dont le traité sur les insectes nuisibles fonda l'entomologie économique et agricole aux États-Unis.","work":"A Treatise on Some of the Insects Injurious to Vegetation","year":1841},{"name":"Carl Ludwig Blume","born":1796,"died":1862,"nat":"German-Dutch","fields":["botany","exploration"],"work":"Bijdragen tot de flora van Nederlandsch Indië","year":1825,"sig_en":"German-Dutch botanist who documented the flora of Java and the Dutch East Indies and directed the Leiden herbarium.","sig_de":"Deutsch-niederländischer Botaniker, der die Flora Javas und Niederländisch-Indiens erfasste und das Leidener Herbarium leitete.","sig_fr":"Botaniste germano-néerlandais qui documenta la flore de Java et des Indes néerlandaises et dirigea l'herbier de Leyde."},{"name":"Henry De la Beche","born":1796,"died":1855,"nat":"British","fields":["geology","art","ideas"],"work":"Duria Antiquior","year":1830,"sig_en":"Geologist who painted Duria Antiquior, the first depiction of prehistoric life reconstructed from fossils, founding the art of paleoart.","sig_de":"Geologe, der Duria Antiquior malte, die erste aus Fossilien rekonstruierte Darstellung urzeitlichen Lebens, und damit die Paläokunst begründete.","sig_fr":"Géologue qui peignit Duria Antiquior, première représentation de la vie préhistorique reconstituée d'après les fossiles, fondant l'art paléontologique."},{"name":"John Torrey","born":1796,"died":1873,"nat":"American","fields":["botany"],"work":"A Flora of North America","year":1838,"sig_en":"American botanist and chemist who, with Asa Gray, launched the great Flora of North America and mentored a generation of collectors.","sig_de":"Amerikanischer Botaniker und Chemiker, der mit Asa Gray die große Flora of North America begann und eine Generation von Sammlern förderte.","sig_fr":"Botaniste et chimiste américain qui, avec Asa Gray, lança la grande Flora of North America et forma une génération de collecteurs."},{"name":"Orra White Hitchcock","born":1796,"died":1863,"nat":"American","fields":["geology","botany","art"],"work":"Report on the Geology, Mineralogy, Botany, and Zoology of Massachusetts","year":1833,"sig_en":"One of America's earliest women scientific illustrators, who drew geological and botanical plates for her husband's pioneering surveys.","sig_de":"Eine der frühesten wissenschaftlichen Illustratorinnen Amerikas, die geologische und botanische Tafeln für die bahnbrechenden Kartierungen ihres Mannes zeichnete.","sig_fr":"L'une des premières illustratrices scientifiques américaines, elle dessina des planches géologiques et botaniques pour les relevés pionniers de son mari."},{"name":"William MacGillivray","born":1796,"died":1852,"nat":"Scottish","fields":["ornithology","zoology"],"work":"A History of British Birds","year":1837,"sig_en":"Scottish naturalist whose anatomically rigorous History of British Birds advanced classification and who assisted Audubon with scientific text.","sig_de":"Schottischer Naturforscher, dessen anatomisch strenge History of British Birds die Klassifikation voranbrachte und der Audubon beim wissenschaftlichen Text half.","sig_fr":"Naturaliste écossais dont l'History of British Birds, rigoureuse en anatomie, fit progresser la classification et qui aida Audubon pour le texte scientifique."},{"name":"Andrew Smith","born":1797,"died":1872,"nat":"British","fields":["zoology","exploration"],"sig_de":"Der schottische Arzt begruendete die zoologische Erforschung Suedafrikas und beschrieb dessen Reptilien, Saeugetiere und Voegel.","sig_en":"The Scottish physician founded the zoological exploration of South Africa, describing its reptiles, mammals and birds.","sig_fr":"Le medecin ecossais fonda l'exploration zoologique de l'Afrique du Sud, decrivant ses reptiles, mammiferes et oiseaux.","work":"Illustrations of the Zoology of South Africa","year":1838},{"name":"Charles Lyell","born":1797,"died":1875,"nat":"Scottish","fields":["geology","ideas"],"sig_de":"Schottischer Geologe, dessen Principles of Geology den Aktualismus und die geologische Tiefenzeit begründete und Darwin entscheidend beeinflusste.","sig_en":"Scottish geologist whose Principles of Geology established uniformitarianism and deep time, decisively influencing Darwin.","sig_fr":"Géologue écossais dont Principles of Geology établit l'actualisme et le temps profond, influençant décisivement Darwin.","work":"Principles of Geology","year":1830},{"name":"Frederick William Hope","born":1797,"died":1862,"nat":"British","fields":["entomology"],"sig_en":"English clergyman-collector who founded Oxford's Hope Entomological Collections and wrote 'The Coleopterist's Manual'.","sig_de":"Englischer Geistlicher und Sammler, der Oxfords Hope Entomological Collections gründete und 'The Coleopterist's Manual' verfasste.","sig_fr":"Ecclésiastique et collectionneur anglais qui fonda les Hope Entomological Collections d'Oxford et écrivit « The Coleopterist's Manual ».","work":"The Coleopterist's Manual","year":1837},{"name":"Étienne Mulsant","born":1797,"died":1880,"nat":"French","fields":["entomology"],"sig_en":"French entomologist whose 'Histoire naturelle des coléoptères de France' remained a standard reference on French beetles.","sig_de":"Französischer Entomologe, dessen 'Histoire naturelle des coléoptères de France' ein Standardwerk über französische Käfer blieb.","sig_fr":"Entomologiste français dont l'« Histoire naturelle des coléoptères de France » demeura une référence sur les coléoptères français.","work":"Histoire naturelle des coléoptères de France","year":1839},{"name":"Anna Atkins","born":1799,"died":1871,"nat":"British","fields":["botany","art"],"work":"Photographs of British Algae: Cyanotype Impressions","year":1843,"sig_en":"British botanist and photographer who made the first book illustrated with photographs, her cyanotype impressions of British algae.","sig_de":"Britische Botanikerin und Fotografin, die das erste mit Fotografien illustrierte Buch schuf – ihre Cyanotypie-Abbildungen britischer Algen.","sig_fr":"Botaniste et photographe britannique qui réalisa le premier livre illustré de photographies, ses cyanotypes d'algues britanniques."},{"name":"David Douglas","born":1799,"died":1834,"nat":"Scottish","fields":["botany","exploration"],"work":"Journal Kept by David Douglas During His Travels in North America","year":1914,"sig_en":"Scottish plant hunter who introduced the Douglas fir and many conifers and lupins to Europe before dying young in a Hawaiian bull-pit.","sig_de":"Schottischer Pflanzenjäger, der die Douglasie und viele Nadelbäume und Lupinen nach Europa brachte, ehe er jung in einer hawaiischen Stierfalle starb.","sig_fr":"Chasseur de plantes écossais qui introduisit le sapin de Douglas et de nombreux conifères et lupins en Europe, avant de mourir jeune à Hawaï."},{"name":"Félix Édouard Guérin-Méneville","born":1799,"died":1874,"nat":"French","fields":["entomology","zoology"],"sig_en":"French entomologist and editor whose 'Iconographie du règne animal' illustrated the animal kingdom and advanced applied entomology.","sig_de":"Französischer Entomologe und Herausgeber, dessen 'Iconographie du règne animal' das Tierreich illustrierte und die angewandte Entomologie förderte.","sig_fr":"Entomologiste et éditeur français dont l'« Iconographie du règne animal » illustra le règne animal et développa l'entomologie appliquée.","work":"Iconographie du règne animal","year":1829},{"name":"Gottlieb August Wilhelm Herrich-Schäffer","born":1799,"died":1874,"nat":"German","fields":["entomology"],"sig_en":"German entomologist whose systematic, finely illustrated treatment of European Lepidoptera set new taxonomic standards.","sig_de":"Deutscher Entomologe, dessen systematische, fein illustrierte Bearbeitung der europäischen Schmetterlinge neue taxonomische Maßstäbe setzte.","sig_fr":"Entomologiste allemand dont le traitement systématique et finement illustré des lépidoptères européens fixa de nouveaux standards taxonomiques.","work":"Systematische Bearbeitung der Schmetterlinge von Europa","year":1843},{"name":"Jean Baptiste Boisduval","born":1799,"died":1879,"nat":"French","fields":["entomology","botany"],"sig_en":"French physician-botanist and leading lepidopterist whose 'Species général des lépidoptères' surveyed the world's butterflies.","sig_de":"Französischer Arzt, Botaniker und führender Lepidopterologe, dessen 'Species général des lépidoptères' die Schmetterlinge der Welt erfasste.","sig_fr":"Médecin-botaniste français et grand lépidoptériste dont le « Species général des lépidoptères » recensa les papillons du monde.","work":"Histoire naturelle des insectes: Species général des lépidoptères","year":1836},{"name":"John Lindley","born":1799,"died":1865,"nat":"British","fields":["botany"],"work":"The Vegetable Kingdom","year":1846,"sig_en":"British botanist and orchid authority who defended the natural system and, through The Vegetable Kingdom, helped save Kew as a national garden.","sig_de":"Britischer Botaniker und Orchideen-Autorität, der das natürliche System verteidigte und durch The Vegetable Kingdom half, Kew als Nationalgarten zu retten.","sig_fr":"Botaniste britannique et spécialiste des orchidées qui défendit le système naturel et, par The Vegetable Kingdom, contribua à sauver Kew comme jardin national."},{"name":"Mary Anning","born":1799,"died":1847,"nat":"British","fields":["geology","exploration"],"sig_de":"Englische Fossiliensammlerin aus Lyme Regis, deren Funde von Ichthyosauriern, Plesiosauriern und Flugsauriern die frühen Vorstellungen vom Urleben umgestalteten.","sig_en":"English fossil hunter of Lyme Regis whose ichthyosaur, plesiosaur and pterosaur discoveries reshaped early views of prehistoric life.","sig_fr":"Chasseuse de fossiles anglaise de Lyme Regis dont les découvertes d'ichtyosaures, plésiosaures et ptérosaures bouleversèrent les premières visions de la vie préhistorique.","work":"First complete Plesiosaurus skeleton","year":1823},{"name":"Priscilla Susan Bury","born":1799,"died":1872,"nat":"British","fields":["botany","art"],"work":"A Selection of Hexandrian Plants","year":1831,"sig_en":"Amateur artist whose large, spectacular plates of lilies and amaryllis rank among the finest colour-printed botanical works.","sig_de":"Amateurkünstlerin, deren große, spektakuläre Tafeln von Lilien und Amaryllis zu den schönsten farbgedruckten botanischen Werken zählen.","sig_fr":"Artiste amatrice dont les grandes et spectaculaires planches de lys et d'amaryllis comptent parmi les plus beaux ouvrages botaniques imprimés en couleur."},{"name":"Titian Peale","born":1799,"died":1885,"nat":"American","fields":["ornithology","entomology","zoology","art","exploration"],"work":"American Ornithology (Bonaparte)","year":1825,"sig_en":"Naturalist-artist on major American expeditions who painted birds, butterflies and mammals of the young United States.","sig_de":"Naturforscher und Künstler auf bedeutenden amerikanischen Expeditionen, der Vögel, Schmetterlinge und Säugetiere der jungen Vereinigten Staaten malte.","sig_fr":"Naturaliste-artiste des grandes expéditions américaines, il peignit les oiseaux, papillons et mammifères des jeunes États-Unis."},{"name":"George Bentham","born":1800,"died":1884,"nat":"British","fields":["botany"],"work":"Genera Plantarum","year":1862,"sig_en":"Self-taught British botanist whose Genera Plantarum, written with Hooker, classified all seed-plant genera and remains a foundation of plant taxonomy.","sig_de":"Autodidaktischer britischer Botaniker, dessen mit Hooker verfasste Genera Plantarum alle Samenpflanzengattungen ordnete und bis heute ein Fundament der Systematik bildet.","sig_fr":"Botaniste britannique autodidacte dont le Genera Plantarum, écrit avec Hooker, classa tous les genres de plantes à graines et reste un fondement de la taxonomie."},{"name":"Heinrich Georg Bronn","born":1800,"died":1862,"nat":"German","fields":["geology","zoology","ideas"],"sig_de":"Deutscher Paläontologe, der den Fossilbericht chronologisch systematisierte und Darwins Origin erstmals ins Deutsche übersetzte.","sig_en":"German palaeontologist who systematized the fossil record chronologically and first translated Darwin's Origin into German.","sig_fr":"Paléontologue allemand qui systématisa chronologiquement le registre fossile et traduisit le premier l'Origine de Darwin en allemand.","work":"Lethaea Geognostica","year":1834},{"name":"Henri Milne-Edwards","born":1800,"died":1885,"nat":"French","fields":["zoology"],"sig_de":"Französischer Zoologe, Meister der Krebssystematik und vergleichenden Physiologie, der das Konzept der physiologischen Arbeitsteilung förderte.","sig_en":"French zoologist, master of crustacean systematics and comparative physiology, who advanced the concept of division of physiological labour.","sig_fr":"Zoologiste français, maître de la systématique des crustacés et de la physiologie comparée, qui développa le concept de division du travail physiologique.","work":"Histoire naturelle des crustacés","year":1834},{"name":"James Clark Ross","born":1800,"died":1862,"nat":"British","fields":["exploration"],"sig_de":"Der englische Seefahrer fand den magnetischen Nordpol und fuehrte die grosse britische Antarktis-Expedition an, auf der Hooker sammelte.","sig_en":"The English navigator located the north magnetic pole and led the great British Antarctic expedition on which Hooker collected.","sig_fr":"Le navigateur anglais localisa le pole nord magnetique et dirigea la grande expedition antarctique britannique ou Hooker collecta.","work":"A Voyage of Discovery and Research in the Southern and Antarctic Regions","year":1847},{"name":"Johann Georg Wagler","born":1800,"died":1832,"nat":"German","fields":["ornithology","zoology"],"work":"Systema Avium","year":1827,"sig_en":"German herpetologist and ornithologist whose Systema Avium proposed an influential classification of birds before his early accidental death.","sig_de":"Deutscher Herpetologe und Ornithologe, dessen Systema Avium eine einflussreiche Vogelklassifikation vorschlug, bevor er früh durch einen Unfall starb.","sig_fr":"Herpétologiste et ornithologue allemand dont le Systema Avium proposa une classification influente des oiseaux avant sa mort accidentelle précoce."},{"name":"Adolphe Brongniart","born":1801,"died":1876,"nat":"French","fields":["botany","geology"],"work":"Histoire des végétaux fossiles","year":1828,"sig_en":"French botanist known as the father of palaeobotany, whose Histoire des végétaux fossiles first classified extinct plants and linked them to strata.","sig_de":"Französischer Botaniker, Vater der Paläobotanik, dessen Histoire des végétaux fossiles erstmals ausgestorbene Pflanzen klassifizierte und mit Schichten verknüpfte.","sig_fr":"Botaniste français dit père de la paléobotanique, dont l'Histoire des végétaux fossiles classa les premières plantes disparues et les relia aux strates."},{"name":"Christian Erich Hermann von Meyer","born":1801,"died":1869,"nat":"German","fields":["geology","zoology"],"sig_de":"Deutscher Paläontologe, der Archaeopteryx und Plateosaurus benannte und zahlreiche fossile Reptilien klassifizierte.","sig_en":"German palaeontologist who named Archaeopteryx and Plateosaurus and classified many fossil reptiles.","sig_fr":"Paléontologue allemand qui nomma l'Archaeopteryx et le Plateosaurus et classa de nombreux reptiles fossiles.","work":"Zur Fauna der Vorwelt","year":1845},{"name":"Edward Newman","born":1801,"died":1876,"nat":"British","fields":["entomology"],"sig_en":"English naturalist, printer and editor whose popular illustrated histories of British butterflies and moths reached a mass audience.","sig_de":"Englischer Naturforscher, Drucker und Herausgeber, dessen populäre illustrierte Werke über britische Schmetterlinge ein breites Publikum erreichten.","sig_fr":"Naturaliste, imprimeur et éditeur anglais dont les histoires illustrées et populaires des papillons britanniques touchèrent un vaste public.","work":"An Illustrated Natural History of British Butterflies","year":1871},{"name":"Félix Dujardin","born":1801,"died":1860,"nat":"French","fields":["zoology"],"sig_de":"Französischer Biologe, der die lebende Substanz Sarkode (Protoplasma) beschrieb und die wahre Natur der Protozoen klärte.","sig_en":"French biologist who described the living substance 'sarcode' (protoplasm) and clarified the true nature of protozoa.","sig_fr":"Biologiste français qui décrivit la substance vivante sarcode (protoplasme) et éclaircit la véritable nature des protozoaires.","work":"Histoire naturelle des zoophytes: Infusoires","year":1841},{"name":"Johannes Peter Müller","born":1801,"died":1858,"nat":"German","fields":["zoology","ideas"],"sig_de":"Deutscher Physiologe und vergleichender Anatom, der eine Biologengeneration ausbildete und das Gesetz der spezifischen Sinnesenergien formulierte.","sig_en":"German physiologist and comparative anatomist who trained a generation of biologists and formulated the law of specific nerve energies.","sig_fr":"Physiologiste et anatomiste comparatiste allemand qui forma une génération de biologistes et formula la loi des énergies nerveuses spécifiques.","work":"Handbuch der Physiologie des Menschen","year":1833},{"name":"Alcide d'Orbigny","born":1802,"died":1857,"nat":"French","fields":["zoology","geology","exploration"],"sig_de":"Französischer Naturforscher, der Südamerika erforschte und die Mikropaläontologie der Foraminiferen sowie die stratigraphische Paläontologie Frankreichs begründete.","sig_en":"French naturalist who explored South America and founded the micropalaeontology of foraminifera and stratigraphic palaeontology in France.","sig_fr":"Naturaliste français qui explora l'Amérique du Sud et fonda la micropaléontologie des foraminifères et la paléontologie stratigraphique en France.","work":"Paléontologie française","year":1840},{"name":"Johann Moritz Rugendas","born":1802,"died":1858,"nat":"German","fields":["art","exploration"],"sig_de":"Der deutsche Maler durchreiste Brasilien, Mexiko und die Anden und schuf die bekanntesten Bilder Lateinamerikas seiner Zeit.","sig_en":"The German painter traveled Brazil, Mexico and the Andes, creating the most famous images of the Latin America of his day.","sig_fr":"Le peintre allemand parcourut le Bresil, le Mexique et les Andes, creant les images les plus celebres de l'Amerique latine de son temps.","work":"Malerische Reise in Brasilien","year":1835},{"name":"Robert Chambers","born":1802,"died":1871,"nat":"Scottish","fields":["ideas","geology"],"work":"Vestiges of the Natural History of Creation","year":1844,"sig_en":"Chambers anonymously proposed a sweeping law of transmutation, preparing the public for evolution a decade before Darwin.","sig_de":"Chambers stellte anonym ein umfassendes Gesetz der Umwandlung auf und bereitete die Öffentlichkeit ein Jahrzehnt vor Darwin auf die Evolution vor.","sig_fr":"Chambers proposa anonymement une vaste loi de transmutation, préparant le public à l'évolution une décennie avant Darwin."},{"name":"Charles Lucien Bonaparte","born":1803,"died":1857,"nat":"French","fields":["ornithology","zoology"],"sig_de":"Französisch-italienischer Ornithologe, Neffe Napoleons, der die Vogelsystematik reformierte und amerikanische und europäische Ornithologie verband.","sig_en":"French-Italian ornithologist, Napoleon's nephew, who reformed bird systematics and bridged American and European ornithology.","sig_fr":"Ornithologue franco-italien, neveu de Napoléon, qui réforma la systématique des oiseaux et relia les ornithologies américaine et européenne.","work":"Conspectus Generum Avium","year":1850},{"name":"Constantin Wilhelm Lambert Gloger","born":1803,"died":1863,"nat":"German","fields":["ornithology","zoology","ideas"],"work":"Das Abändern der Vögel durch Einfluss des Klimas","year":1833,"sig_en":"Gloger formulated the ecogeographic rule that animals are more darkly pigmented in warm, humid climates.","sig_de":"Gloger formulierte die ökogeographische Regel, dass Tiere in warmen, feuchten Klimaten dunkler pigmentiert sind.","sig_fr":"Gloger formula la règle écogéographique selon laquelle les animaux sont plus foncés dans les climats chauds et humides."},{"name":"Miles Joseph Berkeley","born":1803,"died":1889,"nat":"British","fields":["botany"],"work":"Outlines of British Fungology","year":1860,"sig_en":"English clergyman-botanist who founded plant pathology by proving a fungus caused the Irish potato blight.","sig_de":"Englischer Geistlicher und Botaniker, der die Pflanzenpathologie begründete, indem er nachwies, dass ein Pilz die irische Kartoffelfäule verursachte.","sig_fr":"Ecclésiastique et botaniste anglais qui fonda la pathologie végétale en prouvant qu'un champignon causait le mildiou de la pomme de terre en Irlande."},{"name":"Sarah Anne Drake","born":1803,"died":1857,"nat":"British","fields":["botany","art"],"work":"The Orchidaceae of Mexico and Guatemala","year":1837,"sig_en":"Prolific orchid illustrator whose exquisite plates for Bateman's Orchidaceae of Mexico and Guatemala defined the genre.","sig_de":"Produktive Orchideenillustratorin, deren exquisite Tafeln für Batemans Orchidaceae of Mexico and Guatemala das Genre prägten.","sig_fr":"Illustratrice prolifique d'orchidées dont les planches exquises pour l'Orchidaceae of Mexico and Guatemala de Bateman définirent le genre."},{"name":"Elizabeth Gould","born":1804,"died":1841,"nat":"English","fields":["art","ornithology"],"work":"The Birds of Australia","year":1840,"sig_en":"English artist who drew and lithographed hundreds of plates for her husband John Gould, including Darwin's finches, before dying at thirty-seven.","sig_de":"Englische Künstlerin, die für ihren Mann John Gould Hunderte von Tafeln zeichnete und lithographierte, darunter Darwins Finken, bevor sie mit siebenunddreißig starb.","sig_fr":"Artiste anglaise qui dessina et lithographia des centaines de planches pour son mari John Gould, dont les pinsons de Darwin, avant de mourir à trente-sept ans."},{"name":"Hermann Schlegel","born":1804,"died":1884,"nat":"German-Dutch","fields":["zoology","ornithology"],"sig_de":"Deutsch-niederländischer Zoologe, Leidener Direktor, der Herpetologie und Ornithologie förderte und einen Großteil der asiatischen Fauna beschrieb.","sig_en":"German-Dutch zoologist, director at Leiden, who advanced herpetology and ornithology and described much of Asia's fauna.","sig_fr":"Zoologiste germano-néerlandais, directeur à Leyde, qui fit progresser l'herpétologie et l'ornithologie et décrivit une grande partie de la faune d'Asie.","work":"Essai sur la physionomie des serpents","year":1837},{"name":"John Gould","born":1804,"died":1881,"nat":"British","fields":["ornithology","art","zoology"],"sig_de":"Englischer Ornithologe und Verleger, dessen prachtvolle Vogelfolios, darunter Kolibris und australische Arten, unübertroffen bleiben.","sig_en":"English ornithologist and publisher whose sumptuous folios of birds, including hummingbirds and Australian species, remain unrivalled.","sig_fr":"Ornithologue et éditeur anglais dont les somptueux in-folios d'oiseaux, dont les colibris et les espèces australiennes, restent inégalés.","work":"The Birds of Australia","year":1840},{"name":"Karl Theodor Ernst von Siebold","born":1804,"died":1885,"nat":"German","fields":["zoology"],"sig_de":"Deutscher Zoologe, der die Protozoen und Arthropoden abgrenzte und die Parthenogenese bei Insekten nachwies.","sig_en":"German zoologist who defined the Protozoa and Arthropoda and demonstrated parthenogenesis in insects.","sig_fr":"Zoologiste allemand qui définit les protozoaires et les arthropodes et démontra la parthénogenèse chez les insectes.","work":"Lehrbuch der vergleichenden Anatomie der wirbellosen Thiere","year":1848},{"name":"Matthias Jakob Schleiden","born":1804,"died":1881,"nat":"German","fields":["botany","ideas"],"work":"Grundzüge der wissenschaftlichen Botanik","year":1842,"sig_en":"German botanist who co-founded cell theory by arguing that all plant tissues are built from cells, revolutionising biology.","sig_de":"Deutscher Botaniker, der die Zelltheorie mitbegründete, indem er zeigte, dass alle Pflanzengewebe aus Zellen bestehen, und die Biologie revolutionierte.","sig_fr":"Botaniste allemand qui cofonda la théorie cellulaire en montrant que tous les tissus végétaux sont formés de cellules, révolutionnant la biologie."},{"name":"Richard Owen","born":1804,"died":1892,"nat":"British","fields":["zoology","geology","ideas"],"sig_de":"Englischer Anatom, der den Begriff Dinosauria prägte, Londons Naturhistorisches Museum gründete und die darwinsche Evolution bekämpfte.","sig_en":"English anatomist who coined 'Dinosauria', founded London's Natural History Museum, and opposed Darwinian evolution.","sig_fr":"Anatomiste anglais qui inventa le terme Dinosauria, fonda le muséum d'histoire naturelle de Londres et combattit l'évolution darwinienne.","work":"On the Archetype and Homologies of the Vertebrate Skeleton","year":1848},{"name":"Stephan Endlicher","born":1804,"died":1849,"nat":"Austrian","fields":["botany"],"work":"Genera Plantarum secundum ordines naturales disposita","year":1836,"sig_en":"Austrian botanist and sinologist whose Genera Plantarum offered an influential natural classification embracing the whole plant kingdom.","sig_de":"Österreichischer Botaniker und Sinologe, dessen Genera Plantarum eine einflussreiche natürliche Klassifikation des gesamten Pflanzenreichs bot.","sig_fr":"Botaniste et sinologue autrichien dont le Genera Plantarum proposa une classification naturelle influente embrassant tout le règne végétal."},{"name":"Anna Maria Hussey","born":1805,"died":1853,"nat":"British","fields":["botany","art"],"work":"Illustrations of British Mycology","year":1847,"sig_en":"Clergyman's wife and mycologist who drew and hand-coloured a pioneering illustrated study of British fungi.","sig_de":"Pfarrersfrau und Mykologin, die eine bahnbrechende illustrierte Studie britischer Pilze zeichnete und handkolorierte.","sig_fr":"Épouse de pasteur et mycologue qui dessina et colora à la main une étude illustrée pionnière des champignons britanniques."},{"name":"Elizabeth Twining","born":1805,"died":1889,"nat":"British","fields":["botany","art"],"work":"Illustrations of the Natural Orders of Plants","year":1849,"sig_en":"Philanthropist who illustrated a large-format survey of plant families, teaching botany through bold, systematic colour plates.","sig_de":"Philanthropin, die eine großformatige Übersicht der Pflanzenfamilien illustrierte und Botanik durch kräftige, systematische Farbtafeln vermittelte.","sig_fr":"Philanthrope qui illustra un vaste panorama des familles de plantes, enseignant la botanique par des planches colorées audacieuses et systématiques."},{"name":"Frederick Smith","born":1805,"died":1879,"nat":"British","fields":["entomology"],"sig_en":"British Museum entomologist whose catalogues of Hymenoptera described countless bees, wasps and ants worldwide.","sig_de":"Entomologe am British Museum, dessen Kataloge der Hymenopteren zahllose Bienen, Wespen und Ameisen weltweit beschrieben.","sig_fr":"Entomologiste du British Museum dont les catalogues d'hyménoptères décrivirent d'innombrables abeilles, guêpes et fourmis du monde entier.","work":"Catalogue of Hymenopterous Insects in the Collection of the British Museum","year":1853},{"name":"Hugo von Mohl","born":1805,"died":1872,"nat":"German","fields":["botany"],"work":"Grundzüge der Anatomie und Physiologie der vegetabilischen Zelle","year":1851,"sig_en":"German botanist who named 'protoplasm' and pioneered the microscopic study of plant cells, their walls and their division.","sig_de":"Deutscher Botaniker, der das 'Protoplasma' benannte und die mikroskopische Erforschung von Pflanzenzellen, Zellwänden und ihrer Teilung begründete.","sig_fr":"Botaniste allemand qui nomma le « protoplasme » et fut pionnier de l'étude microscopique des cellules végétales, de leurs parois et de leur division."},{"name":"Isidore Geoffroy Saint-Hilaire","born":1805,"died":1861,"nat":"French","fields":["zoology","ideas"],"sig_de":"Französischer Zoologe, der die wissenschaftliche Teratologie begründete, den Begriff Ethologie prägte und die Akklimatisation von Tieren förderte.","sig_en":"French zoologist who founded scientific teratology, coined 'ethology', and promoted the acclimatization of animals.","sig_fr":"Zoologiste français qui fonda la tératologie scientifique, forgea le mot éthologie et promut l'acclimatation des animaux.","work":"Histoire générale et particulière des anomalies de l'organisation","year":1832},{"name":"John Obadiah Westwood","born":1805,"died":1893,"nat":"British","fields":["entomology"],"sig_en":"English entomologist, Oxford's first Hope Professor, whose 'Modern Classification of Insects' synthesised insect systematics.","sig_de":"Englischer Entomologe, Oxfords erster Hope-Professor, dessen 'Modern Classification of Insects' die Insektensystematik zusammenfasste.","sig_fr":"Entomologiste anglais, premier professeur Hope d'Oxford, dont « Modern Classification of Insects » fit la synthèse de la systématique des insectes.","work":"An Introduction to the Modern Classification of Insects","year":1839},{"name":"Michael Sars","born":1805,"died":1869,"nat":"Norwegian","field the foundational work on the island.","sig_fr":"Le naturaliste germano-neerlandais explora les volcans et forets de Java et realisa l'ouvrage fondateur sur l'ile.","work":"Java, seine Gestalt, Pflanzendecke und innere Bauart","year":1852},{"name":"Friedrich August Quenstedt","born":1809,"died":1889,"nat":"German","fields":["geology","zoology"],"sig_de":"Deutscher Paläontologe, Meister der Ammoniten, dessen schwäbische Jura-Studien Biostratigraphie und Fossilbeschreibung voranbrachten.","sig_en":"German palaeontologist, master of ammonites, whose Swabian Jurassic studies advanced biostratigraphy and fossil description.","sig_fr":"Paléontologue allemand, maître des ammonites, dont les études du Jurassique souabe firent progresser la biostratigraphie et la description des fossiles.","work":"Petrefaktenkunde Deutschlands","year":1846},{"name":"Karl Bodmer","born":1809,"died":1893,"nat":"Swiss","fields":["art","exploration"],"sig_de":"Der Schweizer Maler begleitete Prinz Maximilian den Missouri hinauf und schuf unersetzliche Bilder der Praerie-Indianer und ihrer Welt.","sig_en":"The Swiss painter accompanied Prince Maximilian up the Missouri, creating irreplaceable images of the Plains Indians and their world.","sig_fr":"Le peintre suisse accompagna le prince Maximilian sur le Missouri et crea des images irremplacables des Indiens des Plaines et de leur monde.","work":"Travels in the Interior of North America (Atlas)","year":1839},{"name":"Oswald Heer","born":1809,"died":1883,"nat":"Swiss","fields":["entomology","geology","botany"],"sig_en":"Swiss naturalist who pioneered palaeoentomology, describing the fossil insects of the Oeningen Tertiary deposits.","sig_de":"Schweizer Naturforscher, der die Paläoentomologie begründete und die fossilen Insekten der Öninger Tertiärablagerungen beschrieb.","sig_fr":"Naturaliste suisse pionnier de la paléoentomologie, qui décrivit les insectes fossiles des dépôts tertiaires d'Oeningen.","work":"Die Insektenfauna der Tertiärgebilde von
