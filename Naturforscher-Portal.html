lish lepidopterist at the British Museum whose 'Genera of Diurnal Lepidoptera' provided a global classification of butterflies.","sig_de":"Englischer Lepidopterologe am British Museum, dessen 'Genera of Diurnal Lepidoptera' eine globale Klassifikation der Tagfalter lieferte.","sig_fr":"Lépidoptériste anglais du British Museum dont « Genera of Diurnal Lepidoptera » offrit une classification mondiale des papillons diurnes.","work":"The Genera of Diurnal Lepidoptera","year":1846},{"name":"Francis Orpen Morris","born":1810,"died":1893,"nat":"Irish","fields":["ornithology"],"work":"A History of British Birds","year":1851,"sig_en":"Irish-born clergyman whose colourfully illustrated, six-volume History of British Birds brought popular ornithology into countless Victorian homes.","sig_de":"In Irland geborener Geistlicher, dessen farbenprächtig illustrierte, sechsbändige History of British Birds die populäre Ornithologie in unzählige viktorianische Haushalte brachte.","sig_fr":"Ecclésiastique né en Irlande dont l'History of British Birds en six volumes, illustrée en couleurs, introduisit l'ornithologie populaire dans d'innombrables foyers victoriens."},{"name":"Philip Henry Gosse","born":1810,"died":1888,"nat":"British","fields":["zoology","art"],"sig_de":"Der englische Naturforscher popularisierte das Meeresaquarium und beschrieb die Kuestenfauna Jamaikas und Englands in kunstvollen Tafeln.","sig_en":"The English naturalist popularized the marine aquarium and depicted the shore fauna of Jamaica and England in artful plates.","sig_fr":"Le naturaliste anglais popularisa l'aquarium marin et depeignit la faune littorale de la Jamaique et de l'Angleterre en planches soignees.","work":"A Naturalist's Sojourn in Jamaica","year":1851},{"name":"Pierre Edmond Boissier","born":1810,"died":1885,"nat":"Swiss","fields":["botany","exploration"],"work":"Flora Orientalis","year":1867,"sig_en":"Swiss botanist and traveller whose monumental Flora Orientalis described the plants of the Mediterranean and Middle East for the first time.","sig_de":"Schweizer Botaniker und Reisender, dessen monumentale Flora Orientalis erstmals die Pflanzen des Mittelmeerraums und Nahen Ostens beschrieb.","sig_fr":"Botaniste et voyageur suisse dont la monumentale Flora Orientalis décrivit pour la première fois les plantes de la Méditerranée et du Proche-Orient."},{"name":"Theodor Schwann","born":1810,"died":1882,"nat":"German","fields":["zoology"],"work":"Mikroskopische Untersuchungen","year":1839,"sig_en":"Schwann extended cell theory to animals, establishing the cell as the universal building block of all living things.","sig_de":"Schwann dehnte die Zelltheorie auf Tiere aus und etablierte die Zelle als universellen Baustein aller Lebewesen.","sig_fr":"Schwann étendit la théorie cellulaire aux animaux, établissant la cellule comme brique universelle de tout être vivant."},{"name":"William Griffith","born":1810,"died":1845,"nat":"British","fields":["botany","exploration"],"work":"Icones Plantarum Asiaticarum","year":1847,"sig_en":"British botanist who explored the Himalaya, Bhutan and Afghanistan, collecting prodigiously before his early death; his drawings filled Icones Plantarum Asiaticarum.","sig_de":"Britischer Botaniker, der Himalaya, Bhutan und Afghanistan erforschte und vor seinem frühen Tod enorm sammelte; seine Zeichnungen füllten Icones Plantarum Asiaticarum.","sig_fr":"Botaniste britannique qui explora l'Himalaya, le Bhoutan et l'Afghanistan, récoltant énormément avant sa mort précoce ; ses dessins remplirent Icones Plantarum Asiaticarum."},{"name":"Isaac Sprague","born":1811,"died":1895,"nat":"American","fields":["botany","art"],"work":"Genera Florae Americae Boreali-Orientalis Illustrata","year":1848,"sig_en":"America's leading botanical illustrator, who accompanied Audubon and drew the definitive plates for Asa Gray's floras.","sig_de":"Amerikas führender botanischer Illustrator, der Audubon begleitete und die maßgeblichen Tafeln für Asa Grays Floren zeichnete.","sig_fr":"Principal illustrateur botaniste d'Amérique, il accompagna Audubon et dessina les planches de référence pour les flores d'Asa Gray."},{"name":"Thomas C. Jerdon","born":1811,"died":1872,"nat":"Scottish","fields":["ornithology","zoology"],"work":"The Birds of India","year":1862,"sig_en":"Scottish surgeon-naturalist in the East India Company whose Birds of India was the first comprehensive ornithology of the subcontinent.","sig_de":"Schottischer Arzt und Naturforscher der Ostindien-Kompanie, dessen Birds of India die erste umfassende Ornithologie des Subkontinents war.","sig_fr":"Chirurgien-naturaliste écossais de la Compagnie des Indes dont The Birds of India fut la première ornithologie complète du sous-continent."},{"name":"William Henry Harvey","born":1811,"died":1866,"nat":"Irish","fields":["botany","art"],"work":"Phycologia Britannica","year":1846,"sig_en":"Irish botanist and leading phycologist whose beautifully illustrated Phycologia Britannica described the seaweeds of the British Isles.","sig_de":"Irischer Botaniker und führender Algenkundler, dessen schön illustrierte Phycologia Britannica die Meeresalgen der Britischen Inseln beschrieb.","sig_fr":"Botaniste irlandais et grand phycologue dont la Phycologia Britannica, superbement illustrée, décrivit les algues des îles Britanniques."},{"name":"Edward Lear","born":1812,"died":1888,"nat":"English","fields":["art","ornithology"],"work":"Illustrations of the Family of Psittacidae, or Parrots","year":1832,"sig_en":"English artist, later famed for nonsense verse, whose Parrots, drawn from live birds at twenty, ranks among the finest ornithological folios.","sig_de":"Englischer Künstler, später berühmt für Unsinnsverse, dessen mit zwanzig nach lebenden Vögeln gezeichnete Papageien zu den feinsten ornithologischen Foliobänden zählen.","sig_fr":"Artiste anglais, plus tard célèbre pour ses poèmes absurdes, dont les Perroquets, dessinés d'après nature à vingt ans, comptent parmi les plus beaux in-folios ornithologiques."},{"name":"Robert Fortune","born":1812,"died":1880,"nat":"Scottish","fields":["botany","exploration"],"work":"Three Years' Wanderings in the Northern Provinces of China","year":1847,"sig_en":"Scottish plant hunter who smuggled tea plants from China to British India, transforming the empire's tea industry through botanical espionage.","sig_de":"Schottischer Pflanzenjäger, der Teepflanzen aus China nach Britisch-Indien schmuggelte und durch botanische Spionage die Teeindustrie des Empires umgestaltete.","sig_fr":"Chasseur de plantes écossais qui fit passer clandestinement le théier de Chine en Inde britannique, transformant l'industrie du thé par l'espionnage botanique."},{"name":"David Livingstone","born":1813,"died":1873,"nat":"British","fields":["exploration"],"sig_de":"Der schottische Missionar durchquerte Afrika, entdeckte die Victoriafaelle und oeffnete den Kontinent fuer die europaeische Wissenschaft.","sig_en":"The Scottish missionary crossed Africa, discovered Victoria Falls, and opened the continent to European science.","sig_fr":"Le missionnaire ecossais traversa l'Afrique, decouvrit les chutes Victoria et ouvrit le continent a la science europeenne.","work":"Missionary Travels and Researches in South Africa","year":1857},{"name":"James Dwight Dana","born":1813,"died":1895,"nat":"American","fields":["geology","zoology","exploration"],"sig_de":"Der amerikanische Geologe fuhr auf der Wilkes-Expedition um die Welt und schrieb ein massgebliches Handbuch der Geologie.","sig_en":"The American geologist sailed around the world on the Wilkes Expedition and wrote an authoritative manual of geology.","sig_fr":"Le geologue americain fit le tour du monde lors de l'expedition Wilkes et redigea un manuel de geologie faisant autorite.","work":"Manual of Geology","year":1862},{"name":"Japetus Steenstrup","born":1813,"died":1897,"nat":"Danish","fields":["zoology","ideas"],"sig_de":"Dänischer Zoologe, der den Generationswechsel bei Tieren beschrieb und Kopffüßer sowie prähistorische Muschelhaufen erforschte.","sig_en":"Danish zoologist who described the alternation of generations in animals and studied cephalopods and prehistoric middens.","sig_fr":"Zoologiste danois qui décrivit l'alternance des générations chez les animaux et étudia les céphalopodes et les amas coquilliers préhistoriques.","work":"Über den Generationswechsel","year":1842},{"name":"John Cassin","born":1813,"died":1869,"nat":"American","fields":["ornithology"],"work":"Illustrations of the Birds of California, Texas, Oregon, British and Russian America","year":1853,"sig_en":"Philadelphia ornithologist, the first American to study the world's birds systematically, who named nearly two hundred species.","sig_de":"Ornithologe aus Philadelphia, der erste Amerikaner, der die Vögel der Welt systematisch untersuchte und fast zweihundert Arten benannte.","sig_fr":"Ornithologue de Philadelphie, premier Américain à étudier systématiquement les oiseaux du monde, qui nomma près de deux cents espèces."},{"name":"August Grisebach","born":1814,"died":1879,"nat":"German","fields":["botany"],"work":"Die Vegetation der Erde nach ihrer klimatischen Anordnung","year":1872,"sig_en":"German botanist and plant geographer whose Vegetation der Erde described the plant formations of the whole globe by climate.","sig_de":"Deutscher Botaniker und Pflanzengeograph, dessen Vegetation der Erde die Pflanzenformationen des gesamten Globus nach dem Klima beschrieb.","sig_fr":"Botaniste et géographe botanique allemand dont la Vegetation der Erde décrivit les formations végétales du globe entier selon le climat."},{"name":"Carl Bergmann","born":1814,"died":1865,"nat":"German","fields":["zoology","ideas"],"work":"Über die Verhältnisse der Wärmeökonomie der Thiere zu ihrer Grösse","year":1847,"sig_en":"Bergmann formulated the rule that, within a group, animals tend to be larger in colder climates.","sig_de":"Bergmann formulierte die Regel, dass Tiere innerhalb einer Gruppe in kälteren Klimaten tendenziell größer sind.","sig_fr":"Bergmann formula la règle selon laquelle, au sein d'un groupe, les animaux tendent à être plus grands dans les climats froids."},{"name":"Gustav Hartlaub","born":1814,"died":1900,"nat":"German","fields":["ornithology"],"work":"Die Vögel Madagascars","year":1877,"sig_en":"German ornithologist of Bremen who specialised in the birds of Africa and Madagascar and co-founded a leading ornithological journal.","sig_de":"Deutscher Ornithologe aus Bremen, der sich auf die Vögel Afrikas und Madagaskars spezialisierte und eine führende ornithologische Zeitschrift mitbegründete.","sig_fr":"Ornithologue allemand de Brême, spécialiste des oiseaux d'Afrique et de Madagascar, cofondateur d'une importante revue ornithologique."},{"name":"Heinrich Gätke","born":1814,"died":1897,"nat":"German","fields":["ornithology","art"],"work":"Die Vogelwarte Helgoland","year":1891,"sig_en":"German artist-ornithologist on Heligoland whose decades of observation made the island famous and pioneered the study of bird migration.","sig_de":"Deutscher Künstler und Ornithologe auf Helgoland, dessen jahrzehntelange Beobachtungen die Insel berühmt machten und die Erforschung des Vogelzugs begründeten.","sig_fr":"Artiste-ornithologue allemand de Heligoland dont des décennies d'observation rendirent l'île célèbre et furent pionnières dans l'étude de la migration des oiseaux."},{"name":"Thomas Mayo Brewer","born":1814,"died":1880,"nat":"American","fields":["ornithology"],"work":"North American Oology","year":1857,"sig_en":"Boston physician and oologist, America's pioneer of the study of birds' eggs and nests, and co-author of A History of North American Birds.","sig_de":"Bostoner Arzt und Oologe, Amerikas Pionier der Erforschung von Vogeleiern und Nestern und Mitautor von A History of North American Birds.","sig_fr":"Médecin et oologiste de Boston, pionnier américain de l'étude des œufs et des nids d'oiseaux, coauteur de A History of North American Birds."},{"name":"Jean Cabanis","born":1816,"died":1906,"nat":"German","fields":["ornithology"],"work":"Museum Heineanum","year":1850,"sig_en":"German ornithologist who founded the Journal für Ornithologie, the world's oldest bird journal, and curated Berlin's vast collections.","sig_de":"Deutscher Ornithologe, der das Journal für Ornithologie, die älteste Vogelzeitschrift der Welt, gründete und Berlins riesige Sammlungen betreute.","sig_fr":"Ornithologue allemand qui fonda le Journal für Ornithologie, la plus ancienne revue d'oiseaux au monde, et conserva les vastes collections de Berlin."},{"name":"Paul Gervais","born":1816,"died":1879,"nat":"French","fields":["zoology","geology"],"sig_de":"Französischer Zoologe und Paläontologe, der die fossilen und lebenden Säugetiere Frankreichs zusammenfasste.","sig_en":"French zoologist and palaeontologist who synthesized the fossil and living mammals of France.","sig_fr":"Zoologiste et paléontologue français qui fit la synthèse des mammifères fossiles et vivants de France.","work":"Zoologie et paléontologie françaises","year":1848},{"name":"Albert von Kölliker","born":1817,"died":1905,"nat":"Swiss","fields":["zoology"],"sig_de":"Schweizer Anatom, Pionier der Zelltheorie und Histologie, der die Mikroskopie auf Embryologie und vergleichende Anatomie anwandte.","sig_en":"Swiss anatomist, pioneer of cell theory and histology, who applied microscopy to embryology and comparative anatomy.","sig_fr":"Anatomiste suisse, pionnier de la théorie cellulaire et de l'histologie, qui appliqua la microscopie à l'embryologie et à l'anatomie comparée.","work":"Handbuch der Gewebelehre des Menschen","year":1852},{"name":"Berthe Hoola van Nooten","born":1817,"died":1892,"nat":"Dutch","fields":["botany","art","exploration"],"work":"Fleurs, fruits et feuillages choisis de l'île de Java","year":1863,"sig_en":"Dutch artist who painted the flowers and fruits of Java, producing one of the finest colour-plate books of tropical plants.","sig_de":"Niederländische Künstlerin, die die Blumen und Früchte Javas malte und eines der schönsten Farbtafelwerke tropischer Pflanzen schuf.","sig_fr":"Artiste néerlandaise qui peignit les fleurs et fruits de Java, produisant l'un des plus beaux livres à planches colorées de plantes tropicales."},{"name":"Hermann August Hagen","born":1817,"died":1893,"nat":"German","fields":["entomology"],"sig_en":"German-American entomologist, authority on Neuroptera and Odonata, whose synopses organised North American nerve-winged insects.","sig_de":"Deutsch-amerikanischer Entomologe, Autorität für Neuroptera und Odonata, dessen Synopsen die nordamerikanischen Netzflügler ordneten.","sig_fr":"Entomologiste germano-américain, autorité sur les névroptères et odonates, dont les synopsis organisèrent les insectes à ailes nervurées d'Amérique du Nord.","work":"Synopsis of the Neuroptera of North America","year":1861},{"name":"Joseph Dalton Hooker","born":1817,"died":1911,"nat":"British","fields":["botany","exploration"],"work":"The Rhododendrons of Sikkim-Himalaya","year":1849,"sig_en":"British botanist, Darwin's friend and Kew director, who explored the Himalaya and Antarctica; his Rhododendrons of Sikkim transformed Victorian gardens.","sig_de":"Britischer Botaniker, Darwins Freund und Kew-Direktor, der Himalaya und Antarktis erforschte; seine Rhododendren von Sikkim verwandelten viktorianische Gärten.","sig_fr":"Botaniste britannique, ami de Darwin et directeur de Kew, il explora l'Himalaya et l'Antarctique ; ses Rhododendrons du Sikkim transformèrent les jardins victoriens."},{"name":"Richard Spruce","born":1817,"died":1893,"nat":"British","fields":["botany","exploration"],"work":"Notes of a Botanist on the Amazon and Andes","year":1908,"sig_en":"British botanist who spent fifteen years exploring the Amazon and Andes, collecting cinchona and thousands of plants amid great hardship.","sig_de":"Britischer Botaniker, der fünfzehn Jahre den Amazonas und die Anden erforschte und unter großen Entbehrungen Chinarinde und Tausende Pflanzen sammelte.","sig_fr":"Botaniste britannique qui passa quinze ans à explorer l'Amazone et les Andes, récoltant le quinquina et des milliers de plantes au prix de grandes épreuves."},{"name":"Walter Hood Fitch","born":1817,"died":1892,"nat":"Scottish","fields":["botany","art"],"work":"The Rhododendrons of Sikkim-Himalaya","year":1849,"sig_en":"The most gifted botanical lithographer of the Victorian age, who drew over 9,000 plates for Kew and Curtis's Botanical Magazine.","sig_de":"Der begabteste botanische Lithograf des viktorianischen Zeitalters, der über 9.000 Tafeln für Kew und Curtis's Botanical Magazine schuf.","sig_fr":"Le plus doué des lithographes botaniques de l'ère victorienne, auteur de plus de 9 000 planches pour Kew et le Curtis's Botanical Magazine."},{"name":"Pieter Bleeker","born":1819,"died":1878,"nat":"Dutch","fields":["zoology","exploration"],"sig_de":"Niederländischer Arzt und Ichthyologe, der die Fische des indonesischen Archipels in einem monumentalen illustrierten Atlas beschrieb.","sig_en":"Dutch physician-ichthyologist who described the fishes of the Indonesian archipelago in a monumental illustrated atlas.","sig_fr":"Médecin-ichtyologiste néerlandais qui décrivit les poissons de l'archipel indonésien dans un atlas illustré monumental.","work":"Atlas ichthyologique des Indes Orientales Néêrlandaises","year":1862},{"name":"Alfred Riocreux","born":1820,"died":1912,"nat":"French","fields":["botany","art"],"work":"Le Jardin fruitier du Muséum","year":1858,"sig_en":"Leading French botanical illustrator of the mid-nineteenth century, celebrated for the precise plates of the Muséum's fruit garden.","sig_de":"Führender französischer botanischer Illustrator der Mitte des 19. Jahrhunderts, gefeiert für die präzisen Tafeln des Obstgartens des Muséum.","sig_fr":"Grand illustrateur botaniste français du milieu du XIXe siècle, célèbre pour les planches précises du jardin fruitier du Muséum."},{"name":"Herbert Spencer","born":1820,"died":1903,"nat":"British","fields":["ideas"],"work":"The Principles of Biology","year":1864,"sig_en":"Spencer coined 'survival of the fittest' and built a vast evolutionary philosophy embracing life, mind and society.","sig_de":"Spencer prägte 'Überleben des Tüchtigsten' und errichtete eine umfassende Evolutionsphilosophie, die Leben, Geist und Gesellschaft umfasste.","sig_fr":"Spencer forgea l'expression « survie du plus apte » et bâtit une vaste philosophie évolutionniste embrassant la vie, l'esprit et la société."},{"name":"Joseph Wolf","born":1820,"died":1899,"nat":"German","fields":["art","ornithology","zoology"],"work":"Zoological Sketches","year":1861,"sig_en":"German-born artist, considered the greatest animal painter of his century, whose dynamic birds set the model for all later wildlife illustration.","sig_de":"In Deutschland geborener Künstler, der als größter Tiermaler seines Jahrhunderts gilt und dessen dynamische Vögel das Vorbild aller späteren Tierillustration wurden.","sig_fr":"Artiste d'origine allemande, considéré comme le plus grand peintre animalier de son siècle, dont les oiseaux dynamiques servirent de modèle à toute l'illustration animalière ultérieure."},{"name":"Henry Constantine Richter","born":1821,"died":1902,"nat":"English","fields":["art","ornithology"],"work":"The Birds of Great Britain","year":1862,"sig_en":"English artist who, largely unsung, drew and lithographed the majority of John Gould's later plates, including The Birds of Great Britain.","sig_de":"Englischer Künstler, der weitgehend unbeachtet die meisten der späteren Tafeln John Goulds zeichnete und lithographierte, darunter The Birds of Great Britain.","sig_fr":"Artiste anglais qui, largement méconnu, dessina et lithographia la plupart des planches tardives de John Gould, dont The Birds of Great Britain."},{"name":"John MacGillivray","born":1821,"died":1867,"nat":"British","fields":["zoology","exploration"],"sig_de":"Der schottische Naturforscher sammelte auf mehreren Marineexpeditionen im Pazifik und verfasste den Bericht der Rattlesnake-Reise.","sig_en":"The Scottish naturalist collected on several Pacific naval expeditions and wrote the narrative of the Rattlesnake voyage.","sig_fr":"Le naturaliste ecossais collecta lors de plusieurs expeditions navales dans le Pacifique et redigea le recit du voyage du Rattlesnake.","work":"Narrative of the Voyage of HMS Rattlesnake","year":1852},{"name":"Fritz Mueller","born":1822,"died":1897,"nat":"German","fields":["zoology","ideas"],"sig_de":"Der deutsch-brasilianische Naturforscher lieferte aus dem Regenwald mit Fuer Darwin fruehe experimentelle Belege fuer die Evolution.","sig_en":"The German-Brazilian naturalist supplied, from the rainforest, early experimental evidence for evolution in Fuer Darwin.","sig_fr":"Le naturaliste germano-bresilien apporta, depuis la foret tropicale, les premieres preuves experimentales de l'evolution dans Fuer Darwin.","work":"Fuer Darwin","year":1864},{"name":"Fritz Müller","born":1822,"died":1897,"nat":"German","fields":["zoology","entomology","ideas"],"sig_de":"Deutsch-brasilianischer Naturforscher, der Darwin mit Krebs-Belegen verteidigte und die Müller'sche Mimikry bei Schmetterlingen entdeckte.","sig_en":"German-Brazilian naturalist who defended Darwin with crustacean evidence and discovered Müllerian mimicry among butterflies.","sig_fr":"Naturaliste germano-brésilien qui défendit Darwin par des preuves tirées des crustacés et découvrit le mimétisme müllérien chez les papillons.","work":"Für Darwin","year":1864},{"name":"Gregor Mendel","born":1822,"died":1884,"nat":"Austrian","fields":["botany","ideas"],"work":"Versuche über Pflanzen-Hybriden","year":1866,"sig_en":"Moravian friar whose pea-plant hybridisation experiments uncovered the laws of inheritance, founding genetics decades before science recognised him.","sig_de":"Mährischer Mönch, dessen Kreuzungsversuche mit Erbsen die Vererbungsgesetze aufdeckten und die Genetik begründeten – Jahrzehnte vor seiner Anerkennung.","sig_fr":"Moine morave dont les croisements de pois révélèrent les lois de l'hérédité, fondant la génétique des décennies avant que la science le reconnaisse."},{"name":"Henry Tibbats Stainton","born":1822,"died":1892,"nat":"British","fields":["entomology"],"sig_en":"English entomologist who championed micro-moths, whose 'Natural History of the Tineina' detailed their life-histories trilingually.","sig_de":"Englischer Entomologe, der die Kleinschmetterlinge erforschte und dessen 'Natural History of the Tineina' ihre Lebensgeschichten dreisprachig darstellte.","sig_fr":"Entomologiste anglais champion des micro-lépidoptères, dont « Natural History of the Tineina » détailla leurs cycles de vie en trois langues.","work":"The Natural History of the Tineina","year":1855},{"name":"Rudolf Leuckart","born":1822,"died":1898,"nat":"German","fields":["zoology"],"sig_de":"Deutscher Zoologe, der die wissenschaftliche Parasitologie begründete, indem er die komplexen Lebenszyklen von Bandwürmern und Egeln entschlüsselte.","sig_en":"German zoologist who founded scientific parasitology by unravelling the complex life cycles of tapeworms and flukes.","sig_fr":"Zoologiste allemand qui fonda la parasitologie scientifique en élucidant les cycles de vie complexes des ténias et des douves.","work":"Die menschlichen Parasiten","year":1863},{"name":"Thomas Vernon Wollaston","born":1822,"died":1878,"nat":"British","fields":["entomology","exploration"],"sig_en":"English coleopterist whose studies of Atlantic-island beetles, like 'Insecta Maderensia', illuminated island evolution and endemism.","sig_de":"Englischer Koleopterologe, dessen Studien der Käfer atlantischer Inseln, etwa 'Insecta Maderensia', Inselevolution und Endemismus beleuchteten.","sig_fr":"Coléoptériste anglais dont les études sur les coléoptères des îles atlantiques, comme « Insecta Maderensia », éclairèrent l'évolution insulaire et l'endémisme.","work":"Insecta Maderensia","year":1854},{"name":"William Henry Edwards","born":1822,"died":1909,"nat":"American","fields":["entomology"],"sig_en":"American author whose sumptuous 'Butterflies of North America' documented species, their life-histories and variation in fine colour plates.","sig_de":"Amerikanischer Autor, dessen prachtvolle 'Butterflies of North America' Arten, Lebensgeschichten und Variation in feinen Farbtafeln dokumentierte.","sig_fr":"Auteur américain dont les somptueux « Butterflies of North America » documentèrent les espèces, leurs cycles de vie et leur variation en belles planches.","work":"The Butterflies of North America","year":1868},{"name":"Alfred Russel Wallace","born":1823,"died":1913,"nat":"British","fields":["zoology","ideas","exploration","entomology"],"sig_de":"Englischer Naturforscher, der die natürliche Selektion unabhängig entdeckte und die Biogeographie begründete, indem er die Wallace-Linie definierte.","sig_en":"English naturalist who independently conceived natural selection and founded biogeography, defining the Wallace Line.","sig_fr":"Naturaliste anglais qui conçut indépendamment la sélection naturelle et fonda la biogéographie, définissant la ligne Wallace.","work":"The Malay Archipelago","year":1869},{"name":"Jean-Henri Fabre","born":1823,"died":1915,"nat":"French","fields":["entomology"],"sig_de":"Französischer Entomologe, dessen geduldige Feldstudien zum Instinkt und Verhalten der Insekten einen Klassiker der naturkundlichen Literatur schufen.","sig_en":"French entomologist whose patient field studies of insect instinct and behaviour created a classic of natural-history literature.","sig_fr":"Entomologiste français dont les patientes études de terrain sur l'instinct et le comportement des insectes créèrent un classique de la littérature naturaliste.","work":"Souvenirs entomologiques","year":1879},{"name":"Joseph Leidy","born":1823,"died":1891,"nat":"American","fields":["zoology","geology"],"sig_de":"Amerikanischer Naturforscher, Vater der Wirbeltierpaläontologie in den USA, der das erste amerikanische Dinosaurierskelett beschrieb.","sig_en":"American naturalist, father of vertebrate palaeontology in the United States, who described the first American dinosaur skeleton.","sig_fr":"Naturaliste américain, père de la paléontologie des vertébrés aux États-Unis, qui décrivit le premier squelette de dinosaure américain.","work":"The Extinct Mammalian Fauna of Dakota and Nebraska","year":1869},{"name":"Spencer Fullerton Baird","born":1823,"died":1887,"nat":"American","fields":["zoology","ornithology"],"sig_de":"Amerikanischer Zoologe, der die Sammlungen des Smithsonian aufbaute und die nordamerikanische Wirbeltierzoologie im kontinentalen Maßstab organisierte.","sig_en":"American zoologist who built the Smithsonian's collections and organized North American vertebrate zoology on a continental scale.","sig_fr":"Zoologiste américain qui constitua les collections du Smithsonian et organisa la zoologie des vertébrés nord-américains à l'échelle continentale.","work":"A History of North American Birds","year":1874},{"name":"Carl Gustaf Thomson","born":1824,"died":1899,"nat":"Swedish","fields":["entomology"],"sig_en":"Swedish entomologist whose 'Skandinaviens Coleoptera' systematically documented the beetles of Scandinavia.","sig_de":"Schwedischer Entomologe, dessen 'Skandinaviens Coleoptera' die Käfer Skandinaviens systematisch dokumentierte.","sig_fr":"Entomologiste suédois dont « Skandinaviens Coleoptera » documenta systématiquement les coléoptères de Scandinavie.","work":"Skandinaviens Coleoptera","year":1859},{"name":"Wilhelm Hofmeister","born":1824,"died":1877,"nat":"German","fields":["botany"],"work":"Vergleichende Untersuchungen der Keimung, Entfaltung und Fruchtbildung höherer Kryptogamen","year":1851,"sig_en":"German botanist who revealed the alternation of generations linking mosses, ferns and seed plants, one of botany's greatest unifying discoveries.","sig_de":"Deutscher Botaniker, der den Generationswechsel zwischen Moosen, Farnen und Samenpflanzen aufdeckte – eine der größten vereinheitlichenden Entdeckungen der Botanik.","sig_fr":"Botaniste allemand qui révéla l'alternance des générations reliant mousses, fougères et plantes à graines, l'une des grandes découvertes unificatrices de la botanique."},{"name":"Berthold Carl Seemann","born":1825,"died":1871,"nat":"German","fields":["botany","exploration"],"work":"Flora Vitiensis","year":1865,"sig_en":"German botanist who sailed on HMS Herald and described the flora of Fiji in his richly illustrated Flora Vitiensis.","sig_de":"Deutscher Botaniker, der auf HMS Herald fuhr und die Flora Fidschis in seiner reich illustrierten Flora Vitiensis beschrieb.","sig_fr":"Botaniste allemand qui navigua sur le HMS Herald et décrivit la flore des Fidji dans sa Flora Vitiensis richement illustrée."},{"name":"Ferdinand von Mueller","born":1825,"died":1896,"nat":"German-Australian","fields":["botany","exploration"],"work":"Fragmenta Phytographiae Australiae","year":1858,"sig_en":"German-Australian botanist who documented Australia's flora, named thousands of species, and greened the colony through his Fragmenta Phytographiae Australiae.","sig_de":"Deutsch-australischer Botaniker, der Australiens Flora erfasste, Tausende Arten benannte und die Kolonie durch seine Fragmenta Phytographiae Australiae begrünte.","sig_fr":"Botaniste germano-australien qui documenta la flore australienne, nomma des milliers d'espèces et verdit la colonie grâce à ses Fragmenta Phytographiae Australiae."},{"name":"Henry Walter Bates","born":1825,"died":1892,"nat":"British","fields":["entomology","zoology","exploration","ideas"],"sig_de":"Englischer Naturforscher, der elf Jahre Amazonien erforschte und die Bates'sche Mimikry entdeckte, ein starker Beleg für die natürliche Selektion.","sig_en":"English naturalist who explored Amazonia for eleven years and discovered Batesian mimicry, strong evidence for natural selection.","sig_fr":"Naturaliste anglais qui explora l'Amazonie durant onze ans et découvrit le mimétisme batésien, forte preuve de la sélection naturelle.","work":"The Naturalist on the River Amazons","year":1863},{"name":"Karl Möbius","born":1825,"died":1908,"nat":"German","fields":["zoology","ideas"],"work":"Die Auster und die Austernwirthschaft","year":1877,"sig_en":"Möbius coined 'biocoenosis', showing that the creatures of an oyster bank form one interdependent living community.","sig_de":"Möbius prägte den Begriff 'Biozönose' und zeigte, dass die Lebewesen einer Austernbank eine voneinander abhängige Lebensgemeinschaft bilden.","sig_fr":"Möbius forgea le terme « biocénose », montrant que les êtres d'un banc d'huîtres forment une communauté vivante interdépendante."},{"name":"Thomas Henry Huxley","born":1825,"died":1895,"nat":"British","fields":["zoology","ideas","exploration"],"sig_de":"Englischer vergleichender Anatom, Darwins Bulldogge, der die Evolution verteidigte und die Abstammung der Vögel von Dinosauriern vertrat.","sig_en":"English comparative anatomist, 'Darwin's bulldog', who championed evolution and argued birds descended from dinosaurs.","sig_fr":"Anatomiste comparatiste anglais, le bouledogue de Darwin, qui défendit l'évolution et soutint que les oiseaux descendent des dinosaures.","work":"Evidence as to Man's Place in Nature","year":1863},{"name":"Armand David","born":1826,"died":1900,"nat":"French","fields":["ornithology","zoology","exploration","botany"],"work":"Les Oiseaux de la Chine","year":1877,"sig_en":"French Lazarist missionary in China who revealed its wildlife to science, from the giant panda to hundreds of birds in Les Oiseaux de la Chine.","sig_de":"Französischer Lazaristenmissionar in China, der dessen Tierwelt der Wissenschaft erschloss, vom Großen Panda bis zu Hunderten Vögeln in Les Oiseaux de la Chine.","sig_fr":"Missionnaire lazariste français en Chine qui révéla sa faune à la science, du panda géant aux centaines d'oiseaux des Oiseaux de la Chine."},{"name":"Carl Gegenbaur","born":1826,"died":1903,"nat":"German","fields":["zoology","ideas"],"sig_de":"Deutscher Anatom, der die vergleichende Anatomie evolutionär neu ausrichtete und mittels Homologie die Abstammung der Wirbeltiere rekonstruierte.","sig_en":"German anatomist who reshaped comparative anatomy around evolution, using homology to reconstruct vertebrate ancestry.","sig_fr":"Anatomiste allemand qui refonda l'anatomie comparée autour de l'évolution, utilisant l'homologie pour reconstituer l'ascendance des vertébrés.","work":"Grundzüge der vergleichenden Anatomie","year":1859},{"name":"Henri Mouhot","born":1826,"died":1861,"nat":"French","fields":["exploration","zoology","entomology"],"sig_de":"Der franzoesische Naturforscher erforschte Indochina, machte Europa die Tempel von Angkor bekannt und starb im laotischen Fieber.","sig_en":"The French naturalist explored Indochina, brought the temples of Angkor to European attention, and died of fever in Laos.","sig_fr":"Le naturaliste francais explora l'Indochine, revela a l'Europe les temples d'Angkor et mourut de la fievre au Laos.","work":"Travels in the Central Parts of Indo-China","year":1864},{"name":"Sereno Watson","born":1826,"died":1892,"nat":"American","fields":["botany","exploration"],"work":"Botany (United States Geological Exploration of the Fortieth Parallel)","year":1871,"sig_en":"American botanist of western expeditions who described the flora of the Great Basin and curated Harvard's herbarium.","sig_de":"Amerikanischer Botaniker der Westexpeditionen, der die Flora des Großen Beckens beschrieb und Harvards Herbarium betreute.","sig_fr":"Botaniste américain des expéditions de l'Ouest qui décrivit la flore du Grand Bassin et dirigea l'herbier de Harvard."},{"name":"Albert Gaudry","born":1827,"died":1908,"nat":"French","fields":["geology","zoology","ideas"],"sig_de":"Französischer Paläontologe, der die fossile Fauna von Pikermi in Griechenland nutzte, um evolutionäre Übergänge nachzuweisen.","sig_en":"French palaeontologist who used the Pikermi fossil fauna of Greece to demonstrate evolutionary transitions.","sig_fr":"Paléontologue français qui utilisa la faune fossile de Pikermi, en Grèce, pour démontrer des transitions évolutives.","work":"Animaux fossiles et géologie de l'Attique","year":1862},{"name":"Carl Johann Maximovich","born":1827,"died":1891,"nat":"Russian","fields":["botany","exploration"],"work":"Primitiae Florae Amurensis","year":1859,"sig_en":"Russian botanist who described much of the flora of East Asia, beginning with the plants of the Amur region.","sig_de":"Russischer Botaniker, der weite Teile der Flora Ostasiens beschrieb, beginnend mit den Pflanzen der Amur-Region.","sig_fr":"Botaniste russe qui décrivit une grande partie de la flore d'Asie orientale, à commencer par les plantes de la région de l'Amour."},{"name":"St. George Jackson Mivart","born":1827,"died":1900,"nat":"British","fields":["zoology","ideas"],"sig_de":"Englischer vergleichender Anatom, der die Evolution akzeptierte, aber argumentierte, natürliche Selektion allein könne beginnende Strukturen nicht erklären.","sig_en":"English comparative anatomist who accepted evolution but argued natural selection alone could not explain incipient structures.","sig_fr":"Anatomiste comparatiste anglais qui acceptait l'évolution mais soutenait que la sélection naturelle seule ne pouvait expliquer les structures naissantes.","work":"On the Genesis of Species","year":1871},{"name":"Carl Robert Osten-Sacken","born":1828,"died":1906,"nat":"Russian","fields":["entomology"],"sig_en":"Russian-American diplomat and dipterist whose catalogues laid the foundation for the study of North American flies.","sig_de":"Russisch-amerikanischer Diplomat und Dipterologe, dessen Kataloge die Grundlage für die Erforschung nordamerikanischer Fliegen legten.","sig_fr":"Diplomate russo-américain et diptérologiste dont les catalogues posèrent les bases de l'étude des mouches d'Amérique du Nord.","work":"Catalogue of the Described Diptera of North America","year":1858},{"name":"Eleanor Ormerod","born":1828,"died":1901,"nat":"British","fields":["entomology"],"sig_en":"British economic entomologist whose manuals of injurious insects guided farmers and established agricultural entomology in Britain.","sig_de":"Britische ökonomische Entomologin, deren Handbücher über Schadinsekten Landwirte anleiteten und die landwirtschaftliche Entomologie in Britannien begründeten.","sig_fr":"Entomologiste économique britannique dont les manuels sur les insectes nuisibles guidèrent les fermiers et établirent l'entomologie agricole en Grande-Bretagne.","work":"A Manual of Injurious Insects","year":1881},{"name":"Alfred Brehm","born":1829,"died":1884,"nat":"German","fields":["zoology","ornithology"],"work":"Brehms Tierleben","year":1863,"sig_en":"German zoologist whose vivid, hugely popular Brehms Tierleben brought the drama of animal life, especially birds, to the general public.","sig_de":"Deutscher Zoologe, dessen anschauliches, überaus beliebtes Brehms Tierleben die Dramatik des Tierlebens, besonders der Vögel, einem breiten Publikum nahebrachte.","sig_fr":"Zoologiste allemand dont le célèbre et vivant Brehms Tierleben fit découvrir au grand public le drame de la vie animale, notamment des oiseaux."},{"name":"Alfred Newton","born":1829,"died":1907,"nat":"British","fields":["ornithology","ideas"],"sig_de":"Englischer Zoologe, erster Zoologieprofessor in Cambridge, der die Ornithologie und frühe Vogelschutzbemühungen förderte.","sig_en":"English zoologist, first professor of zoology at Cambridge, who advanced ornithology and early bird-protection efforts.","sig_fr":"Zoologiste anglais, premier professeur de zoologie à Cambridge, qui fit progresser l'ornithologie et les premiers efforts de protection des oiseaux.","work":"A Dictionary of Birds","year":1893},{"name":"Allan Octavian Hume","born":1829,"died":1912,"nat":"British","fields":["ornithology"],"work":"The Nests and Eggs of Indian Birds","year":1873,"sig_en":"British administrator in India, 'father of Indian ornithology', who amassed a huge collection and founded the journal Stray Feathers.","sig_de":"Britischer Verwaltungsbeamter in Indien, 'Vater der indischen Ornithologie', der eine riesige Sammlung anlegte und die Zeitschrift Stray Feathers gründete.","sig_fr":"Administrateur britannique en Inde, « père de l'ornithologie indienne », qui rassembla une immense collection et fonda la revue Stray Feathers."},{"name":"Hermann Müller","born":1829,"died":1883,"nat":"German","fields":["botany","entomology"],"work":"Die Befruchtung der Blumen durch Insekten","year":1873,"sig_en":"German botanist who confirmed and extended Sprengel's and Darwin's work, documenting how insects and flowers adapt to each other.","sig_de":"Deutscher Botaniker, der Sprengels und Darwins Werk bestätigte und erweiterte und zeigte, wie Insekten und Blüten sich aneinander anpassen.","sig_fr":"Botaniste allemand qui confirma et prolongea les travaux de Sprengel et Darwin, documentant l'adaptation mutuelle des insectes et des fleurs."},{"name":"Philip Lutley Sclater","born":1829,"died":1913,"nat":"British","fields":["ornithology","zoology","ideas"],"sig_de":"Englischer Zoologe, der die sechs zoogeographischen Regionen definierte, die noch heute die Tierwelt der Erde kartieren.","sig_en":"English zoologist who defined the six zoogeographical regions still used to map the world's animal life.","sig_fr":"Zoologiste anglais qui définit les six régions zoogéographiques encore utilisées pour cartographier la vie animale du monde.","work":"On the General Geographical Distribution of the Members of the Class Aves","year":1858},{"name":"Albert Günther","born":1830,"died":1914,"nat":"German-British","fields":["zoology"],"sig_de":"Deutsch-britischer Zoologe, der die Fische und Reptilien des British Museum katalogisierte und Ichthyologie und Herpetologie jahrzehntelang beherrschte.","sig_en":"German-British zoologist who catalogued the British Museum's fishes and reptiles, dominating ichthyology and herpetology for decades.","sig_fr":"Zoologiste germano-britannique qui catalogua les poissons et reptiles du British Museum, dominant l'ichtyologie et l'herpétologie durant des décennies.","work":"Catalogue of the Fishes in the British Museum","year":1859},{"name":"Charles Wyville Thomson","born":1830,"died":1882,"nat":"British","fields":["zoology","exploration"],"sig_de":"Der schottische Meeresforscher leitete die Challenger-Expedition und begruendete mit ihr die moderne Tiefseeforschung.","sig_en":"The Scottish oceanographer led the Challenger expedition and with it founded modern deep-sea science.","sig_fr":"L'oceanographe ecossais dirigea l'expedition Challenger et fonda avec elle l'oceanographie des grands fonds.","work":"The Depths of the Sea","year":1873},{"name":"Gustav Mayr","born":1830,"died":1908,"nat":"Austrian","fields":["entomology"],"sig_en":"Austrian entomologist whose work on ants (Formicidae) established their systematic classification across Europe and beyond.","sig_de":"Österreichischer Entomologe, dessen Arbeiten über Ameisen (Formicidae) deren systematische Klassifikation in Europa und darüber hinaus begründeten.","sig_fr":"Entomologiste autrichien dont les travaux sur les fourmis (Formicidae) établirent leur classification systématique en Europe et au-delà.","work":"Die europäischen Formiciden","year":1861},{"name":"Harriet Scott","born":1830,"died":1907,"nat":"Australian","fields":["entomology","art"],"work":"Australian Lepidoptera and their Transformations","year":1864,"sig_en":"With her sister Helena, produced Australia's first major illustrated work on native butterflies and moths from careful life studies.","sig_de":"Schuf mit ihrer Schwester Helena Australiens erstes bedeutendes illustriertes Werk über einheimische Schmetterlinge und Motten aus sorgfältigen Lebensstudien.","sig_fr":"Avec sa sœur Helena, elle produisit le premier grand ouvrage illustré d'Australie sur les papillons indigènes, d'après de minutieuses études d'après nature."},{"name":"Marianne North","born":1830,"died":1890,"nat":"British","fields":["botany","art","exploration"],"work":"Recollections of a Happy Life","year":1892,"sig_en":"British painter who travelled the world alone depicting plants in their habitats; her vivid gallery still stands at Kew.","sig_de":"Britische Malerin, die allein die Welt bereiste und Pflanzen in ihren Lebensräumen malte; ihre lebendige Galerie steht bis heute in Kew.","sig_fr":"Peintre britannique qui parcourut seule le monde pour représenter les plantes dans leurs milieux ; sa galerie éclatante subsiste à Kew."},{"name":"Otto Staudinger","born":1830,"died":1900,"nat":"German","fields":["entomology"],"sig_en":"German lepidopterist and dealer whose great catalogue of Palaearctic butterflies and moths standardised European lepidopterology.","sig_de":"Deutscher Lepidopterologe und Händler, dessen großer Katalog der paläarktischen Schmetterlinge die europäische Lepidopterologie standardisierte.","sig_fr":"Lépidoptériste et marchand allemand dont le grand catalogue des lépidoptères paléarctiques standardisa la lépidoptérologie européenne.","work":"Catalog der Lepidopteren des europäischen Faunengebiets","year":1861},{"name":"Albert Oppel","born":1831,"died":1865,"nat":"German","fields":["geology"],"sig_de":"Deutscher Geologe, der die Biostratigraphie durch die Definition feinskaliger Ammoniten-Zonen im Jura verfeinerte.","sig_en":"German geologist who refined biostratigraphy by defining fine-scale ammonite 'zones' across the Jurassic.","sig_fr":"Géologue allemand qui affina la biostratigraphie en définissant des zones fines d'ammonites à travers le Jurassique.","work":"Die Juraformation","year":1856},{"name":"Anton de Bary","born":1831,"died":1888,"nat":"German","fields":["botany"],"work":"Morphologie und Physiologie der Pilze, Flechten und Myxomyceten","year":1866,"sig_en":"German botanist who founded modern mycology and plant pathology, proving fungi cause disease and coining the term symbiosis.","sig_de":"Deutscher Botaniker, der die moderne Mykologie und Pflanzenpathologie begründete, nachwies, dass Pilze Krankheiten verursachen, und den Begriff Symbiose prägte.","sig_fr":"Botaniste allemand qui fonda la mycologie et la pathologie végétale modernes, prouva que les champignons causent des maladies et forgea le mot symbiose."},{"name":"Othniel Charles Marsh","born":1831,"died":1899,"nat":"American","fields":["geology","zoology"],"sig_de":"Amerikanischer Paläontologe der Bone Wars, der viele Dinosaurier benannte und die fossile Evolution der Pferde dokumentierte.","sig_en":"American palaeontologist of the 'Bone Wars' who named many dinosaurs and documented the fossil evolution of horses.","sig_fr":"Paléontologue américain des guerres des os qui nomma de nombreux dinosaures et documenta l'évolution fossile des chevaux.","work":"Odontornithes: A Monograph on the Extinct Toothed Birds of North America","year":1880},{"name":"William Henry Flower","born":1831,"died":1899,"nat":"British","fields":["zoology"],"sig_de":"Englischer vergleichender Anatom und Museumsreformer, Experte für die Osteologie der Säugetiere, besonders Wale und Primaten.","sig_en":"English comparative anatomist and museum reformer, expert on mammalian osteology, especially whales and primates.","sig_fr":"Anatomiste comparatiste et réformateur muséal anglais, spécialiste de l'ostéologie des mammifères, notamment des baleines et des primates.","work":"An Introduction to the Osteology of the Mammalia","year":1870},{"name":"Henry Seebohm","born":1832,"died":1895,"nat":"English","fields":["ornithology","exploration"],"work":"A History of British Birds","year":1883,"sig_en":"English steel manufacturer and ornithologist who explored Siberian breeding grounds and championed a scientific classification of birds.","sig_de":"Englischer Stahlfabrikant und Ornithologe, der sibirische Brutgebiete erforschte und sich für eine wissenschaftliche Vogelklassifikation einsetzte.","sig_fr":"Fabricant d'acier et ornithologue anglais qui explo ,"nat":"German","fields":["botany","art"],"work":"Flora von Deutschland, Österreich und der Schweiz","year":1885,"sig_en":"German botanist and teacher whose colour-plate Flora von Deutschland became the best-loved illustrated field guide to Central European plants.","sig_de":"Deutscher Botaniker und Lehrer, dessen farbtafelreiche Flora von Deutschland zum beliebtesten illustrierten Bestimmungsbuch mitteleuropäischer Pflanzen wurde.","sig_fr":"Botaniste et enseignant allemand dont la Flora von Deutschland, riche en planches en couleurs, devint le guide illustré préféré des plantes d'Europe centrale."},{"name":"Roland Trimen","born":1840,"died":1916,"nat":"British","fields":["entomology","exploration"],"sig_en":"British-South African naturalist whose 'South-African Butterflies' founded the systematic study of the region's Lepidoptera.","sig_de":"Britisch-südafrikanischer Naturforscher, dessen 'South-African Butterflies' die systematische Erforschung der Schmetterlinge der Region begründete.","sig_fr":"Naturaliste britannique et sud-africain dont « South-African Butterflies » fonda l'étude systématique des lépidoptères de la région.","work":"South-African Butterflies","year":1887},{"name":"Augustus Radcliffe Grote","born":1841,"died":1903,"nat":"American","fields":["entomology"],"sig_en":"British-American entomologist, the leading authority on North American moths, who described and catalogued thousands of Noctuidae.","sig_de":"Britisch-amerikanischer Entomologe, führende Autorität für nordamerikanische Nachtfalter, der Tausende Noctuidae beschrieb und katalogisierte.","sig_fr":"Entomologiste anglo-américain, principale autorité sur les hétérocères nord-américains, qui décrivit et catalogua des milliers de Noctuidae.","work":"A New Check List of North American Moths","year":1882},{"name":"Eugenius Warming","born":1841,"died":1924,"nat":"Danish","fields":["botany","ideas"],"work":"Plantesamfund","year":1895,"sig_en":"Danish botanist who founded plant ecology, showing in
