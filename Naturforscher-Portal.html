<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Age of Natural History — Portal</title>
<style>
:root{--bg:#f6f1e7;--panel:#fffdf8;--ink:#2b2a26;--muted:#6f6a5f;--line:#e2d9c6;--accent:#3f6b46;--accent2:#7a5230;--chip:#ece3d2;--shadow:0 2px 10px rgba(60,50,30,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a17;--panel:#24231f;--ink:#ece7db;--muted:#a49d8c;--line:#3a382f;--accent:#8fc59a;--accent2:#d3a877;--chip:#31302a;--shadow:0 2px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
header.top{max-width:1080px;margin:0 auto;padding:26px 20px 8px;position:relative}
h1{font-size:clamp(24px,3.6vw,38px);margin:0 0 6px}
.sub{color:var(--accent2);font-style:italic;font-size:clamp(15px,2.2vw,19px);margin:0 0 12px}
.intro{max-width:820px;color:var(--muted);font-size:15.5px}
.langbar{position:absolute;top:24px;right:20px;display:flex;gap:6px}
.langbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px}
.langbar button.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
main{max-width:1080px;margin:0 auto;padding:10px 20px 60px}
h2.sec{font-size:22px;margin:30px 0 6px;border-bottom:2px solid var(--line);padding-bottom:5px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.theme h3{margin:0 0 6px;font-size:17px;color:var(--accent)}
.theme p{margin:0;font-size:14.5px;color:var(--ink)}
.tabs2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin:26px 0 8px}
.stab{background:none;border:none;font-family:inherit;font-size:clamp(18px,2.6vw,22px);color:var(--muted);cursor:pointer;padding:6px 2px 9px;position:relative;font-weight:700;letter-spacing:.01em}
.stab:hover{color:var(--ink)}
.stab.active{color:var(--ink)}
.stab.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--accent);border-radius:2px}
[hidden]{display:none!important}
.glosshelp{max-width:1080px;margin:14px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.glosshelp summary{cursor:pointer;padding:12px 16px;font-size:16px;color:var(--accent)}
.glosshelp .gbody{padding:0 16px 14px;columns:2;column-gap:26px;font-size:14px}
@media(max-width:640px){.glosshelp .gbody{columns:1}}
.glosshelp .gterm{break-inside:avoid;margin-bottom:8px}
.glosshelp .gterm b{color:var(--accent2)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.controls input{flex:1;min-width:200px;font-family:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.fchip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.fchip .dot{width:9px;height:9px;border-radius:50%}
.fchip.active{background:var(--ink);color:var(--bg)}
.count{color:var(--muted);font-size:14px;margin-left:auto}
.band{font-size:15px;font-weight:700;color:var(--accent2);letter-spacing:.05em;margin:22px 0 8px;padding-top:6px;border-top:1px dashed var(--line)}
.fig{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.fig .yr{font-size:13px;color:var(--muted);text-align:right;padding-top:3px;white-space:nowrap}
.fig .yr .b{font-weight:700;color:var(--ink);font-size:15px}
.fig .body h3{margin:0;font-size:18px}
.fig .body h3 a.wname{color:inherit;text-decoration:none}
.fig .body h3 a.wname:hover{color:var(--accent);text-decoration:underline}
.wext{font-size:.7em;opacity:.4}
.fig .body .meta{font-size:13px;color:var(--muted);margin:1px 0 5px}
.fig .body .hero{margin:8px 0 8px}
.fig .body .hero .herobio{font-size:15px;margin:0 0 4px}
.fig .body .hero .herofacts{font-size:13px;color:var(--muted);margin:0}
.fig .body .hero .herofacts b{color:var(--accent2)}
.fig .body .sig{font-size:15px;margin:0 0 6px}
.fig .body .work{font-size:13.5px;color:var(--accent2);font-style:italic;margin:0 0 6px}
.fig .body .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;color:#fff}
.fig .body .links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
/* glossary tooltip: appears when the mouse lingers */
.gloss{border-bottom:1px dotted var(--accent2);cursor:help;position:relative}
.gloss::after{content:attr(data-def);position:absolute;left:0;bottom:130%;width:min(260px,70vw);background:#2b2a26;color:#f6f1e7;padding:9px 11px;border-radius:8px;font-size:13px;line-height:1.45;font-style:normal;font-weight:400;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .15s .4s,visibility 0s .55s;z-index:40;pointer-events:none;white-space:normal}
.gloss:hover::after{opacity:1;visibility:visible;transition:opacity .15s .4s,visibility 0s .4s}
footer{max-width:1080px;margin:0 auto;padding:20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
</style>
</head>

<header class="top">
  <div class="langbar"><button id="lDe">Deutsch</button><button id="lEn" class="active">English</button><button id="lFr">Français</button></div>

</header>
<main>
  <details class="glosshelp" id="glosshelp"><summary id="glossSummary"></summary><div class="gbody" id="glossBody"></div></details>
  <div class="tabs2">
    <button class="stab active" id="tabPeople"></button>
    <button class="stab" id="tabIdeas"></button>
  </div>
  <section id="ideasSec">
    <div class="themes" id="themes"></div>
  </section>
  <section id="peopleSec" hidden>
    <div class="controls"><input id="search" type="search"><span class="count" id="count"></span></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </section>
</main>

<script>
const D={"figures":[{"name":"Nicolas Robert","born":1614,"died":1685,"nat":"French","fields":["botany","zoology","art"],"work":"Vélins du Roi (royal vellums)","year":1664,"sig_en":"Founder of the royal vellums, France's collection of exquisite natural-history paintings on parchment that Redoute would later continue.","sig_de":"Begründer der königlichen Vélins, Frankreichs Sammlung exquisiter Naturkundemalereien auf Pergament, die Redouté später fortsetzte.","sig_fr":"Fondateur des vélins du Roi, la collection française de peintures d'histoire naturelle sur vélin que Redouté prolongera plus tard."},{"name":"Robert Morison","born":1620,"died":1683,"nat":"British","fields":["botany"],"work":"Plantarum Historia Universalis Oxoniensis","year":1680,"sig_en":"Scottish botanist who challenged existing systems with a classification based on fruit and flower form in his 'Plantarum Historia Universalis Oxoniensis'.","sig_de":"Schottischer Botaniker, der in seiner 'Plantarum Historia Universalis Oxoniensis' mit einer auf Frucht- und Blütenform beruhenden Klassifikation bestehende Systeme herausforderte.","sig_fr":"Botaniste écossais qui, dans sa « Plantarum Historia Universalis Oxoniensis », défia les systèmes existants par une classification fondée sur la forme des fruits et fleurs."},{"name":"Georg Eberhard Rumphius","born":1627,"died":1702,"nat":"German","fields":["botany","exploration","zoology"],"work":"Herbarium Amboinense","year":1741,"sig_en":"German-born naturalist of the Dutch East Indies whose 'Herbarium Amboinense', written while blind, catalogued the tropical flora of Ambon in vivid detail.","sig_de":"Deutschstämmiger Naturforscher Niederländisch-Ostindiens, dessen erblindet verfasstes 'Herbarium Amboinense' die tropische Flora von Ambon anschaulich katalogisierte.","sig_fr":"Naturaliste d'origine allemande des Indes néerlandaises dont l'« Herbarium Amboinense », rédigé aveugle, catalogua avec précision la flore tropicale d'Amboine."},{"name":"John Ray","born":1627,"died":1705,"nat":"British","fields":["botany","zoology","ideas"],"work":"Historia Plantarum","year":1686,"sig_en":"English naturalist whose 'Historia Plantarum' founded the biological species concept and a natural classification of plants, laying the groundwork for all later systematics.","sig_de":"Englischer Naturforscher, dessen 'Historia Plantarum' den biologischen Artbegriff und eine natürliche Pflanzenordnung begründete und das Fundament aller späteren Systematik legte.","sig_fr":"Naturaliste anglais dont l'« Historia Plantarum » fonda le concept biologique d'espèce et une classification naturelle des plantes, posant les bases de la systématique."},{"name":"Marcello Malpighi","born":1628,"died":1694,"nat":"Italian","fields":["botany","zoology"],"work":"Anatome Plantarum","year":1675,"sig_en":"Italian anatomist whose 'Anatome Plantarum' applied the microscope to plants, founding plant anatomy alongside his pioneering studies of animal tissues.","sig_de":"Italienischer Anatom, dessen 'Anatome Plantarum' das Mikroskop auf Pflanzen anwandte und neben seinen Tierstudien die Pflanzenanatomie begründete.","sig_fr":"Anatomiste italien dont l'« Anatome Plantarum » appliqua le microscope aux plantes, fondant l'anatomie végétale à côté de ses études pionnières des tissus animaux."},{"name":"Jan Commelin","born":1629,"died":1692,"nat":"Dutch","fields":["botany"],"work":"Horti Medici Amstelodamensis Rariorum Plantarum Historia","year":1697,"sig_en":"Dutch botanist who directed Amsterdam's botanical garden and described its rare exotic plants in the sumptuous 'Horti Medici Amstelodamensis'.","sig_de":"Niederländischer Botaniker, der Amsterdams botanischen Garten leitete und dessen seltene Exoten im prächtigen 'Horti Medici Amstelodamensis' beschrieb.","sig_fr":"Botaniste néerlandais qui dirigea le jardin botanique d'Amsterdam et décrivit ses rares plantes exotiques dans le somptueux « Horti Medici Amstelodamensis »."},{"name":"Antonie van Leeuwenhoek","born":1632,"died":1723,"nat":"Dutch","fields":["zoology","ideas"],"work":"Arcana Naturae Detecta","year":1695,"sig_en":"Dutch draper and self-taught microscopist who first observed bacteria, protozoa and spermatozoa, opening the entire microscopic world to science.","sig_de":"Niederländischer Tuchhändler und autodidaktischer Mikroskopiker, der als Erster Bakterien, Protozoen und Spermien beobachtete und der Wissenschaft die mikroskopische Welt eröffnete.","sig_fr":"Drapier néerlandais et microscopiste autodidacte qui observa le premier bactéries, protozoaires et spermatozoïdes, ouvrant tout le monde microscopique à la science."},{"name":"Francis Willughby","born":1635,"died":1672,"nat":"British","fields":["ornithology","zoology"],"work":"Ornithologiae libri tres","year":1676,"sig_en":"English naturalist whose systematic ornithology, published by his friend John Ray, founded scientific bird classification based on anatomy and structure.","sig_de":"Englischer Naturforscher, dessen von seinem Freund John Ray herausgegebene systematische Ornithologie die wissenschaftliche Vogelklassifikation nach Anatomie und Bau begründete.","sig_fr":"Naturaliste anglais dont l'ornithologie systématique, publiée par son ami John Ray, fonda la classification scientifique des oiseaux sur l'anatomie et la structure."},{"name":"Hendrik van Rheede","born":1636,"died":1691,"nat":"Dutch","fields":["botany"],"work":"Hortus Malabaricus","year":1678,"sig_en":"Dutch colonial governor whose monumental 'Hortus Malabaricus' documented the plants of India's Malabar coast with local knowledge and superb engravings.","sig_de":"Niederländischer Kolonialgouverneur, dessen monumentaler 'Hortus Malabaricus' die Pflanzen der indischen Malabarküste mit lokalem Wissen und prächtigen Stichen dokumentierte.","sig_fr":"Gouverneur colonial néerlandais dont le monumental « Hortus Malabaricus » documenta les plantes de la côte de Malabar avec le savoir local et de superbes gravures."},{"name":"Jan Swammerdam","born":1637,"died":1680,"nat":"Dutch","fields":["entomology","zoology","ideas"],"work":"Historia Insectorum Generalis","year":1669,"sig_en":"Dutch microscopist whose meticulous dissections of insects revealed their true metamorphosis and anatomy, founding modern entomology.","sig_de":"Niederländischer Mikroskopiker, dessen akribische Insektensezierungen deren wahre Metamorphose und Anatomie enthüllten und die moderne Entomologie begründeten.","sig_fr":"Microscopiste néerlandais dont les dissections méticuleuses d'insectes révélèrent leur véritable métamorphose et anatomie, fondant l'entomologie moderne."},{"name":"Filippo Bonanni","born":1638,"died":1725,"nat":"Italian","fields":["zoology"],"work":"Ricreatione dell'occhio e della mente","year":1681,"sig_en":"Italian Jesuit polymath whose work on shells was the first book devoted solely to conchology, laying foundations for the study of molluscs.","sig_de":"Italienischer Jesuit und Universalgelehrter, dessen Muschelwerk das erste ausschließlich der Conchylienkunde gewidmete Buch war und die Molluskenforschung begründete.","sig_fr":"Jésuite et savant italien dont l'ouvrage sur les coquillages fut le premier livre entièrement consacré à la conchyliologie, fondant l'étude des mollusques."},{"name":"Pierre Magnol","born":1638,"died":1715,"nat":"French","fields":["botany"],"work":"Prodromus historiae generalis plantarum","year":1689,"sig_en":"French botanist who introduced the concept of plant families as natural groups, an idea honoured in the genus Magnolia named after him.","sig_de":"Französischer Botaniker, der den Begriff der Pflanzenfamilien als natürliche Gruppen einführte, geehrt in der nach ihm benannten Gattung Magnolia.","sig_fr":"Botaniste français qui introduisit la notion de familles de plantes comme groupes naturels, idée honorée par le genre Magnolia qui porte son nom."},{"name":"Martin Lister","born":1639,"died":1712,"nat":"British","fields":["zoology"],"work":"Historiae Conchyliorum","year":1685,"sig_en":"English naturalist whose 'Historiae Conchyliorum' was the first comprehensive illustrated study of shells, and who also produced the earliest arachnid catalogue.","sig_de":"Englischer Naturforscher, dessen 'Historiae Conchyliorum' die erste umfassende illustrierte Muschelstudie war und der auch den frühesten Spinnentierkatalog schuf.","sig_fr":"Naturaliste anglais dont l'« Historiae Conchyliorum » fut la première étude illustrée complète des coquillages, et qui produisit aussi le premier catalogue d'arachnides."},{"name":"Nehemiah Grew","born":1641,"died":1712,"nat":"British","fields":["botany"],"work":"The Anatomy of Plants","year":1682,"sig_en":"English botanist, a founder of plant anatomy, whose microscopic 'The Anatomy of Plants' revealed the inner tissue structure of plants.","sig_de":"Englischer Botaniker und Mitbegründer der Pflanzenanatomie, dessen mikroskopisches Werk 'The Anatomy of Plants' den inneren Gewebebau der Pflanzen enthüllte.","sig_fr":"Botaniste anglais, fondateur de l'anatomie végétale, dont l'ouvrage microscopique « The Anatomy of Plants » révéla la structure interne des tissus végétaux."},{"name":"Isaac Newton","born":1642,"died":1727,"nat":"British","fields":["ideas"],"work":"Philosophiæ Naturalis Principia Mathematica","year":1687,"sig_en":"Newton's Principia gave nature universal mathematical laws, inspiring naturalists to seek comparable unifying order in the living and physical world.","sig_de":"Newtons Principia gab der Natur universelle mathematische Gesetze und ermutigte Naturforscher, eine vergleichbare vereinheitlichende Ordnung in der lebendigen und physischen Welt zu suchen.","sig_fr":"Les Principia de Newton dotèrent la nature de lois mathématiques universelles, incitant les naturalistes à chercher un ordre unificateur comparable dans le monde vivant et physique."},{"name":"Leonard Plukenet","born":1642,"died":1706,"nat":"British","fields":["botany"],"work":"Phytographia","year":1691,"sig_en":"English botanist whose richly illustrated 'Phytographia' figured thousands of plants from around the world, serving as a vast reference for contemporaries.","sig_de":"Englischer Botaniker, dessen reich illustrierte 'Phytographia' tausende Pflanzen aus aller Welt abbildete und Zeitgenossen als umfangreiches Nachschlagewerk diente.","sig_fr":"Botaniste anglais dont la « Phytographia » richement illustrée figura des milliers de plantes du monde entier, servant de vaste référence à ses contemporains."},{"name":"Charles Plumier","born":1646,"died":1704,"nat":"French","fields":["botany","exploration"],"work":"Nova Plantarum Americanarum Genera","year":1703,"sig_en":"French friar-botanist who explored the Caribbean, describing many new American plants and naming genera such as Magnolia, Begonia and Fuchsia after botanists.","sig_de":"Französischer Mönch und Botaniker, der die Karibik erkundete, viele neue amerikanische Pflanzen beschrieb und Gattungen wie Magnolia, Begonia und Fuchsia nach Botanikern benannte.","sig_fr":"Botaniste et religieux français qui explora les Caraïbes, décrivant de nombreuses plantes américaines et nommant des genres comme Magnolia, Begonia et Fuchsia."},{"name":"Gottfried Wilhelm Leibniz","born":1646,"died":1716,"nat":"German","fields":["ideas","geology"],"work":"Protogaea","year":1749,"sig_en":"Leibniz envisioned a continuous chain of being and a dynamic Earth history, insisting that nature makes no leaps.","sig_de":"Leibniz entwarf eine kontinuierliche Kette der Wesen und eine dynamische Erdgeschichte und betonte, dass die Natur keine Sprünge macht.","sig_fr":"Leibniz imagina une chaîne continue des êtres et une histoire dynamique de la Terre, affirmant que la nature ne fait pas de sauts."},{"name":"Paul Hermann","born":1646,"died":1695,"nat":"German","fields":["botany"],"work":"Paradisus Batavus","year":1698,"sig_en":"German botanist who collected extensively in Ceylon, whose posthumous 'Paradisus Batavus' documented exotic plants cultivated at Leiden's celebrated garden.","sig_de":"Deutscher Botaniker, der ausgiebig in Ceylon sammelte und dessen postumes 'Paradisus Batavus' exotische Pflanzen des berühmten Leidener Gartens dokumentierte.","sig_fr":"Botaniste allemand qui herborisa abondamment à Ceylan et dont le « Paradisus Batavus » posthume documenta les plantes exotiques du célèbre jardin de Leyde."},{"name":"Maria Sibylla Merian","born":1647,"died":1717,"nat":"German","fields":["entomology","art","botany","zoology","exploration"],"work":"Metamorphosis Insectorum Surinamensium","year":1705,"sig_en":"German naturalist and artist whose 'Metamorphosis Insectorum Surinamensium' revealed insect life cycles on their host plants with unprecedented scientific artistry.","sig_de":"Deutsche Naturforscherin und Künstlerin, deren 'Metamorphosis Insectorum Surinamensium' Insektenmetamorphosen an ihren Wirtspflanzen mit beispielloser wissenschaftlicher Kunstfertigkeit darstellte.","sig_fr":"Naturaliste et artiste allemande dont la « Metamorphosis Insectorum Surinamensium » révéla les cycles de vie des insectes sur leurs plantes-hôtes avec un art scientifique inédit."},{"name":"Engelbert Kaempfer","born":1651,"died":1716,"nat":"German","fields":["botany","exploration"],"work":"Amoenitatum Exoticarum","year":1712,"sig_en":"German physician-traveller whose 'Amoenitatum Exoticarum' introduced Europe to the plants of Persia and Japan, including the first Western description of ginkgo.","sig_de":"Deutscher Arzt und Reisender, dessen 'Amoenitatum Exoticarum' Europa die Pflanzen Persiens und Japans vorstellte, darunter die erste westliche Beschreibung des Ginkgo.","sig_fr":"Médecin-voyageur allemand dont l'« Amoenitatum Exoticarum » fit connaître à l'Europe les plantes de Perse et du Japon, dont la première description occidentale du ginkgo."},{"name":"William Dampier","born":1651,"died":1715,"nat":"British","fields":["exploration","zoology"],"sig_de":"Der englische Freibeuter umsegelte dreimal die Welt und hielt als scharfer Beobachter Winde, Pflanzen und Tiere fremder Kuesten fest.","sig_en":"The English buccaneer circled the globe three times, recording as a keen observer the winds, plants and animals of distant coasts.","sig_fr":"Le flibustier anglais fit trois fois le tour du monde, notant en fin observateur les vents, plantes et animaux de cotes lointaines.","work":"A New Voyage Round the World","year":1697},{"name":"Joseph Pitton de Tournefort","born":1656,"died":1708,"nat":"French","fields":["botany"],"work":"Institutiones Rei Herbariae","year":1700,"sig_en":"French botanist who rigorously defined the genus as the key rank of classification, shaping botanical order before Linnaeus in his 'Institutiones Rei Herbariae'.","sig_de":"Französischer Botaniker, der in den 'Institutiones Rei Herbariae' die Gattung als zentrale Rangstufe klar definierte und die botanische Ordnung vor Linné prägte.","sig_fr":"Botaniste français qui, dans ses « Institutiones Rei Herbariae », définit rigoureusement le genre comme rang clé, structurant la botanique avant Linné."},{"name":"Hans Sloane","born":1660,"died":1753,"nat":"British","fields":["botany","zoology","ideas","exploration"],"work":"A Voyage to the Islands ... Jamaica","year":1707,"sig_en":"British physician and collector whose vast natural-history cabinet, catalogued from his Jamaica voyage, became the founding collection of the British Museum.","sig_de":"Britischer Arzt und Sammler, dessen riesiges Naturalienkabinett, aus seiner Jamaika-Reise katalogisiert, den Grundstock des British Museum bildete.","sig_fr":"Médecin et collectionneur britannique dont l'immense cabinet d'histoire naturelle, catalogué depuis son voyage en Jamaïque, forma la collection fondatrice du British Museum."},{"name":"Olof Rudbeck the Younger","born":1660,"died":1740,"nat":"Swedish","fields":["botany","ornithology"],"work":"Campi Elysii","year":1701,"sig_en":"Swedish naturalist whose ambitious 'Campi Elysii' aimed to figure every known plant and who, as professor at Uppsala, mentored the young Linnaeus.","sig_de":"Schwedischer Naturforscher, dessen ehrgeiziges 'Campi Elysii' jede bekannte Pflanze abbilden wollte und der als Uppsala-Professor den jungen Linné förderte.","sig_fr":"Naturaliste suédois dont l'ambitieux « Campi Elysii » visait à figurer toute plante connue et qui, professeur à Uppsala, forma le jeune Linné."},{"name":"Albertus Seba","born":1665,"died":1736,"nat":"Dutch","fields":["zoology","botany","art"],"work":"Locupletissimi rerum naturalium thesauri","year":1734,"sig_en":"Amsterdam apothecary whose cabinet of curiosities became the sumptuous Thesaurus, engraving snakes, shells and exotic beasts for all Europe.","sig_de":"Amsterdamer Apotheker, dessen Kuriositätenkabinett zum prachtvollen Thesaurus wurde und Schlangen, Muscheln und exotische Tiere für ganz Europa festhielt.","sig_fr":"Apothicaire d'Amsterdam dont le cabinet de curiosités devint le somptueux Thesaurus, gravant serpents, coquillages et bêtes exotiques pour toute l'Europe."},{"name":"Claude Aubriet","born":1665,"died":1742,"nat":"French","fields":["botany","art","exploration"],"work":"Institutiones Rei Herbariae (Tournefort)","year":1700,"sig_en":"Traveled to the Levant with Tournefort and became royal botanical painter, bridging seventeenth-century flower art and modern illustration.","sig_de":"Reiste mit Tournefort in die Levante und wurde königlicher Pflanzenmaler, eine Brücke zwischen Blumenkunst des 17. Jahrhunderts und moderner Illustration.","sig_fr":"Voyagea au Levant avec Tournefort et devint peintre botaniste du roi, reliant l'art floral du XVIIe siècle à l'illustration moderne."},{"name":"James Petiver","born":1665,"died":1718,"nat":"British","fields":["botany","entomology"],"work":"Musei Petiveriani","year":1695,"sig_en":"English apothecary and avid collector whose specimen cabinets and 'Musei Petiveriani' assembled a global natural-history collection later acquired by Sloane.","sig_de":"Englischer Apotheker und eifriger Sammler, dessen Kabinette und 'Musei Petiveriani' eine weltweite naturkundliche Sammlung zusammentrugen, die später Sloane erwarb.","sig_fr":"Apothicaire anglais et collectionneur passionné dont les cabinets et le « Musei Petiveriani » réunirent une collection d'histoire naturelle mondiale, acquise plus tard par Sloane."},{"name":"Rudolf Jakob Camerarius","born":1665,"died":1721,"nat":"German","fields":["botany"],"work":"De Sexu Plantarum Epistola","year":1694,"sig_en":"German botanist whose 'De Sexu Plantarum Epistola' experimentally proved that plants reproduce sexually, establishing stamens and pistils as reproductive organs.","sig_de":"Deutscher Botaniker, dessen 'De Sexu Plantarum Epistola' experimentell nachwies, dass Pflanzen sich geschlechtlich fortpflanzen, und Staubblätter und Stempel als Geschlechtsorgane erkannte.","sig_fr":"Botaniste allemand dont le « De Sexu Plantarum Epistola » prouva expérimentalement la reproduction sexuée des plantes, identifiant étamines et pistils comme organes reproducteurs."},{"name":"Herman Boerhaave","born":1668,"died":1738,"nat":"Dutch","fields":["botany","ideas"],"work":"Index alter plantarum","year":1727,"sig_en":"Dutch physician-botanist who transformed Leiden's garden into Europe's finest, cataloguing its plants in his influential 'Index alter plantarum'.","sig_de":"Niederländischer Arzt und Botaniker, der Leidens Garten zum besten Europas machte und dessen Pflanzen in seinem einflussreichen 'Index alter plantarum' verzeichnete.","sig_fr":"Médecin-botaniste néerlandais qui fit du jardin de Leyde le plus beau d'Europe, cataloguant ses plantes dans son influent « Index alter plantarum »."},{"name":"Sébastien Vaillant","born":1669,"died":1722,"nat":"French","fields":["botany"],"work":"Botanicon Parisiense","year":1727,"sig_en":"French botanist whose lecture and 'Botanicon Parisiense' championed the sexuality of plants, deeply influencing Linnaeus's sexual system of classification.","sig_de":"Französischer Botaniker, dessen Vorlesung und 'Botanicon Parisiense' die Sexualität der Pflanzen vertraten und Linnés Sexualsystem stark beeinflussten.","sig_fr":"Botaniste français dont le discours et le « Botanicon Parisiense » défendirent la sexualité des plantes, influençant profondément le système sexuel de Linné."},{"name":"Stephen Hales","born":1677,"died":1761,"nat":"British","fields":["botany","ideas"],"work":"Vegetable Staticks","year":1727,"sig_en":"English clergyman-scientist whose 'Vegetable Staticks' founded plant physiology by measuring sap flow, transpiration and the nourishment of plants.","sig_de":"Englischer Geistlicher und Wissenschaftler, dessen 'Vegetable Staticks' die Pflanzenphysiologie begründete, indem er Saftfluss, Transpiration und Pflanzenernährung maß.","sig_fr":"Ecclésiastique et savant anglais dont « Vegetable Staticks » fonda la physiologie végétale en mesurant la sève, la transpiration et la nutrition des plantes."},{"name":"Pier Antonio Micheli","born":1679,"died":1737,"nat":"Italian","fields":["botany"],"work":"Nova Plantarum Genera","year":1729,"sig_en":"Italian botanist, founder of mycology, whose 'Nova Plantarum Genera' first described the reproductive structures of fungi and hundreds of new plant genera.","sig_de":"Italienischer Botaniker und Begründer der Mykologie, dessen 'Nova Plantarum Genera' erstmals die Fortpflanzungsorgane der Pilze und hunderte neuer Pflanzengattungen beschrieb.","sig_fr":"Botaniste italien, fondateur de la mycologie, dont les « Nova Plantarum Genera » décrivirent les premiers organes reproducteurs des champignons et des centaines de genres nouveaux."},{"name":"Mark Catesby","born":1683,"died":1749,"nat":"British","fields":["ornithology","botany","art","zoology","exploration"],"work":"The Natural History of Carolina, Florida and the Bahama Islands","year":1729,"sig_en":"English naturalist-artist whose 'Natural History of Carolina' was the first illustrated survey of American flora and fauna, portraying birds with their plants.","sig_de":"Englischer Naturforscher und Künstler, dessen 'Natural History of Carolina' die erste illustrierte Übersicht amerikanischer Flora und Fauna bot und Vögel mit ihren Pflanzen zeigte.","sig_fr":"Naturaliste et artiste anglais dont la « Natural History of Carolina » fut la première étude illustrée de la flore et faune américaines, associant oiseaux et plantes."},{"name":"René Antoine Ferchault de Réaumur","born":1683,"died":1757,"nat":"French","fields":["entomology","zoology","ideas"],"work":"Mémoires pour servir à l'histoire des insectes","year":1734,"sig_en":"French polymath whose six-volume 'Mémoires ... des insectes' set a new standard for detailed observation of insect behaviour and structure.","sig_de":"Französischer Universalgelehrter, dessen sechsbändige 'Mémoires ... des insectes' einen neuen Maßstab für die genaue Beobachtung von Insektenverhalten und -bau setzten.","sig_fr":"Savant français dont les « Mémoires ... des insectes » en six volumes établirent une nouvelle norme d'observation détaillée du comportement et de la structure des insectes."},{"name":"Johann Jacob Dillenius","born":1684,"died":1747,"nat":"German","fields":["botany"],"work":"Historia Muscorum","year":1741,"sig_en":"German-born botanist at Oxford whose 'Historia Muscorum' was the first systematic study of mosses and lower plants, pioneering cryptogam classification.","sig_de":"In Deutschland geborener Oxforder Botaniker, dessen 'Historia Muscorum' die erste systematische Untersuchung der Moose und niederen Pflanzen war und die Kryptogamen-Klassifikation begründete.","sig_fr":"Botaniste d'origine allemande à Oxford dont l'« Historia Muscorum » fut la première étude systématique des mousses et plantes inférieures, pionnière de la classification des cryptogames."},{"name":"Cadwallader Colden","born":1688,"died":1776,"nat":"American","fields":["botany"],"work":"Plantae Coldenghamiae","year":1749,"sig_en":"Scottish-born American official and botanist whose 'Plantae Coldenghamiae' applied Linnaeus's system to New York's plants, corresponding directly with Linnaeus.","sig_de":"Schottischstämmiger amerikanischer Beamter und Botaniker, dessen 'Plantae Coldenghamiae' Linnés System auf die Pflanzen New Yorks anwandte und der mit Linné korrespondierte.","sig_fr":"Fonctionnaire et botaniste américain d'origine écossaise dont « Plantae Coldenghamiae » appliqua le système de Linné aux plantes de New York, correspondant avec Linné."},{"name":"Philip Miller","born":1691,"died":1771,"nat":"British","fields":["botany"],"work":"The Gardeners Dictionary","year":1731,"sig_en":"English gardener of the Chelsea Physic Garden whose 'The Gardeners Dictionary' became the era's most authoritative practical guide to plants.","sig_de":"Englischer Gärtner des Chelsea Physic Garden, dessen 'The Gardeners Dictionary' zum maßgeblichsten praktischen Pflanzenhandbuch der Epoche wurde.","sig_fr":"Jardinier anglais du Chelsea Physic Garden dont « The Gardeners Dictionary » devint le guide pratique des plantes le plus autorisé de l'époque."},{"name":"George Edwards","born":1694,"died":1773,"nat":"British","fields":["ornithology","art","zoology"],"work":"A Natural History of Uncommon Birds","year":1743,"sig_en":"English ornithologist, father of British ornithology, whose 'Natural History of Uncommon Birds' described and illustrated many species new to science.","sig_de":"Englischer Ornithologe, Vater der britischen Vogelkunde, dessen 'Natural History of Uncommon Birds' viele der Wissenschaft neue Arten beschrieb und abbildete.","sig_fr":"Ornithologue anglais, père de l'ornithologie britannique, dont la « Natural History of Uncommon Birds » décrivit et illustra de nombreuses espèces nouvelles pour la science."},{"name":"Bernard de Jussieu","born":1699,"died":1777,"nat":"French","fields":["botany"],"work":"Ordre naturel des plantes (Jardin du Trianon)","year":1759,"sig_en":"French botanist who arranged the royal Trianon garden by a natural method, quietly inspiring the family-based classification his nephew later published.","sig_de":"Französischer Botaniker, der den königlichen Trianon-Garten nach einer natürlichen Methode ordnete und so die spätere Familienklassifikation seines Neffen inspirierte.","sig_fr":"Botaniste français qui disposa le jardin royal du Trianon selon une méthode naturelle, inspirant la classification par familles que son neveu publia plus tard."},{"name":"John Bartram","born":1699,"died":1777,"nat":"American","fields":["botany","exploration"],"work":"Observations on the Inhabitants, Climate, Soil ...","year":1751,"sig_en":"Self-taught American botanist, called the father of American botany, who explored the colonies and supplied new plants to European gardens.","sig_de":"Autodidaktischer amerikanischer Botaniker, Vater der amerikanischen Botanik, der die Kolonien erkundete und europäischen Gärten neue Pflanzen lieferte.","sig_fr":"Botaniste américain autodidacte, dit père de la botanique américaine, qui explora les colonies et fournit de nouvelles plantes aux jardins européens."},{"name":"Charles Marie de La Condamine","born":1701,"died":1774,"nat":"French","fields":["exploration","geology"],"sig_de":"Der Franzose leitete die Aequator-Expedition nach Peru, vermass die Erdgestalt und brachte Kautschuk und Chinarinde nach Europa.","sig_en":"The Frenchman led the equatorial expedition to Peru, measured the Earth's shape, and brought rubber and cinchona to Europe.","sig_fr":"Le Francais dirigea l'expedition equatoriale au Perou, mesura la forme de la Terre et rapporta le caoutchouc et le quinquina en Europe.","work":"Relation abregee d'un voyage fait dans l'interieur de l'Amerique meridionale","year":1745},{"name":"Madeleine Françoise Basseporte","born":1701,"died":1780,"nat":"French","fields":["botany","art"],"work":"Vélins du Roi (royal vellums)","year":1735,"sig_en":"Rare woman to hold the post of royal painter at the Jardin du Roi, adding decades of vellums to the royal collection.","sig_de":"Als seltene Frau bekleidete sie das Amt der königlichen Malerin am Jardin du Roi und ergänzte die königliche Sammlung um jahrzehntelange Vélins.","sig_fr":"Femme rare à occuper le poste de peintre du roi au Jardin du Roi, elle enrichit la collection royale de décennies de vélins."},{"name":"August Johann Rösel von Rosenhof","born":1705,"died":1759,"nat":"German","fields":["entomology","art","zoology"],"work":"Insecten-Belustigung","year":1746,"sig_en":"German miniaturist and naturalist whose 'Insecten-Belustigung' combined exquisite illustration with careful observation of insects, and later of frogs.","sig_de":"Deutscher Miniaturmaler und Naturforscher, dessen 'Insecten-Belustigung' exquisite Illustration mit sorgfältiger Beobachtung von Insekten und später Fröschen verband.","sig_fr":"Miniaturiste et naturaliste allemand dont l'« Insecten-Belustigung » allia une illustration exquise à l'observation attentive des insectes, puis des grenouilles."},{"name":"Georg Wolfgang Knorr","born":1705,"died":1761,"nat":"German","fields":["geology","zoology","art"],"work":"Deliciae Naturae Selectae","year":1766,"sig_en":"Nuremberg engraver whose vivid plates of shells and fossils were among the earliest fine illustrations of natural curiosities and prehistoric remains.","sig_de":"Nürnberger Kupferstecher, dessen lebhafte Tafeln von Muscheln und Fossilien zu den frühesten schönen Darstellungen von Naturalien und vorzeitlichen Überresten gehörten.","sig_fr":"Graveur nurembergeois dont les planches éclatantes de coquillages et de fossiles comptent parmi les premières belles illustrations de curiosités naturelles et de restes préhistoriques."},{"name":"Carl Linnaeus","born":1707,"died":1778,"nat":"Swedish","fields":["botany","zoology","ideas"],"work":"Systema Naturae","year":1735,"sig_en":"Swedish naturalist who imposed binomial nomenclature and a hierarchical system on all living things, becoming the founding father of modern taxonomy.","sig_de":"Schwedischer Naturforscher, der der gesamten Lebewelt die binäre Nomenklatur und ein hierarchisches System auferlegte und zum Begründer der modernen Taxonomie wurde.","sig_fr":"Naturaliste suédois qui imposa la nomenclature binomiale et un système hiérarchique à tout le vivant, devenant le père fondateur de la taxinomie moderne."},{"name":"Elizabeth Blackwell","born":1707,"died":1758,"nat":"British","fields":["botany","art"],"work":"A Curious Herbal","year":1737,"sig_en":"British botanical artist who drew, engraved and coloured 'A Curious Herbal' to free her husband from debtors' prison, documenting medicinal plants.","sig_de":"Britische Pflanzenkünstlerin, die 'A Curious Herbal' zeichnete, stach und kolorierte, um ihren Mann aus dem Schuldgefängnis zu befreien, und Heilpflanzen dokumentierte.","sig_fr":"Artiste botanique britannique qui dessina, grava et coloria « A Curious Herbal » pour libérer son mari de la prison pour dettes, documentant les plantes médicinales."},{"name":"Georges-Louis Leclerc de Buffon","born":1707,"died":1788,"nat":"French","fields":["zoology","geology","ideas"],"work":"Histoire Naturelle","year":1749,"sig_en":"French naturalist whose monumental 'Histoire Naturelle' popularized natural history and raised bold questions about species change, the Earth's age and common descent.","sig_de":"Französischer Naturforscher, dessen monumentale 'Histoire Naturelle' die Naturgeschichte popularisierte und kühne Fragen zu Artenwandel, Erdalter und gemeinsamer Abstammung aufwarf.","sig_fr":"Naturaliste français dont la monumentale « Histoire Naturelle » popularisa l'histoire naturelle et souleva des questions audacieuses sur les espèces, l'âge de la Terre et la filiation."},{"name":"Georges-Louis Leclerc, Comte de Buffon","born":1707,"died":1788,"nat":"French","fields":["zoology","ideas","geology","botany","ornithology"],"sig_de":"Französischer Enzyklopädist, dessen umfangreiche Histoire Naturelle die Naturgeschichte popularisierte und kühn über das Erdalter und den Artenwandel spekulierte.","sig_en":"French encyclopedist whose vast Histoire Naturelle popularized natural history and speculated boldly about the Earth's age and species change.","sig_fr":"Encyclopédiste français dont la vaste Histoire Naturelle vulgarisa l'histoire naturelle et spécula hardiment sur l'âge de la Terre et la transformation des espèces.","work":"Histoire Naturelle","year":1749},{"name":"Johannes Burman","born":1707,"died":1780,"nat":"Dutch","fields":["botany"],"work":"Thesaurus Zeylanicus","year":1737,"sig_en":"Dutch botanist who described the plants of Ceylon and the Cape, editing important exotic floras and collaborating with the young Linnaeus.","sig_de":"Niederländischer Botaniker, der die Pflanzen Ceylons und des Kaps beschrieb, wichtige exotische Floren herausgab und mit dem jungen Linné zusammenarbeitete.","sig_fr":"Botaniste néerlandais qui décrivit les plantes de Ceylan et du Cap, éditant d'importantes flores exotiques et collaborant avec le jeune Linné."},{"name":"Albrecht von Haller","born":1708,"died":1777,"nat":"Swiss","fields":["botany","zoology","ideas"],"work":"Historia Stirpium Indigenarum Helvetiae","year":1768,"sig_en":"Swiss polymath whose 'Historia Stirpium ... Helvetiae' catalogued the Alpine flora and defended a natural method against Linnaeus's artificial system.","sig_de":"Schweizer Universalgelehrter, dessen 'Historia Stirpium ... Helvetiae' die alpine Flora katalogisierte und eine natürliche Methode gegen Linnés künstliches System verteidigte.","sig_fr":"Savant suisse dont l'« Historia Stirpium ... Helvetiae » catalogua la flore alpine et défendit une méthode naturelle contre le système artificiel de Linné."},{"name":"Georg Dionysius Ehret","born":1708,"died":1770,"nat":"German","fields":["botany","art","entomology"],"work":"Plantae et Papiliones Rariores","year":1748,"sig_en":"German botanical artist, the finest of his age, whose exquisite plates illustrated Linnaeus's system and the works of leading eighteenth-century botanists.","sig_de":"Deutscher Pflanzenmaler, der beste seiner Zeit, dessen exquisite Tafeln Linnés System und die Werke führender Botaniker des 18. Jahrhunderts illustrierten.","sig_fr":"Peintre botanique allemand, le plus grand de son temps, dont les planches exquises illustrèrent le système de Linné et les ouvrages des grands botanistes du XVIIIe siècle."},{"name":"Carl Alexander Clerck","born":1709,"died":1765,"nat":"Swedish","fields":["entomology","art"],"sig_en":"Swedish naturalist and Linnaeus's pupil whose 'Swedish Spiders' gave arachnology its first formally recognised zoological names.","sig_de":"Schwedischer Naturforscher und Linné-Schüler, dessen 'Schwedische Spinnen' der Arachnologie ihre ersten offiziell anerkannten zoologischen Namen gaben.","sig_fr":"Naturaliste suédois et élève de Linné dont les 'Araignées de Suède' donnèrent à l'arachnologie ses premiers noms zoologiques officiellement reconnus.","work":"Svenska Spindlar (Aranei Svecici)","year":1757},{"name":"Carl Clerck","born":1709,"died":1765,"nat":"Swedish","fields":["entomology"],"work":"Svenska Spindlar / Aranei Suecici","year":1757,"sig_en":"Swedish entomologist and arachnologist whose 'Svenska Spindlar' was among the first works to apply Linnaean binomial names, describing Sweden's spiders.","sig_de":"Schwedischer Entomologe und Arachnologe, dessen 'Svenska Spindlar' zu den ersten Werken mit linnéscher Binärnomenklatur zählte und Schwedens Spinnen beschrieb.","sig_fr":"Entomologiste et arachnologue suédois dont « Svenska Spindlar » fut parmi les premiers ouvrages à employer la nomenclature binomiale linnéenne, décrivant les araignées de Suède."},{"name":"Georg Wilhelm Steller","born":1709,"died":1746,"nat":"German","fields":["zoology","botany","exploration"],"work":"De Bestiis Marinis","year":1751,"sig_en":"German naturalist on Bering's expedition who first described Alaskan wildlife, including the now-extinct Steller's sea cow, in 'De Bestiis Marinis'.","sig_de":"Deutscher Naturforscher auf Berings Expedition, der Alaskas Tierwelt, darunter die ausgestorbene Stellersche Seekuh, erstmals in 'De Bestiis Marinis' beschrieb.","sig_fr":"Naturaliste allemand de l'expédition de Béring qui décrivit le premier la faune de l'Alaska, dont la rhytine de Steller aujourd'hui disparue, dans « De Bestiis Marinis »."},{"name":"Johann Georg Gmelin","born":1709,"died":1755,"nat":"German","fields":["botany","exploration"],"work":"Flora Sibirica","year":1747,"sig_en":"German naturalist who explored Siberia for Russia and produced the pioneering 'Flora Sibirica', describing hundreds of previously unknown plants.","sig_de":"Deutscher Naturforscher, der für Russland Sibirien erkundete und die bahnbrechende 'Flora Sibirica' schuf, die hunderte zuvor unbekannte Pflanzen beschrieb.","sig_fr":"Naturaliste allemand qui explora la Sibérie pour la Russie et produisit la « Flora Sibirica » pionnière, décrivant des centaines de plantes jusqu'alors inconnues."},{"name":"Abraham Trembley","born":1710,"died":1784,"nat":"Swiss","fields":["zoology"],"work":"Mémoires ... polypes d'eau douce","year":1744,"sig_en":"Swiss naturalist whose experiments on the freshwater hydra, showing regeneration from fragments, astonished Europe and helped launch experimental zoology.","sig_de":"Schweizer Naturforscher, dessen Versuche am Süßwasserpolypen, der sich aus Bruchstücken regenerierte, Europa verblüfften und die experimentelle Zoologie mitbegründeten.","sig_fr":"Naturaliste suisse dont les expériences sur l'hydre d'eau douce, régénérée à partir de fragments, stupéfièrent l'Europe et contribuèrent à fonder la zoologie expérimentale."},{"name":"Stepan Krasheninnikov","born":1711,"died":1755,"nat":"Russian","fields":["exploration","zoology","botany"],"sig_de":"Der russische Forscher erkundete Kamtschatka und verfasste die erste umfassende Beschreibung seiner Natur und Voelker.","sig_en":"The Russian explorer surveyed Kamchatka and wrote the first comprehensive account of its nature and peoples.","sig_fr":"L'explorateur russe etudia le Kamtchatka et redigea la premiere description complete de sa nature et de ses peuples.","work":"Description of the Land of Kamchatka","year":1755},{"name":"John Miller","born":1715,"died":1790,"nat":"German-British","fields":["botany","art"],"work":"An Illustration of the Sexual System of Linnaeus","year":1777,"sig_en":"German-born engraver whose superb plates illustrated Linnaeus's sexual system, praised by Linnaeus himself as unrivalled.","sig_de":"In Deutschland geborener Kupferstecher, dessen hervorragende Tafeln Linnés Sexualsystem illustrierten und von Linné selbst als unübertroffen gelobt wurden.","sig_fr":"Graveur d'origine allemande dont les superbes planches illustrèrent le système sexuel de Linné, loué par Linné lui-même comme sans égal."},{"name":"Pehr Kalm","born":1716,"died":1779,"nat":"Swedish","fields":["botany","exploration"],"sig_de":"Linnes Schueler bereiste Nordamerika, um Nutzpflanzen fuer Schweden zu finden, und schilderte Land und Natur der Kolonien lebendig.","sig_en":"Linnaeus's pupil traveled North America seeking useful plants for Sweden and vividly described the colonies' land and nature.","sig_fr":"L'eleve de Linne parcourut l'Amerique du Nord en quete de plantes utiles pour la Suede et decrivit vivement la nature des colonies.","work":"En resa til Norra America","year":1753},{"name":"Peter Kalm","born":1716,"died":1779,"nat":"Swedish","fields":["botany","exploration"],"work":"En Resa til Norra America","year":1753,"sig_en":"Swedish-Finnish apostle of Linnaeus who explored North America, describing its plants and peoples in his widely read travel account.","sig_de":"Schwedisch-finnischer Linné-Apostel, der Nordamerika erkundete und dessen Pflanzen und Völker in seinem vielgelesenen Reisebericht beschrieb.","sig_fr":"Apôtre suédo-finlandais de Linné qui explora l'Amérique du Nord, décrivant ses plantes et ses peuples dans un récit de voyage très lu."},{"name":"Charles Bonnet","born":1720,"died":1793,"nat":"Swiss","fields":["entomology","zoology","ideas"],"work":"Traité d'insectologie","year":1745,"sig_en":"Swiss naturalist who di rwin, Dichter und Arzt, stellte sich kühn vor, alles Leben stamme von einem gemeinsamen Faden ab, und nahm die Theorie seines Enkels vorweg.","sig_fr":"Erasmus Darwin, médecin-poète, imagina hardiment toute la vie issue d'un filament commun, préfigurant la théorie de son petit-fils."},{"name":"William Aiton","born":1731,"died":1793,"nat":"British","fields":["botany"],"work":"Hortus Kewensis","year":1789,"sig_en":"Scottish gardener who directed Kew and compiled 'Hortus Kewensis', a systematic catalogue of the thousands of plants cultivated there.","sig_de":"Schottischer Gärtner, der Kew leitete und 'Hortus Kewensis' zusammenstellte, einen systematischen Katalog der dort kultivierten tausenden Pflanzen.","sig_fr":"Jardinier écossais qui dirigea Kew et compila le « Hortus Kewensis », catalogue systématique des milliers de plantes qui y étaient cultivées."},{"name":"Jose Celestino Mutis","born":1732,"died":1808,"nat":"Spanish","fields":["botany","exploration"],"sig_de":"Der spanische Priester leitete die Botanische Expedition nach Neu-Granada und erforschte die fiebersenkende Chinarinde der Anden.","sig_en":"The Spanish priest led the Botanical Expedition to New Granada and studied the fever-curing cinchona bark of the Andes.","sig_fr":"Le pretre espagnol dirigea l'Expedition botanique de Nouvelle-Grenade et etudia le quinquina febrifuge des Andes.","work":"El Arcano de la Quina","year":1793},{"name":"Joseph Gärtner","born":1732,"died":1791,"nat":"German","fields":["botany"],"work":"De Fructibus et Seminibus Plantarum","year":1788,"sig_en":"German botanist whose 'De Fructibus et Seminibus Plantarum' founded carpology, the systematic study of fruits and seeds for plant classification.","sig_de":"Deutscher Botaniker, dessen 'De Fructibus et Seminibus Plantarum' die Karpologie begründete, die systematische Untersuchung von Früchten und Samen zur Pflanzenklassifikation.","sig_fr":"Botaniste allemand dont le « De Fructibus et Seminibus Plantarum » fonda la carpologie, l'étud
