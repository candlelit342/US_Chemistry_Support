r":1766,"sig_en":"Swedish student of Linnaeus and Banks's shipmate on the Endeavour, he catalogued South Pacific plants and organised the British Museum's collections.","sig_de":"Schwedischer Linné-Schüler und Banks' Gefährte auf der Endeavour, der Pflanzen der Südsee katalogisierte und die Sammlungen des British Museum ordnete.","sig_fr":"Élève suédois de Linné et compagnon de Banks sur l'Endeavour, il catalogua les plantes du Pacifique sud et organisa les collections du British Museum."},{"name":"Joseph Gottlieb Kölreuter","born":1733,"died":1806,"nat":"German","fields":["botany","ideas"],"work":"Vorläufige Nachricht von einigen ... Versuchen und Beobachtungen","year":1761,"sig_en":"German botanist whose careful experiments on plant hybrids demonstrated the roles of pollen and the two sexes, founding scientific plant hybridization.","sig_de":"Deutscher Botaniker, dessen sorgfältige Kreuzungsversuche die Rolle des Pollens und beider Geschlechter zeigten und die wissenschaftliche Pflanzenhybridisierung begründeten.","sig_fr":"Botaniste allemand dont les expériences soignées sur les hybrides végétaux montrèrent le rôle du pollen et des deux sexes, fondant l'hybridation végétale scientifique."},{"name":"Nicolaas Laurens Burman","born":1734,"died":1793,"nat":"Dutch","fields":["botany"],"work":"Flora Indica","year":1768,"sig_en":"Dutch botanist, son of Johannes, whose 'Flora Indica' catalogued plants of the East Indies using the Linnaean system he learned firsthand.","sig_de":"Niederländischer Botaniker, Sohn des Johannes, dessen 'Flora Indica' Pflanzen Ostindiens nach dem von ihm gelernten linnéschen System katalogisierte.","sig_fr":"Botaniste néerlandais, fils de Johannes, dont la « Flora Indica » catalogua les plantes des Indes orientales selon le système linnéen qu'il avait appris."},{"name":"James Bolton","born":1735,"died":1799,"nat":"British","fields":["botany","ornithology","art"],"work":"An History of Fungusses Growing about Halifax","year":1788,"sig_en":"Self-taught Yorkshire naturalist who produced Britain's first illustrated book on fungi and fine studies of ferns and birds.","sig_de":"Autodidaktischer Naturforscher aus Yorkshire, der Großbritanniens erstes illustriertes Pilzbuch und feine Studien von Farnen und Vögeln schuf.","sig_fr":"Naturaliste autodidacte du Yorkshire, auteur du premier livre illustré britannique sur les champignons et de belles études de fougères et d'oiseaux."},{"name":"Jan Christiaan Sepp","born":1739,"died":1811,"nat":"Dutch","fields":["entomology","art"],"work":"Nederlandsche Insecten","year":1762,"sig_en":"Dutch publisher-artist whose sumptuous Nederlandsche Insecten depicted native insects with their food plants in brilliant colour.","sig_de":"Niederländischer Verleger und Künstler, dessen prachtvolles Nederlandsche Insecten einheimische Insekten mit ihren Futterpflanzen in leuchtenden Farben darstellte.","sig_fr":"Éditeur-artiste néerlandais dont le somptueux Nederlandsche Insecten représentait les insectes indigènes avec leurs plantes nourricières en couleurs éclatantes."},{"name":"William Bartram","born":1739,"died":1823,"nat":"American","fields":["botany","ornithology","art","exploration"],"work":"Travels Through North and South Carolina, Georgia, East and West Florida","year":1791,"sig_en":"American naturalist and artist whose lyrical 'Travels' described the wildlife, plants and peoples of the southeastern frontier, inspiring Romantic writers.","sig_de":"Amerikanischer Naturforscher und Künstler, dessen lyrische 'Travels' Tierwelt, Pflanzen und Völker des südöstlichen Grenzlands beschrieben und romantische Dichter inspirierten.","sig_fr":"Naturaliste et artiste américain dont les « Travels » lyriques décrivirent la faune, la flore et les peuples de la frontière du Sud-Est, inspirant les romantiques."},{"name":"John Latham","born":1740,"died":1837,"nat":"English","fields":["ornithology"],"work":"A General Synopsis of Birds","year":1781,"sig_en":"English 'grandfather of Australian ornithology' whose General Synopsis first described many birds from Cook's voyages, including the emu and lyrebird.","sig_de":"Englischer 'Großvater der australischen Ornithologie', dessen General Synopsis erstmals viele Vögel von Cooks Reisen beschrieb, darunter Emu und Leierschwanz.","sig_fr":"« Grand-père de l'ornithologie australienne » anglais dont le General Synopsis décrivit le premier de nombreux oiseaux des voyages de Cook, dont l'émeu et le ménure."},{"name":"Juan Ignacio Molina","born":1740,"died":1829,"nat":"Chilean","fields":["zoology","botany","ideas"],"sig_de":"Der chilenische Jesuit verfasste im Exil die erste Naturgeschichte Chiles und machte Europa mit dessen Pflanzen und Tieren bekannt.","sig_en":"The Chilean Jesuit wrote in exile the first natural history of Chile, introducing Europe to its plants and animals.","sig_fr":"Le jesuite chilien redigea en exil la premiere histoire naturelle du Chili, faisant connaitre a l'Europe ses plantes et animaux.","work":"Saggio sulla storia naturale del Chili","year":1782},{"name":"Peter Simon Pallas","born":1741,"died":1811,"nat":"German","fields":["zoology","botany","geology","exploration","ornithology"],"work":"Reise durch verschiedene Provinzen des Russischen Reichs","year":1771,"sig_en":"German naturalist in Russian service whose vast expeditions across Siberia catalogued new plants, animals and minerals and mapped the empire's natural history.","sig_de":"Deutscher Naturforscher in russischen Diensten, dessen ausgedehnte Sibirien-Expeditionen neue Pflanzen, Tiere und Mineralien katalogisierten und die Naturgeschichte des Reiches erfassten.","sig_fr":"Naturaliste allemand au service de la Russie dont les vastes expéditions à travers la Sibérie cataloguèrent plantes, animaux et minéraux nouveaux et cartographièrent l'histoire naturelle de l'empire."},{"name":"Eugenius Johann Christoph Esper","born":1742,"died":1810,"nat":"German","fields":["entomology","art"],"sig_en":"German professor whose illustrated 'Die Schmetterlinge' comprehensively depicted European Lepidoptera in finely coloured plates.","sig_de":"Deutscher Professor, dessen bebildertes Werk 'Die Schmetterlinge' die europäischen Lepidopteren umfassend in fein kolorierten Tafeln darstellte.","sig_fr":"Professeur allemand dont l'ouvrage illustré « Die Schmetterlinge » représenta de façon exhaustive les lépidoptères européens en planches finement coloriées.","work":"Die Schmetterlinge in Abbildungen nach der Natur","year":1777},{"name":"Felix de Azara","born":1742,"died":1821,"nat":"Spanish","fields":["zoology","ornithology","exploration"],"sig_de":"Der spanische Offizier kartierte Paraguay und beschrieb, von Buffon unabhaengig, praezise dessen Voegel und Saeugetiere.","sig_en":"The Spanish officer mapped Paraguay and, independently of Buffon, precisely described its birds and mammals.","sig_fr":"L'officier espagnol cartographia le Paraguay et decrivit, independamment de Buffon, ses oiseaux et mammiferes avec precision.","work":"Apuntamientos para la historia natural de los quadrupedos del Paraguay","year":1802},{"name":"Carl Peter Thunberg","born":1743,"died":1828,"nat":"Swedish","fields":["botany","exploration"],"work":"Flora Japonica","year":1784,"sig_en":"Swedish apostle of Linnaeus, called the father of South African botany, whose 'Flora Japonica' first opened Japan's plants to European science.","sig_de":"Schwedischer Apostel Linnés, Vater der südafrikanischen Botanik, dessen 'Flora Japonica' Japans Pflanzen erstmals der europäischen Wissenschaft erschloss.","sig_fr":"Apôtre suédois de Linné, dit père de la botanique sud-africaine, dont la « Flora Japonica » révéla les premières plantes du Japon à la science européenne."},{"name":"Eberhard August Wilhelm von Zimmermann","born":1743,"died":1815,"nat":"German","fields":["zoology","ideas"],"work":"Geographische Geschichte des Menschen, und der allgemein verbreiteten vierfüßigen Thiere","year":1778,"sig_en":"Zimmermann pioneered zoogeography, mapping how mammals are distributed across the globe in relation to climate and geography.","sig_de":"Zimmermann leistete Pionierarbeit in der Zoogeographie und kartierte, wie Säugetiere in Beziehung zu Klima und Geographie über die Erde verteilt sind.","sig_fr":"Zimmermann fut un pionnier de la zoogéographie, cartographiant la répartition des mammifères sur le globe selon le climat et la géographie."},{"name":"Joseph Banks","born":1743,"died":1820,"nat":"British","fields":["botany","exploration"],"work":"Banks' Florilegium","year":1980,"sig_en":"Wealthy British botanist who sailed on Cook's Endeavour, brought back thousands of new plants, and as Royal Society president made Kew a global hub.","sig_de":"Wohlhabender britischer Botaniker, der auf Cooks Endeavour fuhr, Tausende neuer Pflanzen mitbrachte und als Präsident der Royal Society Kew zum Weltzentrum machte.","sig_fr":"Riche botaniste britannique embarqué sur l'Endeavour de Cook, il rapporta des milliers de plantes et fit de Kew, comme président de la Royal Society, un centre mondial."},{"name":"Marmaduke Tunstall","born":1743,"died":1790,"nat":"English","fields":["ornithology","zoology"],"work":"Ornithologia Britannica","year":1771,"sig_en":"English collector whose Ornithologia Britannica catalogued British birds and whose vast cabinet seeded one of the country's earliest natural history museums.","sig_de":"Englischer Sammler, dessen Ornithologia Britannica die Vögel Großbritanniens katalogisierte und dessen umfangreiche Sammlung eines der frühesten Naturkundemuseen des Landes begründete.","sig_fr":"Collectionneur anglais dont l'Ornithologia Britannica catalogua les oiseaux britanniques et dont le vaste cabinet fonda l'un des premiers musées d'histoire naturelle du pays."},{"name":"William Paley","born":1743,"died":1805,"nat":"British","fields":["ideas"],"work":"Natural Theology","year":1802,"sig_en":"Paley's watchmaker argument made adaptive design the classic proof of a Creator, the target Darwin would later overturn.","sig_de":"Paleys Uhrmacher-Argument machte die zweckmäßige Anpassung zum klassischen Gottesbeweis, den Darwin später widerlegen sollte.","sig_fr":"L'argument de l'horloger de Paley fit de l'adaptation la preuve classique d'un Créateur, cible que Darwin renverserait plus tard."},{"name":"Jean-Baptiste Lamarck","born":1744,"died":1829,"nat":"French","fields":["botany","zoology","ideas"],"work":"Flore française","year":1778,"sig_en":"French naturalist whose 'Flore française' organized the nation's plants, before he classified invertebrates and proposed the first full theory of evolution.","sig_de":"Französischer Naturforscher, dessen 'Flore française' die Pflanzen des Landes ordnete, ehe er die Wirbellosen klassifizierte und die erste vollständige Evolutionstheorie vorlegte.","sig_fr":"Naturaliste français dont la « Flore française » organisa les plantes du pays, avant qu'il ne classe les invertébrés et propose la première théorie complète de l'évolution."},{"name":"Johann Andreas Naumann","born":1744,"died":1826,"nat":"German","fields":["ornithology","art"],"work":"Naturgeschichte der Land- und Wasser-Vögel des nördlichen Deutschlands","year":1795,"sig_en":"Self-taught German farmer who wrote and etched the first comprehensive natural history of northern Germany's birds, founding a dynasty of ornithologists.","sig_de":"Autodidaktischer deutscher Landwirt, der die erste umfassende Naturgeschichte der Vögel Norddeutschlands schrieb und radierte und eine Dynastie von Ornithologen begründete.","sig_fr":"Agriculteur allemand autodidacte qui écrivit et grava la première histoire naturelle complète des oiseaux du nord de l'Allemagne, fondant une dynastie d'ornithologues."},{"name":"Johann Gottfried Herder","born":1744,"died":1803,"nat":"German","fields":["ideas"],"work":"Ideen zur Philosophie der Geschichte der Menschheit","year":1784,"sig_en":"Herder saw nature and human history as one unfolding organic process, shaping Romantic ideas of development and the unity of life.","sig_de":"Herder verstand Natur und Menschheitsgeschichte als einen sich entfaltenden organischen Prozess und prägte romantische Ideen von Entwicklung und Einheit des Lebens.","sig_fr":"Herder vit la nature et l'histoire humaine comme un même processus organique en devenir, façonnant les idées romantiques de développement et d'unité du vivant."},{"name":"Antonio José Cavanilles","born":1745,"died":1804,"nat":"Spanish","fields":["botany"],"work":"Icones et Descriptiones Plantarum","year":1791,"sig_en":"Spanish priest-botanist who directed Madrid's botanic garden and described many American plants in his finely engraved Icones et Descriptiones Plantarum.","sig_de":"Spanischer Priester und Botaniker, der Madrids Botanischen Garten leitete und viele amerikanische Pflanzen in seinen fein gestochenen Icones et Descriptiones Plantarum beschrieb.","sig_fr":"Prêtre et botaniste espagnol qui dirigea le jardin botanique de Madrid et décrivit de nombreuses plantes américaines dans ses Icones et Descriptiones Plantarum finement gravées."},{"name":"Johan Christian Fabricius","born":1745,"died":1808,"nat":"Danish","fields":["entomology","zoology"],"sig_en":"Danish student of Linnaeus who classified insects by their mouthparts and described thousands of species in 'Systema Entomologiae'.","sig_de":"Dänischer Linné-Schüler, der Insekten nach ihren Mundwerkzeugen klassifizierte und in 'Systema Entomologiae' Tausende Arten beschrieb.","sig_fr":"Élève danois de Linné qui classa les insectes d'après leurs pièces buccales et décrivit des milliers d'espèces dans « Systema Entomologiae ».","work":"Systema Entomologiae","year":1775},{"name":"Johann Christian Fabricius","born":1745,"died":1808,"nat":"Danish","fields":["entomology","zoology"],"work":"Systema Entomologiae","year":1775,"sig_en":"Danish entomologist and Linnaeus's pupil who classified insects by their mouthparts, describing thousands of species in his 'Systema Entomologiae'.","sig_de":"Dänischer Entomologe und Linné-Schüler, der Insekten nach ihren Mundwerkzeugen klassifizierte und in seiner 'Systema Entomologiae' tausende Arten beschrieb.","sig_fr":"Entomologiste danois et élève de Linné qui classa les insectes d'après leurs pièces buccales, décrivant des milliers d'espèces dans son « Systema Entomologiae »."},{"name":"Sydney Parkinson","born":1745,"died":1771,"nat":"Scottish","fields":["botany","art","exploration","zoology"],"work":"A Journal of a Voyage to the South Seas","year":1773,"sig_en":"Scottish artist on Cook's Endeavour who drew over a thousand Pacific plants before dying at sea aged twenty-six.","sig_de":"Schottischer Künstler auf Cooks Endeavour, der über tausend pazifische Pflanzen zeichnete, ehe er mit sechsundzwanzig Jahren auf See starb.","sig_fr":"Artiste écossais de l'Endeavour de Cook, il dessina plus d'un millier de plantes du Pacifique avant de mourir en mer à vingt-six ans."},{"name":"Andre Michaux","born":1746,"died":1802,"nat":"French","fields":["botany","exploration"],"sig_de":"Der franzoesische Botaniker sammelte von Persien bis Nordamerika und beschrieb posthum die Baeume und Pflanzen des amerikanischen Ostens.","sig_en":"The French botanist collected from Persia to North America and posthumously described the trees and plants of the American East.","sig_fr":"Le botaniste francais recolta de la Perse a l'Amerique du Nord et decrivit a titre posthume les arbres et plantes de l'Est americain.","work":"Flora Boreali-Americana","year":1803},{"name":"Gerard van Spaendonck","born":1746,"died":1822,"nat":"Dutch","fields":["botany","art"],"work":"Fleurs dessinées d'après nature","year":1801,"sig_en":"Master flower painter at the Muséum who taught Redoute and helped shift botanical art from gouache to watercolour on vellum.","sig_de":"Meisterhafter Blumenmaler am Muséum, der Redouté lehrte und die botanische Kunst von Gouache zum Aquarell auf Pergament wandte.","sig_fr":"Maître peintre de fleurs au Muséum qui forma Redouté et contribua à faire passer l'art botanique de la gouache à l'aquarelle sur vélin."},{"name":"William Curtis","born":1746,"died":1799,"nat":"British","fields":["botany","entomology","art"],"work":"Flora Londinensis","year":1777,"sig_en":"English botanist who documented London's wild flora and founded 'The Botanical Magazine', which brought accurate coloured plant plates to a broad public.","sig_de":"Englischer Botaniker, der Londons Wildflora dokumentierte und 'The Botanical Magazine' gründete, das genaue kolorierte Pflanzentafeln einem breiten Publikum brachte.","sig_fr":"Botaniste anglais qui documenta la flore sauvage de Londres et fonda « The Botanical Magazine », offrant des planches végétales coloriées exactes à un large public."},{"name":"Anders Sparrman","born":1748,"died":1820,"nat":"Swedish","fields":["botany","zoology","exploration","ornithology"],"work":"A Voyage to the Cape of Good Hope","year":1783,"sig_en":"Swedish naturalist and Linnaean disciple who sailed with Cook, describing the plants and animals of southern Africa and the Pacific.","sig_de":"Schwedischer Naturforscher und Linné-Schüler, der mit Cook segelte und Pflanzen und Tiere des südlichen Afrikas und des Pazifiks beschrieb.","sig_fr":"Naturaliste suédois et disciple de Linné qui navigua avec Cook, décrivant les plantes et animaux d'Afrique australe et du Pacifique."},{"name":"Antoine-Laurent de Jussieu","born":1748,"died":1836,"nat":"French","fields":["botany"],"work":"Genera Plantarum secundum ordines naturales disposita","year":1789,"sig_en":"French botanist whose 'Genera Plantarum' established the natural system of plant families that still underlies flowering-plant classification today.","sig_de":"Französischer Botaniker, dessen 'Genera Plantarum' das natürliche System der Pflanzenfamilien begründete, das der heutigen Klassifikation der Blütenpflanzen zugrunde liegt.","sig_fr":"Botaniste français dont les « Genera Plantarum » fondèrent le système naturel des familles végétales qui sous-tend encore la classification des plantes à fleurs."},{"name":"Félix Vicq d'Azyr","born":1748,"died":1794,"nat":"French","fields":["zoology","ideas"],"sig_de":"Französischer Anatom, Pionier der vergleichenden Anatomie und Neuroanatomie, der das Prinzip der anatomischen Homologie formulierte.","sig_en":"French anatomist, pioneer of comparative anatomy and neuroanatomy, who articulated the principle of anatomical homology.","sig_fr":"Anatomiste français, pionnier de l'anatomie comparée et de la neuroanatomie, qui formula le principe de l'homologie anatomique.","work":"Traité d'anatomie et de physiologie","year":1786},{"name":"Johann Friedrich Gmelin","born":1748,"died":1804,"nat":"German","fields":["zoology","botany","ornithology"],"work":"Systema Naturae (13th edition)","year":1788,"sig_en":"German naturalist who edited the expanded thirteenth edition of Linnaeus's 'Systema Naturae', incorporating thousands of newly described species.","sig_de":"Deutscher Naturforscher, der die erweiterte dreizehnte Ausgabe von Linnés 'Systema Naturae' herausgab und tausende neu beschriebener Arten aufnahm.","sig_fr":"Naturaliste allemand qui édita la treizième édition élargie du « Systema Naturae » de Linné, y intégrant des milliers d'espèces nouvellement décrites."},{"name":"Louis Jean Pierre Vieillot","born":1748,"died":1830,"nat":"French","fields":["ornithology"],"work":"Histoire naturelle des oiseaux de l'Amérique septentrionale","year":1807,"sig_en":"French ornithologist who pioneered study of living birds and their habits, describing hundreds of new species from the Americas and Africa.","sig_de":"Französischer Ornithologe, der die Erforschung lebender Vögel und ihres Verhaltens vorantrieb und Hunderte neuer Arten aus Amerika und Afrika beschrieb.","sig_fr":"Ornithologue français qui fut pionnier de l'étude des oiseaux vivants et de leurs mœurs, décrivant des centaines d'espèces nouvelles d'Amérique et d'Afrique."},{"name":"Thomas Marsham","born":1748,"died":1819,"nat":"British","fields":["entomology"],"sig_en":"English entomologist and founding Linnean Society secretary whose 'Entomologia Britannica' catalogued the beetles of Britain.","sig_de":"Englischer Entomologe und Mitbegründer der Linnean Society, dessen 'Entomologia Britannica' die Käfer Großbritanniens verzeichnete.","sig_fr":"Entomologiste anglais et secrétaire fondateur de la Linnean Society, dont « Entomologia Britannica » recensa les coléoptères britanniques.","work":"Entomologia Britannica","year":1802},{"name":"Johann Wolfgang von Goethe","born":1749,"died":1832,"nat":"German","fields":["botany","ideas","art"],"work":"Versuch die Metamorphose der Pflanzen zu erklären","year":1790,"sig_en":"Goethe founded morphology and sought the Urpflanze, the ideal archetype from which all plant forms might be derived.","sig_de":"Goethe begründete die Morphologie und suchte die Urpflanze, den idealen Archetyp, aus dem sich alle Pflanzenformen ableiten ließen.","sig_fr":"Goethe fonda la morphologie et chercha l'Urpflanze, l'archétype idéal d'où toutes les formes végétales pourraient dériver."},{"name":"Christian Konrad Sprengel","born":1750,"died":1816,"nat":"German","fields":["botany","ideas"],"work":"Das entdeckte Geheimniss der Natur im Bau und in der Befruchtung der Blumen","year":1793,"sig_en":"German theologian-botanist who first revealed how flowers are structured for insect pollination, a discovery long ignored until Darwin vindicated it.","sig_de":"Deutscher Theologe und Botaniker, der als Erster enthüllte, wie Blüten auf die Insektenbestäubung angelegt sind – lange verkannt, bis Darwin ihn bestätigte.","sig_fr":"Théologien et botaniste allemand, il révéla le premier comment les fleurs sont conçues pour la pollinisation par les insectes, découverte ignorée jusqu'à Darwin."},{"name":"René Louiche Desfontaines","born":1750,"died":1833,"nat":"French","fields":["botany","exploration"],"work":"Flora Atlantica","year":1798,"sig_en":"French botanist who explored North Africa and described its flora in Flora Atlantica, later directing the Paris botanic garden.","sig_de":"Französischer Botaniker, der Nordafrika erforschte, dessen Flora in Flora Atlantica beschrieb und später den Pariser Botanischen Garten leitete.","sig_fr":"Botaniste français qui explora l'Afrique du Nord, décrivit sa flore dans Flora Atlantica et dirigea ensuite le jardin botanique de Paris."},{"name":"John Abbot","born":1751,"died":1840,"nat":"British-American","fields":["entomology","ornithology","art","exploration"],"work":"The Natural History of the Rarer Lepidopterous Insects of Georgia","year":1797,"sig_en":"English naturalist who settled in Georgia and painted thousands of American insects and birds with their host plants.","sig_de":"Englischer Naturforscher, der sich in Georgia niederließ und tausende amerikanische Insekten und Vögel mit ihren Wirtspflanzen malte.","sig_fr":"Naturaliste anglais établi en Géorgie, il peignit des milliers d'insectes et d'oiseaux américains avec leurs plantes hôtes."},{"name":"William Roxburgh","born":1751,"died":1815,"nat":"Scottish","fields":["botany","art"],"work":"Plants of the Coast of Coromandel","year":1795,"sig_en":"Scottish surgeon called the father of Indian botany, who directed Calcutta's garden and illustrated India's flora in Plants of the Coast of Coromandel.","sig_de":"Schottischer Wundarzt, genannt Vater der indischen Botanik, der Kalkuttas Garten leitete und Indiens Flora in Plants of the Coast of Coromandel darstellte.","sig_fr":"Chirurgien écossais, dit père de la botanique indienne, il dirigea le jardin de Calcutta et illustra la flore de l'Inde dans Plants of the Coast of Coromandel."},{"name":"Johann Friedrich Blumenbach","born":1752,"died":1840,"nat":"German","fields":["zoology","ideas"],"sig_de":"Deutscher Anatom, Mitbegründer der physischen Anthropologie, der menschliche Schädel verglich und die vergleichende Morphologie prägte.","sig_en":"German anatomist, a founder of physical anthropology, who compared human skulls and shaped comparative morphology.","sig_fr":"Anatomiste allemand, fondateur de l'anthropologie physique, qui compara les crânes humains et façonna la morphologie comparée.","work":"De generis humani varietate nativa","year":1775},{"name":"François Levaillant","born":1753,"died":1824,"nat":"French","fields":["ornithology","exploration","art"],"work":"Histoire naturelle des oiseaux d'Afrique","year":1796,"sig_en":"French explorer of southern Africa whose sumptuously illustrated bird books rejected Latin names and celebrated birds observed in the wild.","sig_de":"Französischer Erforscher des südlichen Afrikas, dessen prächtig illustrierte Vogelbücher lateinische Namen ablehnten und in freier Wildbahn beobachtete Vögel feierten.","sig_fr":"Explorateur français de l'Afrique australe dont les livres d'oiseaux somptueusement illustrés rejetaient les noms latins et célébraient les oiseaux observés dans la nature."},{"name":"George Montagu","born":1753,"died":1815,"nat":"English","fields":["ornithology"],"work":"Ornithological Dictionary","year":1802,"sig_en":"English army officer whose Ornithological Dictionary clarified confused British bird names; the elegant Montagu's harrier commemorates him.","sig_de":"Englischer Offizier, dessen Ornithological Dictionary die verworrenen britischen Vogelnamen klärte; die elegante Wiesenweihe erinnert an ihn.","sig_fr":"Officier anglais dont l'Ornithological Dictionary clarifia les noms confus des oiseaux britanniques ; l'élégant busard cendré porte son nom."},{"name":"Thomas Bewick","born":1753,"died":1828,"nat":"British","fields":["ornithology","art","zoology"],"sig_de":"Englischer Holzstecher, dessen History of British Birds erlesene Illustration mit scharfer Feldbeobachtung für ein breites Publikum verband.","sig_en":"English wood-engraver whose History of British Birds combined exquisite illustration with keen field observation for a wide public.","sig_fr":"Graveur sur bois anglais dont History of British Birds allia gravure exquise et fine observation de terrain pour un large public.","work":"A History of British Birds","year":1797},{"name":"Archibald Menzies","born":1754,"died":1842,"nat":"British","fields":["botany","exploration"],"sig_de":"Der schottische Schiffsarzt sammelte auf Vancouvers Weltreise Pflanzen der Pazifikkueste und brachte die Andentanne nach Europa.","sig_en":"The Scottish ship's surgeon collected Pacific-coast plants on Vancouver's voyage and brought the monkey-puzzle tree to Europe.","sig_fr":"Le chirurgien de bord ecossais recolta les plantes de la cote pacifique lors du voyage de Vancouver et rapporta l'araucaria en Europe.","work":"Menzies' Journal of Vancouver's Voyage","year":1923},{"name":"Georg Forster","born":1754,"died":1794,"nat":"German","fields":["botany","exploration","ideas","zoology","art"],"work":"A Voyage Round the World","year":1777,"sig_en":"German naturalist and writer who, aged seventeen, joined Cook's voyage and produced a landmark scientific travelogue blending observation and philosophy.","sig_de":"Deutscher Naturforscher und Schriftsteller, der mit siebzehn Cooks Reise begleitete und einen wegweisenden wissenschaftlichen Reisebericht aus Beobachtung und Philosophie schuf.","sig_fr":"Naturaliste et écrivain allemand qui, à dix-sept ans, participa au voyage de Cook et produisit un récit scientifique majeur mêlant observation et philosophie."},{"name":"Hipolito Ruiz Lopez","born":1754,"died":1816,"nat":"Spanish","fields":["botany","exploration"],"sig_de":"Der Spanier durchforschte mit Pavon Peru und Chile und veroeffentlichte die erste grosse Flora der spanischen Anden.","sig_en":"The Spaniard explored Peru and Chile with Pavon and published the first great flora of the Spanish Andes.","sig_fr":"L'Espagnol explora le Perou et le Chili avec Pavon et publia la premiere grande flore des Andes espagnoles.","work":"Flora Peruviana et Chilensis","year":1798},{"name":"Bernard Germain de Lacépède","born":1756,"died":1825,"nat":"French","fields":["zoology"],"sig_de":"Französischer Naturforscher, der Buffons Histoire Naturelle fortführte und bedeutende Bände über Fische, Reptilien und Wale verfasste.","sig_en":"French naturalist who continued Buffon's Histoire Naturelle, producing major volumes on fishes, reptiles and cetaceans.","sig_fr":"Naturaliste français qui poursuivit l'Histoire Naturelle de Buffon, produisant d'importants volumes sur les poissons, les reptiles et les cétacés.","work":"Histoire naturelle des poissons","year":1798},{"name":"Guillaume-Antoine Olivier","born":1756,"died":1814,"nat":"French","fields":["entomology","exploration"],"sig_en":"French naturalist and traveller whose monumental illustrated 'Entomologie' focused on beetles from across the known world.","sig_de":"Französischer Naturforscher und Reisender, dessen monumentales, illustriertes 'Entomologie' Käfer aus aller Welt behandelte.","sig_fr":"Naturaliste et voyageur français dont la monumentale « Entomologie » illustrée traita les coléoptères du monde entier connu.","work":"Entomologie, ou histoire naturelle des insectes","year":1789},{"name":"Erik Acharius","born":1757,"died":1819,"nat":"Swedish","fields":["botany"],"work":"Lichenographia Universalis","year":1810,"sig_en":"Swedish botanist, Linnaeus's last pupil and father of lichenology, whose 'Lichenographia Universalis' established the systematic classification of lichens.","sig_de":"Schwedischer Botaniker, Linnés letzter Schüler und Vater der Lichenologie, dessen 'Lichenographia Universalis' die systematische Klassifikation der Flechten begründete.","sig_fr":"Botaniste suédois, dernier élève de Linné et père de la lichénologie, dont la « Lichenographia Universalis » fonda la classification systématique des lichens."},{"name":"James Sowerby","born":1757,"died":1822,"nat":"British","fields":["botany","geology","art"],"work":"English Botany","year":1790,"sig_en":"Prolific illustrator whose thousands of hand-coloured plates for English Botany brought accurate plant portraits to a wide British public.","sig_de":"Produktiver Illustrator, dessen tausende handkolorierte Tafeln für English Botany dem breiten britischen Publikum genaue Pflanzenporträts brachten.","sig_fr":"Illustrateur prolifique dont les milliers de planches coloriées à la main pour English Botany offrirent au grand public britannique des portraits botaniques exacts."},{"name":"Johann Matthäus Bechstein","born":1757,"died":1822,"nat":"German","fields":["ornithology","zoology"],"work":"Gemeinnützige Naturgeschichte Deutschlands","year":1789,"sig_en":"German forester and ornithologist whose practical natural histories and famous manual of cage birds shaped early German bird study and conservation.","sig_de":"Deutscher Forstmann und Ornithologe, dessen praktische Naturgeschichten und berühmtes Handbuch der Stubenvögel die frühe deutsche Vogelkunde und den Naturschutz prägten.","sig_fr":"Forestier et ornithologue allemand dont les histoires naturelles pratiques et le célèbre manuel des oiseaux de cage façonnèrent l'étude et la protection précoces des oiseaux allemands."},{"name":"Franz Bauer","born":1758,"died":1840,"nat":"Austrian","fields":["botany","art"],"work":"Delineations of Exotick Plants Cultivated in the Royal Garden at Kew","year":1796,"sig_en":"Austrian botanical artist, resident illustrator at Kew, whose microscopically precise drawings of exotic plants Banks prized above all others.","sig_de":"Österreichischer Pflanzenkünstler und Kew-Illustrator, dessen mikroskopisch genaue Zeichnungen exotischer Pflanzen Banks über alle anderen schätzte.","sig_fr":"Artiste botaniste autrichien, illustrateur attitré de Kew, dont les dessins d'une précision microscopique de plantes exotiques étaient les préférés de Banks."},{"name":"John Sibthorp","born":1758,"died":1796,"nat":"British","fields":["botany","exploration"],"work":"Flora Graeca","year":1806,"sig_en":"British botanist whose posthumous Flora Graeca, sumptuously illustrated by Ferdinand Bauer, remains the most costly botanical book ever made.","sig_de":"Britischer Botaniker, dessen posthume, von Ferdinand Bauer prächtig illustrierte Flora Graeca bis heute das teuerste je geschaffene botanische Buch ist.","sig_fr":"Botaniste britannique dont la Flora Graeca posthume, somptueusement illustrée par Ferdinand Bauer, reste le livre botanique le plus coûteux jamais réalisé."},{"name":"James Edward Smith","born":1759,"died":1828,"nat":"British","fields":["botany"],"work":"English Botany","year":1790,"sig_en":"English botanist who bought Linnaeus's collections and founded the Linnean Society, safeguarding the legacy of taxonomy in Britain.","sig_de":"Englischer Botaniker, der Linnés Sammlungen erwarb und die Linnean Society gründete und so das Erbe der Taxonomie in Großbritannien bewahrte.","sig_fr":"Botaniste anglais qui acheta les collections de Linné et fonda la Linnean Society, préservant l'héritage de la taxinomie en Grande-Bretagne."},{"name":"Jean-Baptiste Audebert","born":1759,"died":1800,"nat":"French","fields":["art","ornithology"],"work":"Histoire naturelle des oiseaux dorés ou à reflets métalliques","year":1802,"sig_en":"French artist who perfected gold-heightened colour printing, producing dazzling posthumous volumes on hummingbirds and other iridescent birds.","sig_de":"Französischer Künstler, der den goldgehöhten Farbdruck perfektionierte und prächtige posthume Bände über Kolibris und andere schillernde Vögel schuf.","sig_fr":"Artiste français qui perfectionna l'impression en couleurs rehaussée d'or, produisant d'éblouissants volumes posthumes sur les colibris et autres oiseaux iridescents."},{"name":"Pierre-Joseph Redouté","born":1759,"died":1840,"nat":"French","fields":["botany","art"],"work":"Les Liliacées","year":1802,"sig_en":"French flower painter, the 'Raphael of flowers', whose exquisite stipple engravings in Les Liliacées set the standard for botanical art.","sig_de":"Französischer Blumenmaler, der 'Raffael der Blumen', dessen erlesene Punktierstiche in Les Liliacées den Maßstab der botanischen Kunst setzten.","sig_fr":"Peintre de fleurs français, le « Raphaël des fleurs », dont les exquises gravures au pointillé des Liliacées fixèrent la norme de l'art botanique."},{"name":"William Kirby","born":1759,"died":1850,"nat":"British","fields":["entomology"],"sig_en":"English clergyman, 'father of entomology', who with Spence wrote the hugely popular 'Introduction to Entomology'.","sig_de":"Englischer Geistlicher, 'Vater der Entomologie', der mit Spence die höchst populäre 'Introduction to Entomology' verfasste.","sig_fr":"Ecclésiastique anglais, « père de l'entomologie », qui écrivit avec Spence la très populaire « Introduction to Entomology ».","work":"An Introduction to Entomology","year":1815},{"name":"Ferdinand Bauer","born":1760,"died":1826,"nat":"Austrian","fields":["botany","art","exploration"],"work":"Illustrationes Florae Novae Hollandiae","year":1813,"sig_en":"Austrian botanical artist who sailed to Australia with Flinders and Brown, producing luminous plates for Illustrationes Florae Novae Hollandiae.","sig_de":"Österreichischer Pflanzenkünstler, der mit Flinders und Brown nach Australien segelte und leuchtende Tafeln für Illustrationes Florae Novae Hollandiae schuf.","sig_fr":"Artiste botaniste autrichien qui accompagna Flinders et Brown en Australie, réalisant les planches lumineuses des Illustrationes Florae Novae Hollandiae."},{"name":"Olof Swartz","born":1760,"died":1818,"nat":"Swedish","fields":["botany"],"work":"Nova Genera et Species Plantarum","year":1788,"sig_en":"Swedish botanist and Linnaean who studied West Indian flora, becoming a leading authority on orchids and ferns in his 'Nova Genera et Species Plantarum'.","sig_de":"Schwedischer Botaniker und Linné-Anhänger, der die westindische Flora erforschte und in 'Nova Genera et Species Plantarum' zur führenden Autorität für Orchideen und Farne wurde.","sig_fr":"Botaniste suédois et linnéen qui étudia la flore des Antilles et devint une autorité majeure sur les orchidées et fougères dans ses « Nova Genera et Species Plantarum »."},{"name":"Sarah Stone","born":1760,"died":1844,"nat":"British","fields":["zoology","ornithology","art"],"work":"Watercolours of the Leverian Museum","year":1780,"sig_en":"Self-taught natural-history painter who recorded thousands of specimens in Ashton Lever's museum, including creatures from Cook's Pacific voyages.","sig_de":"Autodidaktische Naturkundemalerin, die tausende Exemplare in Ashton Levers Museum festhielt, darunter Tiere von Cooks Pazifikreisen.","sig_fr":"Peintre naturaliste autodidacte qui documenta des milliers de spécimens du musée d'Ashton Lever, dont des créatures des voyages de Cook dans le Pacifique."},{"name":"Christiaan Hendrik Persoon","born":1761,"died":1836,"nat":"South African","fields":["botany"],"work":"Synopsis Methodica Fungorum","year":1801,"sig_en":"South African-born mycologist who laid the foundations of fungal taxonomy in his Synopsis Methodica Fungorum while living in poverty in Paris.","sig_de":"In Südafrika geborener Mykologe, der in Armut in Paris mit seiner Synopsis Methodica Fungorum die Grundlagen der Pilzsystematik legte.","sig_fr":"Mycologue né en Afrique du Sud qui posa les bases de la taxonomie fongique dans sa Synopsis Methodica Fungorum, vivant dans la pauvreté à Paris."},{"name":"Jacob Hübner","born":1761,"died":1826,"nat":"German","fields":["entomology","art"],"sig_en":"German artist-entomologist whose great illustrated works and new genera reshaped the systematics of European and exotic Lepidoptera.","sig_de":"Deutscher Künstler-Entomologe, dessen große Bildwerke und neue Gattungen die Systematik europäischer und exotischer Schmetterlinge umgestalteten.","sig_fr":"Artiste-entomologiste allemand dont les grands ouvrages illustrés et les genres nouveaux remodelèrent la systématique des lépidoptères européens et exotiques.","work":"Sammlung europäischer Schmetterlinge","year":1796},{"name":"Kaspar Maria von Sternberg","born":1761,"died":1838,"nat":"Bohemian","fields":["botany","geology"],"work":"Versuch einer geognostisch-botanischen Darstellung der Flora der Vorwelt","year":1820,"sig_en":"Bohemian nobleman who founded palaeobotany, describing the fossil plants of the primeval world and co-founding Prague's National Museum.","sig_de":"Böhmischer Adliger, der die Paläobotanik begründete, die fossilen Pflanzen der Vorwelt beschrieb und das Prager Nationalmuseum mitbegründete.","sig_fr":"Noble bohémien qui fonda la paléobotanique, décrivit les plantes fossiles du monde primitif et cofonda le Musée national de Prague."},{"name":"Pierre André Latreille","born":1762,"died":1833,"nat":"French","fields":["entomology","zoology"],"sig_de":"Französischer Priester und Entomologe, der führende Gliederfüßer-Systematiker seiner Zeit, der die moderne Insektenklassifikation strukturierte.","sig_en":"French priest and entomologist, the leading arthropod systematist of his age, who structured modern insect classification.","sig_fr":"Prêtre et entomologiste français, principal systématicien des arthropodes de son temps, qui structura la classification moderne des insectes.","work":"Genera crustaceorum et insectorum","year":1806},{"name":"Johann Wilhelm Meigen","born":1764,"died":1845,"nat":"German","fields":["entomology"],"sig_en":"German entomologist whose multi-volume work founded the systematic study of European two-winged flies (Diptera).","sig_de":"Deutscher Entomologe, dessen mehrbändiges Werk die systematische Erforschung der europäischen Zweiflügler (Diptera) begründete.","sig_fr":"Entomologiste allemand dont l'ouvrage en plusieurs volumes fonda l'étude systématique des diptères (mouches) d'Europe.","work":"Systematische Beschreibung der bekannten europäischen zweiflügeligen Insekten","year":1818},{"name":"Carl Ludwig Willdenow","born":1765,"died":1812,"nat":"German","fields":["botany"],"work":"Species Plantarum (4th edition)","year":1797,"sig_en":"German botanist who expanded Linnaeus's 'Species Plantarum' and, as Berlin's garden director, taught and inspired the young Alexander von Humboldt.","sig_de":"Deutscher Botaniker, der Linnés 'Species Plantarum' erweiterte und als Berliner Gartendirektor den jungen Alexander von Humboldt lehrte und begeisterte.","sig_fr":"Botaniste allemand qui enrichit les « Species Plantarum » de Linné et, directeur du jardin de Berlin, forma et inspira le jeune Alexander von Humboldt."},{"name":"Alexander Wilson","born":1766,"died":1813,"nat":"American","fields":["ornithology","art"],"sig_de":"In Schottland geborener Weber und Dichter, der durch seine bahnbrechende illustrierte Übersicht zum Vater der amerikanischen Ornithologie wurde.","sig_en":"Scottish-born weaver-poet who became the father of American ornithology through his pioneering illustrated survey of the nation's birds.","sig_fr":"Tisserand et poète né en Écosse devenu le père de l'ornithologie américaine grâce à son inventaire illustré pionnier des oiseaux du pays.","work":"American Ornithology","year":1808},{"name":"Pierre Antoine Poiteau","born":1766,"died":1854,"nat":"French","fields":["botany","art","exploration"],"work":"Histoire naturelle des orangers","year":1818,"sig_en":"Botanist and painter who documented citrus and fruit trees, combining field expertise with elegant, accurate illustration.","sig_de":"Botaniker und Maler, der Zitrus- und Obstbäume dokumentierte und Feldkenntnis mit eleganter, genauer Illustration verband.","sig_fr":"Botaniste et peintre qui documenta les agrumes et arbres fruitiers, alliant expertise de terrain et illustration élégante et exacte."},{"name":"Thomas Robert Malthus","born":1766,"died":1834,"nat":"British","fields":["ideas"],"work":"An Essay on the Principle of Population","year":1798,"sig_en":"Malthus argued that populations outrun their food, a principle of struggle that independently inspired both Darwin and Wallace.","sig_de":"Malthus argumentierte, dass Bevölkerungen ihre Nahrung überflügeln, ein Prinzip des Kampfes, das Darwin und Wallace unabhängig inspirierte.","sig_fr":"Malthus soutint que les populations dépassent leurs ressources, principe de lutte qui inspira indépendamment Darwin et Wallace."},{"name":"Adrian Hardy Haworth","born":1767,"died":1833,"nat":"British","fields":["entomology","botany"],"sig_en":"English naturalist whose 'Lepidoptera Britannica' systematically described the butterflies and moths of Britain.","sig_de":"Englischer Naturforscher, dessen 'Lepidoptera Britannica' die Schmetterlinge Großbritanniens systematisch beschrieb.","sig_fr":"Naturaliste anglais dont « Lepidoptera Britannica » décrivit systématiquement les papillons de Grande-Bretagne.","work":"Lepidoptera Britannica","year":1803},{"name":"Edward Donovan","born":1768,"died":1837,"nat":"British","fields":["entomology","art","ornithology","zoology"],"sig_en":"English illustrator whose 'Natural History of British Insects' brought colourful, accessible entomology to a wide readership.","sig_de":"Englischer Illustrator, dessen 'Natural History of British Insects' eine farbenfrohe, zugängliche Entomologie einem breiten Publikum brachte.","sig_fr":"Illustrateur anglais dont « Natural History of British Insects » offrit une entomologie colorée et accessible à un large public.","work":"The Natural History of British Insects","year":1792},{"name":"Jacques Barraband","born":1768,"died":1809,"nat":"French","fields":["art","ornithology"],"work":"Histoire naturelle des perroquets","year":1801,"sig_en":"French painter whose lifelike parrots and birds of paradise, engraved for Levaillant's works, epitomise the golden age of French bird illustration.","sig_de":"Französischer Maler, dessen lebensechte Papageien und Paradiesvögel, für Levaillants Werke gestochen, das goldene Zeitalter der französischen Vogelillustration verkörpern.","sig_fr":"Peintre français dont les perroquets et paradisiers réalistes, gravés pour les ouvrages de Levaillant, incarnent l'âge d'or de l'illustration ornithologique française."},{"name":"Robert John Thornton","born":1768,"died":1837,"nat":"British","fields":["botany","art"],"work":"The Temple of Flora","year":1799,"sig_en":"Physician whose grandiose, romantic Temple of Flora set flowers against dramatic landscapes, a lavish folly that ruined him financially.","sig_de":"Arzt, dessen grandioser, romantischer Temple of Flora Blumen vor dramatische Landschaften stellte, eine prächtige Torheit, die ihn finanziell ruinierte.","sig_fr":"Médecin dont le grandiose et romantique Temple of Flora plaçait les fleurs sur des paysages spectaculaires, folie somptueuse qui le ruina financièrement."},{"name":"Sydenham Edwards","born":1768,"died":1819,"nat":"British","fields":["botany","art"],"work":"The Botanical Register","year":1815,"sig_en":"Chief artist of Curtis's Botanical Magazine for decades before founding the rival Botanical Register, drawing thousands of garden plants.","sig_de":"Jahrzehntelang Hauptkünstler von Curtis's Botanical Magazine, bevor er das konkurrierende Botanical Register gründete und tausende Gartenpflanzen zeichnete.","sig_fr":"Artiste principal du Curtis's Botanical Magazine pendant des décennies avant de fonder le rival Botanical Register, dessinant des milliers de plantes de jardin."},{"name":"Alexander von Humboldt","born":1769,"died":1859,"nat":"German","fields":["botany","geology","exploration","ideas"],"work":"Ideen zu einer Geographie der Pflanzen","year":1807,"sig_en":"Prussian polymath and founder of plant geography, whose measurements of how vegetation zones vary with altitude and climate reshaped natural science.","sig_de":"Preußischer Universalgelehrter und Begründer der Pflanzengeographie, dessen Messungen der Vegetationszonen nach Höhe und Klima die Naturwissenschaft umgestalteten.","sig_fr":"Savant prussien et fondateur de la géographie botanique, dont les mesures de la répartition de la végétation selon l'altitude et le climat transformèrent la science."},{"name":"Georges Cuvier","born":1769,"died":1832,"nat":"French","fields":["zoology","geology","ideas"],"sig_de":"Französischer Anatom, der die vergleichende Anatomie und die Wirbeltierpaläontologie begründete und das tatsächliche Aussterben von Arten bewies.","sig_en":"French anatomist who founded comparative anatomy and vertebrate palaeontology and proved that species had truly gone extinct.","sig_fr":"Anatomiste français qui fonda l'anatomie comparée et la paléontologie des vertébrés et prouva que des espèces s'étaient réellement éteintes.","work":"Le Règne Animal","year":1817},{"name":"William Smith","born":1769,"died":1839,"nat":"British","fields":["geology","ideas"],"sig_de":"Englischer Landvermesser, Vater der englischen Geologie, der Fossilien zur Schichtordnung nutzte und die erste nationale geologische Karte schuf.","sig_en":"English surveyor, 'father of English geology', who used fossils to order strata and made the first national geological map.","sig_fr":"Arpenteur anglais, père de la géologie anglaise, qui utilisa les fossiles pour ordonner les strates et dressa la première carte géologique nationale.","work":"A Delineation of the Strata of England and Wales","year":1815},{"name":"Amédée Louis Michel Lepeletier de Saint-Fargeau","born":1770,"died":1845,"nat":"French","fields":["entomology"],"sig_en":"French aristocrat-entomologist whose volumes on Hymenoptera in the Suites à Buffon organised the classification of bees and wasps.","sig_de":"Französischer Adliger und Entomologe, dessen Bände über Hymenopteren in den Suites à Buffon die Klassifikation von Bienen und Wespen ordneten.","sig_fr":"Aristocrate-entomologiste français dont les volumes sur les hyménoptères des Suites à Buffon organisèrent la classification des abeilles et guêpes.","work":"Histoire naturelle des insectes: Hyménoptères","year":1836},{"name":"Christian Rudolph Wilhelm Wiedemann","born":1770,"died":1840,"nat":"German","fields":["entomology"],"sig_en":"German zoologist who pioneered the study of non-European flies, describing much of the world's exotic Diptera.","sig_de":"Deutscher Zoologe, der die Erforschung außereuropäischer Fliegen begründete und einen Großteil der exotischen Diptera beschrieb.","sig_fr":"Zoologiste allemand pionnier de l'étude des mouches non européennes, décrivant une grande part des diptères exotiques du monde.","work":"Aussereuropäische zweiflügelige Insekten","year":1828},{"name":"Francois Andre Michaux","born":1770,"died":1855,"nat":"French","fields":["botany"],"sig_de":"Der franzoesische Botaniker setzte das Werk seines Vaters fort und beschrieb die Waldbaeume Nordamerikas in seiner Baumkunde.","sig_en":"The French botanist continued his father's work, describing North America's forest trees in his sylva.","sig_fr":"Le botaniste francais poursuivit l'oeuvre de son pere, decrivant les arbres forestiers d'Amerique du Nord dans sa sylve.","work":"Histoire des arbres forestiers de l'Amerique septentrionale","year":1810},{"name":"Charles Athanase Walckenaer","born":1771,"died":1852,"nat":"French","fields":["entomology","zoology"],"sig_en":"French savant whose 'Histoire naturelle des insectes aptères' was the first comprehensive systematic treatment of spiders.","sig_de":"Französischer Gelehrter, dessen 'Histoire naturelle des insectes aptères' die erste umfassende systematische Behandlung der Spinnen war.","sig_fr":"Savant français dont l'« Histoire naturelle des insectes aptères » fut le premier traité systématique complet des araignées.","work":"Histoire naturelle des insectes aptères","year":1837},{"name":"Jakob Sturm","born":1771,"died":1848,"nat":"German","fields":["botany","entomology","art"],"work":"Deutschlands Flora in Abbildungen","year":1798,"sig_en":"German engraver-naturalist whose pocket-sized Deutschlands Flora made finely detailed plant portraits widely available.","sig_de":"Deutscher Kupferstecher und Naturforscher, dessen handliches Deutschlands Flora fein detaillierte Pflanzenporträts weithin verfügbar machte.","sig_fr":"Graveur-naturaliste allemand dont le format de poche Deutschlands Flora rendit largement accessibles des portraits de plantes finement détaillés."},{"name":"Carl Johan Schönherr","born":1772,"died":1848,"nat":"Swedish","fields":["entomology"],"sig_en":"Swedish entomologist whose vast collaborative monograph on weevils (Curculionidae) organised one of the largest insect families.","sig_de":"Schwedischer Entomologe, dessen umfangreiche Gemeinschaftsmonographie der Rüsselkäfer (Curculionidae) eine der größten Insektenfamilien ordnete.","sig_fr":"Entomologiste suédois dont la vaste monographie collaborative sur les charançons (Curculionidae) organisa l'une des plus grandes familles d'insectes.","work":"Genera et species curculionidum","year":1833},{"name":"Pancrace Bessa","born":1772,"died":1846,"nat":"French","fields":["botany","art"],"work":"Herbier général de l'amateur","year":1810,"sig_en":"Pupil of Redoute and van Spaendonck who specialized in fruit and flowers, illustrating major French horticultural works.","sig_de":"Schüler von Redouté und van Spaendonck, der sich auf Früchte und Blumen spezialisierte und bedeutende französische Gartenbauwerke illustrierte.","sig_fr":"Élève de Redouté et van Spaendonck, spécialisé dans les fruits et fleurs, il illustra de grands ouvrages horticoles français."},{"name":"Étienne Geoffroy Saint-Hilaire","born":1772,"died":1844,"nat":"French","fields":["zoology","ideas"],"sig_de":"Französischer Anatom, der behauptete, alle Tiere teilten einen einzigen Bauplan, und sich mit Cuvier berühmt über die Homologie stritt.","sig_en":"French anatomist who argued all animals share a single structural plan, clashing famously with Cuvier over homology.","sig_fr":"Anatomiste français qui soutint que tous les animaux partagent un plan d'organisation unique, s'opposant fameusement à Cuvier sur l'homologie.","work":"Philosophie anatomique","year":1818},{"name":"Aime Bonpland","born":1773,"died":1858,"nat":"French","fields":["botany","exploration"],"sig_de":"Der franzoesische Botaniker begleitete Humboldt durch Amerika und beschrieb tausende neue Pflanzen der Tropen.","sig_en":"The French botanist accompanied Humboldt across the Americas and described thousands of new tropical plants.","sig_fr":"Le botaniste francais accompagna Humboldt a travers les Ameriques et decrivit des milliers de plantes tropicales nouvelles.","work":"Plantae Aequinoctiales","year":1808},{"name":"Robert Brown","born":1773,"died":1858,"nat":"Scottish","fields":["botany","ideas"],"work":"Prodromus Florae Novae Hollandiae","year":1810,"sig_en":"Scottish botanist who explored Australia, discovered the cell nucleus and Brownian motion, and reformed plant classification in his Prodromus.","sig_de":"Schottischer Botaniker, der Australien erforschte, den Zellkern und die Brownsche Bewegung entdeckte und die Pflanzensystematik in seinem Prodromus reformierte.","sig_fr":"Botaniste écossais qui explora l'Australie, découvrit le noyau cellulaire et le mouvement brownien, et réforma la classification végétale dans son Prodromus."},{"name":"Thomas Horsfield","born":1773,"died":1859,"nat":"American","fields":["zoology","entomology","botany","exploration"],"sig_de":"Der amerikanische Arzt erforschte Java und beschrieb dessen Saeugetiere, Voegel und Schmetterlinge fuer die Ostindische Kompanie.","sig_en":"The American physician explored Java and described its mammals, birds and butterflies for the East India Company.","sig_fr":"Le medecin americain explora Java et decrivit ses mammiferes, oiseaux et papillons pour la Compagnie des Indes orientales.","work":"Zoological Researches in Java","year":1821},{"name":"André Marie Constant Duméril","born":1774,"died":1860,"nat":"French","fields":["zoology"],"sig_de":"Französischer Zoologe, dessen neunbändige Erpétologie générale mit Bibron das grundlegende Referenzwerk über Reptilien und Amphibien blieb.","sig_en":"French zoologist whose nine-volume Erpétologie générale, with Bibron, remained the foundational reference on reptiles and amphibians.","sig_fr":"Zoologiste français dont l'Erpétologie générale en neuf volumes, avec Bibron, demeura la référence fondatrice sur les reptiles et amphibiens.","work":"Erpétologie générale","year":1834},{"name":"Frederick Traugott Pursh","born":1774,"died":1820,"nat":"German-American","fields":["botany"],"work":"Flora Americae Septentrionalis","year":1814,"sig_en":"German-American botanist who described the plants collected by the Lewis and Clark expedition in his Flora Americae Septentrionalis.","sig_de":"Deutsch-amerikanischer Botaniker, der die von der Lewis-und-Clark-Expedition gesammelten Pflanzen in seiner Flora Americae Septentrionalis beschrieb.","sig_fr":"Botaniste germano-américain qui décrivit les plantes récoltées par l'expédition de Lewis et Clark dans sa Flora Americae Septentrionalis."},{"name":"Georg Heinrich von Langsdorff","born":1774,"died":1852,"nat":"German","fields":["exploration","zoology"],"sig_de":"Der deutsch-russische Arzt umsegelte mit Krusenstern die Welt und fuehrte spaeter eine folgenreiche Expedition ins Innere Brasiliens.","sig_en":"The German-Russian physician circumnavigated with Krusenstern and later led a consequential expedition into the Brazilian interior.","sig_fr":"Le medecin germano-russe fit le tour du monde avec Krusenstern puis mena une expedition marquante a l'interieur du Bresil.","work":"Bemerkungen auf einer Reise um die Welt","year":1812},{"name":"Friedrich Schelling","born":1775,"died":1854,"nat":"German","fields":["ideas"],"work":"Ideen zu einer Philosophie der Natur","year":1797,"sig_en":"Schelling's Naturphilosophie envisioned nature as one living, polar, self-developing whole, inspiring Romantic biology and morphology.","sig_de":"Schellings Naturphilosophie deutete die Natur als ein lebendiges, polares, sich selbst entwickelndes Ganzes und inspirierte die romantische Biologie und Morphologie.","sig_fr":"La Naturphilosophie de Schelling conçut la nature comme un tout vivant, polaire et s'auto-développant, inspirant la biologie et la morphologie romantiques."},{"name":"Jean Guillaume Audinet-Serville","born":1775,"died":1858,"nat":"French","fields":["entomology"],"sig_en":"French entomologist whose work on Orthoptera established the classification of grasshoppers, crickets and their kin.","sig_de":"Französischer Entomologe, dessen Werk über Orthopteren die Klassifikation von Heuschrecken, Grillen und Verwandten begründete.","sig_fr":"Entomologiste français dont les travaux sur les orthoptères établirent la classification des sauterelles, grillons et apparentés.","work":"Histoire naturelle des insectes: Orthoptères","year":1839},{"name":"Johann Karl Wilhelm Illiger","born":1775,"died":1813,"nat":"German","fields":["zoology","ornithology"],"work":"Prodromus systematis mammalium et avium","year":1811,"sig_en":"German zoologist and first curator of Berlin's museum whose Prodromus erected many enduring genera of mammals and birds.","sig_de":"Deutscher Zoologe und erster Kustos des Berliner Museums, dessen Prodromus viele bis heute gültige Gattungen von Säugetieren und Vögeln aufstellte.","sig_fr":"Zoologiste allemand et premier conservateur du musée de Berlin dont le Prodromus érigea de nombreux genres durables de mammifères et d'oiseaux."},{"name":"Pierre Jean François Turpin","born":1775,"died":1840,"nat":"French","fields":["botany","art"],"work":"Flore médicale","year":1814,"sig_en":"Self-taught botanical artist, called the finest of his age in France, who illustrated medical and horticultural floras with scientific insight.","sig_de":"Autodidaktischer botanischer Künstler, in Frankreich als der beste seiner Zeit gerühmt, der medizinische und gärtnerische Floren mit wissenschaftlichem Verständnis illustrierte.","sig_fr":"Artiste botaniste autodidacte, réputé le meilleur de son temps en France, qui illustra des flores médicales et horticoles avec une intelligence scientifique."},{"name":"Henri Marie Ducrotay de Blainville","born":1777,"died":1850,"nat":"French","fields":["zoology"],"sig_de":"Französischer Zoologe und vergleichender Anatom, der die Tierklassifikation reformierte und einen monumentalen osteologischen Atlas der Säugetiere schuf.","sig_en":"French zoologist and comparative anatomist who reformed animal classification and produced a monumental osteological atlas of mammals.","sig_fr":"Zoologiste et anatomiste comparatiste français qui réforma la classification animale et réalisa un atlas ostéologique monumental des mammifères.","work":"Ostéographie","year":1839},{"name":"Augustin-Pyramus de Candolle","born":1778,"died":1841,"nat":"Swiss","fields":["botany","ideas"],"work":"Prodromus Systematis Naturalis Regni Vegetabilis","year":1824,"sig_en":"Swiss botanist whose 'natural system' and monumental Prodromus sought to describe every known seed plant, and who coined the term taxonomy.","sig_de":"Schweizer Botaniker, dessen 'natürliches System' und monumentaler Prodromus jede bekannte Samenpflanze zu beschreiben suchte und den Begriff Taxonomie prägte.","sig_fr":"Botaniste suisse dont le « système naturel » et le monumental Prodromus visaient à décrire toute plante à graines connue, forgeant le mot taxonomie."},{"name":"Charles Alexandre Lesueur","born":1778,"died":1846,"nat":"French","fields":["zoology","art","exploration"],"work":"Voyage de découvertes aux terres australes","year":1807,"sig_en":"Artist on the Baudin expedition to Australia who produced thousands of precise drawings of marine animals and coastlines.","sig_de":"Künstler der Baudin-Expedition nach Australien, der tausende präzise Zeichnungen von Meerestieren und Küsten anfertigte.","sig_fr":"Artiste de l'expédition Baudin en Australie, il réalisa des milliers de dessins précis d'animaux marins et de côtes."},{"name":"Coenraad Jacob Temminck","born":1778,"died":1858,"nat":"Dutch","fields":["ornithology","zoology","art"],"sig_de":"Niederländischer Ornithologe und erster Direktor des Leidener Naturkundemuseums, dessen Farbtafelwerke die Vögel der Welt katalogisierten.","sig_en":"Dutch ornithologist and first director of Leiden's natural history museum, whose colour-plate works catalogued the world's birds.","sig_fr":"Ornithologue néerlandais et premier directeur du muséum de Leyde, dont les ouvrages à planches coloriées cataloguèrent les oiseaux du monde.","work":"Nouveau recueil de planches coloriées d'oiseaux","year":1820},{"name":"Auguste de Saint-Hilaire","born":1779,"died":1853,"nat":"French","fields":["botany","exploration"],"sig_de":"Der franzoesische Botaniker durchreiste sechs Jahre Brasilien und beschrieb dessen suedliche Flora sowie Sitten und Landschaften.","sig_en":"The French botanist traveled Brazil for six years, describing its southern flora as well as customs and landscapes.","sig_fr":"Le botaniste francais parcourut le Bresil six ans, decrivant sa flore meridionale ainsi que les moeurs et les paysages.","work":"Flora Brasiliae Meridionalis","year":1825},{"name":"Lorenz Oken","born":1779,"died":1851,"nat":"German","fields":["zoology","ideas"],"work":"Lehrbuch der Naturphilosophie","year":1809,"sig_en":"Oken, a leading Naturphilosoph, sought nature's unity in bold analogies, proposing that the skull is made of transformed vertebrae.","sig_de":"Oken, ein führender Naturphilosoph, suchte die Einheit der Natur in kühnen Analogien und deutete den Schädel als umgebildete Wirbel.","sig_fr":"Oken, éminent Naturphilosoph, chercha l'unité de la nature dans d'audacieuses analogies, proposant que le crâne soit formé de vertèbres transformées."},{"name":"William Hooker (fruit painter)","born":1779,"died":1832,"nat":"British","fields":["botany","art"],"work":"Pomona Londinensis","year":1818,"sig_en":"Skilled fruit painter whose Pomona Londinensis set a high standard for depicting British apples, pears and other cultivated varieties.","sig_de":"Geschickter Obstmaler, dessen Pomona Londinensis einen hohen Maßstab für die Darstellung britischer Äpfel, Birnen und anderer Kultursorten setzte.","sig_fr":"Peintre de fruits talentueux dont la Pomona Londinensis fixa un haut standard pour représenter pommes, poires et autres variétés cultivées britanniques."},{"name":"Johann Friedrich Naumann","born":1780,"died":1857,"nat":"German","fields":["ornithology","art"],"work":"Naturgeschichte der Vögel Deutschlands","year":1820,"sig_en":"The 'father of scientific ornithology in Germany', whose superbly illustrated Naturgeschichte der Vögel Deutschlands remained authoritative for a century.","sig_de":"Der 'Vater der wissenschaftlichen Ornithologie in Deutschland', dessen hervorragend illustrierte Naturgeschichte der Vögel Deutschlands ein Jahrhundert lang maßgeblich blieb.","sig_fr":"Le « père de l'ornithologie scientifique en Allemagne », dont la Naturgeschichte der Vögel Deutschlands superbement illustrée fit autorité pendant un siècle."},{"name":"Maximilian Spinola","born":1780,"died":1857,"nat":"Italian","fields":["entomology"],"sig_en":"Italian nobleman-entomologist who described numerous beetles and other insects, contributing to Ligurian and world entomology.","sig_de":"Italienischer Adliger und Entomologe, der zahlreiche Käfer und andere Insekten beschrieb und zur ligurischen und globalen Entomologie beitrug.","sig_fr":"Noble entomologiste italien qui décrivit de nombreux coléoptères et autres insectes, contribuant à l'entomologie ligure et mondiale.","work":"Insectorum Liguriae species novae","year":1806},{"name":"Pierre François Marie Auguste Dejean","born":1780,"died":1845,"nat":"French","fields":["entomology"],"sig_en":"Napoleonic general and passionate collector whose 'Species général des coléoptères' described a huge share of known beetles.","sig_de":"Napoleonischer General und leidenschaftlicher Sammler, dessen 'Species général des coléoptères' einen großen Teil der bekannten Käfer beschrieb.","sig_fr":"Général napoléonien et collectionneur passionné dont le « Species général des coléoptères » décrivit une immense part des coléoptères connus.","work":"Species général des coléoptères","year":1825},{"name":"Adelbert von Chamisso","born":1781,"died":1838,"nat":"German","fields":["botany","zoology","exploration","ideas"],"sig_de":"Der deutsch-franzoesische Dichter und Botaniker umsegelte auf der Rurik die Welt und entdeckte den Generationswechsel der Salpen.","sig_en":"The German-French poet and botanist circled the world on the Rurik and discovered the alternation of generations in salps.","sig_fr":"Le poete et botaniste franco-allemand fit le tour du monde sur le Rurik et decouvrit l'alternance des generations chez les salpes.","work":"Reise um die Welt","year":1836},{"name":"Johann Baptist von Spix","born":1781,"died":1826,"nat":"German","fields":["zoology","exploration","ornithology"],"sig_de":"Deutscher Zoologe, dessen brasilianische Expedition mit Martius reiche Sammlungen von Affen, Fledermäusen, Reptilien und Vögeln erbrachte.","sig_en":"German zoologist whose Brazilian expedition with Martius yielded rich collections of monkeys, bats, reptiles and birds.","sig_fr":"Zoologiste allemand dont l'expédition brésilienne avec Martius livra de riches collections de singes, chauves-souris, reptiles et oiseaux.","work":"Simiarum et Vespertilionum Brasiliensium species novae","year":1823},{"name":"Pauline Knip","born":1781,"died":1851,"nat":"French","fields":["art","ornithology"],"work":"Les Pigeons","year":1811,"sig_en":"French court painter, one of few women bird artists of her age, whose luminous plates of pigeons rivalled the finest ornithological art.","sig_de":"Französische Hofmalerin, eine der wenigen Vogelkünstlerinnen ihrer Zeit, deren leuchtende Tafeln von Tauben die feinste ornithologische Kunst erreichten.","sig_fr":"Peintre de cour française, l'une des rares femmes peintres d'oiseaux de son époque, dont les planches lumineuses de pigeons rivalisaient avec le meilleur art ornithologique."},{"name":"William John Burchell","born":1781,"died":1863,"nat":"British","fields":["botany","zoology","exploration"],"sig_de":"Der englische Naturforscher durchquerte das suedliche Afrika und spaeter Brasilien und brachte ueber fuenfzigtausend Naturobjekte heim.","sig_en" t les expéditions au Brésil et dans les plaines nord-américaines livrèrent de riches descriptions d'oiseaux et de peuples autochtones."},{"name":"Constantine Samuel Rafinesque","born":1783,"died":1840,"nat":"American","fields":["zoology","botany"],"sig_de":"Exzentrischer, produktiver französisch-amerikanischer Naturforscher, der in den jungen USA zahllose Pflanzen, Fische und Tiere benannte.","sig_en":"Eccentric, prolific French-American naturalist who named countless plants, fishes and animals across the young United States.","sig_fr":"Naturaliste franco-américain excentrique et prolifique qui nomma d'innombrables plantes, poissons et animaux dans les jeunes États-Unis.","work":"Ichthyologia Ohiensis","year":1820},{"name":"William Spence","born":1783,"died":1860,"nat":"British","fields":["entomology"],"sig_en":"English economist and naturalist who co-authored the classic 'Introduction to Entomology', shaping the science for generations.","sig_de":"Englischer Ökonom und Naturforscher, Mitautor der klassischen 'Introduction to Entomology', die die Wissenschaft über Generationen prägte.","sig_fr":"Économiste et naturaliste anglais, coauteur du classique « Introduction to Entomology », qui marqua la science pour des générations.","work":"An Introduction to Entomology","year":1815},{"name":"William Buckland","born":1784,"died":1856,"nat":"British","fields":["geology"],"sig_de":"Englischer Geologe, der Megalosaurus, den ersten Dinosaurier, benannte und die Erforschung fossiler Höhlen und Koprolithen begründete.","sig_en":"English geologist who named Megalosaurus, the first dinosaur, and pioneered the study of fossil caves and coprolites.","sig_fr":"Géologue anglais qui nomma le Megalosaurus, premier dinosaure, et fut pionnier de l'étude des grottes fossilifères et des coprolithes.","work":"Reliquiae Diluvianae","year":1823},{"name":"William Yarrell","born":1784,"died":1856,"nat":"English","fields":["ornithology","zoology"],"work":"A History of British Birds","year":1843,"sig_en":"English bookseller-naturalist whose accessible, well-illustrated History of British Birds became the most popular Victorian handbook of its kind.","sig_de":"Englischer Buchhändler und Naturforscher, dessen zugängliche, gut illustrierte History of British Birds das beliebteste viktorianische Handbuch seiner Art wurde.","sig_fr":"Libraire-naturaliste anglais dont l'History of British Birds, accessible et bien illustrée, devint le manuel victorien le plus populaire de son genre."},{"name":"John James Audubon","born":1785,"died":1851,"nat":"American","fields":["ornithology","art","zoology","exploration"],"sig_de":"In Frankreich geborener amerikanischer Künstler-Naturforscher, dessen lebensgroßes Birds of America das berühmteste ornithologische Werk aller Zeiten ist.","sig_en":"French-born American artist-naturalist whose life-size Birds of America is the most celebrated ornithological work ever produced.","sig_fr":"Artiste-naturaliste américain né en France dont Birds of America, grandeur nature, est l'ouvrage ornithologique le plus célèbre jamais réalisé.","work":"The Birds of America","year":1827},{"name":"William Jackson Hooker","born":1785,"died":1865,"nat":"British","fields":["botany"],"work":"Species Filicum","year":1846,"sig_en":"British botanist, fern specialist and first director of Kew Gardens, whose Species Filicum and prolific writings built the empire's greatest herbarium.","sig_de":"Britischer Botaniker, Farnspezialist und erster Direktor von Kew, dessen Species Filicum und reiche Schriften das größte Herbarium des Empires begründeten.","sig_fr":"Botaniste britannique, spécialiste des fougères et premier directeur de Kew, dont Species Filicum et ses nombreux écrits bâtirent le plus grand herbier de l'empire."},{"name":"Nathaniel Wallich","born":1786,"died":1854,"nat":"Danish","fields":["botany","exploration"],"work":"Plantae Asiaticae Rariores","year":1830,"sig_en":"Danish surgeon-botanist who directed Calcutta's botanic garden and distributed thousands of Himalayan and Indian species through his lavish Plantae Asiaticae Rariores.","sig_de":"Dänischer Wundarzt und Botaniker, der Kalkuttas Botanischen Garten leitete und Tausende himalayischer und indischer Arten durch seine prächtigen Plantae Asiaticae Rariores verbreitete.","sig_fr":"Chirurgien-botaniste danois, directeur du jardin botanique de Calcutta, il diffusa des milliers d'espèces himalayennes et indiennes dans ses somptueuses Plantae Asiaticae Rariores."},{"name":"Thomas Nuttall","born":1786,"died":1859,"nat":"British-American","fields":["botany","ornithology","exploration"],"work":"The Genera of North American Plants","year":1818,"sig_en":"English-American botanist and ornithologist who traversed the young United States, naming countless western plants in his Genera of North American Plants.","sig_de":"Englisch-amerikanischer Botaniker und Ornithologe, der die junge USA durchquerte und in seinen Genera of North American Plants zahllose Westpflanzen benannte.","sig_fr":"Botaniste et ornithologue anglo-américain qui parcourut les jeunes États-Unis, nommant d'innombrables plantes de l'Ouest dans ses Genera of North American Plants."},{"name":"Christian Ludwig Brehm","born":1787,"died":1864,"nat":"German","fields":["ornithology"],"work":"Handbuch der Naturgeschichte aller Vögel Deutschlands","year":1831,"sig_en":"German pastor and 'father of German bird study' whose enormous private collection and handbook advanced the systematics of European birds.","sig_de":"Deutscher Pfarrer und 'Vater der deutschen Vogelkunde', dessen riesige Privatsammlung und Handbuch die Systematik der europäischen Vögel voranbrachten.","sig_fr":"Pasteur allemand et « père de l'étude des oiseaux allemands » dont l'énorme collection privée et le manuel firent progresser la systématique des oiseaux européens."},{"name":"John Richardson","born":1787,"died":1865,"nat":"Scottish","fields":["zoology","exploration","ornithology"],"sig_de":"Schottischer Marinechirurg und Arktisforscher,
