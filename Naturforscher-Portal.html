gny (Viosne River), France","town":"Vigny","river":"Viosne River","country":"France","field":"Botany"},"Stephen Hales":{"hook":"The first person to measure sap pressure in plants and blood pressure in animals! He proved that plants absorb air and water moves continuously up through their stems.","birth":"Bekesbourne (River Stour), England","town":"Bekesbourne","river":"River Stour","country":"England","field":"Plant Physiology"},"Pier Antonio Micheli":{"hook":"The \"Father of Modern Mycology\"! He proved that mushrooms don't spontaneously appear out of nowhere by being the first person to catch microscopic mushroom spores germinating under a lens!","birth":"Florence (Arno River), Italy","town":"Florence","river":"Arno River","country":"Italy","field":"Mycology"},"Mark Catesby":{"hook":"Braved pirates and hurricanes to explore North America in the 1700s, drawing the very first complete, epic book of American birds, snakes, frogs, and plants!","birth":"Castle Hedingham (River Colne), England","town":"Castle Hedingham","river":"River Colne","country":"England","field":"Natural History Illustration"},"René Antoine Ferchault de Réaumur":{"hook":"Invented a temperature scale and wrote a massive 6-volume insect masterpiece proving that ants communicate and bees work together in complex social kingdoms!","birth":"La Rochelle (Atlantic Ocean (Coastal)), France","town":"La Rochelle","river":"Atlantic Ocean (Coastal)","country":"France","field":"Entomology & Physics"},"Johann Jacob Dillenius":{"hook":"First Sherardian Professor of Botany at Oxford, known for his masterful, exquisitely illustrated work on mosses and lower plants, *Historia Muscorum*.","birth":"Darmstadt (Darmbach River), Germany","town":"Darmstadt","river":"Darmbach River","country":"Germany","field":"Botany"},"Cadwallader Colden":{"hook":"One of the first European-American scientists to adopt Linnaeus's plant naming system in North America, meticulously cataloging the native plant life of colonial New York.","birth":"Duns, Scotland","town":"Duns","river":null,"country":"Scotland","field":null},"Philip Miller":{"hook":"Master gardener of Chelsea Physic Garden! He shipped the very first cotton seeds to the American colony of Georgia and taught Europeans how to safely grow and eat mysterious tropical tomatoes!","birth":"Deptford (London) (River Thames), England","town":"Deptford (London)","river":"River Thames","country":"England","field":"Horticulture & Botany"},"George Edwards":{"hook":"Known as the \"Father of British Ornithology,\" he published works illustrating hundreds of previously undescribed bird species.","birth":"Stratford (River Lea), England","town":"Stratford","river":"River Lea","country":"England","field":"Ornithology & Illustration"},"Bernard de Jussieu":{"hook":"A French botanist who arranged the Royal Garden at Trianon by grouping living plants into natural families based on physical relationships rather than arbitrary lists.","birth":"Lyon, France","town":"Lyon","river":null,"country":"France","field":null},"John Bartram":{"hook":"Known as the \"Father of American Botany.\" He founded the oldest surviving botanical garden in North America and tirelessly sent seeds back to eager European scientists.","birth":"Darby (Delaware River), USA","town":"Darby","river":"Delaware River","country":"USA","field":"Botany & Exploration"},"Charles Marie de La Condamine":{"hook":"An explorer who measured the shape of Earth at the equator and introduced natural rubber (caoutchouc) and quinine (malaria medicine) from South America to Europe.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Madeleine Françoise Basseporte":{"hook":"A totally trailblazing female artist who became the official painter for the King of France, painting hyper-accurate scientific plants and teaching the royal princesses how to draw!","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Botanical Art"},"August Johann Rösel von Rosenhof":{"hook":"A miniature painter turned insect enthusiast who used delicate artwork to capture the life cycles and metamorphoses of frogs, insects, and reptiles with stunning microscopic detail.","birth":"Arnstadt, Germany","town":"Arnstadt","river":null,"country":"Germany","field":null},"Georg Wolfgang Knorr":{"hook":"German engraver whose beautifully illustrated books on fossils and shells set new visual standards in natural science documentation.","birth":"Nuremberg (Pegnitz River), Germany","town":"Nuremberg","river":"Pegnitz River","country":"Germany","field":"Paleontology & Engraving"},"Carl Linnaeus":{"hook":"The \"father of modern taxonomy\" who invented binomial nomenclature—the two-word Latin naming system (like *Homo sapiens*) that scientists worldwide still use to name every living thing!","birth":"Råshult, Sweden","town":"Råshult","river":null,"country":"Sweden","field":null},"Elizabeth Blackwell":{"hook":"Scottish illustrator who drew, engraved, and hand-colored *A Curious Herbal*—a crucial reference for medicinal plants—to secure her husband's release from debtor's prison.","birth":"Aberdeen (River Dee), Scotland","town":"Aberdeen","river":"River Dee","country":"Scotland","field":"Botanical Illustration"},"Georges-Louis Leclerc de Buffon":{"hook":"Authored the monumental 36-volume *Histoire Naturelle*, transforming natural history into a major public science.","birth":"Montbard (Brenne River), France","town":"Montbard","river":"Brenne River","country":"France","field":"Natural History & Philosophy"},"Georges-Louis Leclerc, Comte de Buffon":{"hook":"Authored the monumental 36-volume *Histoire Naturelle*, transforming natural history into a major public science.","birth":"Montbard (Brenne River), France","town":"Montbard","river":"Brenne River","country":"France","field":"Natural History & Philosophy"},"Johannes Burman":{"hook":"Dutch botanist and friend to Linnaeus. He published extensively on the flora of Ceylon (Sri Lanka) and South Africa, bringing global exotic plants to European science.","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Botany"},"Albrecht von Haller":{"hook":"A child prodigy who wrote poems and learned multiple languages before age ten, Haller became the father of modern physiology. He performed clever experiments on animal tissues to prove that nerves are what carry pain and sensation to the brain, while muscles are what actually contract to create movement.","birth":"Bern, Switzerland","town":"Bern","river":null,"country":"Switzerland","field":null},"Georg Dionysius Ehret":{"hook":"Dominant botanical artist of the 18th century, renowned for scientific accuracy and collaboration with Carl Linnaeus and Hans Sloane.","birth":"Heidelberg (Neckar River), Germany","town":"Heidelberg","river":"Neckar River","country":"Germany","field":"Botanical Illustration"},"Carl Alexander Clerck":{"hook":"An arachnologist who published the groundbreaking book *Aranei Svecici*, creating the world's very first scientific naming guide for spiders.","birth":"Stockholm, Sweden","town":"Stockholm","river":null,"country":"Sweden","field":null},"Carl Clerck":{"hook":"A close friend of Linnaeus who turned his backyard into an insect lab, accurately classifying Swedish spiders and butterflies into unified scientific groupings.","birth":"Stockholm, Sweden","town":"Stockholm","river":null,"country":"Sweden","field":null},"Georg Wilhelm Steller":{"hook":"Pioneer natural scientist on the Bering Expedition; documented the ecology of Alaska and left his name on species like Steller's sea cow.","birth":"Windsheim (Aisch River), Germany","town":"Windsheim","river":"Aisch River","country":"Germany","field":"Zoology & Exploration"},"Johann Georg Gmelin":{"hook":"Conducted a historic decade-long exploration of Siberia, publishing the landmark *Flora Sibirica* and advancing the study of permafrost.","birth":"Tübingen (Neckar River), Germany","town":"Tübingen","river":"Neckar River","country":"Germany","field":"Botany & Geography"},"Abraham Trembley":{"hook":"Trembley discovered the Hydra, a microscopic freshwater creature, and proved it could regenerate from tiny cut pieces—a mind-blowing revelation that blurred the line between plants and animals! Deeply patient and endlessly curious, he built his own magnifying lenses and conducted wild backyard experiments, essentially inventing experimental biology.","birth":"Geneva, Switzerland","town":"Geneva","river":null,"country":"Switzerland","field":null},"Stepan Krasheninnikov":{"hook":"Braved freezing Arctic conditions during the Great Northern Expedition to write the very first detailed scientific account of the volcanoes, wildlife, and people of Kamchatka!","birth":"Moscow (Moskva River), Russia","town":"Moscow","river":"Moskva River","country":"Russia","field":"Geography & Natural History"},"John Miller":{"hook":"Born Johann Sebastian Müller, he created some of the most exact and beautiful botanical engravings of the 18th century, actively endorsed by Carl Linnaeus himself.","birth":"Nuremberg (Pegnitz River), Germany","town":"Nuremberg","river":"Pegnitz River","country":"Germany","field":"Botanical Illustration"},"Pehr Kalm":{"hook":"Sailed to the wild frontiers of North America, wrote the very first scientific description of Niagara Falls, and brought epic plants like the mountain laurel back to Europe!","birth":"Ångermanland (Ångermanälven), Sweden","town":"Ångermanland","river":"Ångermanälven","country":"Sweden","field":"Botany & Exploration"},"Peter Kalm":{"hook":"The English form of Swedish explorer Pehr Kalm! He trekked through the North American wilderness, wrote one of the earliest eyewitness accounts of Niagara Falls, and packed hundreds of American seeds home to Europe.","birth":"Ångermanland (Ångermanälven River), Sweden","town":"Ångermanland","river":"Ångermanälven River","country":"Sweden","field":"Botany & Exploration"},"Charles Bonnet":{"hook":"Discovered **parthenogenesis** (virgin birth in animals) by observing that female aphids could reproduce without mating, challenging centuries of biological assumptions!","birth":"Geneva, Switzerland","town":"Geneva","river":null,"country":"Switzerland","field":null},"Charles De Geer":{"hook":"A Swedish industrialist and entomologist who produced a legendary 7-volume study detailing insect anatomy, reproduction, and developmental lifecycles.","birth":"Finspång, Sweden","town":"Finspång","river":null,"country":"Sweden","field":null},"Gilbert White":{"hook":"Author of *The Natural History and Antiquities of Selborne*, an early masterpiece of localized natural history and observational ecology.","birth":"Selborne (River Wey), England","town":"Selborne","river":"River Wey","country":"England","field":"Ecology & Ornithology"},"Patrick Browne":{"hook":"An Irish doctor who braved the tropical jungles of Jamaica in the 1700s to write a massive, definitive book on every weird, wild, and medicinal plant he could find!","birth":"Woodstock (River Robe), Ireland","town":"Woodstock","river":"River Robe","country":"Ireland","field":"Botany & Medicine"},"Pieter Cramer":{"hook":"A wealthy Dutch merchant who poured his immense fortune into building a world-famous collection of vivid, exotic butterflies and moths shipped in from tropical colonies across the globe!","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Entomology"},"Fredric Hasselquist":{"hook":"A pupil of Carl Linnaeus who undertook early scientific journeys to Palestine and Egypt to catalog Middle Eastern flora and fauna.","birth":"Törnevalla (Stångån River), Sweden","town":"Törnevalla","river":"Stångån River","country":"Sweden","field":"Botany & Natural History"},"Giovanni Antonio Scopoli":{"hook":"Early Tyrolean naturalist who applied Linnaean taxonomy to the flora, fauna, and insects of the Alpine region.","birth":"Cavalese (Avisio River), Italy","town":"Cavalese","river":"Avisio River","country":"Italy","field":"Entomology & Botany"},"Marcus Elieser Bloch":{"hook":"A doctor who became completely obsessed with fish! He created a massive, spectacular encyclopedia with giant, shiny, hand-colored illustrations of almost every fish known to science!","birth":"Ansbach (Fränkische Rezat), Germany","town":"Ansbach","river":"Fränkische Rezat","country":"Germany","field":"Ichthyology (Fish)"},"Mathurin Jacques Brisson":{"hook":"A science superstar who first cataloged thousands of birds and mammals in extreme detail, then casually switched careers to physics to translate the natural world into pure math!","birth":"Fontenay-le-Comte (Vendée River), France","town":"Fontenay-le-Comte","river":"Vendée River","country":"France","field":"Zoology & Physics"},"Pehr Osbeck":{"hook":"Traveled all the way to China in the 1700s, surviving mega-storms and pirates, just to catalog over 600 weird and wonderful Asian plants and animals for science!","birth":"Oland Parish (Fyris River (nearby)), Sweden","town":"Oland Parish","river":"Fyris River (nearby)","country":"Sweden","field":"Exploration & Biology"},"Dru Drury":{"hook":"Prominent English silversmith and entomologist who amassed one of the largest insect collections of his time, publishing the lavishly illustrated *Illustrations of Natural History*.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Immanuel Kant":{"hook":"One of history's most important philosophers. He also proposed the nebular hypothesis, explaining the formation of the solar system.","birth":"Königsberg (Pregel River), Germany","town":"Königsberg","river":"Pregel River","country":"Germany","field":"Philosophy & Natural Science"},"Étienne Louis Geoffroy":{"hook":"A French apothecary and bug pioneer who wrote one of the very first comprehensive, highly organized catalog guides detailing all the insect species crawling around Paris!","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Entomology & Pharmacy"},"James Hutton":{"hook":"Known as the \"Father of Modern Geology.\" He revolutionized science by proving the earth's crust was shaped by slow processes over \"deep time.\"","birth":"Edinburgh (Water of Leith), Scotland","town":"Edinburgh","river":"Water of Leith","country":"Scotland","field":"Geology"},"Thomas Pennant":{"hook":"Leading Welsh naturalist whose giant, beautifully illustrated zoology books were massive bestsellers that inspired generations of wildlife observers and Charles Darwin himself!","birth":"Whitford (River Dee), Wales","town":"Whitford","river":"River Dee","country":"Wales","field":"Zoology & Travel Writing"},"Ignaz Schiffermüller":{"hook":"Austrian naturalist who cataloged the butterflies of the Vienna region and developed one of the earliest standardized biological color systems.","birth":"Hellmonsödt (Danube River), Austria","town":"Hellmonsödt","river":"Danube River","country":"Austria","field":"Entomology"},"Michel Adanson":{"hook":"Traveled to the heat of Senegal, studied the massive, bizarre Baobab tree (now scientifically named *Adansonia* after him!), and created a whole new system to organize all plants on Earth!","birth":"Aix-en-Provence (Arc River), France","town":"Aix-en-Provence","river":"Arc River","country":"France","field":"Botany & Exploration"},"Nikolaus Joseph von Jacquin":{"hook":"The Holy Roman Emperor personally ordered him to sail to the pirate-infested Caribbean just to grab hundreds of wild, tropical plants to decorate the royal palaces of Vienna!","birth":"Leiden (Oude Rijn), Netherlands","town":"Leiden","river":"Oude Rijn","country":"Netherlands","field":"Botany & Chemistry"},"Carlo Allioni":{"hook":"An Italian physician and botanist who published *Flora Pedemontana*, a masterwork describing over 2,800 alpine plant species native to northwestern Italy.","birth":"Turin, Italy","town":"Turin","river":null,"country":"Italy","field":null},"Georg Christian Oeder":{"hook":"Founder and original editor of *Flora Danica*, a monumental botanical atlas detailing all plants native to the Danish crown lands.","birth":"Ansbach (Rezat River), Germany","town":"Ansbach","river":"Rezat River","country":"Germany","field":"Botany"},"John Hunter":{"hook":"Revolutionized surgery by demanding a scientific basis for medicine, amassing an incredible anatomical collection that formed the Hunterian Museum.","birth":"East Kilbride (River Clyde), Scotland","town":"East Kilbride","river":"River Clyde","country":"Scotland","field":"Anatomy & Surgery"},"Johann Reinhold Forster":{"hook":"Served as the official naturalist on Captain James Cook’s second voyage, laying the groundwork for Antarctic ecology and biogeography.","birth":"Tczew (Vistula River), Royal Prussia (Poland)","town":"Tczew","river":"Vistula River","country":"Royal Prussia (Poland)","field":"Natural History & Exploration"},"Lazzaro Spallanzani":{"hook":"Proved that bugs don't just magically spawn from rotting meat out of thin air, AND he was the first to figure out how bats can navigate in pitch-black darkness using echolocation!","birth":"Scandiano (Tresinaro River), Italy","town":"Scandiano","river":"Tresinaro River","country":"Italy","field":"Physiology & Biology"},"Louis Antoine de Bougainville":{"hook":"A swashbuckling explorer who sailed around the whole world, survived the French Revolution, and brought back the brilliant neon-pink \"Bougainvillea\" flower to Europe!","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Exploration"},"Pehr Loefling":{"hook":"Linnaeus’s favorite student. He was sent on a highly dangerous expedition to the South American rainforests to hunt for rare plants and died a hero to science at just 27.","birth":"Valbo (Gavleån River), Sweden","town":"Valbo","river":"Gavleån River","country":"Sweden","field":"Botany & Exploration"},"Pehr Löfling":{"hook":"Linnaeus’s favorite student. He was sent on a highly dangerous expedition to the South American rainforests to hunt for rare plants and died a hero to science at just 27.","birth":"Valbo (Gavleån River), Sweden","town":"Valbo","river":"Gavleån River","country":"Sweden","field":"Botany & Exploration"},"Moses Harris":{"hook":"Butterfly wings were so incredibly colorful that he literally had to invent the modern Color Wheel just so scientists could accurately describe their insane, iridescent patterns!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology & Art"},"Otto Friedrich Müller":{"hook":"He was one of the very first people to peer into a microscope and successfully classify the totally bizarre, invisible, alien-like organisms swarming inside a single tiny drop of water!","birth":"Copenhagen (Øresund Strait), Denmark","town":"Copenhagen","river":"Øresund Strait","country":"Denmark","field":"Microbiology"},"Erasmus Darwin":{"hook":"Grandfather of Charles Darwin. He formulated one of the first formal theories of evolution in his epic poetic and scientific work *Zoonomia*.","birth":"Elston (River Trent), England","town":"Elston","river":"River Trent","country":"England","field":"Natural Philosophy & Medicine"},"William Aiton":{"hook":"The very first Director of Kew Royal Botanic Gardens! He superintended the growth of thousands of exotic world plants and published the ultimate catalog of over 5,500 garden species!","birth":"Avondale (River Avon), Scotland","town":"Avondale","river":"River Avon","country":"Scotland","field":"Horticulture & Botany"},"Jose Celestino Mutis":{"hook":"Led the legendary Royal Botanical Expedition to New Granada (Colombia), establishing immense scientific institutions and documenting thousands of South American plants.","birth":"Cádiz (Guadalete River), Spain","town":"Cádiz","river":"Guadalete River","country":"Spain","field":"Botany & Mathematics"},"José Celestino Mutis":{"hook":"Led the legendary Royal Botanical Expedition to New Granada (Colombia), establishing immense scientific institutions and documenting thousands of South American plants.","birth":"Cádiz (Guadalete River), Spain","town":"Cádiz","river":"Guadalete River","country":"Spain","field":"Botany & Mathematics"},"Joseph Gärtner":{"hook":"German botanist who achieved monumental advancements in carpology (the study of seeds and fruits), establishing fundamental structural terminology still in use today.","birth":"Calw (Nagold River), Germany","town":"Calw","river":"Nagold River","country":"Germany","field":"Botany"},"Pehr Forsskal":{"hook":"A brilliant rebel! He disguised himself in local clothing to explore the forbidden deserts of Arabia, discovering bizarre sea creatures before tragically dying of malaria.","birth":"Helsinki (Vantaa River), Finland","town":"Helsinki","river":"Vantaa River","country":"Finland","field":"Exploration & Botany"},"Antoine Gouan":{"hook":"Gouan was a French trailblazer who helped modernize science education. He was among the very first in France to adopt Carl Linnaeus's new system for naming species, and he turned the Botanical Garden of Montpellier into a world-famous center for plant discovery.","birth":"Montpellier, France","town":"Montpellier","river":null,"country":"France","field":null},"Carsten Niebuhr":{"hook":"The sole survivor of a tragic Danish scientific expedition to Arabia, Niebuhr successfully mapped the region and brought back invaluable botanical and geographical data.","birth":"Lüdingworth, Germany","town":"Lüdingworth","river":null,"country":"Germany","field":null},"Daniel Solander":{"hook":"Carl Linnaeus’s favorite star pupil who sailed around the world on Captain Cook's *Endeavour*, collecting thousands of exotic Pacific plants and helping document the biodiversity of Botany Bay!","birth":"Piteå (Pite River), Sweden","town":"Piteå","river":"Pite River","country":"Sweden","field":"Botany & Oceanic Exploration"},"Joseph Gottlieb Kölreuter":{"hook":"A true pioneer in the study of plant fertilization and hybridization, centuries ahead of his time in understanding pollen transfer and genetics.","birth":"Sulz am Neckar (Neckar River), Germany","town":"Sulz am Neckar","river":"Neckar River","country":"Germany","field":"Botany & Genetics"},"Nicolaas Laurens Burman":{"hook":"Worked side-by-side with the legendary Linnaeus and somehow mapped out the wild, vibrant plant life of India—all without ever leaving his home in the Netherlands!","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Botany"},"James Bolton":{"hook":"Self-taught English naturalist who painstakingly wrote and illustrated the very first English-language work devoted entirely to fungi.","birth":"Warley Town (River Calder), England","town":"Warley Town","river":"River Calder","country":"England","field":"Mycology & Botany"},"Jan Christiaan Sepp":{"hook":"Master Dutch engraver who produced breathtakingly detailed, multi-volume works illuminating the insects and birds of the Netherlands.","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Entomology & Illustration"},"William Bartram":{"hook":"Spent four wild years exploring the untamed American South, writing a legendary book packed with vivid stories of fighting huge alligators and discovering rare frontier plants!","birth":"Kingsessing (Philadelphia) (Schuylkill River), USA","town":"Kingsessing (Philadelphia)","river":"Schuylkill River","country":"USA","field":"Botany & Exploration"},"John Latham":{"hook":"The \"Grandfather of Australian Ornithology.\" He described and named numerous famous Australian birds (like the emu and lyrebird) from specimens sent back to England.","birth":"Eltham (River Thames), England","town":"Eltham","river":"River Thames","country":"England","field":"Ornithology"},"Juan Ignacio Molina":{"hook":"Chilean Jesuit priest who, from exile in Italy, wrote the first comprehensive, scientific accounts of the flora, fauna, and geography of Chile.","birth":"Villa Alegre (Maule River), Chile","town":"Villa Alegre","river":"Maule River","country":"Chile","field":"Natural History"},"Peter Simon Pallas":{"hook":"Traveled across freezing Siberia for Empress Catherine the Great! He dug up extinct mammoths trapped in ice and discovered Pallas’s Cat—the fluffiest, grumpiest-looking wildcat on Earth!","birth":"Berlin (Spree River), Germany","town":"Berlin","river":"Spree River","country":"Germany","field":"Zoology & Geology"},"Eugenius Johann Christoph Esper":{"hook":"German zoologist whose beautifully illustrated magnum opus, *Die Schmetterlinge in Abbildungen*, was a monumental leap forward in butterfly taxonomy.","birth":"Wunsiedel (Röslau River), Germany","town":"Wunsiedel","river":"Röslau River","country":"Germany","field":"Entomology & Botany"},"Felix de Azara":{"hook":"Spanish military engineer who extensively documented the mammals and birds of South America, uncovering biological principles that heavily influenced Charles Darwin.","birth":"Barbuñales (Alcanadre River), Spain","town":"Barbuñales","river":"Alcanadre River","country":"Spain","field":"Natural History & Exploration"},"Carl Peter Thunberg":{"hook":"Known as the \"father of Japanese botany,\" Thunberg posed as a Dutch physician to enter isolated 18th-century Japan and secretly collect and document its unique plants and animals.","birth":"Jönköping, Sweden","town":"Jönköping","river":null,"country":"Sweden","field":null},"Eberhard August Wilhelm von Zimmermann":{"hook":"German geographer who authored *Specimen Zoologiae Geographicae*, widely considered one of the foundational works in the study of animal geography (zoogeography).","birth":"Uelzen (Ilmenau River), Germany","town":"Uelzen","river":"Ilmenau River","country":"Germany","field":"Zoology & Geography"},"Joseph Banks":{"hook":"Sailed with Captain Cook on the *Endeavour*. He became the powerful President of the Royal Society, dictating the course of British science and global botanical collection.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Botany & Patronage"},"Marmaduke Tunstall":{"hook":"A quirky nobleman who turned his entire fancy house into a giant museum of stuffed birds and animals. Oh, and he was the one who officially gave the Peregrine Falcon its scientific name!","birth":"Burton Constable (Humber Estuary (nearby)), England","town":"Burton Constable","river":"Humber Estuary (nearby)","country":"England","field":"Ornithology"},"William Paley":{"hook":"Created the famous \"Watchmaker Analogy\"—arguing that if you stumble across a complex pocket watch on a heath, someone must have designed it, so the mind-blowing complexity of nature must have a creator!","birth":"Peterborough (River Nene), England","town":"Peterborough","river":"River Nene","country":"England","field":"Natural Theology & Philosophy"},"Jean-Baptiste Lamarck":{"hook":"Coined the word \"biology\" and boldly formulated one of the first comprehensive, though later heavily debated, theories of evolution (Lamarckism).","birth":"Bazentin (Somme River), France","town":"Bazentin","river":"Somme River","country":"France","field":"Evolutionary Biology"},"Johann Andreas Naumann":{"hook":"Patriarch of a famous German scientific family and author of the foundational, heavily referenced *Natural History of the Birds of Germany*.","birth":"Ziebigk (Elbe River), Germany","town":"Ziebigk","river":"Elbe River","country":"Germany","field":"Ornithology"},"Johann Gottfried Herder":{"hook":"A key figure in the Sturm und Drang movement whose philosophical ideas deeply influenced the romantic approach to nature and historical biology.","birth":"Mohrungen (Pasłęka River), Prussia (Poland)","town":"Mohrungen","river":"Pasłęka River","country":"Prussia (Poland)","field":"Philosophy & Natural History"},"Antonio José Cavanilles":{"hook":"A Spanish priest turned botanist who cataloged hundreds of plant species from Australia and the Americas brought back by Spanish expeditions, leading the Royal Botanical Garden of Madrid to international fame.","birth":"Valencia, Spain","town":"Valencia","river":null,"country":"Spain","field":null},"Johan Christian Fabricius":{"hook":"A brilliant student of Linnaeus who vastly improved insect taxonomy by classifying species based on the structure of their mouthparts.","birth":"Tønder (Vidå River), Denmark","town":"Tønder","river":"Vidå River","country":"Denmark","field":"Entomology"},"Johann Christian Fabricius":{"hook":"A brilliant student of Linnaeus who vastly improved insect taxonomy by classifying species based on the structure of their mouthparts.","birth":"Tønder (Vidå River), Denmark","town":"Tønder","river":"Vidå River","country":"Denmark","field":"Entomology"},"Sydney Parkinson":{"hook":"Sailed with Captain Cook on HMS *Endeavour*, becoming the very first European artist to draw Australian plants, animals, and landscapes before tragically dying at sea.","birth":"Edinburgh (Water of Leith), Scotland","town":"Edinburgh","river":"Water of Leith","country":"Scotland","field":"Botanical Illustration"},"Andre Michaux":{"hook":"Sent by the King of France to find new tree species for building warships, Michaux braved wild North American frontiers, surviving native wilderness, cold rivers, and shipwrecks. Along the way, he introduced iconic plants like crape myrtles, camellias, and tea olives to American gardens!","birth":"Versailles, France","town":"Versailles","river":null,"country":"France","field":null},"André Michaux":{"hook":"Sent by the King of France to find new tree species for building warships, Michaux braved wild North American frontiers, surviving native wilderness, cold rivers, and shipwrecks. Along the way, he introduced iconic plants like crape myrtles, camellias, and tea olives to American gardens!","birth":"Versailles, France","town":"Versailles","river":null,"country":"France","field":null},"Gerard van Spaendonck":{"hook":"Dutch painter and professor at the Jardin des Plantes in Paris who elevated scientific botanical illustration using watercolor-on-vellum techniques.","birth":"Tilburg (Wilhelminakanaal), Netherlands","town":"Tilburg","river":"Wilhelminakanaal","country":"Netherlands","field":"Botanical Art"},"William Curtis":{"hook":"Founded *Curtis's Botanical Magazine* in 1787—the longest-running botanical periodical in history, bringing thousands of gorgeous copper-plate flower paintings to plant lovers worldwide!","birth":"Alton (River Wey), England","town":"Alton","river":"River Wey","country":"England","field":"Botany & Entomology"},"Anders Sparrman":{"hook":"A brave student of Carl Linnaeus who joined Captain Cook’s famous second voyage around the world. Sparrman braved freezing Antarctic ice storms and tropical diseases, returning home with exotic plants and animals no European had ever seen before.","birth":"Tensta, Sweden","town":"Tensta","river":null,"country":"Sweden","field":null},"Antoine-Laurent de Jussieu":{"hook":"Jussieu brought order to botanical chaos. Instead of sorting plants by random single features (like counting petal numbers), he grouped plants into natural \"families\" based on all their shared traits—a system that forms the backbone of plant classification today!","birth":"Lyon, France","town":"Lyon","river":null,"country":"France","field":null},"Félix Vicq d'Azyr":{"hook":"Pioneer of neuroanatomy; introduced the concept of anatomical homology and described the tract of Vicq d'Azyr in the brain.","birth":"Valognes (Merderet River), France","town":"Valognes","river":"Merderet River","country":"France","field":"Comparative Anatomy"},"Johann Friedrich Gmelin":{"hook":"Edited and vastly expanded the 13th edition of Linnaeus' *Systema Naturae*, formally naming countless species discovered by early explorers.","birth":"Tübingen (Neckar River), Germany","town":"Tübingen","river":"Neckar River","country":"Germany","field":"Botany & Zoology"},"Louis Jean Pierre Vieillot":{"hook":"A true bird detective! He realized that some \"different\" bird species were actually just the same bird with different feathers because they were babies, females, or molting!","birth":"Yvetot (Seine River (nearby)), France","town":"Yvetot","river":"Seine River (nearby)","country":"France","field":"Ornithology"},"Thomas Marsham":{"hook":"Co-founder and long-time secretary of the Linnean Society of London who wrote *Entomologia Britannica*, a landmark scientific catalog of British beetles.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Johann Wolfgang von Goethe":{"hook":"While famous as a literary giant, he was also a passionate botanist and anatomist who coined the term \"morphology\" and discovered the human intermaxillary bone.","birth":"Frankfurt (Main River), Germany","town":"Frankfurt","river":"Main River","country":"Germany","field":"Literature & Morphology"},"Christian Konrad Sprengel":{"hook":"Discovered that flowers use colors, scents, and nectar specifically to attract insects for pollination, proving that plants and insects co-evolved to rely on each other.","birth":"Brandenburg, Germany","town":"Brandenburg","river":null,"country":"Germany","field":null},"René Louiche Desfontaines":{"hook":"Traveled through North Africa during volatile times to gather thousands of rare desert plants, while proving that tree trunks grow differently depending on whether they're monocots or dicots!","birth":"Tremblay (Couesnon River), France","town":"Tremblay","river":"Couesnon River","country":"France","field":"Botany"},"John Abbot":{"hook":"An English-born American artist who spent a lifetime beautifully painting and documenting the life cycles of North American insects and birds in Georgia.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology & Illustration"},"William Roxburgh":{"hook":"The \"Father of Indian Botany\"! He directed the massive Calcutta Botanical Garden, cataloged thousands of tropical Indian plants, and revolutionized sustainable forestry and agriculture across Asia!","birth":"Symington (River Irvine), Scotland","town":"Symington","river":"River Irvine","country":"Scotland","field":"Botany & Tropical Agriculture"},"Johann Friedrich Blumenbach":{"hook":"Considered a founder of zoology and anthropology as comparative sciences, known for his vast skull collection and ideas on natural historical classification.","birth":"Gotha (Nesse River), Germany","town":"Gotha","river":"Nesse River","country":"Germany","field":"Physiology & Anthropology"},"François Levaillant":{"hook":"French explorer who studied African bird species extensively and published heavily illustrated, popular volumes on ornithology, helping popularize natural history in 18th-century Europe.","birth":"Paramaribo (Suriname River), Dutch Surinam","town":"Paramaribo","river":"Suriname River","country":"Dutch Surinam","field":"Ornithology & Exploration"},"George Montagu":{"hook":"Early English naturalist who produced the *Ornithological Dictionary*, providing clear empirical descriptions of British bird behaviors.","birth":"Lackham House (River Avon), England","town":"Lackham House","river":"River Avon","country":"England","field":"Ornithology & Conchology"},"Thomas Bewick":{"hook":"Master artist who revolutionized wood engraving! His illustrated books *A History of British Birds* inspired generations of naturalists and birdwatchers.","birth":"Cherryburn (River Tyne), England","town":"Cherryburn","river":"River Tyne","country":"England","field":"Wood Engraving & Natural History"},"Archibald Menzies":{"hook":"A naval surgeon and plant hunter who sailed with Captain George Vancouver, discovering iconic trees like the Douglas fir and famously introducing the Monkey Puzzle tree to Europe after slipping its seeds into his pocket at a dinner party!","birth":"Aberfeldy, Scotland","town":"Aberfeldy","river":null,"country":"Scotland","field":null},"Georg Forster":{"hook":"Accompanied James Cook on his second voyage; wrote influential ethnological and natural history accounts of the Pacific islands.","birth":"Nassenhuben (Motława River), Poland","town":"Nassenhuben","river":"Motława River","country":"Poland","field":"Natural History & Anthropology"},"Hipolito Ruiz Lopez":{"hook":"Led the monumental Spanish Botanical Expedition to the Viceroyalty of Peru, introducing hundreds of previously unknown South American plants to Europe.","birth":"Belorado (Tirón River), Spain","town":"Belorado","river":"Tirón River","country":"Spain","field":"Botany & Exploration"},"Hipólito Ruiz López":{"hook":"Led the monumental Spanish Botanical Expedition to the Viceroyalty of Peru, introducing hundreds of previously unknown South American plants to Europe.","birth":"Belorado (Tirón River), Spain","town":"Belorado","river":"Tirón River","country":"Spain","field":"Botany & Exploration"},"Bernard Germain de Lacépède":{"hook":"A French naturalist who continued Buffon's famous natural history series, writing comprehensive works on reptiles, amphibians, fish, and cetaceans during the turmoil of the French Revolution.","birth":"Agen, France","town":"Agen","river":null,"country":"France","field":null},"Guillaume-Antoine Olivier":{"hook":"French entomologist who authored major volumes of the *Encyclopédie Méthodique*, describing thousands of new insect species.","birth":"Les Arcs (Argens River), France","town":"Les Arcs","river":"Argens River","country":"France","field":"Entomology"},"Erik Acharius":{"hook":"The last pupil of Linnaeus, known as the \"Father of Lichenology\" for his pioneering, comprehensive classification and study of lichens.","birth":"Gävle (Gavleån River), Sweden","town":"Gävle","river":"Gavleån River","country":"Sweden","field":"Lichenology & Botany"},"James Sowerby":{"hook":"Founded a dynasty of scientific illustrators and brought immense visual clarity to botany and paleontology with works like *English Botany*.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Natural History Illustration"},"Johann Matthäus Bechstein":{"hook":"Pioneered conservation ecology in Germany, founding one of the first forestry schools and writing prolifically on the care of cage birds and forest wildlife.","birth":"Waltershausen (Hörsel River), Germany","town":"Waltershausen","river":"Hörsel River","country":"Germany","field":"Forestry & Ornithology"},"Franz Bauer":{"hook":"Became the very first permanent botanical artist at Kew Gardens. He was universally renowned for his breathtaking, microscopically accurate paintings of orchids.","birth":"Feldsberg (Thaya River (Dyje)), Austria (Czechia)","town":"Feldsberg","river":"Thaya River (Dyje)","country":"Austria (Czechia)","field":"Botanical Art"},"John Sibthorp":{"hook":"English botanist famous for producing the *Flora Graeca*, an incredibly lavish, legendary ten-volume masterpiece detailing the plant life of Greece and the Levant.","birth":"Oxford (River Thames), England","town":"Oxford","river":"River Thames","country":"England","field":"Botany"},"James Edward Smith":{"hook":"Purchased Linnaeus's entire library/specimens, subsequently founding the prestigious Linnean Society of London to foster global naturalism.","birth":"Norwich (River Wensum), England","town":"Norwich","river":"River Wensum","country":"England","field":"Botany"},"Jean-Baptiste Audebert":{"hook":"Invented revolutionary printing techniques utilizing gold and silver leaf to perfectly capture the shimmering iridescence of exotic bird feathers.","birth":"Rochefort (Charente River), France","town":"Rochefort","river":"Charente River","country":"France","field":"Natural History Illustration"},"Pierre-Joseph Redouté":{"hook":"Nicknamed the \"Raphael of Flowers\"! He survived political chaos to serve as the official court artist for Marie Antoinette and Empress Joséphine, painting the world's most famous rose watercolor prints.","birth":"Saint-Hubert (Lhomme River), Belgium","town":"Saint-Hubert","river":"Lhomme River","country":"Belgium","field":"Botanical Painting"},"William Kirby":{"hook":"The \"Father of Entomology in Britain\"! Co-wrote the very first popular English textbook on insects (*An Introduction to Entomology*), inspiring generations of kids to catch bugs!","birth":"Witnesham (River Fynn), England","town":"Witnesham","river":"River Fynn","country":"England","field":"Entomology"},"Ferdinand Bauer":{"hook":"Famed for his remarkable scientific precision and unique color-coding system while traveling on the historic Flinders expedition to document Australian flora.","birth":"Feldsberg (Thaya River (Dyje)), Austria (Czechia)","town":"Feldsberg","river":"Thaya River (Dyje)","country":"Austria (Czechia)","field":"Botanical Illustration"},"Olof Swartz":{"hook":"A literal botanical pirate! He sailed across the treacherous Caribbean seas hunting for treasure, but instead of gold, he found and named thousands of unknown, alien-looking orchids!","birth":"Norrköping (Motala ström), Sweden","town":"Norrköping","river":"Motala ström","country":"Sweden","field":"Botany"},"Sarah Stone":{"hook":"Painted hundreds of strange, unknown Pacific and Australian creatures brought back to England on Captain James Cook’s historic global ocean voyages!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Natural History Art"},"Christiaan Hendrik Persoon":{"hook":"Considered a pioneer of systematic mycology, Persoon created the first organized system for classifying mushroom and fungus species.","birth":"Cape of Good Hope, South Africa","town":"Cape of Good Hope","river":null,"country":"South Africa","field":null},"Jacob Hübner":{"hook":"German entomologist whose incredibly comprehensive, illustrated works laid down the foundational taxonomy for butterflies and moths.","birth":"Augsburg (Lech River), Germany","town":"Augsburg","river":"Lech River","country":"Germany","field":"Entomology"},"Kaspar Maria von Sternberg":{"hook":"The \"Father of Paleobotany\"! He looked at chunks of coal and realized they were actually squished, millions-of-years-old fossilized prehistoric plants!","birth":"Prague (Vltava River), Bohemia (Czechia)","town":"Prague","river":"Vltava River","country":"Bohemia (Czechia)","field":"Paleobotany"},"Pierre André Latreille":{"hook":"Saved from the guillotine during the French Revolution because he found a rare beetle in his prison floorboards! The prison doctor recognized the rare bug, realized he was a genius, and got him freed!","birth":"Brive-la-Gaillarde (Corrèze River), France","town":"Brive-la-Gaillarde","river":"Corrèze River","country":"France","field":"Entomology"},"Johann Wilhelm Meigen":{"hook":"A founder of modern dipterology (the study of flies), establishing a revolutionary classification system based on insect wing venation.","birth":"Solingen (Wupper River), Germany","town":"Solingen","river":"Wupper River","country":"Germany","field":"Entomology"},"Carl Ludwig Willdenow":{"hook":"A mentor to Alexander von Humboldt, Willdenow was an early pioneer of phytogeography, studying how climate and terrain dictate where specific plant species can grow.","birth":"Berlin, Germany","town":"Berlin","river":null,"country":"Germany","field":null},"Alexander Wilson":{"hook":"A former weaver and poet who fled to America, Wilson walked thousands of miles through wild forests and swamps to draw and paint every bird species he could find. He published the first comprehensive guide to American birds, earning him the title \"Father of American Ornithology.\"","birth":"Paisley, Scotland","town":"Paisley","river":null,"country":"Scotland","field":null},"Pierre Antoine Poiteau":{"hook":"Rose from a penniless garden worker to painting hyper-detailed, mouth-watering illustrations of exotic fruits and tropical foliage for Empress Joséphine of France!","birth":"Ambleny (Aisne River), France","town":"Ambleny","river":"Aisne River","country":"France","field":"Botanical Art & Pomology"},"Thomas Robert Malthus":{"hook":"Realized populations outgrow food supply leading to a fierce struggle for survival—the exact concept that gave Charles Darwin and Alfred Russel Wallace the spark to discover Natural Selection!","birth":"Westcott (River Tillingbourne), England","town":"Westcott","river":"River Tillingbourne","country":"England","field":"Demography & Population Biology"},"Adrian Hardy Haworth":{"hook":"Haworth was so obsessed with succulents and butterflies that he converted his home into a living laboratory filled with fleshy cacti and fluttery specimens. He loved describing tiny details that other scientists missed, spending hours classifying subtle differences in leaf shapes and butterfly wing patterns.","birth":"Hull, England","town":"Hull","river":null,"country":"England","field":null},"Edward Donovan":{"hook":"Anglo-Irish writer and illustrator who published exceptionally popular, highly detailed works such as *The Natural History of British Insects* and *British Birds*.","birth":"Cork (River Lee), Ireland","town":"Cork","river":"River Lee","country":"Ireland","field":"Natural History Illustration"},"Jacques Barraband":{"hook":"A highly esteemed French artist who created some of the most vibrant, accurate, and prized illustrations of tropical birds ever printed.","birth":"Aubusson (Creuse River), France","town":"Aubusson","river":"Creuse River","country":"France","field":"Zoological Illustration"},"Robert John Thornton":{"hook":"Bankrupted himself to publish *The Temple of Flora*—the most dramatically romantic, lushly illustrated flower print collection in history!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Botanical Publishing"},"Sydenham Edwards":{"hook":"A master artist who spent decades illustrating thousands of exotic plants for *Curtis's Botanical Magazine* and founded the world-renowned *Botanical Register*!","birth":"Abergavenny (River Usk), Wales","town":"Abergavenny","river":"River Usk","country":"Wales","field":"Botanical & Zoological Illustration"},"Alexander von Humboldt":{"hook":"Humboldt was the ultimate scientific rockstar—he tested electric eels on his own skin, climbed active volcanoes without modern gear, and realized that nature is a single interconnected web long before the word \"ecology\" existed. More places, rivers, and mountain ranges are named after him than anyone else in history!","birth":"Berlin, Germany","town":"Berlin","river":null,"country":"Germany","field":null},"Georges Cuvier":{"hook":"\"Father of Paleontology.\" Established that extinction is a biological reality and developed the concept of catastrophism.","birth":"Montbéliard (Allan River), France","town":"Montbéliard","river":"Allan River","country":"France","field":"Comparative Anatomy & Paleontology"},"William Smith":{"hook":"Nicknamed \"Strata Smith\"! He created the world's very first nationwide geological map by realizing that specific fossil layers underground could be used to map out the rock strata of an entire country!","birth":"Churchill (River Evenlode), England","town":"Churchill","river":"River Evenlode","country":"England","field":"Geology & Cartography"},"Amédée Louis Michel Lepeletier de Saint-Fargeau":{"hook":"Lepeletier was obsessed with the stingers and social lives of bees, wasps, and ants. He spent his life catching stinging insects and categorizing their complex behaviors, writing the ultimate guides on how these tiny creatures organize their hives and underground fortresses.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Christian Rudolph Wilhelm Wiedemann":{"hook":"The ultimate fly specialist! He authored the very first systematic scientific studies on tropical flies, mosquitoes, and gnats collected from ecosystems across the globe.","birth":"Braunschweig (Oker River), Germany","town":"Braunschweig","river":"Oker River","country":"Germany","field":"Entomology & Dipterology"},"Francois Andre Michaux":{"hook":"French botanist who authored *The North American Sylva*, a landmark, foundational masterwork in American forestry and tree ecology.","birth":"Versailles (Seine River), France","town":"Versailles","river":"Seine River","country":"France","field":"Botany & Forestry"},"François André Michaux":{"hook":"French botanist who authored *The North American Sylva*, a landmark, foundational masterwork in American forestry and tree ecology.","birth":"Versailles (Seine River), France","town":"Versailles","river":"Seine River","country":"France","field":"Botany & Forestry"},"Charles Athanase Walckenaer":{"hook":"A French civil servant who was obsessed with spiders, creating groundbreaking classification guides for arachnids and mapping their wild behavior.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Jakob Sturm":{"hook":"German engraver whose beautifully crafted miniature natural history books made high-quality scientific knowledge accessible to the public.","birth":"Nuremberg (Pegnitz River), Germany","town":"Nuremberg","river":"Pegnitz River","country":"Germany","field":"Entomology & Illustration"},"Carl Johan Schönherr":{"hook":"A wealthy silk manufacturer who retired early to focus entirely on beetles, eventually publishing a world-defining multi-volume guide to snout beetles (weevils).","birth":"Stockholm, Sweden","town":"Stockholm","river":null,"country":"Sweden","field":null},"Étienne Geoffroy Saint-Hilaire":{"hook":"Proposed that all animal species are built upon a single underlying anatomical \"master plan,\" launching a legendary, explosive debate against Georges Cuvier over how life evolved!","birth":"Étampes (Juine River), France","town":"Étampes","river":"Juine River","country":"France","field":"Comparative Anatomy & Embryology"},"Pancrace Bessa":{"hook":"Painted flowers so vibrantly that French royalty hired him to teach their kids art! He turned boring plant science into absolute visual masterpieces.","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Botanical Art"},"Aime Bonpland":{"hook":"Bonpland was a botanist-adventurer who survived jaguar encounters, electric eel shocks, and climbing high up the Andes mountains alongside Alexander von Humboldt. His life was so wild that a South American dictator once kidnapped him and held him under house arrest in Paraguay for nine years because he was worried Bonpland would start a lucrative tea farm!","birth":"La Rochelle, France","town":"La Rochelle","river":null,"country":"France","field":null},"Aimé Bonpland":{"hook":"Bonpland was a botanist-adventurer who survived jaguar encounters, electric eel shocks, and climbing high up the Andes mountains alongside Alexander von Humboldt. His life was so wild that a South American dictator once kidnapped him and held him under house arrest in Paraguay for nine years because he was worried Bonpland would start a lucrative tea farm!","birth":"La Rochelle, France","town":"La Rochelle","river":null,"country":"France","field":null},"Robert Brown":{"hook":"Discovered the nucleus inside living cells AND noticed microscopic pollen grains randomly dancing around in water—a physical phenomenon now known everywhere as \"Brownian Motion\"!","birth":"Montrose (River South Esk), Scotland","town":"Montrose","river":"River South Esk","country":"Scotland","field":"Botany & Physics"},"Thomas Horsfield":{"hook":"An American physician who spent years exploring the dense, untamed jungles of Java, cataloging and describing dozens of brand-new Asian mammal and bird species!","birth":"Bethlehem (Lehigh River), USA","town":"Bethlehem","river":"Lehigh River","country":"USA","field":"Botany & Zoology"},"André Marie Constant Duméril":{"hook":"Duméril was Paris's go-to reptile and fish expert. He created a massive, 9-volume encyclopedia of reptiles (*Erpétologie Générale*) that classified over 1,300 species of snakes, lizards, and turtles, setting the standard for how we study cold-blooded creatures.","birth":"Amiens, France","town":"Amiens","river":null,"country":"France","field":null},"Frederick Traugott Pursh":{"hook":"German-American botanist who compiled *Flora Americae Septentrionalis*, one of the earliest complete descriptions of North American plants.","birth":"Großenhain (Röder River), Germany","town":"Großenhain","river":"Röder River","country":"Germany","field":"Botany"},"Georg Heinrich von Langsdorff":{"hook":"Led major scientific expeditions into the interior of Brazil, compiling immense collections of botanical and zoological specimens.","birth":"Wöllstein (Appelbach River), Germany","town":"Wöllstein","river":"Appelbach River","country":"Germany","field":"Natural History & Exploration"},"Friedrich Schelling":{"hook":"Major German Idealist philosopher whose work attempted to bridge the gap between human spirit and the organic natural world.","birth":"Leonberg (Glems River), Germany","town":"Leonberg","river":"Glems River","country":"Germany","field":"Philosophy of Nature"},"Jean Guillaume Audinet-Serville":{"hook":"French entomologist who created highly significant, early structural classifications for grasshoppers (Orthoptera) and true bugs (Hemiptera).","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Entomology"},"Johann Karl Wilhelm Illiger":{"hook":"Developed early systematic classifications of mammals and insects, emphasizing the importance of family structures in biological taxonomy.","birth":"Braunschweig (Oker River), Germany","town":"Braunschweig","river":"Oker River","country":"Germany","field":"Entomology & Zoology"},"Pierre Jean François Turpin":{"hook":"Combined extreme artistic beauty with microscopic precision! He peered through lenses to draw hyper-accurate plant cells, revealing microscopic biological structures never seen before.","birth":"Vire (Vire River), France","town":"Vire","river":"Vire River","country":"France","field":"Botanical Art & Microscopic Illustration"},"Henri Marie Ducrotay de Blainville":{"hook":"French zoologist who coined the term *paleontology* and succeeded Cuvier in the chair of comparative anatomy in Paris.","birth":"Arques-la-Bataille (Varenne River), France","town":"Arques-la-Bataille","river":"Varenne River","country":"France","field":"Comparative Anatomy"},"Augustin-Pyramus de Candolle":{"hook":"A famous botanist who coined the term taxonomy to describe the science of sorting living things, and discovered that plant leaf movements follow an internal biological clock.","birth":"Geneva, Switzerland","town":"Geneva","river":null,"country":"Switzerland","field":null},"Charles Alexandre Lesueur":{"hook":"An artist-naturalist who explored Australia and North America, producing thousands of beautiful drawings of ocean sea jellies, fish, and freshwater turtles.","birth":"Le Havre, France","town":"Le Havre","river":null,"country":"France","field":null},"Coenraad Jacob Temminck":{"hook":"Founder and longtime director of the Naturalis Museum in Leiden, who analyzed and named thousands of new mammal and bird species brought back from East Asian and African expeditions!","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Zoology & Ornithology"},"Auguste de Saint-Hilaire":{"hook":"A brave French botanist who spent six years trekking through Brazil's wild interior, collecting over 30,000 plant specimens and mapping South American ecosystems.","birth":"Orléans, France","town":"Orléans","river":null,"country":"France","field":null},"Lorenz Oken":{"hook":"A wild, rebel scientist who thought the entire universe was like one giant living organism. He predicted that all animals were made of tiny \"infusoria\" before cell theory was fully proven!","birth":"Bohlsbach (Kinzig River), Germany","town":"Bohlsbach","river":"Kinzig River","country":"Germany","field":"Naturphilosophie"},"William Hooker (fruit painter)":{"hook":"Renowned fruit painter for the London Horticultural Society! His incredibly realistic, mouth-watering paintings of apples, plums, and peaches set the gold standard for fruit art!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Horticultural Art"},"Johann Friedrich Naumann":{"hook":"Recognized as the founder of modern ornithology in Europe. His multi-volume *Natural History of the Birds of Germany* set a gold standard for field guides.","birth":"Ziebigk (Elbe River), Germany","town":"Ziebigk","river":"Elbe River","country":"Germany","field":"Ornithology"},"Maximilian Spinola":{"hook":"An Italian nobleman born in France who was utterly obsessed with bugs! He named and described hundreds of new insect species, creating a massive catalog of wasps and beetles!","birth":"Toulouse (Garonne River), France","town":"Toulouse","river":"Garonne River","country":"France","field":"Entomology"},"Pierre François Marie Auguste Dejean":{"hook":"A high-ranking general under Napoleon who collected beetles *on active battlefields*! Legend says he pinned rare specimens straight onto his military helmet mid-combat!","birth":"Amiens (Somme River), France","town":"Amiens","river":"Somme River","country":"France","field":"Entomology"},"Adelbert von Chamisso":{"hook":"A remarkable polymath who sailed around the world on a scientific expedition, discovered new plants (including the California poppy), and made breakthroughs in organism reproduction. A French aristocrat forced to flee the French Revolution, he grew up to become a celebrated German poet and a rugged round-the-world explorer.","birth":"Champagne, France","town":"Champagne","river":null,"country":"France","field":null},"Johann Baptist von Spix":{"hook":"Led a monumental expedition to Brazil alongside Carl Friedrich Philipp von Martius, bringing back thousands of previously unknown animal species to Europe.","birth":"Höchstadt (Aisch River), Germany","town":"Höchstadt","river":"Aisch River","country":"Germany","field":"Zoology & Exploration"},"Pauline Knip":{"hook":"She painted pigeons. Sounds boring? Her pigeon paintings were so unbelievably hyper-realistic that she became the official artist for the Queen of Naples!","birth":"Paris (Seine River), France","town":"Paris","river":"Seine River","country":"France","field":"Bird Illustration"},"William John Burchell":{"hook":"Trekked over 4,500 miles through wild South Africa in a custom ox-wagon, collecting 60,000 specimens (including Burchell's Zebra) and making super-accurate wilderness maps!","birth":"Fulham (London) (River Thames), England","town":"Fulham (London)","river":"River Thames","country":"England","field":"Exploration & Natural History"},"Charles Waterton":{"hook":"An eccentric naturalist who created one of the world's first nature reserves on his estate and experimented with the Amazonian arrow poison curare to discover its medical properties.","birth":"Wakefield, England","town":"Wakefield","river":null,"country":"England","field":null},"Georg August Goldfuss":{"hook":"German paleontologist who coined the term *protozoa* and performed crucial early work describing German fossil invertebrates and vertebrates.","birth":"Thurnau (Red Main River), Germany","town":"Thurnau","river":"Red Main River","country":"Germany","field":"Paleontology & Zoology"},"Maximilian zu Wied-Neuwied":{"hook":"A real-life prince who gave up his luxurious castle life to journey deep into the Amazon jungle and the American Wild West to study grizzly bears and indigenous tribes!","birth":"Neuwied (Rhine River), Germany","town":"Neuwied","river":"Rhine River","country":"Germany","field":"Exploration & Ethnography"},"Constantine Samuel Rafinesque":{"hook":"An eccentric self-taught genius who named thousands of North American plant and animal species, explored wild frontier river valleys, and accurately predicted evolution before Darwin!","birth":"Galata (Istanbul) (Bosphorus Strait), Turkey","town":"Galata (Istanbul)","river":"Bosphorus Strait","country":"Turkey","field":"Evolutionary Botany & Zoology"},"William Spence":{"hook":"Co-authored the legendary 4-volume *Introduction to Entomology* with William Kirby—the runaway bestseller that turned insect-hunting into a mainstream global sensation!","birth":"Bishop Burton (River Hull), England","town":"Bishop Burton","river":"River Hull","country":"England","field":"Entomology"},"William Buckland":{"hook":"Scientifically described the very first named dinosaur—*Megalosaurus*—in 1824! He was famous for eccentric experiments and trying to taste every single animal species on Earth!","birth":"Axminster (River Axe), England","town":"Axminster","river":"River Axe","country":"England","field":"Paleontology & Geology"},"William Yarrell":{"hook":"A London newsagent turned super-naturalist who wrote master reference books on British birds and fishes, and successfully proved that Bewick's Swan was an entirely separate species!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Zoology & Ornithology"},"John James Audubon":{"hook":"Painted, cataloged, and described the birds of North America in a style far superior to any preceding work in his epic masterpiece, *The Birds of America*.","birth":"Les Cayes (Ravine du Sud), Saint-Domingue (Haiti)","town":"Les Cayes","river":"Ravine du Sud","country":"Saint-Domingue (Haiti)","field":"Ornithology & Art"},"William Jackson Hooker":{"hook":"Transformed Kew Gardens into the supreme global power for plant science! As official Director, he organized expeditions across the British Empire and built huge plant herbariums.","birth":"Norwich (River Wensum), England","town":"Norwich","river":"River Wensum","country":"England","field":"Botany & Administration"},"Nathaniel Wallich":{"hook":"Ran the legendary Calcutta Botanical Gardens and loaded entire fleets of ships with over 8,000 completely crazy, unknown Indian jungle plants to amaze scientists back in Europe!","birth":"Copenhagen (Øresund Strait), Denmark","town":"Copenhagen","river":"Øresund Strait","country":"Denmark","field":"Botany"},"Thomas Nuttall":{"hook":"A fearless explorer who trekked across thousands of miles of wild American frontier, identifying hundreds of new plant species and writing classic botanical reference guides.","birth":"Settle (River Ribble), England","town":"Settle","river":"River Ribble","country":"England","field":"Botany & Exploration"},"Christian Ludwig Brehm":{"hook":"A pastor and bird collector who accumulated over 9,000 bird skins, proving how subtle variations in plumage exist within individual bird species across regions.","birth":"Schönau vor dem Walde, Germany","town":"Schönau vor dem Walde","river":null,"country":"Germany","field":null},"John Richardson":{"hook":"Scottish naval surgeon and naturalist who surveyed the harsh Canadian Arctic alongside John Franklin, thoroughly documenting its flora and fauna in *Fauna Boreali-Americana*.","birth":"Dumfries (River Nith), Scotland","town":"Dumfries","river":"River Nith","country":"Scotland","field":"Exploration & Ichthyology"},"Thomas Say":{"hook":"The \"Father of American Entomology\"! He braved dangerous frontier expeditions across the American West to discover and describe thousands of brand-new insect and shell species!","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Entomology & Conchology"},"Carl Sigismund Kunth":{"hook":"Spent 24 years in Paris organizing, describing, and publishing thousands of new South American plant specimens brought back by Humboldt and Bonpland's expedition.","birth":"Leipzig, Germany","town":"Leipzig","river":null,"country":"Germany","field":null},"Jacques Boucher de Perthes":{"hook":"Pioneered the study of prehistoric flint tools in France, providing some of the very first proof of the ancient antiquity of humankind.","birth":"Rethel (Aisne River), France","town":"Rethel","river":"Aisne River","country":"France","field":"Archaeology & Antiquarianism"},"Prideaux John Selby":{"hook":"Etched life-sized, hand-colored prints of British birds onto giant sheets of paper—creating British ornithological artwork so large and detailed it rivaled Audubon's work in America!","birth":"Alnwick (River Aln), England","town":"Alnwick","river":"River Aln","country":"England","field":"Ornithology & Engraving"},"Joakim Frederik Schouw":{"hook":"Danish pioneer who shifted botany toward ecology by correlating the global distribution of plant species directly with specific climate zones.","birth":"Copenhagen (Øresund (Strait)), Denmark","town":"Copenhagen","river":"Øresund (Strait)","country":"Denmark","field":"Phytogeography (Plant Geography)"},"William Scoresby":{"hook":"A fearless Arctic whaling captain turned scientist who mapped Greenland's icy coastline, studied frozen ocean currents, drew complex snowflake crystals, and solved iron ship magnetic interference!","birth":"Whitby (River Esk), England","town":"Whitby","river":"River Esk","country":"England","field":"Arctic Exploration & Geophysics"},"William Swainson":{"hook":"A gifted artist and daring explorer who published ultra-detailed, vibrant lithographs of wild tropical birds, colorful fish, and shells collected during his journeys through South America!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Ornithology & Zoological Illustration"},"Gideon Mantell":{"hook":"Discovered and identified the first fossil teeth and bones of *Iguanodon*, playing a pivotal role in the early scientific discovery of dinosaurs.","birth":"Lewes (River Ouse), England","town":"Lewes","river":"River Ouse","country":"England","field":"Paleontology & Geology"},"Jules Dumont d'Urville":{"hook":"French naval officer who commanded crucial expeditions to the South Pacific and Antarctica, gathering vast biological specimens and acquiring the Venus de Milo for France.","birth":"Condé-sur-Noireau (Noireau River), France","town":"Condé-sur-Noireau","river":"Noireau River","country":"France","field":"Exploration & Botany"},"John Curtis":{"hook":"Produced the majestic 16-volume *British Entomology*, lauded as some of the finest, most accurate insect illustrations ever printed in England.","birth":"Norwich (River Wensum), England","town":"Norwich","river":"River Wensum","country":"England","field":"Entomology & Illustration"},"Sarah Bowdich Lee":{"hook":"The first woman ever to collect and systematically describe new plant species in West Africa! She wrote ground-breaking natural history books and illustrated exotic wildlife.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Natural History & Exploration"},"William Elford Leach":{"hook":"A energetic natural history curator at the British Museum who revolutionized the study of crustaceans, insects, and mollusks through intense, non-stop laboratory analysis!","birth":"Plymouth (River Plym), England","town":"Plymouth","river":"River Plym","country":"England","field":"Zoology & Marine Biology"},"Augusta Innes Withers":{"hook":"An extraordinary English botanical painter who served as Flower Painter in Ordinary to Queen Adelaide, painting wildly detailed orchids and exotic fruit plants for top scientific books.","birth":"Gloucestershire, England","town":"Gloucestershire","river":null,"country":"England","field":null},"James Francis Stephens":{"hook":"Authored the colossal *Illustrations of British Entomology*, serving as a critical reference point for Charles Darwin's early insect research.","birth":"Shoreham-by-Sea (River Adur), England","town":"Shoreham-by-Sea","river":"River Adur","country":"England","field":"Entomology"},"Karl Ernst von Baer":{"hook":"He discovered the mammalian egg! He proved that massive animals (and humans) don't start as fully-formed mini-creatures, but grow from a single, microscopic little dot!","birth":"Piibe (Põltsamaa River), Estonia","town":"Piibe","river":"Põltsamaa River","country":"Estonia","field":"Embryology & Biology"},"Roderick Murchison":{"hook":"Solved massive ancient rock puzzles across Britain and Europe! He established and named the Silurian geological period, revealing millions of years of hidden Earth history.","birth":"Tarradale (River Beauly), Scotland","town":"Tarradale","river":"River Beauly","country":"Scotland","field":"Geology"},"William Sharp Macleay":{"hook":"Invented the \"Quinarian System\"—a wild, mind-bending 19th-century theory that proposed every single living creature on Earth was organized in repeating patterns of five intersecting circles!","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology & Evolutionary Theory"},"Johann Friedrich von Eschscholtz":{"hook":"Baltic-German naturalist who served as physician and scientist on Otto von Kotzebue's exploratory voyages, profoundly contributing to the biology of the Pacific.","birth":"Tartu (Dorpat) (Emajõgi River), Estonia","town":"Tartu (Dorpat)","river":"Emajõgi River","country":"Estonia","field":"Biology & Exploration"},"Robert Havell":{"hook":"The master printmaker who spent 11 relentless years engraving and printing giant copper plates for John James Audubon’s world-famous masterpiece *The Birds of America*!","birth":"Reading (River Thames), England","town":"Reading","river":"River Thames","country":"England","field":"Printmaking & Art"},"Achille Valenciennes":{"hook":"Valenciennes spent decades meticulously describing fish and microscopic parasites, co-authoring a massive 22-volume encyclopedia on fish still relied upon today. Born directly inside the famous Paris Natural History Museum where his father worked, he grew up surrounded by exotic specimens and dedicated his life to ocean creatures.","birth":"Paris, France","town":"Paris","river":null,"country":"France","field":null},"Carl Friedrich Philipp von Martius":{"hook":"An explorer who spent three years exploring the Amazon basin, producing a legendary multi-volume encyclopedia on palm trees (*Flora Brasiliensis*) that remains a botanical landmark.","birth":"Erlangen, Germany","town":"Erlangen","river":null,"country":"Germany","field":null},"Christian Heinrich Pander":{"hook":"Discovered the embryonic germ layers (ectoderm, mesoderm, endoderm) that form all animal body organs, laying the foundation for modern embryology.","birth":"Riga, Latvia","town":"Riga","river":null,"country":"Latvia","field":null},"Eduard Rueppell":{"hook":"German naturalist and explorer who extensively surveyed Northeastern Africa and the Middle East, describing many new species including Rüppell's vulture.","birth":"Frankfurt am Main (Main River), Germany","town":"Frankfurt am Main","river":"Main River","country":"Germany","field":"Zoology & Exploration"},"Eduard Rüppell":{"hook":"German naturalist and explorer who extensively surveyed Northeastern Africa and the Middle East, describing many new species including Rüppell's vulture.","birth":"Frankfurt am Main (Main River), Germany","town":"Frankfurt am Main","river":"Main River","country":"Germany","field":"Zoology & Exploration"},"Elias Magnus Fries":{"hook":"Known as the \"Linnaeus of Mycology,\" this Swedish botanist established the foundational taxonomic classification system for mushrooms and fungi still used today.","birth":"Femsjö (Nissan River), Sweden","town":"Femsjö","river":"Nissan River","country":"Sweden","field":"Mycology & Botany"},"Rene Primevere Lesson":{"hook":"Double entry for the iconic French naval naturalist! Beyond Birds-of-Paradise, he discovered dozens of unknown hummingbird species and unique marine creatures during his 2-year voyage around the planet.","birth":"Rochefort (Charente River), France","town":"Rochefort","river":"Charente River","country":"France","field":"Zoology & Exploration"},"René Primevère Lesson":{"hook":"Double entry for the iconic French naval naturalist! Beyond Birds-of-Paradise, he discovered dozens of unknown hummingbird species and unique marine creatures during his 2-year voyage around the planet.","birth":"Rochefort (Charente River), France","town":"Rochefort","river":"Charente River","country":"France","field":"Zoology & Exploration"},"Christian Gottfried Ehrenberg":{"hook":"Discovered that giant chalk cliffs and ocean sediment deposits are actually made up of billions of microscopic fossil skeletons, revealing microscopic life's massive geological power.","birth":"Delitzsch, Germany","town":"Delitzsch","river":null,"country":"Germany","field":null},"Thaddeus William Harris":{"hook":"The \"Father of Economic Entomology in America\"! He showed farmers how to protect their crops by studying agricultural insect pests and their life cycles.","birth":"Dorchester (Boston) (Neponset River), USA","town":"Dorchester (Boston)","river":"Neponset River","country":"USA","field":"Economic Entomology"},"Carl Ludwig Blume":{"hook":"A botanist who spent years studying the tropical biodiversity of Java and the East Indies, naming hundreds of exotic plants including rare orchids and giant jungle flowers.","birth":"Brunswick, Germany","town":"Brunswick","river":null,"country":"Germany","field":null},"Henry De la Beche":{"hook":"First director of the Geological Survey of Great Britain, creating pioneering geological maps that set the standard for stratigraphy.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Geology"},"John Torrey":{"hook":"A pivotal figure in American science who collaborated with Asa Gray to catalog the immense floral diversity brought back from western American expeditions.","birth":"New York City (Hudson River), USA","town":"New York City","river":"Hudson River","country":"USA","field":"Botany"},"Orra White Hitchcock":{"hook":"America’s first female scientific illustrator! She painted huge, wall-sized classroom posters of terrifying prehistoric fossils and giant dinosaur tracks to blow the minds of university students!","birth":"Amherst (Connecticut River), USA","town":"Amherst","river":"Connecticut River","country":"USA","field":"Scientific Illustration"},"William MacGillivray":{"hook":"Collaborated with John James Audubon on *Ornithological Biography*, dissecting and describing the internal anatomy and digestive systems of hundreds of bird species!","birth":"Aberdeen (River Dee), Scotland","town":"Aberdeen","river":"River Dee","country":"Scotland","field":"Ornithology & Comparative Anatomy"},"Andrew Smith":{"hook":"An army surgeon sent to South Africa who spent his free time trekking into uncharted territory. He was the first scientist to officially describe the infamous, highly venomous Black Mamba snake and founded South Africa's very first natural history museum.","birth":"Hawick, Scotland","town":"Hawick","river":null,"country":"Scotland","field":null},"Charles Lyell":{"hook":"The geologist who popularized **uniformitarianism**, proving that Earth's geological features were formed over millions of years by slow, natural forces still at work today.","birth":"Kinnordy, Scotland","town":"Kinnordy","river":null,"country":"Scotland","field":null},"Étienne Mulsant":{"hook":"An unstoppable French naturalist who classified hundreds of newly discovered beetle species and co-authored a massive multi-volume masterpiece on every hummingbird species on Earth!","birth":"Mornant (Garon River), France","town":"Mornant","river":"Garon River","country":"France","field":"Entomology & Ornithology"},"Frederick William Hope":{"hook":"Founder of the Hope Department of Entomology at the University of Oxford and a founder of the Royal Entomological Society.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Entomology"},"Anna Atkins":{"hook":"Atkins created the world's very first book illustrated with photographs! Using early photographic blueprints (cyanotypes), she placed real seaweeds and ferns onto light-sensitive paper, creating stunning, deep-blue visual prints of plant life.","birth":"Tonbridge, England","town":"Tonbridge","river":null,"country":"England","field":null},"David Douglas":{"hook":"Daring Scottish plant hunter who braved dangerous wilderness in the Pacific Northwest to introduce the massive Douglas-fir tree and over 200 species of wild plants to gardens worldwide!","birth":"Scone (River Tay), Scotland","town":"Scone","river":"River Tay","country":"Scotland","field":"Botanical Exploration & Forestry"},"Félix Édouard Guérin-Méneville":{"hook":"Prolific French entomologist who illustrated and described thousands of insect species, editing key serial publications like *Revue Zoologique*.","birth":"Toulon (Las River), France","town":"Toulon","river":"Las River","country":"France","field":"Entomology"},"Gottlieb August Wilhelm Herrich-Schäffer":{"hook":"Leading German specialist; authored comprehensive multi-volume guides classifying European butterflies and moths.","birth":"Regensburg (Danube River), Germany","town":"Regensburg","river":"Danube River","country":"Germany","field":"Entomology & Medicine"},"Jean Baptiste Boisduval":{"hook":"One of the foremost lepidopterists of his era, painstakingly describing butterfly collections returned from major French naval exploratory voyages.","birth":"Ticheville (Touques River), France","town":"Ticheville","river":"Touques River","country":"France","field":"Entomology"},"John Lindley":{"hook":"Fought tirelessly to save the Royal Botanic Gardens at Kew and became one of the foremost authorities on orchids, fundamentally reshaping plant taxonomy.","birth":"Old Catton (River Wensum), England","town":"Old Catton","river":"River Wensum","country":"England","field":"Botany & Orchidology"},"Mary Anning":{"hook":"Survived a lightning strike as a baby to become the greatest fossil hunter ever! She dug whole sea monsters (Plesiosaurs) out of crumbling cliffs, proving to scientists that animals could go extinct!","birth":"Lyme Regis (River Lim), England","town":"Lyme Regis","river":"River Lim","country":"England","field":"Paleontology"},"Priscilla Susan Bury":{"hook":"A brilliant self-taught artist who published enormous, dramatic prints of lilies and amaryllis flowers that left the world's most experienced male botanists completely awestruck!","birth":"Liverpool (River Mersey), England","town":"Liverpool","river":"River Mersey","country":"England","field":"Botanical Illustration"},"Titian Peale":{"hook":"An adventurer, wildlife artist, and bug collector who trekked across the untamed American West and sailed around the globe on the U.S. Exploring Expedition to sketch rare wildlife!","birth":"Philadelphia (Delaware River), USA","town":"Philadelphia","river":"Delaware River","country":"USA","field":"Entomology & Scientific Art"},"George Bentham":{"hook":"Leading 19th-century English botanist who co-authored *Genera Plantarum*, creating a comprehensive classification system for seed plants.","birth":"Stoke (River Tamar), England","town":"Stoke","river":"River Tamar","country":"England","field":"Systematic Botany"},"Heinrich Georg Bronn":{"hook":"German paleontologist known for his extensive encyclopedia of fossil organisms and for translating Charles Darwin's works into German.","birth":"Ziegelhausen (Neckar River), Germany","town":"Ziegelhausen","river":"Neckar River","country":"Germany","field":"Geology & Paleontology"},"Henri Milne-Edwards":{"hook":"French zoologist recognized for pioneer studies on marine invertebrates, physiological division of labor, and comprehensive works on crustaceans.","birth":"Bruges (Reie Canals), Belgium","town":"Bruges","river":"Reie Canals","country":"
