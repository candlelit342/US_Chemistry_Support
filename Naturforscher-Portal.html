"Paris (Seine), France","hook":"A Paris pharmacist, he wrote one of France's first Linnaean guides to the insects living in the fields and gardens right around the city."},"James Hutton":{"birth":"Edinburgh, Scotland","hook":"Studying rock layers meeting at strange angles, he realised Earth was almost unimaginably old, with 'no vestige of a beginning, no prospect of an end.'"},"Thomas Pennant":{"birth":"Flintshire, Wales","hook":"Gilbert White wrote his famous nature letters to this Welsh naturalist, whose popular books introduced ordinary readers to the animals of Britain and the Arctic."},"Ignaz Schiffermüller":{"birth":"Upper Austria","hook":"Besides cataloguing the butterflies around Vienna, he devised one of the earliest colour wheels to help name the exact shades of insects' wings."},"Michel Adanson":{"birth":"Aix-en-Provence, France","hook":"He spent five years exploring Senegal, and the giant African baobab tree, Adansonia, is named in his honour."},"Nikolaus Joseph von Jacquin":{"birth":"Leiden, Netherlands","hook":"Sent by the Austrian emperor to the Caribbean, he braved the tropics to ship exotic plants back to fill Vienna's imperial gardens at Schönbrunn."},"Carlo Allioni":{"birth":"Turin (Po), Italy","hook":"Nicknamed the 'Piedmontese Linnaeus,' he catalogued thousands of plants growing across the mountains and valleys of northwest Italy."},"Georg Christian Oeder":{"birth":"Ansbach, Germany","hook":"He launched Flora Danica, a plan to paint every wild plant in the Danish kingdom — a project so huge it took later botanists over a century to finish."},"John Hunter":{"birth":"East Kilbride, Scotland","hook":"This surgeon built a collection of thousands of specimens and controversially obtained the skeleton of a 7-foot 'Irish Giant' who had begged not to be dissected."},"Johann Reinhold Forster":{"birth":"Dirschau (Vistula), Poland","hook":"Sailing around the world with Captain Cook, he pioneered biogeography — the study of why different creatures live in different places — despite his famously quarrelsome temper."},"Louis Antoine de Bougainville":{"birth":"Paris (Seine), France","hook":"He led France's first voyage around the world; the flaming bougainvillea is named after him, and his crew secretly included the first woman to circle the globe."},"Pehr Loefling":{"birth":"Gästrikland, Sweden","hook":"Linnaeus's favourite pupil, he collected plants along the Orinoco River in South America but died of tropical fever at just 27."},"Pehr Löfling":{"birth":"Gästrikland, Sweden","hook":"Linnaeus mourned him like a son; this young botanist discovered new plants in Spain and Venezuela before dying of fever deep in the tropics at 27."},"Moses Harris":{"birth":"England","hook":"As well as painting British butterflies alongside the plants they feed on, he created one of the first colour wheels showing how colours blend."},"Otto Friedrich Müller":{"birth":"Copenhagen, Denmark","hook":"He was among the first to give scientific names to the tiny 'animalcules' swarming in a drop of pond water, even naming some of the earliest known bacteria."},"Erasmus Darwin":{"birth":"Elston, England","hook":"Charles Darwin's grandfather, this poet-doctor wrote scientific ideas as verse and boldly suggested, decades early, that all life sprang from one common ancestor."},"William Aiton":{"birth":"Hamilton, Scotland","hook":"From a Scottish farm boy to head of the royal gardens at Kew, he catalogued the thousands of exotic plants gathered there from around the world."},"José Celestino Mutis":{"birth":"Cádiz, Spain","hook":"A priest in the Andes, he studied cinchona bark — source of the malaria cure quinine — and directed artists to produce thousands of stunning plant paintings."},"Joseph Gärtner":{"birth":"Calw, Germany","hook":"He founded the science of fruits and seeds, dissecting and drawing them with such care that he kept working even as his own eyesight faded."},"Pehr Forsskal":{"birth":"Helsinki, Finland","hook":"Before dying of fever in Yemen, this fiery Swede described Red Sea wildlife — and also wrote a daring pamphlet defending free speech."},"Antoine Gouan":{"birth":"Montpellier, France","hook":"He championed Linnaeus's new naming system in France, applying it to the rich plant life around Montpellier and helping win French botanists over."},"Carsten Niebuhr":{"birth":"Lüdingworth, Germany","hook":"The only member of a six-man expedition to survive Arabia, he copied ancient cuneiform so accurately that scholars later used his drawings to crack the lost script."},"Daniel Solander":{"birth":"Piteå, Sweden","hook":"Sailing with Cook and Banks on the Endeavour, he nearly froze to death in Tierra del Fuego, then helped catalogue Australia's first known plants."},"Joseph Gottlieb Kölreuter":{"birth":"Sulz am Neckar (Neckar), Germany","hook":"Through hundreds of careful crosses between tobacco plants, he proved both parents pass on traits through pollen and egg, founding the science of plant breeding."},"Nicolaas Laurens Burman":{"birth":"Amsterdam (Amstel), Netherlands","hook":"He learned botany directly from Linnaeus, who once stayed at his family's home, then catalogued the plants of the faraway East Indies."},"James Bolton":{"birth":"Halifax, England","hook":"A self-taught Yorkshireman, he wrote and illustrated Britain's first book devoted entirely to fungi, painting mushrooms with astonishing accuracy."},"Jan Christiaan Sepp":{"birth":"Amsterdam (Amstel), Netherlands","hook":"This Amsterdam publisher created breathtaking colour plates of Dutch insects shown together with the exact plants they lived and fed upon."},"William Bartram":{"birth":"Philadelphia, USA","hook":"His thrilling account of battling giant alligators in a Florida swamp captivated readers and inspired Romantic poets like Coleridge and Wordsworth."},"John Latham":{"birth":"Eltham, England","hook":"Known as the grandfather of Australian bird study, he gave the first descriptions of the emu and the lyrebird, and lived to the remarkable age of 96."},"Juan Ignacio Molina":{"birth":"Villa Alegre, Chile","hook":"Expelled from Chile as a Jesuit, he wrote from exile in Italy the first natural history of his homeland, introducing Europe to Chilean plants and animals."},"Peter Simon Pallas":{"birth":"Berlin (Spree), Germany","hook":"Exploring Siberia for Catherine the Great, he studied frozen Ice Age beasts and catalogued countless new animals across the vast Russian empire."},"Eugenius Johann Christoph Esper":{"birth":"Wunsiedel, Germany","hook":"He set out to picture every butterfly and moth in Europe in vivid hand-coloured plates, and also produced pioneering illustrated studies of corals."},"Felix de Azara":{"birth":"Barbuñales, Spain","hook":"Sent to map a South American border, this soldier ended up stranded for 20 years and, self-taught, described Paraguay's animals so well that Darwin later praised him."},"Carl Peter Thunberg":{"birth":"Jönköping, Sweden","hook":"Confined to Japan's only foreign trading post, he found new plants by picking through the hay brought ashore as fodder to feed the livestock."},"Eberhard August Wilhelm von Zimmermann":{"birth":"Uelzen, Germany","hook":"He drew one of the world's first animal maps, plotting where each mammal lives and asking why lions roam Africa while polar bears cling to the ice."},"Joseph Banks":{"birth":"London (River Thames), England","hook":"He spent his own fortune to sail with Captain Cook to Tahiti and Australia, where Botany Bay was named for the flood of new plants he gathered."},"Marmaduke Tunstall":{"birth":"England","hook":"He kept a private menagerie and a cabinet so crammed with birds and curiosities that it later became one of England's earliest natural history museums."},"William Paley":{"birth":"Peterborough (River Nene), England","hook":"He argued that finding a watch on a heath proves a watchmaker exists, so nature's design must prove a Creator, an idea Darwin spent his life answering."},"Johann Andreas Naumann":{"birth":"Ziebigk, Anhalt, Germany","hook":"A self-taught farmer, he wrote northern Germany's first great bird book and etched and hand-coloured its plates himself, launching a whole dynasty of ornithologists."},"Johann Gottfried Herder":{"birth":"Mohrungen, Prussia (now Morąg, Poland)","hook":"He argued that every people has its own spirit and language, and that nature and history flow together like one great living, unfolding organism."},"Antonio José Cavanilles":{"birth":"Valencia (River Turia), Spain","hook":"This Spanish priest named the dahlia, now Mexico's national flower, after a fellow botanist while running Madrid's royal garden."},"Johann Christian Fabricius":{"birth":"Tønder, Denmark","hook":"Ignoring wings, he classified insects by their mouthparts and described nearly 10,000 species, more than almost anyone before him."},"André Michaux":{"birth":"Satory, near Versailles, France","hook":"He hunted plants from the deserts of Persia to the forests of America, and died of fever while exploring the island of Madagascar."},"Gerard van Spaendonck":{"birth":"Tilburg, Netherlands","hook":"Master flower-painter at the Paris museum, he taught the legendary Redouté and helped switch botanical art from thick gouache to glowing watercolour on calf-skin vellum."},"William Curtis":{"birth":"Alton, Hampshire, England","hook":"His guide to London's wildflowers lost money, so he founded The Botanical Magazine, still published today, filling it with the exotic blooms readers actually wanted."},"Anders Sparrman":{"birth":"Tensta, Sweden","hook":"He sailed with Captain Cook across the Antarctic Circle into iceberg-filled seas, then explored southern Africa collecting unknown plants and animals."},"Félix Vicq d'Azyr":{"birth":"Valognes, Normandy, France","hook":"He mapped hidden structures deep in the brain, one nerve bundle still carries his name, and served as personal physician to Queen Marie Antoinette."},"Johann Friedrich Gmelin":{"birth":"Tübingen (River Neckar), Germany","hook":"He crammed thousands of newly discovered species into a giant 13th edition of Linnaeus's great catalogue, though later scientists found many of his names muddled."},"Louis Jean Pierre Vieillot":{"birth":"Yvetot, Normandy, France","hook":"He preferred watching living birds to studying dead skins, fleeing revolution to America and describing hundreds of species by their habits and songs."},"Thomas Marsham":{"birth":"England","hook":"As the Linnean Society's very first secretary he helped launch British natural science, and painstakingly catalogued the nation's beetles."},"Johann Wolfgang von Goethe":{"birth":"Frankfurt am Main (River Main), Germany","hook":"The author of Faust was also a keen scientist who identified a bone in the human jaw and searched for the 'Urpflanze', an ideal plant behind all plants."},"Christian Konrad Sprengel":{"birth":"Brandenburg an der Havel, Germany","hook":"He worked out that flowers' colours, patterns and nectar are advertisements to lure insects for pollination, a discovery so ignored that Darwin only later proved him right."},"René Louiche Desfontaines":{"birth":"Tremblay, Brittany, France","hook":"He journeyed through the wild mountains of Tunisia and Algeria, cataloguing North Africa's plants before taking charge of the Paris botanic garden."},"John Abbot":{"birth":"London (River Thames), England","hook":"This Londoner sailed to Georgia and spent decades painting thousands of American butterflies, moths and birds, each shown with the exact plant it fed on."},"William Roxburgh":{"birth":"Craigie, Ayrshire, Scotland","hook":"A ship's surgeon turned 'father of Indian botany', he ran Calcutta's garden and had Indian artists paint the country's plants in glorious detail."},"Johann Friedrich Blumenbach":{"birth":"Gotha, Germany","hook":"He gathered a famous collection of human skulls and divided humanity into five groups, becoming a founder of the study of human variety."},"François Levaillant":{"birth":"Paramaribo, Dutch Guiana (now Suriname)","hook":"Born in South America, he trekked deep into southern Africa hunting rare animals and wrote lavish bird books that scorned stiff Latin names."},"George Montagu":{"birth":"Lackham, Wiltshire, England","hook":"An army officer turned bird expert, he untangled Britain's muddled bird names, and the graceful Montagu's harrier is named in his honour."},"Thomas Bewick":{"birth":"Cherryburn (River Tyne), England","hook":"His tiny, exquisite wood-engravings of British birds were so beloved that Charlotte Brontë had her heroine Jane Eyre pore over them."},"Archibald Menzies":{"birth":"near Aberfeldy, Perthshire, Scotland","hook":"At a dinner in Chile he pocketed the monkey-puzzle nuts served as dessert, sprouted them aboard ship, and carried the strange spiky tree to Britain."},"Georg Forster":{"birth":"Nassenhuben, near Danzig (now Poland)","hook":"Just seventeen, he sailed around the world with Captain Cook and wrote one of history's greatest travel books about the voyage."},"Hipólito Ruiz López":{"birth":"Belorado, Burgos, Spain","hook":"He spent over a decade exploring Peru and Chile, only to lose priceless specimens to shipwreck and a fire that burned his field station."},"Bernard Germain de Lacépède":{"birth":"Agen (River Garonne), France","hook":"A talented composer as well as a naturalist, he completed Buffon's vast natural history with major volumes on fishes, snakes and whales."},"Guillaume-Antoine Olivier":{"birth":"Les Arcs, Provence, France","hook":"He journeyed for years through the Ottoman Empire and Persia, returning with a treasure of beetles for his huge illustrated insect encyclopaedia."},"Erik Acharius":{"birth":"Gävle, Sweden","hook":"As Linnaeus's very last pupil, he devoted himself to lichens, the crusty growths on rocks and trees, becoming the founding father of their study."},"James Sowerby":{"birth":"London (River Thames), England","hook":"His workshop hand-coloured thousands of plant portraits for English Botany, putting accurate, affordable flower pictures into ordinary people's hands."},"Johann Matthäus Bechstein":{"birth":"Waltershausen, Thuringia, Germany","hook":"A forester who wrote a hugely popular guide to keeping cage birds, he was among the first to argue that wild birds deserve protection."},"Franz Bauer":{"birth":"Feldsberg, Austria (now Valtice, Czech Republic)","hook":"His plant drawings were so microscopically precise that Joseph Banks paid him to stay at Kew for life and prized his work above every other artist's."},"John Sibthorp":{"birth":"Oxford (River Thames), England","hook":"His stunning Flora Graeca, illustrated from a daring Greek expedition, is still the most expensive botanical book ever printed."},"James Edward Smith":{"birth":"Norwich (River Wensum), England","hook":"As a young man he bought Linnaeus's entire collection and shipped it to England; legend says Sweden's king sent a ship too late to stop it."},"Jean-Baptiste Audebert":{"birth":"Rochefort, France","hook":"He perfected printing with real gold, making his posthumous books of hummingbirds and sunbirds shimmer with metallic, jewel-like colour."},"William Kirby":{"birth":"Witnesham, Suffolk, England","hook":"A country clergyman nicknamed the 'father of entomology', he co-wrote a bug book so popular it helped turn insect-collecting into a national craze."},"Olof Swartz":{"birth":"Norrköping, Sweden","hook":"He explored the islands of the West Indies and became a world expert on orchids and ferns, naming hundreds of tropical plants."},"Sarah Stone":{"birth":"London (River Thames), England","hook":"Largely self-taught, she painted thousands of specimens, including creatures brought home from Captain Cook's Pacific voyages, in a now-vanished London museum."},"Jacob Hübner":{"birth":"Augsburg, Germany","hook":"His bold illustrations and new groupings completely reshaped how butterflies and moths are classified across Europe and beyond."},"Kaspar Maria von Sternberg":{"birth":"Prague (River Vltava), Bohemia","hook":"This Bohemian count founded the science of fossil plants, reading ancient forests hidden in stone, and helped create Prague's National Museum."},"Johann Wilhelm Meigen":{"birth":"Solingen, Germany","hook":"Working in poverty, he almost single-handedly founded the scientific study of two-winged flies, the buzzing insects most people simply swat."},"Carl Ludwig Willdenow":{"birth":"Berlin (River Spree), Germany","hook":"Running Berlin's botanic garden, he fired the imagination of a teenage Alexander von Humboldt, setting him on the path to becoming a legendary explorer."},"Pierre Antoine Poiteau":{"birth":"Ambleny, France","hook":"Starting as a humble garden labourer, he rose to become a master painter of oranges and fruit trees, blending scientific skill with beautiful art."},"Adrian Hardy Haworth":{"birth":"Hull, England (River Hull)","hook":"So obsessed with succulents that he built one of England's greatest cactus collections, he was killed by the cholera epidemic that swept London in 1833."},"Edward Donovan":{"birth":"Cork, Ireland","hook":"He opened his own natural-history museum in London packed with beautiful insect drawings, then died penniless after bruising legal battles with his publishers."},"Jacques Barraband":{"birth":"Aubusson, France (River Creuse)","hook":"His parrots looked so alive that Napoleon himself admired them and put him in charge of designing imperial tapestries and porcelain."},"Robert John Thornton":{"birth":"London, England","hook":"He poured his whole fortune into the dazzling 'Temple of Flora' and even ran a lottery to save it, yet still died bankrupt."},"Sydenham Edwards":{"birth":"Usk, Wales (River Usk)","hook":"Spotted as a boy for his drawing talent, he illustrated over 1,700 plant plates before quitting to launch a rival magazine."},"Amédée Louis Michel Lepeletier de Saint-Fargeau":{"birth":"Paris, France","hook":"His father, a revolutionary who voted to execute the king, was assassinated the very eve of Louis XVI's death; Amédée turned to studying bees and wasps."},"Christian Rudolph Wilhelm Wiedemann":{"birth":"Braunschweig, Germany","hook":"A surgeon and professor, he became the pioneer of exotic flies, describing insects from tropical lands he himself never set foot in."},"François André Michaux":{"birth":"Versailles, France","hook":"As a teenager he crossed the American wilderness with his botanist father, and later warned that the young country was felling its forests far too fast."},"Charles Athanase Walckenaer":{"birth":"Paris, France","hook":"This Parisian scholar wrote the first big systematic study of spiders — and also a celebrated biography of the fable-writer La Fontaine."},"Jakob Sturm":{"birth":"Nuremberg, Germany (River Pegnitz)","hook":"He engraved thousands of astonishingly tiny, detailed plant and insect plates for pocket books people could carry right into the fields."},"Carl Johan Schönherr":{"birth":"Stockholm, Sweden","hook":"He tackled the weevils — one of the largest families of beetles on Earth — organising thousands of species with helpers writing to him worldwide."},"Étienne Geoffroy Saint-Hilaire":{"birth":"Étampes, France","hook":"On Napoleon's Egyptian campaign he refused to surrender his specimens to the British, reportedly threatening to burn them rather than hand them over."},"Pancrace Bessa":{"birth":"Paris, France","hook":"A pupil of the great Redouté, he became a favourite flower painter of French royalty and gave art lessons to the Duchess de Berry."},"Thomas Horsfield":{"birth":"Bethlehem, Pennsylvania, USA (Lehigh River)","hook":"An American doctor who spent almost two decades in the jungles of Java, collecting its mammals, birds and butterflies for the East India Company."},"André Marie Constant Duméril":{"birth":"Amiens, France (River Somme)","hook":"A prodigy who lectured on anatomy in his teens, he later co-wrote a nine-volume work describing the reptiles and amphibians of the whole world."},"Frederick Traugott Pursh":{"birth":"Grossenhain, Germany","hook":"He described the strange new plants brought back from the Lewis and Clark expedition, yet died young and penniless in Montreal."},"Georg Heinrich von Langsdorff":{"birth":"Wöllstein, Germany","hook":"After sailing around the world, he led an expedition deep into Brazil's rainforest that collapsed when fever wiped away his own memory."},"Friedrich Schelling":{"birth":"Leonberg, Germany","hook":"A philosophical prodigy who entered university at fifteen, he imagined all of nature as a single living, growing, self-developing organism."},"Jean Guillaume Audinet-Serville":{"birth":"Paris, France","hook":"He sorted out the classification of grasshoppers, crickets and stick insects — bringing order to some of the noisiest creatures on Earth."},"Johann Karl Wilhelm Illiger":{"birth":"Braunschweig, Germany","hook":"The first curator of Berlin's natural-history museum, he named many animal groups still used today before tuberculosis killed him at just 38."},"Pierre Jean François Turpin":{"birth":"Vire, France (River Vire)","hook":"A self-taught soldier who met a botanist while stationed in Haiti, he transformed himself into one of France's finest plant painters."},"Henri Marie Ducrotay de Blainville":{"birth":"Arques-la-Bataille, France","hook":"He inherited the chairs of both Lamarck and Cuvier in Paris and coined scientific names for whole groups of animals still used today."},"Augustin-Pyramus de Candolle":{"birth":"Geneva, Switzerland","hook":"He coined the very word 'taxonomy' and set out on the near-impossible dream of describing every single seed plant on Earth."},"Charles Alexandre Lesueur":{"birth":"Le Havre, France","hook":"As artist on a voyage to Australia he drew thousands of jellyfish and sea creatures, many of them never seen by science before."},"Auguste de Saint-Hilaire":{"birth":"Orléans, France (River Loire)","hook":"He journeyed through Brazil for six years and nearly died after tasting a poisonous plant he was studying in the wild."},"Lorenz Oken":{"birth":"Bohlsbach, Germany","hook":"He stunned scientists by claiming the skull was built from transformed backbones — an idea said to have struck him over a cracked deer skull."},"William Hooker (fruit painter)":{"birth":"England","hook":"As official painter to London's Horticultural Society, he set a dazzling new standard for portraying British apples, pears and other fruits."},"Johann Friedrich Naumann":{"birth":"Ziebigk, Germany","hook":"Called the father of German bird study, he drew, engraved and even hand-coloured the plates for his own great work on Germany's birds."},"Maximilian Spinola":{"birth":"Pézenas, France","hook":"An Italian marquis who turned his castle at Tassarolo into a buzzing centre of beetle study, describing insects sent from across the globe."},"Pierre François Marie Auguste Dejean":{"birth":"Amiens, France (River Somme)","hook":"A Napoleonic general so beetle-mad that he pinned a rare specimen inside his helmet before a battle in Spain — and found it safe after his hat was shot to pieces."},"Adelbert von Chamisso":{"birth":"Boncourt, Champagne, France","hook":"A French aristocrat who fled the Revolution, became a German poet, sailed around the world, and discovered how salps switch between generations."},"Johann Baptist von Spix":{"birth":"Höchstadt an der Aisch, Germany","hook":"He hauled home thousands of Brazilian monkeys, bats and birds, but the punishing expedition ruined his health and he died at 45."},"Pauline Knip":{"birth":"Paris, France","hook":"One of very few women bird artists of her time, she painted for two empresses and cleverly put her own name above the scientist's on their book of pigeons."},"William John Burchell":{"birth":"Fulham, London, England","hook":"He crossed southern Africa by ox-wagon, collecting over 50,000 specimens; the striped Burchell's zebra still carries his name."},"Georg August Goldfuss":{"birth":"Thurnau, Germany","hook":"He systematically illustrated Germany's fossils and gave scientific names to extinct shells and creatures buried in ancient rock."},"Maximilian zu Wied-Neuwied":{"birth":"Neuwied, Germany (River Rhine)","hook":"A German prince who travelled up the Missouri River, living among Native American nations and carefully recording their languages and customs."},"Constantine Samuel Rafinesque":{"birth":"Galata, Constantinople (now Istanbul), Ottoman Empire","hook":"This eccentric genius named thousands of species and once smashed his host Audubon's violin to swat bats in the middle of the night."},"William Spence":{"birth":"Bishop Burton, England","hook":"An economist who co-wrote the most popular introduction to insects ever printed and helped found London's Royal Entomological Society."},"William Yarrell":{"birth":"London, England","hook":"A London bookseller and newsagent whose spare-time studies made him author of the go-to Victorian guides to British birds and fishes."},"William Jackson Hooker":{"birth":"Norwich, England (River Wensum)","hook":"First drawn to nature by discovering a rare moss, he grew Kew Gardens into the greatest botanical institution in the world."},"Nathaniel Wallich":{"birth":"Copenhagen, Denmark","hook":"A Danish surgeon captured by the British in India, he went on to run Calcutta's botanic garden and ship thousands of Himalayan plants to Europe."},"Thomas Nuttall":{"birth":"Long Preston, England","hook":"A printer who taught himself botany, he wandered the American wilderness alone, so lost in studying plants that he sometimes went missing for days."},"Christian Ludwig Brehm":{"birth":"Schönau vor dem Walde, Germany","hook":"A country pastor who crammed around 15,000 stuffed birds into his parsonage — a collection so vast it was rediscovered decades after his death."},"John Richardson":{"birth":"Dumfries, Scotland (River Nith)","hook":"A naval surgeon who survived starvation on Franklin's disastrous Arctic trek, then returned north years later to search for his lost friend."},"Carl Sigismund Kunth":{"birth":"Leipzig, Germany","hook":"He scientifically described the enormous plant hauls Humboldt brought back from South America, publishing thousands of species new to science."},"Jacques Boucher de Perthes":{"birth":"Rethel, France (River Aisne)","hook":"By finding ancient flint tools beside extinct animals in the Somme gravels, he proved humans were far older than anyone had believed."},"Prideaux John Selby":{"birth":"Alnwick, England (River Aln)","hook":"He was the first to draw British birds at full life-size, producing giant hand-coloured plates to rival Audubon's famous folios."},"Joakim Frederik Schouw":{"birth":"Copenhagen, Denmark","hook":"He carved the whole planet into plant kingdoms, naming each region after the plants that ruled it, like drawing countries for flowers."},"William Scoresby":{"birth":"Cropton, near Whitby, England","hook":"As a young whaler he sailed to within about 800 kilometres of the North Pole, farther north than anyone had reached before."},"William Swainson":{"birth":"Liverpool (River Mersey), England","hook":"He was convinced all of nature was secretly built from circles of five, a strange theory that eventually wrecked his scientific reputation."},"Jules Dumont d'Urville":{"birth":"Condé-sur-Noireau, France","hook":"He helped France snatch the famous Venus de Milo statue and reached Antarctica, then died in France's first great railway disaster."},"John Curtis":{"birth":"Norwich (River Wensum), England","hook":"His engravings were so precise he drew each insect beside the exact plant it fed on, turning bug guides into gorgeous artwork."},"Sarah Bowdich Lee":{"birth":"Colchester, England","hook":"She braved fever-ridden West African rivers collecting specimens, and kept writing and painting nature after her explorer husband died on their journey."},"William Elford Leach":{"birth":"Plymouth, England","hook":"He named a whole string of sea-creature genera as scrambled anagrams of the mysterious name 'Caroline'."},"Augusta Innes Withers":{"birth":"England","hook":"As official flower painter to Queen Adelaide, she helped illustrate the largest orchid book ever printed, so big it needed its own table."},"James Francis Stephens":{"birth":"Shoreham-by-Sea, England","hook":"He spent years cataloguing the British Museum's insects in his spare time, documenting thousands of Britain's tiniest creatures volume after volume."},"Karl Ernst von Baer":{"birth":"Piep (Piibe), Estonia","hook":"Peering inside a dog, he discovered the mammalian egg cell, proving that even humans begin life as a single tiny egg."},"Roderick Murchison":{"birth":"Tarradale, Scotland","hook":"He named a huge chapter of Earth's ancient history the 'Silurian' after the Silures, a warlike tribe that once fought the Romans in Wales."},"William Sharp Macleay":{"birth":"London, England","hook":"He claimed all living things fit into neat interlocking circles of five, an idea that briefly dazzled and then baffled other naturalists."},"Johann Friedrich von Eschscholtz":{"birth":"Dorpat (Tartu), Estonia","hook":"He sailed around the world twice, and California's golden state flower, the Eschscholzia poppy, was named in his honour by his best friend."},"Robert Havell":{"birth":"Reading (River Thames), England","hook":"He spent over a decade engraving all 435 life-size bird plates for Audubon's colossal Birds of America, one of the most valuable books on Earth."},"Achille Valenciennes":{"birth":"Paris (River Seine), France","hook":"He helped write a mind-boggling twenty-two-volume encyclopedia trying to describe every fish then known to science."},"Christian Heinrich Pander":{"birth":"Riga (River Daugava), Latvia","hook":"Watching chicken eggs develop, he spotted three magical layers of cells from which every organ of the body is built."},"Eduard Rueppell":{"birth":"Frankfurt am Main (River Main), Germany","hook":"The vulture named after him, Rüppell's griffon, is the highest-flying bird ever recorded, once struck by a plane at 11,000 metres."},"Eduard Rüppell":{"birth":"Frankfurt am Main (River Main), Germany","hook":"Rich enough to fund his own expeditions, he plunged into Ethiopia and hauled back so many new species that dozens now carry his name."},"Elias Magnus Fries":{"birth":"Femsjö, Sweden","hook":"He knew mushrooms so well that his 1821 book became the official starting point scientists still use for naming all fungi."},"René Primevère Lesson":{"birth":"Rochefort (River Charente), France","hook":"As a ship's surgeon he became the first European naturalist to watch living birds of paradise dancing in the wild of New Guinea."},"Christian Gottfried Ehrenberg":{"birth":"Delitzsch, Germany","hook":"He proved that entire rock cliffs, and even the eerie glow of the night sea, are built from billions of invisible microscopic creatures."},"Thaddeus William Harris":{"birth":"Dorchester, Massachusetts, USA","hook":"Working as Harvard's librarian by day, he studied the insects destroying America's crops, founding the science of fighting farm pests."},"Carl Ludwig Blume":{"birth":"Braunschweig (Brunswick), Germany","hook":"He explored the steaming jungles of Java, cataloguing exotic orchids and plants that had never been seen by European science."},"Henry De la Beche":{"birth":"London, England","hook":"Using Mary Anning's fossils, he painted the very first scene of prehistoric monsters battling in an ancient sea, inventing dinosaur art."},"John Torrey":{"birth":"New York City, USA","hook":"From New York he identified the strange new plants that explorers shipped back from the wild, unmapped American West."},"Orra White Hitchcock":{"birth":"South Amherst, Massachusetts, USA","hook":"She drew giant classroom charts of dinosaur footprints and ancient rocks, becoming one of America's first women scientific illustrators."},"William MacGillivray":{"birth":"Old Aberdeen, Scotland","hook":"To see the natural history collections in London, he once walked over 800 miles on foot the long way, through the Highlands."},"Andrew Smith":{"birth":"Hawick, Scotland","hook":"An army doctor, he led an expedition deep into unexplored southern Africa and later met a young Charles Darwin at the Cape."},"Étienne Mulsant":{"birth":"Marnand, France","hook":"A quiet librarian, he wrote the definitive book on France's beetles, then turned around and produced huge works on tropical hummingbirds."},"Frederick William Hope":{"birth":"London, England","hook":"This insect-obsessed clergyman gave his entire enormous bug collection to Oxford University, founding a museum treasure that still bears his name."},"Félix Édouard Guérin-Méneville":{"birth":"Toulon, France","hook":"He illustrated the entire animal kingdom in pictures, then battled a mysterious disease wiping out France's precious silkworms."},"Gottlieb August Wilhelm Herrich-Schäffer":{"birth":"Regensburg (River Danube), Germany","hook":"A working doctor, he produced beautifully detailed illustrated volumes that reorganised how Europe's butterflies and moths were classified."},"Jean Baptiste Boisduval":{"birth":"Ticheville, France","hook":"A country doctor who became the world's top butterfly authority, naming dazzling species collected from every continent on Earth."},"John Lindley":{"birth":"Catton, near Norwich, England","hook":"His report rescued Kew Gardens from being shut down, and he became Britain's leading expert on exotic orchids."},"Priscilla Susan Bury":{"birth":"near Liverpool, England","hook":"An amateur painting the lilies in her own garden, she produced enormous, glowing flower plates now counted among the finest ever printed."},"Titian Peale":{"birth":"Philadelphia, Pennsylvania, USA","hook":"Named after a famous Renaissance painter, he sailed with the US Exploring Expedition, painting wildlife across the Pacific and Antarctic."},"George Bentham":{"birth":"Stoke, near Plymouth, England","hook":"Entirely self-taught, he classified every known genus of seed plant on Earth, a monumental system botanists still rely on today."},"Heinrich Georg Bronn":{"birth":"Ziegelhausen, near Heidelberg, Germany","hook":"He introduced Darwin's revolutionary ideas to Germany by translating On the Origin of Species, sneaking in his own doubtful footnotes."},"Henri Milne-Edwards":{"birth":"Bruges, Belgium","hook":"Said to be one of at least twenty-seven children, he grew up to become France's great master of crabs, shrimps and lobsters."},"James Clark Ross":{"birth":"London, England","hook":"He was first to stand at the North Magnetic Pole, then sailed to Antarctica, where a vast floating ice shelf now bears his name."},"Johann Georg Wagler":{"birth":"Nuremberg (River Pegnitz), Germany","hook":"He died at just 32 when his own gun accidentally went off while he was out collecting specimens in the field."},"Adolphe Brongniart":{"birth":"Paris (River Seine), France","hook":"The father of fossil-plant science, he read Earth's deep history in the shapes of ancient leaves pressed into stone."},"Christian Erich Hermann von Meyer":{"birth":"Frankfurt am Main (River Main), Germany","hook":"He named Archaeopteryx, the feathered fossil that stunned the world by linking dinosaurs to modern birds."},"Edward Newman":{"birth":"Hampstead, London, England","hook":"A printer as well as a naturalist, he put beautifully illustrated butterfly and moth books into the hands of ordinary people."},"Félix Dujardin":{"birth":"Tours (River Loire), France","hook":"Peering through his microscope, he discovered the living jelly inside cells he called 'sarcode', which we now know as protoplasm."},"Johannes Peter Müller":{"birth":"Koblenz (River Rhine), Germany","hook":"He explained why the same tap on an eye and an ear makes us see light but hear sound, and taught a generation of future scientific giants."},"Alcide d'Orbigny":{"birth":"Couëron (River Loire), France","hook":"He spent eight years exploring South America and founded the study of forams, ocean creatures smaller than a grain of sand."},"Johann Moritz Rugendas":{"birth":"Augsburg (River Lech), Germany","hook":"He joined a Russian-led expedition deep into Brazil's rainforests, then spent years painting Mexico and the Andes, becoming Europe's window onto Latin America."},"Charles Lucien Bonaparte":{"birth":"Paris, France","hook":"A nephew of Emperor Napoleon, he swapped imperial ambition for birds, reorganising how species are classified across both America and Europe."},"Constantin Wilhelm Lambert Gloger":{"birth":"Grobnig, Silesia (now Poland)","hook":"He noticed animals wear darker coats in warm, damp places than in cool, dry ones — a pattern biologists still call Gloger's rule today."},"Miles Joseph Berkeley":{"birth":"Biggin Hall, near Oundle, Northamptonshire, England","hook":"He proved that a microscopic fungus — not bad weather — caused the blight that starved Ireland, founding the whole science of plant disease."},"Sarah Anne Drake":{"birth":"Skeyton, Norfolk, England","hook":"Working quietly from an English home, she painted the lavish orchid plates for the largest botanical book ever printed — so heavy it needed its own stand."},"Elizabeth Gould":{"birth":"Ramsgate, Kent, England","hook":"She drew and printed the very finches Darwin brought back from the Beagle, then sailed to Australia to paint its birds — dying at just 37."},"Hermann Schlegel":{"birth":"Altenburg, Germany","hook":"Running a great museum in Leiden, he named snakes, birds and mammals from across Asia and wrote one of the first books on the 'faces' of serpents."},"Karl Theodor Ernst von Siebold":{"birth":"Würzburg (River Main), Germany","hook":"He proved that a queen bee can produce sons from unfertilised eggs — a real 'virgin birth' inside the hive."},"Stephan Endlicher":{"birth":"Pressburg (River Danube), now Bratislava, Slovakia","hook":"Fluent in Chinese and a master of plants, he tried to classify every plant on Earth — yet died ruined and in despair at only 45."},"Anna Maria Hussey":{"birth":"England","hook":"A country parson's wife, she hunted and hand-coloured British mushrooms so beautifully that her plates still guide fungus-lovers."},"Elizabeth Twining":{"birth":"London, England","hook":"Heiress to the famous Twinings tea dynasty, she used her fortune to paint plant families and bring botany to ordinary people."},"Frederick Smith":{"birth":"London, England","hook":"At the British Museum he named thousands of the world's bees, wasps and ants from specimens shipped in from every continent."},"Hugo von Mohl":{"birth":"Stuttgart, Germany","hook":"Peering through his microscope, he gave a name to the living jelly inside every plant cell: 'protoplasm'."},"Isidore Geoffroy Saint-Hilaire":{"birth":"Paris, France","hook":"He founded the science of birth deformities, invented the word 'ethology', and even campaigned to bring exotic animals onto French farms and dinner plates."},"John Obadiah Westwood":{"birth":"Sheffield (River Don), England","hook":"Oxford's very first professor of insects, he could draw a beetle so precisely that his pictures became the standard scientists used to identify species."},"Michael Sars":{"birth":"Bergen, Norway","hook":"His deep-sea dredges pulled up living creatures from depths where scientists had flatly insisted nothing could survive."},"Alphonse de Candolle":{"birth":"Paris, France","hook":"He mapped and counted plants like a statistician, and traced everyday crops such as wheat and potatoes back to their wild ancestral homelands."},"Anne Pratt":{"birth":"Strood (River Medway), Kent, England","hook":"Often unwell as a child, she turned to studying plants indoors — and grew up to put colourful wildflower books into thousands of Victorian homes."},"Friedrich Welwitsch":{"birth":"Maria Saal, Carinthia, Austria","hook":"In Angola's harsh desert he found Welwitschia — a strange plant with just two ever-growing leaves that can live over a thousand years."},"William Chapman Hewitson":{"birth":"Newcastle upon Tyne (River Tyne), England","hook":"One of Britain's wealthiest collectors, he poured his fortune into amassing exotic butterflies and painting their dazzling wings in stunning detail."},"Benjamin Waterhouse Hawkins":{"birth":"London, England","hook":"On New Year's Eve 1853 he hosted a dinner party for twenty guests seated inside the hollow mould of a life-size Iguanodon."},"Hermann Burmeister":{"birth":"Stralsund, Germany","hook":"He left Germany for Argentina, unearthing armoured Glyptodons and giant ground sloths and running the natural-history museum in Buenos Aires."},"Hermann Loew":{"birth":"Weißenfels (River Saale), Germany","hook":"He described so many flies from Europe and North America that modern fly science still rests on his painstaking work."},"Jane Loudon":{"birth":"near Birmingham, England","hook":"Long before her gardening books, she wrote 'The Mummy!', a science-fiction novel set in the 22nd century with a reanimated Egyptian king."},"Louis Agassiz":{"birth":"Môtier, Switzerland","hook":"Reading scratched rocks and stranded boulders, he stunned the world by declaring that Earth had once been gripped by a great Ice Age."},"Camillo Rondani":{"birth":"Parma (River Parma), Italy","hook":"Almost single-handedly he sorted and organised all of Italy's flies, becoming his country's undisputed master of the buzzing insects."},"Hugh Falconer":{"birth":"Forres, Scotland","hook":"In India's Siwalik Hills he dug up colossal fossil tortoises and ancient elephants, and helped launch tea growing in the region."},"Achille Guenée":{"birth":"Chartres (River Eure), France","hook":"A working lawyer by day, he classified the world's moths by night, sorting thousands of species into orderly families."},"Asa Fitch":{"birth":"Salem, New York, USA","hook":"As New York's first-ever state entomologist, he tracked the bugs devouring farmers' crops and helped launch pest control in America."},"Francis Walker":{"birth":"Southgate, London, England","hook":"He named a staggering number of insects for the British Museum — so fast and carelessly that later scientists spent decades untangling his mistakes."},"Franz Wilhelm Junghuhn":{"birth":"Mansfeld, Germany","hook":"He climbed Java's steaming volcanoes and mapped its jungles so thoroughly he became known as the 'Humboldt of Java'."},"Friedrich August Quenstedt":{"birth":"Eisleben, Germany","hook":"A wizard with ammonites, he used their coiled shells to read the age of Germany's rocks, layer by ancient layer."},"Karl Bodmer":{"birth":"Riesbach (Zürich), Switzerland","hook":"He journeyed up the Missouri River with a German prince, painting Plains Indian nations with a precision that preserves a now-vanished world."},"Oswald Heer":{"birth":"Niederuzwil, Switzerland","hook":"Studying fossil leaves and insects, he showed that even icy Greenland once basked in a warm, forested climate."},"Wilhelm Ferdinand Erichson":{"birth":"Stralsund, Germany","hook":"He set the gold standard for describing German beetles so carefully that others copied him — before dying of illness at just 39."},"Edward Blyth":{"birth":"London, England","hook":"From his Calcutta museum he wrote about how species vary — ideas the young Charles Darwin read while shaping his theory of natural selection."},"Edward Doubleday":{"birth":"Epping, Essex, England","hook":"At the British Museum he built a worldwide family tree of butterflies, grouping every kind of day-flying species he could find."},"Francis Orpen Morris":{"birth":"Cove of Cork (now Cobh), County Cork, Ireland","hook":"This clergyman's brightly coloured, six-volume 'History of British Birds' became a treasured fixture in Victorian family homes."},"Philip Henry Gosse":{"birth":"Worcester (River Severn), England","hook":"He coined the word 'aquarium' and sparked a Victorian craze for keeping living sea creatures in glass tanks at home."},"Pierre Edmond Boissier":{"birth":"Geneva, Switzerland","hook":"He roamed the mountains of Spain and the Middle East, describing thousands of plants that had never before been named by science."},"William Griffith":{"birth":"Ham, Surrey, England","hook":"He botanised across the Himalaya, Bhutan and Afghanistan, collecting thousands of plants before dying of disease at just 34."},"Isaac Sprague":{"birth":"Hingham, Massachusetts, USA","hook":"Once a field artist alongside the famous Audubon, he became America's finest botanical illustrator, drawing the plates for Asa Gray's great floras."},"Thomas C. Jerdon":{"birth":"Biddick House, near Durham, England","hook":"An army surgeon posted across India, he wrote the first complete guide to the entire subcontinent's birds."},"William Henry Harvey":{"birth":"near Limerick (River Shannon), Ireland","hook":"The world's leading seaweed expert, he travelled distant coasts and turned humble ocean algae into gorgeous illustrated plates."},"Robert Fortune":{"birth":"Kelloe, Berwickshire, Scotland","hook":"Disguised in Chinese robes with a shaved head and pigtail, he smuggled thousands of tea plants out of China to build India's tea industry."},"James Dwight Dana":{"birth":"Utica (Mohawk River), New York, USA","hook":"As a young man he sailed right around the globe on a four-year exploring expedition, then wrote the era's leading geology textbook."},"Japetus Steenstrup":{"birth":"Vang, Denmark","hook":"He argued that the terrifying 'kraken' of sailors' legends was real — a genuine giant deep-sea squid — and gave the monster a scientific name."},"John Cassin":{"birth":"Upper Providence Township, Pennsylvania, USA","hook":"From Philadelphia he studied birds from every continent, naming nearly 200 new species — more than any other American of his day."},"August Grisebach":{"birth":"Hannover (Leine), Germany","hook":"He was the first to describe the plant life of the entire planet organized by climate, pioneering the idea of great vegetation 'formations' that still shapes biogeography."},"Carl Bergmann":{"birth":"Göttingen (Leine), Germany","hook":"He spotted a rule of nature: within an animal group, species in colder places grow larger — which is why the biggest bears live farthest north."},"Gustav Hartlaub":{"birth":"Bremen (Weser), Germany","hook":"From his study in Bremen he described hundreds of African and Madagascan birds, becoming Europe's leading authority on birdlife he mostly never saw in the wild."},"Heinrich Gätke":{"birth":"Pritzwalk, Germany","hook":"For over fifty years he watched millions of migrating birds pass the tiny North Sea island of Heligoland, turning a bare rock into a world-famous migration observatory."},"Thomas Mayo Brewer":{"birth":"Boston (Charles River), USA","hook":"A Boston doctor obsessed with birds' eggs, he pioneered American oology — but is also blamed for helping introduce the house sparrow, a decision America later regretted."},"Jean Cabanis":{"birth":"Berlin (Spree), Germany","hook":"In 1853 he founded the Journal für Ornithologie, still published today as the world's oldest scientific journal devoted entirely to birds."},"Paul Gervais":{"birth":"Paris (Seine), France","hook":"A tireless naturalist who catalogued France's mammals both living and fossil, naming many extinct species and helping turn palaeontology into a rigorous science."},"Albert von Kölliker":{"birth":"Zürich (Limmat), Switzerland","hook":"He was among the first to realise that sperm are single cells and that nerve fibres grow out of individual nerve cells — foundations of modern biology."},"Berthe Hoola van Nooten":{"birth":"Netherlands","hook":"Widowed and needing money, she travelled to tropical Java and painted its dazzling flowers and fruits into one of the most beautiful colour-plate books ever printed."},"Hermann August Hagen":{"birth":"Königsberg (Pregel), Prussia (now Kaliningrad, Russia)","hook":"An authority on dragonflies and lacewings, he crossed the Atlantic to become the first professor of entomology in the United States, at Harvard."},"Walter Hood Fitch":{"birth":"Glasgow (River Clyde), Scotland","hook":"He drew over 9,000 botanical plates for Kew, sometimes finishing one a day, becoming the most prolific and gifted botanical artist of the Victorian age."},"Pieter Bleeker":{"birth":"Zaandam (Zaan), Netherlands","hook":"An army doctor in the Dutch East Indies, he described over 1,100 new species of fish from Indonesian waters — more than almost anyone in history."},"Alfred Riocreux":{"birth":"Sèvres, France","hook":"He began as a decorator at the famous Sèvres porcelain works before becoming one of France's most precise and admired botanical illustrators."},"Herbert Spencer":{"birth":"Derby (River Derwent), England","hook":"After reading Darwin, he coined the phrase 'survival of the fittest' and tried to apply evolution to everything — biology, the mind, and human society."},"Joseph Wolf":{"birth":"Mörz, Germany","hook":"Widely called the greatest animal painter of his century, he sketched creatures in lifelike motion so vividly that later wildlife artists copied his style for generations."},"Henry Constantine Richter":{"birth":"London (River Thames), England","hook":"He drew and lithographed hundreds of John Gould's most famous bird plates, yet received almost no public credit for the masterpieces during his lifetime."},"John MacGillivray":{"birth":"Aberdeen, Scotland","hook":"As naturalist aboard HMS Rattlesnake, he collected plants and animals across the Pacific and wrote the official published narrative of the voyage."},"Fritz Mueller":{"birth":"Windischholzhausen, Germany","hook":"He moved to the Brazilian rainforest and mailed Darwin so much fresh evidence for evolution that Darwin called him the 'prince of observers'."},"Henry Tibbats Stainton":{"birth":"London, England","hook":"He championed tiny, overlooked 'micro-moths' and wrote their life-histories in three languages at once, opening his home weekly to fellow insect enthusiasts."},"Rudolf Leuckart":{"birth":"Helmstedt, Germany","hook":"He unravelled the gruesome life cycles of tapeworms and the trichina worm, founding parasitology and warning how undercooked pork can carry deadly infections."},"Thomas Vernon Wollaston":{"birth":"England","hook":"Studying beetles on Madeira and other Atlantic islands, he found many that had lost the power of flight — early evidence of island evolution that fascinated Darwin."},"William Henry Edwards":{"birth":"Hunter, New York, USA","hook":"Before writing his great butterfly book, he explored the Amazon; his lively travel account inspired both Bates and Wallace to set off for South America."},"Joseph Leidy":{"birth":"Philadelphia, USA","hook":"He described America's first near-complete dinosaur skeleton and even used a microscope to help solve murder cases, becoming a pioneer of forensic science."},"Spencer Fullerton Baird":{"birth":"Reading (Schuylkill River), Pennsylvania, USA","hook":"He built the Smithsonian's collections from almost nothing into millions of specimens, sending armies of young collectors to explore across the continent."},"Carl Gustaf Thomson":{"birth":"Skåne, Sweden","hook":"He systematically documented the beetles and parasitic wasps of Scandinavia, describing thousands of insect species from his base in southern Sweden."},"Berthold Carl Seemann":{"birth":"Hannover (Leine), Germany","hook":"He sailed the world aboard HMS Herald, even joining the hunt for the lost Franklin expedition, then wrote the first flora of the Fiji islands."},"Ferdinand von Mueller":{"birth":"Rostock (Warnow), Germany","hook":"He named thousands of Australian plants, helped equip the doomed Burke and Wills expedition, and spread eucalyptus trees to gardens around the world."},"Karl Möbius":{"birth":"Eilenburg (Mulde), Germany","hook":"Studying an oyster bank, he realised its creatures form one interdependent community — coining 'biocoenosis', an ancestor of the modern idea of the ecosystem."},"Armand David":{"birth":"Espelette, France","hook":"A missionary in China, he was the first Westerner to describe the giant panda to science, along with the rare deer that now bears his name."},"Carl Gegenbaur":{"birth":"Würzburg (Main), Germany","hook":"Darwin's leading anatomist ally in Germany, he used the idea of homology to trace how vertebrate skeletons evolved from shared ancestors."},"Henri Mouhot":{"birth":"Montbéliard, France","hook":"His vivid writings and drawings brought the jungle-swallowed temples of Angkor to Western attention, before he died of fever in Laos aged just 35."},"Sereno Watson":{"birth":"East Windsor, Connecticut, USA","hook":"He joined a great survey of the American West almost by chance, then rose to become the botanist who mapped the plants of the Great Basin desert."},"Carl Johann Maximovich":{"birth":"Tula (Upa), Russia","hook":"He explored the wild Amur region and Japan, describing a huge number of East Asian plants now grown in gardens all over the world."},"St. George Jackson Mivart":{"birth":"London (River Thames), England","hook":"He accepted evolution but argued natural selection alone couldn't build half-formed wings or eyes; his clashes with Darwin and the Church saw him excommunicated."},"Carl Robert Osten-Sacken":{"birth":"St. Petersburg (Neva), Russia","hook":"A Russian diplomat posted to America, he spent his spare hours cataloguing North America's flies, becoming a founder of the study of these insects."},"Alfred Newton":{"birth":"Geneva, Switzerland","hook":"Cambridge's first professor of zoology, he studied extinct birds like the dodo and great auk and helped pass Britain's earliest laws protecting wild birds."},"Allan Octavian Hume":{"birth":"England","hook":"He amassed over 80,000 Indian bird specimens and founded the Indian National Congress; a servant once sold part of his manuscript notes as scrap paper."},"Hermann Müller":{"birth":"Mühlberg, Germany","hook":"A schoolteacher and brother of Fritz Müller, he carefully documented how flowers and their insect pollinators evolved together to fit one another."},"Albert Günther":{"birth":"Esslingen (Neckar), Germany","hook":"He catalogued thousands of fishes, reptiles and amphibians at the British Museum and became a leading expert on the giant tortoises of the Galápagos."},"Charles Wyville Thomson":{"birth":"Linlithgow, Scotland","hook":"He led the Challenger expedition, sailing nearly 70,000 miles and dredging the deep ocean floor to prove that life thrives even in its darkest depths."},"Gustav Mayr":{"birth":"Vienna (Danube), Austria","hook":"One of the founders of the scientific study of ants, he classified species from across the globe, laying out the family's systematic order."},"Harriet Scott":{"birth":"Sydney, Australia","hook":"With her sister Helena, she painted Australia's butterflies and moths from careful life studies, creating the young colony's first great illustrated insect book."},"Otto Staudinger":{"birth":"Groß Wüstenfelde, Germany","hook":"He turned his passion for butterflies and moths into the world's largest specimen-dealing business, supplying collectors everywhere and standardising their names."},"Albert Oppel":{"birth":"Hohenheim, Germany","hook":"He divided Jurassic rocks into fine 'zones' using ammonite fossils, inventing a dating method still used to line up rock layers across the world."},"William Henry Flower":{"birth":"Stratford-upon-Avon (River Avon), England","hook":"An army surgeon in the Crimean War turned museum director, he was an expert on whale and primate skeletons who transformed how museums display specimens."},"Henry Seebohm":{"birth":"Bradford, England","hook":"A steel manufacturer by day, he journeyed deep into Arctic Siberia to find the secret breeding grounds of birds like the grey plover on the frozen tundra."},"Thomas Belt":{"birth":"Newcastle-upon-Tyne (River Tyne), England","hook":"A mining engineer in Nicaragua, his sharp observations of leaf-cutter ants and rainforest led Darwin to call his book the best natural-history book ever written."},"Frederick DuCane Godman":{"birth":"near Godalming, Surrey, England","hook":"He poured decades and a fortune into the 63-volume Biologia Centrali-Americana, then crowned his life's obsession with storm-petrels in a lavish monograph on the ocean-wandering seabirds."},"John Lubbock":{"birth":"London, England","hook":"He kept a pet wasp, tried teaching his poodle to read, and pushed the law that gave Britain its first bank holidays — once nicknamed 'St Lubbock's Days'."},"Daniel Giraud Elliot":{"birth":"New York City, USA","hook":"Heir to a fortune, he printed enormous, gorgeously illustrated folios of pheasants and birds of paradise, and helped found both New York's and Chicago's great natural-history museums."},"Osbert Salvin":{"birth":"Finchley, London, England","hook":"Riding through Guatemala's volcanoes and forests, he and Godman gathered the wildlife for their staggering 63-volume Biologia Centrali-Americana."},"Tommaso Salvadori":{"birth":"Porto San Giorgio, Italy","hook":"As a young doctor he sailed with Garibaldi's Thousand to help unite Italy, then became the world's expert on New Guinea's birds, naming over a thousand kinds."},"Worthington George Smith":{"birth":"London, England","hook":"He drew mushrooms so precisely that his guides helped people tell a tasty supper from a deadly one — and he also dug up Stone Age tools around Dunstable."},"Georg Schweinfurth":{"birth":"Riga, Latvia","hook":"Trekking through unmapped Central Africa, he discovered the Uele River and met the Mangbetu people, though a sudden fire destroyed many of his precious specimens and notes."},"Herman Strecker":{"birth":"Philadelphia, Pennsylvania, USA","hook":"A stone-carver by trade, he obsessively amassed one of America's largest butterfly and moth collections — roughly 50,000 specimens crammed into his home."},"Robert McLachlan":{"birth":"London, England","hook":"He became the world's leading expert on caddisflies — the stream insects whose larvae build tiny protective cases out of sand grains and twigs."},"Samuel Hubbard Scudder":{"birth":"Boston, Massachusetts, USA","hook":"His professor Agassiz once made him stare at a single fish for days — a lesson in patient observation he carried into his studies of butterflies and fossil insects."},"William Boyd Dawkins":{"birth":"Buttington, Wales","hook":"He crawled through Ice Age caves to piece together Britain's vanished lions, hyenas and hippos, and the earliest humans who once shared the land with them."},"Henry Eeles Dresser":{"birth":"Thirsk, Yorkshire, England","hook":"As a young trader he slipped into Texas during the American Civil War, collecting birds between deals, later crafting the nine-volume History of the Birds of Europe."},"Harry Govier Seeley":{"birth":"London, England","hook":"He split all dinosaurs into two great families — 'lizard-hipped' and 'bird-hipped' — a division that scientists still use today."},"Nikolai Przhevalsky":{"birth":"Kimborovo, Smolensk region, Russia","hook":"This Russian officer-explorer crossed deserts and mountains toward forbidden Tibet, discovering the last truly wild horse, which still bears his name."},"Otto Finsch":{"birth":"Warmbrunn, Silesia (now Poland)","hook":"Besides writing the great book on parrots, he sailed to New Guinea and claimed a stretch of coast for Germany — the town Finschhafen is named after him."},"Alexander Kovalevsky":{"birth":"near Daugavpils, Latvia","hook":"Peering into tiny sea-squirt larvae, he spotted a notochord — the same rod-like backbone-precursor found in fish and humans — showing invertebrates and vertebrates are kin."},"Anton Dohrn":{"birth":"Stettin (now Szczecin), Poland","hook":"He built the world's first great marine research lab in Naples, funding it cleverly by renting study 'tables' and an aquarium to scientists from around the globe."},"David Sharp":{"birth":"England","hook":"A specialist in diving water-beetles, he distilled the entire, dizzyingly varied insect world into two masterly Insects volumes for the Cambridge Natural History."},"Otto Wilhelm Thomé":{"birth":"Cologne (River Rhine), Germany","hook":"His hand-coloured Flora von Deutschland became the best-loved picture-guide for identifying Central Europe's wild plants, treasured by students for generations."},"Roland Trimen":{"birth":"London, England","hook":"A friend and correspondent of Darwin, he studied how African butterflies mimic each other to fool predators, founding the systematic study of the region's Lepidoptera."},"Augustus Radcliffe Grote":{"birth":"Liverpool, England","hook":"He described thousands of North American moths and became the top authority on the owlet moths, before spending his final years as a museum curator in Germany."},"Eugenius Warming":{"birth":"Mandø, Denmark","hook":"As a young man he spent three years in Brazil's wild grasslands, an adventure that later inspired him to invent the whole science of plant ecology."},"John Murray":{"birth":"Cobourg, Ontario, Canada","hook":"Aboard HMS Challenger's four-year voyage he coined the word 'oceanography,' hauled up strange deep-sea creatures, and later grew rich mining island phosphate."},"Luigi Maria D'Albertis":{"birth":"Voltri, Genoa, Italy","hook":"He was the first to steam far up New Guinea's Fly River, firing rockets and fireworks to astonish villagers while collecting dazzling birds of paradise."},"Elliott Coues":{"birth":"Portsmouth, New Hampshire, USA","hook":"An army surgeon on the frontier, he wrote a witty Key to North American Birds that taught a nation to name its birds — before drifting into spiritualism and ghost-hunting."},"John Gerrard Keulemans":{"birth":"Rotterdam, Netherlands","hook":"The busiest bird artist of the Victorian age, his lithographs filled hundreds of books — including lifelike portraits of birds already extinct, like the dodo."},"Vladimir Kovalevsky":{"birth":"near Daugavpils, Latvia","hook":"By studying fossil horse legs he showed how horses evolved just as Darwin predicted; he also married the brilliant mathematician Sofya Kovalevskaya."},"Adolf Engler":{"birth":"Sagan, Silesia (now Poland)","hook":"He organised the entire plant kingdom into a vast classification system and the monumental Natürliche Pflanzenfamilien, a framework botanists relied on for generations."},"Eugene William Oates":{"birth":"England","hook":"A railway engineer in Burma, he turned his birdwatching into the standard Fauna of British India bird volumes, used across South Asia for decades."},"William Lucas Distant":{"birth":"London, England","hook":"Working in the steamy Malay Peninsula, he catalogued its butterflies and thousands of true bugs, becoming a leading world authority on the Hemiptera."},"Anton Reichenow":{"birth":"Charlottenburg (now Berlin), Germany","hook":"After collecting along the fever-ridden West African coast, he wrote the three-volume Die Vögel Afrikas, the first complete survey of the whole continent's birds."},"Genevieve Jones":{"birth":"Circleville, Ohio, USA","hook":"She began a giant hand-coloured folio of Ohio's nests and eggs to rival Audubon, but died of typhoid at 32 — and her grieving family finished it for her."},"Ellis Rowan":{"birth":"Melbourne, Australia","hook":"This fearless painter trekked through remote Australia and New Guinea in long Victorian skirts, producing some 3,000 vivid paintings of wildflowers and birds."},"Abbott Handerson Thayer":{"birth":"Boston, Massachusetts, USA","hook":"This painter discovered countershading — why animals are darker on top — and argued colour hides them, ideas that inspired military camouflage in World War I."},"John Henry Comstock":{"birth":"Janesville, Wisconsin, USA","hook":"A beloved Cornell teacher, he and his wife Anna devised the system for naming insect wing veins still used today, training a whole generation of entomologists."},"Richard Lydekker":{"birth":"London, England","hook":"He drew 'Lydekker's Line,' the boundary marking where Australian animals begin among the islands, and catalogued mountains of fossil and living mammals."},"Robert Ridgway":{"birth":"Mount Carmel (Wabash River), Illinois, USA","hook":"A self-taught teenager who joined a western survey at 17, he later built a colour dictionary that let naturalists everywhere name shades precisely."},"William Brewster":{"birth":"Wakefield, Massachusetts, USA","hook":"Weak eyesight kept him out of Harvard, yet he became a superb observer of living birds and the very first president of the American Ornithologists' Union."},"Oscar Drude":{"birth":"Braunschweig, Germany","hook":"He mapped how plants group into communities across the globe, giving plant geography new scientific rigour in his influential Handbuch der Pflanzengeographie."},"Anna Botsford Comstock":{"birth":"Otto, New York, USA","hook":"Her beautiful wood-engravings of insects and her Handbook of Nature Study launched a movement that sent children outdoors to study bugs, birds and plants."},"Edward Meyrick":{"birth":"Ramsbury, Wiltshire, England","hook":"A schoolmaster who studied moths in his spare time, he named around 20,000 species of tiny micro-moths gathered from all over the world."},"Florentino Ameghino":{"birth":"Luján, Argentina","hook":"Self-taught and funded by his little bookshop, he unearthed hundreds of bizarre extinct South American mammals — and boldly (wrongly) argued humankind began in Argentina."},"Matilda Smith":{"birth":"Bombay, India","hook":"Kew Gardens' first official botanical artist, she painted over 2,300 plant portraits for Curtis's Botanical Magazine across forty years."},"Andreas Franz Wilhelm Schimper":{"birth":"Strasbourg (River Ill), France","hook":"He coined the term 'tropical rainforest,' explained the world's vegetation by climate and soil, and died young soon after a gruelling tropical expedition."},"Edward Bagnall Poulton":{"birth":"Reading, England","hook":"He showed that caterpillars and pupae can change colour to match their surroundings, championing Darwin's natural selection through the dazzling colours of insects."},"Louis Dollo":{"birth":"Lille, France","hook":"He reconstructed a whole herd of Iguanodon dinosaurs found deep in a Belgian coal mine, and declared evolution can never exactly run backwards — 'Dollo's law'."},"Eugène Dubois":{"birth":"Eijsden (River Meuse), Netherlands","hook":"He quit a secure job and joined the army just to reach Java, where he dug up 'Java Man' — the first fossil ever deliberately hunted as a human ancestor."},"Ernst Hartert":{"birth":"Hamburg, Germany","hook":"Working in Baron Rothschild's private museum at Tring, he introduced three-part scientific names for bird subspecies, reshaping how birds are classified."},"Archibald Thorburn":{"birth":"Lasswade (River North Esk), Scotland","hook":"He hand-painted 268 lifelike bird plates for Lord Lilford's masterwork, sketching wild and freshly caught birds outdoors to capture their exact living poses."},"George Hampson":{"birth":"England","hook":"He spent decades among the British Museum's moth drawers, naming thousands of new species in a colossal multi-volume catalogue that organised the world's moths."},"Louis Agassiz Fuertes":{"birth":"Ithaca, New York, USA","hook":"Hailed as Audubon's heir, he painted birds from Andean peaks to Ethiopia before dying at 53 when a train struck his car at a rail crossing."},"Albert Gaudry":{"birth":"Saint-Jean-de-Braye (River Loire), France","hook":"Digging at Pikermi in Greece, he unearthed whole herds of extinct mammals and used them as some of the first fossil evidence for evolution."},"Jose Celestino Mutis":{"birth":"Cádiz, Spain","hook":"A priest in the Andes, he studied cinchona bark — source of the malaria cure quinine — and directed artists to produce thousands of stunning plant paintings."},"Andre Michaux":{"birth":"Satory, near Versailles, France","hook":"He hunted plants from the deserts of Persia to the forests of America, and died of fever while exploring the island of Madagascar."},"Hipolito Ruiz Lopez":{"birth":"Belorado, Burgos, Spain","hook":"He spent over a decade exploring Peru and Chile, only to lose priceless specimens to shipwreck and a fire that burned his field station."},"Francois Andre Michaux":{"birth":"Versailles, France","hook":"As a teenager he crossed the American wilderness with his botanist father, and later warned that the young country was felling its forests far too fast."},"Rene Primevere Lesson":{"birth":"Rochefort (River Charente), France","hook":"As a ship's surgeon he became the first European naturalist to watch living birds of paradise dancing in the wild of New Guinea."}};

const CURATED={"Nicolas Robert":{"hook":"King Louis XIV’s personal hype-artist! He hung out in the royal palace's private zoo, painting ultra-realistic pictures of crazy exotic beasts onto fancy calfskin vellum!","birth":"Langres (Marne River), France","town":"Langres","river":"Marne River","country":"France","field":"Scientific Art"},"Robert Morison":{"hook":"A royal physician and botanical pioneer who created one of the very first systematic classification systems for plants long before Linnaeus was even born!","birth":"Aberdeen (River Dee), Scotland","town":"Aberdeen","river":"River Dee","country":"Scotland","field":"Botany"},"Georg Eberhard Rumphius":{"hook":"Spent decades cataloging the natural history of the Indonesian island of Ambon, compiling the classic work *Herbarium Amboinense*.","birth":"Wölfersheim (Nidda River), Germany","town":"Wölfersheim","river":"Nidda River","country":"Germany","field":"Botany & Marine Biology"},"John Ray":{"hook":"Often called the father of English natural history. Long before Linnaeus, he introduced the concept of the biological \"species\" as a fundamental unit of classification.","birth":"Black Notley (River Brain), England","town":"Black Notley","river":"River Brain","country":"England","field":"Botany & Zoology"},"Marcello Malpighi":{"hook":"One of the first humans to ever look at skin and lungs under a microscope, proving that super-tiny hidden tubes (capillaries) connect our blood vessels together!","birth":"Crevalcore (Panaro River), Italy","town":"Crevalcore","river":"Panaro River","country":"Italy","field":"Microscopic Anatomy"},"Jan Commelin":{"hook":"The driving force behind the renowned Hortus Botanicus Amsterdam, he pioneered the massive importation and cultivation of exotic plants in Europe.","birth":"Leiden (Oude Rijn), Netherlands","town":"Leiden","river":"Oude Rijn","country":"Netherlands","field":"Botany"},"Antonie van Leeuwenhoek":{"hook":"Known as the \"father of microbiology,\" Leeuwenhoek crafted super-powerful single-lens microscopes in his spare time, becoming the first human ever to see living bacteria and microscopic cells, which he called \"animalcules\"!","birth":"Delft, Netherlands","town":"Delft","river":null,"country":"Netherlands","field":null},"Francis Willughby":{"hook":"Pioneering English scientist who, working alongside John Ray, discarded mythical lore to establish a modern, structural scientific classification for birds and fishes.","birth":"Middleton (River Tame), England","town":"Middleton","river":"River Tame","country":"England","field":"Ornithology & Ichthyology"},"Hendrik van Rheede":{"hook":"Dutch colonial administrator who compiled *Hortus Malabaricus*, a landmark 12-volume treatise on the medicinal and economic plants of India.","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Botany"},"Jan Swammerdam":{"hook":"A brilliant pioneer of the microscope who proved that insects transition through defined life stages (metamorphosis) rather than spontaneously generating.","birth":"Amsterdam (Amstel River), Netherlands","town":"Amsterdam","river":"Amstel River","country":"Netherlands","field":"Microscopy & Entomology"},"Filippo Bonanni":{"hook":"Italian Jesuit scholar who authored the first book devoted entirely to seashells (*Recreatio mentis et oculi*), establishing the foundation for malacology.","birth":"Rome (Tiber River), Italy","town":"Rome","river":"Tiber River","country":"Italy","field":"Malacology & Microscopy"},"Pierre Magnol":{"hook":"Came up with the revolutionary concept of grouping plants into distinct \"families\" based on matching traits. The magnificent, fragrant Magnolia tree was named in his honor!","birth":"Montpellier (Lez River), France","town":"Montpellier","river":"Lez River","country":"France","field":"Botany"},"Martin Lister":{"hook":"While people thought weird spiral rocks were just cool stones, he realized they were actually the fossilized shells of ancient, extinct sea creatures!","birth":"Radclive (River Great Ouse), England","town":"Radclive","river":"River Great Ouse","country":"England","field":"Geology & Zoology"},"Nehemiah Grew":{"hook":"Stared deep into his primitive microscope in the 1600s and shocked the world by discovering that plants actually have male and female parts and reproduce using pollen!","birth":"Mancetter (River Anker), England","town":"Mancetter","river":"River Anker","country":"England","field":"Plant Anatomy"},"Isaac Newton":{"hook":"Formulated the laws of motion and universal gravitation, serving as the cornerstone figure for the Scientific Revolution.","birth":"Woolsthorpe (River Witham), England","town":"Woolsthorpe","river":"River Witham","country":"England","field":"Physics & Mathematics"},"Leonard Plukenet":{"hook":"He was Queen Mary II's personal botanist! Without ever really leaving his home, he built a massive \"plant empire\" by having explorers send him over 8,000 exotic plants from around the world.","birth":"London (River Thames), England","town":"London","river":"River Thames","country":"England","field":"Botany"},"Charles Plumier":{"hook":"A Franciscan monk and botanist who made three voyages to the West Indies, naming famous plant genera like *Begonia*, *Fuchsia*, and *Lobelia* after fellow scientists.","birth":"Marseille, France","town":"Marseille","river":null,"country":"France","field":null},"Gottfried Wilhelm Leibniz":{"hook":"Polymath who co-invented calculus, contributed to early physics and geology, and developed theories on the nature of substance.","birth":"Leipzig (White Elster River), Germany","town":"Leipzig","river":"White Elster River","country":"Germany","field":"Mathematics & Natural Philosophy"},"Paul Hermann":{"hook":"Sailed all the way to Ceylon (modern Sri Lanka) as a ship's doctor just to collect totally unknown, exotic plants, becoming one of Europe's top botanical rockstars.","birth":"Halle (Saale River), Germany","town":"Halle","river":"Saale River","country":"Germany","field":"Botany"},"Maria Sibylla Merian":{"hook":"An absolute legend who sailed to the jungles of South America in 1699 *just* to paint giant tarantulas eating birds and massive caterpillars turning into glorious butterflies!","birth":"Frankfurt (Main River), Germany","town":"Frankfurt","river":"Main River","country":"Germany","field":"Entomology & Art"},"Engelbert Kaempfer":{"hook":"German physician whose detailed travels in the 17th century introduced Asian flora—including the Ginkgo tree—to European science.","birth":"Lemgo (Bega River), Germany","town":"Lemgo","river":"Bega River","country":"Germany","field":"Natural History & Exploration"},"William Dampier":{"hook":"Pirate, captain, and naturalist! He became the first person to sail around the world three times, taking meticulous notes on exotic tropical animals, plants, and ocean currents!","birth":"East Coker (River Yeo), England","town":"East Coker","river":"River Yeo","country":"England","field":"Exploration & Natural History"},"Joseph Pitton de Tournefort":{"hook":"French botanist who created a highly influential system of plant classification and importantly defined the concept of the \"genus\" for the first time.","birth":"Aix-en-Provence (Arc River), France","town":"Aix-en-Provence","river":"Arc River","country":"France","field":"Botany"},"Hans Sloane":{"hook":"Physician whose massive personal collection of plants, animals, and antiquities served as the foundational core for the creation of the British Museum.","birth":"Killyleagh (River Quoile), Northern Ireland","town":"Killyleagh","river":"River Quoile","country":"Northern Ireland","field":"Natural History & Collecting"},"Olof Rudbeck the Younger":{"hook":"Explored the freezing, untouched Arctic Circle to map the bizarre plants of Lapland, and then heroically rushed to save his life's work when a massive fire burned down his city!","birth":"Uppsala (Fyris River), Sweden","town":"Uppsala","river":"Fyris River","country":"Sweden","field":"Botany & Linguistics"},"Albertus Seba":{"hook":"Seba was an apothecary who ran the ultimate 18th-century \"Cabinet of Curiosities,\" collecting exotic snakes, preserved sea creatures, and bizarre insects from sailors docking in Amsterdam. He compiled these into a massive, brilliantly illustrated book that became the world's most famous natural history picture book of its time.","birth":"Etzel, Germany","town":"Etzel","river":null,"country":"Germany","field":null},"Claude Aubriet":{"hook":"Master French botanical illustrator who accompanied expedition voyages through the Middle East, capturing ultra-precise, exquisite watercolor paintings of wild flora that defined 18th-century plant art!","birth":"Châlons-en-Champagne (Marne River), France","town":"Châlons-en-Champagne","river":"Marne River","country":"France","field":"Botanical Art & Scientific Illustration"},"James Petiver":{"hook":"An early London apothecary who leveraged merchant ships to build a massive global museum, preserving critical specimens for John Ray.","birth":"Hillmorton (River Avon), England","town":"Hillmorton","river":"River Avon","country":"England","field":"Botany & Collecting"},"Rudolf Jakob Camerarius":{"hook":"Shocked the scientific community in 1694 by proving experimentally that plants reproduce sexually using pollen from male stamens to fertilize female seed organs!","birth":"Tübingen (Neckar River), Germany","town":"Tübingen","river":"Neckar River","country":"Germany","field":"Botany"},"Herman Boerhaave":{"hook":"Pioneer of clinical bedside teaching. Made Leiden the medical capital of Europe and vastly expanded its botanical gardens.","birth":"Voorhout (Oude Rijn), Netherlands","town":"Voorhout","river":"Oude Rijn","country":"Netherlands","field":"Medicine & Botany"},"Sébastien Vaillant":{"hook":"Delivered a game-changing lecture in Paris proving flower stamens and pistils are reproductive organs, inspiring Linnaeus to build his revolutionary plant naming system!","birth":"Vi
