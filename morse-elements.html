fferently \u2014 French operators said Anatole, Berthe, C\xE9lestin while British crews used Ack, Beer, Charlie. The ITU introduced the first international radio alphabet in 1927 and revised it in 1932 using city names (Amsterdam, Baltimore, Casablanca\u2026), which served aviation until after the Second World War.","The ICAO then developed an alphabet designed to be intelligible to speakers of any language under poor radio conditions. The version finalised in 1956 \u2014 Alfa to Zulu \u2014 is used worldwide in civil aviation and by NATO, and spells the same in every country."],sources:[{label:"Wikipedia: NATO phonetic alphabet",url:"https://en.wikipedia.org/wiki/NATO_phonetic_alphabet"},{label:"Wikipedia (DE): Buchstabiertafel \u2014 international tables",url:"https://de.wikipedia.org/wiki/Buchstabiertafel"}]},weimar:{title:"The German table \u2014 1926, 1934, and after",paras:["The German spelling table grew out of the earliest telephone books. The Weimar-era version of 1926 included the biblical names David, Jakob, Nathan, Samuel and Zacharias. In March 1933 a telephone subscriber in Rostock wrote to the post office demanding the \u201Eeradication of the Jewish names\u201C. The postal directorate initially objected \u2014 these were Old Testament names borne by Christians too \u2014 but the change went through: the 1934 table replaced David with Dora, Jakob with Jot, Nathan with Nordpol, Samuel with Siegfried and Zacharias with Zeppelin. Even Ypsilon became Ypern, the town where German troops had first used poison gas at scale in 1915.","After 1945 only Samuel and Zacharias were officially restored; Dora and Nordpol remained in everyday use for decades. In 2019 Michael Blume, Baden-W\xFCrttemberg\u2019s commissioner against antisemitism, called for Nathan\u2019s return. DIN reviewed the standard and in 2022 published a new city-name table \u2014 while symbolically reprinting the 1926 version with all the erased names back in their places. That restored 1926 version is the one practised here."],sources:[{label:"Wikipedia (DE): Buchstabiertafel",url:"https://de.wikipedia.org/wiki/Buchstabiertafel"},{label:"Duden: Die Geschichte des Buchstabieralphabets",url:"https://www.duden.de/sprachwissen/sprachratgeber/Die-Geschichte-des-Buchstabieralphabets"},{label:"Austria-Forum: Buchstabieren und Politik",url:"https://austria-forum.org/af/Wissenssammlungen/Essays/Geschichte/Buchstabieren_und_Politik"}]},french:{title:"The French PTT table \u2014 and 1939",paras:["France\u2019s PTT used a first-name table, learned by its agents for spelling names in telegrams and telephone calls. In 1939 it was quietly altered: names regarded as Jewish or associated with Judaism were removed \u2014 Samuel became Suzanne, and Th\xE9odore (a name associated with Theodor Herzl) became Th\xE9r\xE8se \u2014 a change paralleling the German one of 1934.","Unlike in Germany, the change was never publicly debated or reversed. The French table was custom rather than an official norm, so there was no institution to revisit it: the post-1939 version, Anatole to Zo\xE9, is the one still used in France today (aviation uses the ICAO alphabet instead). This episode is far less documented than the German case \u2014 a genuine opportunity for further research."],sources:[{label:"Wikip\xE9dia (FR): Alphabet t\xE9l\xE9phonique fran\xE7ais",url:"https://fr.wikipedia.org/wiki/Alphabet_t%C3%A9l%C3%A9phonique_fran%C3%A7ais"},{label:"Wikipedia (DE): Buchstabiertafel (German parallel)",url:"https://de.wikipedia.org/wiki/Buchstabiertafel"}]},din:{title:"DIN 5009:2022 \u2014 the city-name table",paras:["Prompted by Michael Blume\u2019s 2019 call to bring Nathan back into the table, DIN reviewed the old standard and decided in November 2020 to replace first names entirely. DIN 5009, published on 13 May 2022, spells with German city names from Aachen to Zwickau \u2014 only Y keeps Ypsilon \u2014 with umlauts spoken as \u201EUmlaut Aachen\u201C, \u201EUmlaut Offenbach\u201C and \u201EUmlaut Unna\u201C.","Nine city names changed between the 2021 draft and the final version (for example Vogtland became V\xF6lklingen, Stuttgart became Salzwedel). Alongside the new table, the standard symbolically reprints the 1926 version with the names erased in 1934 restored \u2014 an explicit act of historical acknowledgement. Use of the table is voluntary; emergency services and aviation keep their own alphabets."],sources:[{label:"Wikipedia (DE): Buchstabiertafel",url:"https://de.wikipedia.org/wiki/Buchstabiertafel"},{label:"Wikipedia (EN): DIN 5009",url:"https://en.wikipedia.org/wiki/DIN_5009"},{label:"UEPO: Neue Buchstabiertafel als DIN 5009 (13.5.2022)",url:"https://uepo.de/2022/05/13/von-aachen-bis-zwickau-neue-buchstabiertafel-mit-staedtenamen-als-din-5009-veroeffentlicht/"},{label:"DIN: Fragen & Antworten zur Buchstabiertafel (PDF)",url:"https://www.din.de/resource/blob/867082/20c43e6b1f46ab20b7fe213c6013a6dc/fragenkatalog-din-5009-buchstabiertafel-data.pdf"}]}};function Zc({info:e}){let[n,t]=(0,P.useState)(!1);return(0,f.jsxs)("div",{style:{maxWidth:500,margin:"0 auto 16px"},children:[(0,f.jsx)("button",{onClick:()=>t(r=>!r),style:{display:"block",margin:"0 auto",padding:"6px 14px",borderRadius:999,border:`1px solid ${m.panelEdge}`,background:n?m.panel:"transparent",color:m.muted,fontSize:12,fontWeight:600,fontFamily:"'IBM Plex Mono', monospace"},children:n?"\u25BE background":"\u25B8 background"}),n&&(0,f.jsxs)("div",{style:{marginTop:10,padding:"14px 16px",borderRadius:12,border:`1px solid ${m.panelEdge}`,background:m.panel},children:[(0,f.jsx)("div",{style:{fontWeight:700,fontSize:14,marginBottom:8},children:e.title}),e.paras.map((r,l)=>(0,f.jsx)("p",{style:{fontSize:13,lineHeight:1.6,color:m.paper,margin:"0 0 10px"},children:r},l)),(0,f.jsx)("div",{style:{fontSize:11,color:m.muted,textTransform:"uppercase",letterSpacing:"0.14em",margin:"12px 0 6px",fontFamily:"'IBM Plex Mono', monospace"},children:"Sources & further reading"}),e.sources.map((r,l)
